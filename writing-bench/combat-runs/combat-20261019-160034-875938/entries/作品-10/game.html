<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>断弦剧场 · CUT THE STRINGS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#05060c;overflow:hidden;font-family:system-ui,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
#game{position:fixed;inset:0;display:block}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,12,26,.5),rgba(5,6,12,.88));z-index:10}
.panel{text-align:center;color:#e8ecff;padding:36px 52px;border:1px solid rgba(120,140,220,.25);background:rgba(10,12,24,.74);border-radius:14px;box-shadow:0 0 80px rgba(80,100,220,.16);max-width:660px}
h1{font-size:42px;letter-spacing:12px;color:#fff;text-shadow:0 0 24px rgba(125,249,255,.6)}
.sub{color:#8ef0ff;letter-spacing:3px;margin:8px 0 18px;font-size:13px}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:13.5px;color:#c6cdf0;margin:0 auto 14px;max-width:460px}
.ctl b{color:#ffd76e;font-weight:600;white-space:nowrap;text-align:right}
.tip{font-size:12.5px;color:#9aa4d0;margin-bottom:18px;line-height:1.8}
.go{font-size:17px;color:#fff;animation:pu 1.2s infinite}
@keyframes pu{50%{opacity:.5}}
.stats{display:flex;gap:30px;justify-content:center;margin:18px 0 22px}
.stats div{display:flex;flex-direction:column;gap:4px}
.stats span{font-size:26px;color:#ffd76e;font-weight:700}
.stats label{font-size:11px;color:#9aa4d0;letter-spacing:2px}
.hide{display:none!important}
#mute{position:fixed;top:12px;right:14px;z-index:20;background:rgba(15,18,34,.7);border:1px solid rgba(120,140,220,.35);color:#fff;font-size:17px;padding:6px 10px;border-radius:8px;cursor:pointer}
#mute:hover{background:rgba(40,48,90,.85)}
#ovDead h1{color:#ff6a5e;text-shadow:0 0 24px rgba(255,90,80,.5)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="mute">🔊</button>
<div class="ov" id="ovStart">
  <div class="panel">
    <h1>断弦剧场</h1>
    <p class="sub">CUT THE STRINGS · 横版战斗试玩</p>
    <div class="ctl">
      <b>A / D · ← →</b><span>移动</span>
      <b>Space</b><span>跳跃 / 二段跳</span>
      <b>J</b><span>连斩（三段，第三段挑空，可跳起追击）</span>
      <b>K</b><span>按住蓄力重斩（满蓄必定断肢）· 空中按下砸</span>
      <b>L</b><span>疾闪（无敌帧，可穿波与弹幕）</span>
      <b>I</b><span>弹反（成功缴械硬直，下一击金身反击）</span>
      <b>R</b><span>重开</span>
    </div>
    <p class="tip">木偶敌人拥有可破坏肢体：断腿减速、断臂缴械、断头失控乱砍。<br>连段命中 3 次以上或蓄力/反击命中即可打断肢体。弹幕可被弹反反射。</p>
    <p class="go">点击 或 按 Enter 开始</p>
    <p class="tip" style="margin:10px 0 0">首次点击/按键后启用声音 · 右上角可静音</p>
  </div>
</div>
<div class="ov hide" id="ovDead">
  <div class="panel">
    <h1>人偶崩解</h1>
    <div class="stats">
      <div><span id="stWave">1</span><label>波次</label></div>
      <div><span id="stKills">0</span><label>击破</label></div>
      <div><span id="stHits">0</span><label>命中</label></div>
      <div><span id="stLimbs">0</span><label>断肢</label></div>
    </div>
    <p class="go">按 R / Enter 重开</p>
  </div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cvs=$('game'),ctx=cvs.getContext('2d');
const W=960,H=540,GROUND=472,AW=2240,GRAV=2200,TAU=Math.PI*2;
let CW=0,CH=0,DPR=1,SCL=1,OX=0,OY=0;
function resize(){CW=innerWidth;CH=innerHeight;DPR=Math.min(devicePixelRatio||1,2);cvs.width=CW*DPR;cvs.height=CH*DPR;cvs.style.width=CW+'px';cvs.style.height=CH+'px';SCL=Math.min(CW/W,CH/H);OX=(CW-W*SCL)/2;OY=(CH-H*SCL)/2;}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),sgn=v=>v<0?-1:1;
function RR(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
/* ---------- audio ---------- */
let AC=null,master=null,noiseBuf=null,muted=false;
function ensureAudio(){
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();master=AC.createGain();master.gain.value=.5;master.connect(comp);comp.connect(AC.destination);noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
 if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f0,f1,dur,type,g){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(1,f0),t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v);v.connect(master);o.start(t);o.stop(t+dur+.02);}
function nz(dur,f0,f1,g,type,q){if(!AC||muted)return;type=type||'bandpass';q=q||1;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);f.Q.value=q;const v=AC.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(v);v.connect(master);s.start(t);s.stop(t+dur+.02);}
const sfx={
 slash(){nz(.11,2400,700,.2,'bandpass',1.2);},
 hit(p){tone(150,45,.13,'sine',.42*p);nz(.05,3000,900,.14,'highpass');},
 heavy(){tone(95,26,.3,'sine',.6);nz(.22,900,150,.3,'lowpass');},
 parry(){tone(1318,1318,.5,'sine',.26);tone(1976,1976,.3,'sine',.15);nz(.07,6000,2000,.2,'highpass');},
 crack(){nz(.16,1500,200,.4,'lowpass');tone(210,55,.12,'square',.22);},
 death(){nz(.45,1000,80,.4,'lowpass');tone(72,20,.55,'sine',.55);},
 dash(){nz(.15,700,2600,.16,'bandpass',1.4);},
 jump(){tone(280,640,.12,'triangle',.1);},
 hurt(){tone(190,50,.24,'sawtooth',.26);nz(.12,700,150,.24,'lowpass');},
 bolt(){tone(920,170,.16,'sawtooth',.12);},
 land(){nz(.07,500,120,.16,'lowpass');},
 tick(){tone(1250,1250,.05,'square',.06);},
 wave(){tone(110,110,.55,'sawtooth',.12);tone(165,165,.5,'sawtooth',.09);},
 heal(){tone(520,980,.2,'sine',.12);},
 charge(){tone(85,340,.4,'sawtooth',.07);}
};
/* ---------- state ---------- */
let state='menu',tNow=0,hitstop=0,timeScale=1,slowT=0,shake=0,shX=0,shY=0,ghostT=0;
let cam={x:0},wave=0,interT=0,spawnQ=[];
let enemies=[],debris=[],prts=[],projs=[],shocks=[],slashes=[],floats=[],ghosts=[],rings=[];
let hitCount=0,limbBreakCount=0,kills=0,comboN=0,comboT=0,comboPop=0,redFlash=0,bannerT=0,bannerTxt='';
let P=null;
const keys={};let jBuf=0,kBuf=0,lBuf=0,iBuf=0,spBuf=0;
const CFG={
 blade:{hp:55,w:34,h:74,sp:96,dmg:12},
 brute:{hp:150,w:54,h:116,sp:52,dmg:20,s:1.55},
 caster:{hp:40,w:40,h:40,sp:78,dmg:10}
};
const ATT={
 l1:{st:.06,ac:.10,re:.24,dmg:8,kb:170,up:0,hs:.045,reach:80,shake:3,lunge:330,arc:[-.95,.55],chain:'l2',key:'l1'},
 l2:{st:.06,ac:.10,re:.26,dmg:9,kb:190,up:0,hs:.05,reach:80,shake:3,lunge:300,arc:[2.5,3.7],chain:'l3',key:'l2'},
 l3:{st:.10,ac:.12,re:.36,dmg:15,kb:230,up:-470,hs:.09,reach:88,shake:5,lunge:360,arc:[.9,2.3],chain:null,key:'l3'},
 h1:{st:.12,ac:.12,re:.34,dmg:20,kb:430,up:-140,hs:.10,reach:96,shake:6,lunge:280,arc:[-1.3,1.3],chain:null,key:'h1'},
 h2:{st:.08,ac:.14,re:.44,dmg:30,kb:340,up:-640,hs:.16,reach:106,shake:9,lunge:420,arc:[0,TAU],chain:null,key:'h2',break:1},
 airJ:{st:.05,ac:.20,re:.14,dmg:11,kb:120,up:-260,hs:.05,reach:64,shake:3,lunge:120,arc:[0,TAU],chain:null,key:'airJ',air:1}
};
function initPlayer(){P={x:AW/2,y:GROUND,vx:0,vy:0,facing:1,onGround:true,airJumps:1,airDashed:false,hp:100,maxhp:100,st:0,state:'idle',atk:null,hitSet:null,hitConfirm:false,atkGold:false,chargeT:0,dashT:0,dashCD:0,parryT:0,parryCD:0,riposte:0,invuln:0,hurtT:0,dead:false,deadT:0,trail:[],run:0,scarf:Array.from({length:8},()=>({x:AW/2,y:GROUND-40})),prevVy:0,whooshed:false};}
initPlayer();
/* ---------- helpers ---------- */
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function pBox(){return{x:P.x-12,y:P.y-46,w:24,h:46};}
function eBox(e){return{x:e.x-e.cfg.w/2,y:e.y-e.cfg.h,w:e.cfg.w,h:e.cfg.h};}
function aliveCount(){let n=0;for(const e of enemies)if(!e.gone)n++;return n;}
function nearestEnemy(maxD){let best=null,bd=maxD;for(const e of enemies){if(e.gone)continue;const d=Math.abs(e.x-P.x);if(d<bd&&Math.abs(e.y-P.y)<170){bd=d;best=e;}}return best;}
function canDash(){return P.dashCD<=0&&(P.onGround||!P.airDashed);}
function setSlow(s,d){timeScale=s;slowT=d;}
function banner(t,d){bannerTxt=t;bannerT=d;}
function burst(x,y,n,c,spd){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(spd*.4,spd);prts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,t:0,life:rnd(.2,.45),s:rnd(1.5,3),c,g:900,drag:2,glow:1});}}
function dust(x,y,n){for(let i=0;i<n;i++)prts.push({x:x+rnd(-14,14),y:y+rnd(-4,2),vx:rnd(-60,60),vy:rnd(-90,-20),t:0,life:rnd(.35,.7),s:rnd(2.5,5.5),c:'#9a8f80',g:260,drag:2.4,glow:0});}
function bladeAngle(p){
 if(p.state==='charge')return -2.45+Math.sin(tNow*40)*.04*p.chargeT*3;
 if(p.state==='parry')return -1.5;
 if(p.state==='slam')return p.st*18;
 if(p.state==='attack'&&p.atk){const a=p.atk;
  if(p.st<a.st)return -2.2;
  const pr=clamp((p.st-a.st)/a.ac,0,1),e=1-Math.pow(1-pr,3);
  if(a.key==='airJ')return p.st*22;
  let ang=lerp(a.arc[0],a.arc[1],e);
  if(a.key==='h2')ang+=pr*TAU*1.5;
  return ang;}
 return -0.35+Math.sin(p.run)*.05;
}
function pushTrail(){const p=P,ang=bladeAngle(p),wa=p.facing>0?ang:Math.PI-ang;
 const hx=p.x+p.facing*8+Math.cos(wa)*19,hy=p.y-30+Math.sin(wa)*19;
 p.trail.push({x:hx+Math.cos(wa)*44,y:hy+Math.sin(wa)*44,life:.14});
 if(p.trail.length>12)p.trail.shift();}
/* ---------- player ---------- */
function startAttack(key){const p=P,a=ATT[key];
 p.atk=a;p.state='attack';p.st=0;p.hitConfirm=false;p.hitSet=new Set();p.whooshed=false;p.atkGold=p.riposte>0;
 const e=nearestEnemy(360);if(e&&Math.abs(e.x-p.x)>4)p.facing=sgn(e.x-p.x);
 p.vx=p.facing*a.lunge;
 if(a.air)p.vy=Math.min(p.vy,-80);}
function doDash(){const p=P;p.state='dash';p.st=0;p.dashT=.16;p.dashCD=.4;if(!p.onGround)p.airDashed=true;p.vx=p.facing*980;p.vy=0;sfx.dash();}
function attackBox(p,a){if(a.air)return{x:p.x-64,y:p.y-96,w:128,h:104};const r=a.reach;return{x:p.facing>0?p.x+6:p.x-6-r,y:p.y-66,w:r,h:64};}
function updAttack(dt){const p=P,a=p.atk,st=a.st,ac=a.ac;
 if(p.st<st){p.vx*=Math.max(0,1-6*dt);}
 else if(p.st<st+ac){
  if(!p.whooshed){p.whooshed=true;sfx.slash();pushTrail();
   slashes.push({x:p.x+p.facing*(a.air?0:26),y:p.y-34+(a.air?-10:0),f:p.facing,a0:a.arc[0],a1:a.arc[1],big:a.key==='h1'||a.key==='h2',gold:p.atkGold,t:0,life:.13});}
  pushTrail();
  const ne=nearestEnemy(120);if(ne&&sgn(ne.x-p.x)===p.facing)p.vx+=p.facing*1600*dt;
  const hb=attackBox(p,a);
  for(const en of enemies){if(en.gone||p.hitSet.has(en))continue;if(ov(hb,eBox(en))){p.hitSet.add(en);hitEnemy(en,a,p.facing);}}
  for(const q of projs){if(!q.dead&&!q.friendly&&ov(hb,{x:q.x-6,y:q.y-6,w:12,h:12})){q.dead=true;burst(q.x,q.y,6,'#8ef0ff',160);}}
  if(a.key==='airJ'&&p.hitSet.size>0)p.vy=Math.min(p.vy,-260);
 }else{
  const rec=a.re*(p.hitConfirm?.55:1);
  if(jBuf>0&&a.chain){startAttack(a.chain);jBuf=0;return;}
  if(spBuf>0&&p.hitConfirm){p.vy=-720;spBuf=0;p.onGround=false;p.state='air';return;}
  if(lBuf>0&&canDash()){doDash();lBuf=0;return;}
  if(kBuf>0&&p.hitConfirm&&p.onGround){p.state='charge';p.st=0;p.chargeT=0;kBuf=0;sfx.charge();return;}
  if(p.st>st+ac+rec){p.state=p.onGround?'idle':'air';}
 }}
function doLoco(dt){const p=P;
 const L=keys.KeyA||keys.ArrowLeft,R=keys.KeyD||keys.ArrowRight;
 let ax=0;if(L){ax-=1;p.facing=-1;}if(R){ax+=1;p.facing=1;}
 const sp=p.state==='charge'?90:340;
 p.vx+=(ax*sp-p.vx)*Math.min(1,16*dt);
 if(p.onGround&&Math.abs(p.vx)>20)p.run+=dt*Math.abs(p.vx)*.05;
 if(spBuf>0){if(p.onGround){p.vy=-760;sfx.jump();spBuf=0;p.onGround=false;}
  else if(p.airJumps>0){p.vy=-700;p.airJumps--;spBuf=0;sfx.jump();burst(p.x,p.y-10,6,'#8ef0ff',120);}}
 if(jBuf>0){startAttack(p.onGround?'l1':'airJ');jBuf=0;}
 else if(kBuf>0){if(p.onGround){p.state='charge';p.st=0;p.chargeT=0;p.vx*=.2;sfx.charge();kBuf=0;}
  else{p.state='slam';p.st=0;p.vx*=.25;kBuf=0;}}
 else if(lBuf>0&&canDash()){doDash();lBuf=0;}
 else if(iBuf>0&&p.parryCD<=0){p.state='parry';p.st=0;p.parryT=.22;iBuf=0;sfx.tick();}
}
function onLand(){const p=P,v=p.prevVy;
 if(p.state==='slam'){slamLand();return;}
 if(v>620){shake=Math.max(shake,2);dust(p.x,GROUND,5);sfx.land();}}
function slamLand(){const p=P;p.state='idle';shake=Math.max(shake,10);hitstop=Math.max(hitstop,.05);sfx.heavy();dust(p.x,GROUND,16);rings.push({x:p.x,y:GROUND-6,t:0,life:.35,c:'#8ef0ff'});
 for(const e of enemies){if(e.gone)continue;if(Math.abs(e.x-p.x)<145&&e.y>GROUND-80){const d=sgn(e.x-p.x||p.facing);hitEnemy(e,{dmg:24,kb:260*d,up:e.type==='caster'?-200:-320,hs:.1,shake:6,key:'slam'},d);}}}
function updPlayer(dt){const p=P;p.st+=dt;
 p.invuln=Math.max(0,p.invuln-dt);p.dashCD=Math.max(0,p.dashCD-dt);p.parryCD=Math.max(0,p.parryCD-dt);p.riposte=Math.max(0,p.riposte-dt);
 if(p.dead){p.vy+=GRAV*dt*.6;p.y=Math.min(GROUND,p.y+p.vy*dt);return;}
 switch(p.state){
  case 'hurt':p.vx*=Math.max(0,1-9*dt);p.hurtT-=dt;if(p.hurtT<=0)p.state=p.onGround?'idle':'air';break;
  case 'dash':p.dashT-=dt;p.vx=p.facing*980;p.vy=0;pushTrail();ghostT-=dt;if(ghostT<=0){ghostT=.025;ghosts.push({x:p.x,y:p.y,f:p.facing,t:0});}if(p.dashT<=0){p.state=p.onGround?'idle':'air';}break;
  case 'parry':p.vx*=Math.max(0,1-8*dt);p.parryT-=dt;if(p.parryT<=0){p.state=p.onGround?'idle':'air';p.parryCD=.45;}break;
  case 'charge':{p.chargeT+=dt;const L=keys.KeyA||keys.ArrowLeft,R=keys.KeyD||keys.ArrowRight;let ax=0;if(L){ax-=1;p.facing=-1;}if(R){ax+=1;p.facing=1;}
   p.vx+=(ax*90-p.vx)*Math.min(1,12*dt);
   if(Math.random()<.5){const wa=p.facing>0?-2.45:Math.PI+2.45;const bx=p.x+p.facing*8+Math.cos(wa)*19,by=p.y-30+Math.sin(wa)*19;
    const a=rnd(0,TAU),r=rnd(30,60);prts.push({x:bx+Math.cos(a)*r,y:by+Math.sin(a)*r,vx:-Math.cos(a)*r*3,vy:-Math.sin(a)*r*3,t:0,life:.3,s:2,c:p.chargeT>=.55?'#ffd76e':'#8ef0ff',g:0,drag:0,glow:1});}
   if(!keys.KeyK){startAttack(p.chargeT>=.55?'h2':'h1');}
   else if(lBuf>0&&canDash()){doDash();lBuf=0;}
   break;}
  case 'attack':updAttack(dt);break;
  case 'slam':p.vy=1350;p.vx*=Math.max(0,1-2*dt);pushTrail();break;
  default:doLoco(dt);
 }
 p.prevVy=p.vy;p.vy+=(p.state==='dash'?0:GRAV)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
 if(p.y>=GROUND){if(!p.onGround)onLand();p.y=GROUND;p.vy=0;p.onGround=true;p.airJumps=1;p.airDashed=false;}
 else p.onGround=false;
 p.x=clamp(p.x,50,AW-50);
 for(const t of p.trail)t.life-=dt;p.trail=p.trail.filter(t=>t.life>0);
 const sx=p.x-p.facing*3,sy=p.y-42;p.scarf[0].x=sx;p.scarf[0].y=sy;
 for(let i=1;i<p.scarf.length;i++){const s=p.scarf[i],pv=p.scarf[i-1];let dx=s.x-pv.x,dy=s.y-pv.y;const d=Math.hypot(dx,dy)||1,rest=7;
  s.x=pv.x+dx/d*rest+Math.sin(tNow*6+i)*.5;s.y=pv.y+dy/d*rest+34*dt;}
}
/* ---------- combat resolution ---------- */
function hitEnemy(e,a,dir){
 let dmg=a.dmg,brk=a.break||0,hs=a.hs,gold=P.riposte>0;
 if(gold){dmg=Math.round(dmg*2.6);brk=1;hs=Math.max(hs,.17);P.riposte=0;}
 e.hp-=dmg;hitCount++;comboN++;comboT=1.6;comboPop=.2;
 hitstop=Math.max(hitstop,hs);shake=Math.min(14,shake+a.shake);
 e.flash=.12;e.sq=1;
 const cy=e.type==='caster'?e.y:e.y-44*(e.s||1);
 burst(clamp(P.x+dir*40,e.x-18,e.x+18),cy,gold?12:8,gold?'#ffd76e':'#9ef3ff',240+dmg*8);
 floats.push({x:e.x+rnd(-8,8),y:cy-26,txt:dmg,t:0,c:gold?'#ffd76e':'#fff'});
 sfx.hit(Math.min(1.2,.6+dmg*.02));
 e.hitTimes.push(tNow);while(e.hitTimes.length&&e.hitTimes[0]<tNow-1.2)e.hitTimes.shift();
 const armored=e.brute&&e.state==='windup';
 e.vx=dir*a.kb*(armored?.2:1);

 ctx.fillStyle='rgba(0,0,0,.55)';RR(bx-3,by-3,bw2+6,bh+6,5);ctx.fill();
 const hpr=clamp(P.hp/P.maxhp,0,1);
 ctx.fillStyle='#3a0f16';RR(bx,by,bw2,bh,3);ctx.fill();
 const hg=ctx.createLinearGradient(bx,0,bx+bw2,0);hg.addColorStop(0,'#ff4d5e');hg.addColorStop(1,'#ff8a5e');
 ctx.fillStyle=hg;RR(bx,by,bw2*hpr,bh,3);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.85)';RR(bx,by,bw2*hpr,4,2);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;RR(bx,by,bw2,bh,3);ctx.stroke();
 ctx.fillStyle='#cfd6ff';ctx.font='bold 11px system-ui';ctx.textAlign='left';ctx.fillText('生命',bx,by-8);
 pip(bx,by+26,canDash(),'#67e8f9','疾闪 L');
 pip(bx+86,by+26,P.parryCD<=0,'#ffd76e','弹反 I');
 ctx.textAlign='center';ctx.font='bold 15px system-ui';ctx.fillStyle='#e8ecff';
 ctx.fillText('第 '+wave+' 波',W/2,32);
 ctx.font='12px system-ui';ctx.fillStyle='rgba(210,220,255,.75)';
 ctx.fillText('残敌 '+(enemies.length+spawnQ.length),W/2,50);
 if(bannerT>0){const a=clamp(bannerT/.3,0,1);ctx.globalAlpha=a;
  ctx.font='bold 40px system-ui';ctx.textAlign='center';
  ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=6;
  ctx.strokeText(bannerTxt,W/2,150);ctx.fillStyle='#fff';ctx.fillText(bannerTxt,W/2,150);ctx.globalAlpha=1;}
 if(comboN>1){const pop=1+comboPop*1.5;
  ctx.save();ctx.translate(W-90,100);ctx.scale(pop,pop);
  ctx.font='bold 34px system-ui';ctx.textAlign='center';
  ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=5;
  ctx.strokeText(comboN+'',0,0);
  ctx.fillStyle=comboN>=8?'#ff8a5e':'#ffd76e';ctx.fillText(comboN+'',0,0);
  ctx.font='bold 13px system-ui';ctx.fillStyle='#fff';ctx.fillText('HITS',0,20);ctx.restore();}
 if(P.state==='charge'){const c=clamp(P.chargeT/.55,0,1),cx2=P.x-cam.x,cy2=P.y-88;
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(cx2-24,cy2,48,6);
  ctx.fillStyle=c>=1?'#ffd76e':'#67e8f9';ctx.fillRect(cx2-24,cy2,48*c,6);
  if(c>=1){ctx.fillStyle='#ffd76e';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('MAX',cx2,cy2-4);}}
 if(P.riposte>0){ctx.fillStyle='rgba(255,215,110,'+(0.5+0.4*Math.sin(tNow*18))+')';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('反击!',P.x-cam.x,P.y-98);}
 if(redFlash>0){ctx.fillStyle='rgba(255,40,40,'+redFlash*.22+')';ctx.fillRect(0,0,W,H);}
 if(P.hp<30&&!P.dead){ctx.fillStyle='rgba(255,30,30,'+(0.08+0.06*Math.sin(tNow*6))+')';ctx.fillRect(0,0,W,H);}
 ctx.fillStyle='rgba(200,210,255,.4)';ctx.font='12px system-ui';ctx.textAlign='left';
 ctx.fillText('A/D移动  Space跳跃  J连斩  K蓄力/下砸  L疾闪  I弹反  R重开',26,H-24);
}
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 ctx.fillStyle='#05060c';ctx.fillRect(0,0,CW,CH);
 ctx.setTransform(DPR*SCL,0,0,DPR*SCL,DPR*OX,DPR*OY);
 drawBG();
 ctx.save();ctx.translate(-cam.x+shX,shY);
 drawFloor();
 for(const d of debris)drawDebris(d);
 for(const e of enemies)drawEnemy(e);
 drawPlayer();
 for(const q of projs)drawProj(q);
 for(const s of shocks)drawShock(s);
 for(const b of prts)drawPrt(b);
 for(const s of slashes)drawSlash(s);
 for(const r of rings)drawRing(r);
 for(const f of floats)drawFloat(f);
 ctx.restore();
 drawHUD();
}
/* ---------- input ---------- */
const HK=new Set(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyJ','KeyK','KeyL','KeyI','KeyR','Enter','KeyM']);
addEventListener('keydown',e=>{
 const c=e.code;
 if(HK.has(c))e.preventDefault();
 ensureAudio();
 if(e.repeat){keys[c]=true;return;}
 keys[c]=true;
 if(c==='KeyM'){toggleMute();return;}
 if(state==='menu'){if(c==='Enter'||c==='Space')startGame();return;}
 if(state==='play'){
  if(c==='KeyR'){startGame();return;}
  if(P.dead){if(c==='Enter')startGame();return;}
  if(c==='KeyJ')jBuf=.28;
  else if(c==='KeyK')kBuf=.3;
  else if(c==='KeyL')lBuf=.2;
  else if(c==='KeyI')iBuf=.2;
  else if(c==='Space')spBuf=.13;
 }
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;jBuf=kBuf=lBuf=iBuf=spBuf=0;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){for(const k in keys)keys[k]=false;jBuf=kBuf=lBuf=iBuf=spBuf=0;}});
addEventListener('pointerdown',()=>{ensureAudio();});
function toggleMute(){ensureAudio();muted=!muted;if(master)master.gain.value=muted?0:.5;$('mute').textContent=muted?'🔇':'🔊';}
$('mute').addEventListener('click',e=>{toggleMute();e.currentTarget.blur();});
$('ovStart').addEventListener('click',()=>{ensureAudio();startGame();});
/* ---------- bench ---------- */
window.combatBenchState=()=>({ready:true,playerAlive:!!(P&&!P.dead),enemyCount:enemies.length,hitCount,limbBreakCount,playing:state==='play'&&!P.dead});
/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
 requestAnimationFrame(frame);
 let raw=(now-last)/1000;last=now;
 if(raw>1/30)raw=1/30;if(raw<0)raw=0;
 shake*=Math.pow(0.0001,raw);if(shake<.05)shake=0;
 shX=rnd(-1,1)*shake;shY=rnd(-1,1)*shake*.7;
 if(slowT>0){slowT-=raw;if(slowT<=0)timeScale=1;}
 if(hitstop>0){hitstop-=raw;}
 else{update(raw*timeScale);}
 render();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
