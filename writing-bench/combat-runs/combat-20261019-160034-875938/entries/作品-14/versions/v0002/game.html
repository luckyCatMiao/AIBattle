<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>裂刃试炼 · 战斗试玩</title>
<style>
  html,body{margin:0;padding:0;background:#0a0a12;height:100%;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
  canvas{background:#111;border:1px solid #2a2a44;box-shadow:0 0 40px #000;}
  .btn{position:absolute;padding:6px 14px;background:#1c1c2e;color:#cfd2ff;border:1px solid #4a4a80;cursor:pointer;font-size:14px;border-radius:4px;z-index:5;}
  .btn:hover{background:#2c2c48;}
  #muteBtn{top:10px;right:10px;}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,8,16,0.88);z-index:10;color:#e8e8ff;text-align:center;}
  #overlay h1{font-size:42px;margin:0 0 8px;letter-spacing:6px;color:#ffd27d;text-shadow:0 0 20px #ff9d3c;}
  #overlay p{margin:4px;color:#9fa3d0;}
  #startBtn{position:static;margin-top:22px;font-size:18px;padding:10px 34px;background:#3a2a10;color:#ffd27d;border:1px solid #ff9d3c;}
  #overlay{padding:20px;box-sizing:border-box;}
  #overlay h1{line-height:1.1;}
  #startBtn:hover{background:#5a421c;}
  .keys{display:grid;grid-template-columns:auto auto;gap:2px 14px;margin-top:14px;font-size:14px;color:#b9bce8;text-align:left;}
  .keys b{color:#ffd27d;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="540"></canvas>
  <button class="btn" id="muteBtn">🔊 音效</button>
  <div id="overlay">
    <h1>裂 刃 试 炼</h1>
    <p>斩断魔像与猎犬 —— 重击可撕裂它们的肢体</p>
    <div class="keys">
      <span><b>A / D</b></span><span>移动</span>
      <span><b>Space</b></span><span>跳跃</span>
      <span><b>J</b></span><span>连斩（三连，可在硬直中衔接）</span>
      <span><b>K</b></span><span>蓄力重斩（松开释放，断肢）</span>
      <span><b>L</b></span><span>疾冲（无敌帧）</span>
      <span><b>I</b></span><span>弹反（敌人出手瞬间招架）</span>
      <span><b>R</b></span><span>重新开始</span>
    </div>
    <button class="btn" id="startBtn">开 始 战 斗 (Enter)</button>
  </div>
</div>
<script>
"use strict";
// ---------- 基础 ----------
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=960,H=540,GY=470,WORLD_W=1700;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H)*0.98;cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();
// ---------- 音频 ----------
let AC=null,muted=false,noiseBuf=null;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=AC.createBuffer(1,AC.sampleRate*0.4,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){}}
function tone(f0,f1,dur,type,vol){if(!AC||muted)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function nz(dur,vol,f0,f1){if(!AC||muted)return;try{const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);f.Q.value=1;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+0.02);}catch(e){}}
function sfx(n){switch(n){
 case 'swing':nz(0.12,0.18,2400,400);break;
 case 'hit':tone(190,60,0.12,'square',0.22);nz(0.08,0.15,900,200);break;
 case 'heavy':tone(120,35,0.25,'sawtooth',0.3);nz(0.18,0.22,600,80);break;
 case 'dash':nz(0.16,0.14,300,2000);break;
 case 'jump':tone(260,560,0.12,'sine',0.12);break;
 case 'hurt':tone(300,90,0.2,'sawtooth',0.2);break;
 case 'parry':tone(1400,900,0.18,'square',0.18);tone(2100,1500,0.22,'triangle',0.14);break;
 case 'brk':nz(0.2,0.3,700,90);tone(90,35,0.25,'square',0.25);break;
 case 'die':tone(160,30,0.4,'sawtooth',0.25);nz(0.3,0.2,500,60);break;
 case 'charge':tone(80,320,0.5,'sine',0.08);break;
}}
document.getElementById('muteBtn').addEventListener('click',function(){initAudio();muted=!muted;this.textContent=muted?'🔇 静音':'🔊 音效';});
// ---------- 输入 ----------
const keys={},pressed={};
const GK=['KeyA','KeyD','ArrowLeft','ArrowRight','Space','KeyJ','KeyK','KeyL','KeyI','KeyR','Enter'];
addEventListener('keydown',e=>{
  if(GK.indexOf(e.code)>=0)e.preventDefault();
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  if(!e.repeat){keys[e.code]=true;pressed[e.code]=true;}
  if(e.code==='Enter'&&!game.playing)startGame();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.getElementById('startBtn').addEventListener('click',()=>{initAudio();startGame();});
// ---------- 状态 ----------
const game={ready:true,playing:false,wave:1,spawnT:0,hitCount:0,limbBreaks:0,freeze:0,shake:0,shakeX:0,shakeY:0,camX:0,slowmo:0,flash:0};
let player,enemies,parts,fx,after;
function mkParts(type){
  if(type==='hound')return[
    {n:'head',ox:20,oy:-46,w:22,h:16,hp:18,limb:false,broken:false,c:'#7d3b3b'},
    {n:'body',ox:0,oy:-30,w:44,h:24,hp:40,limb:false,broken:false,c:'#8f4444'},
    {n:'legF',ox:14,oy:-8,w:10,h:22,hp:14,limb:true,broken:false,c:'#6e3333'},
    {n:'legB',ox:-14,oy:-8,w:10,h:22,hp:14,limb:true,broken:false,c:'#6e3333'}];
  return[
    {n:'head',ox:0,oy:-88,w:22,h:18,hp:26,limb:false,broken:false,c:'#5d6f8f'},
    {n:'body',ox:0,oy:-52,w:46,h:52,hp:70,limb:false,broken:false,c:'#4a5a78'},
    {n:'armL',ox:-30,oy:-56,w:16,h:44,hp:26,limb:true,broken:false,c:'#3d4c66'},
    {n:'armR',ox:30,oy:-56,w:16,h:44,hp:26,limb:true,broken:false,c:'#3d4c66'}];
}
function spawnEnemy(type,x){
  const golem=type==='golem';
  enemies.push({type,x,y:GY,vx:0,vy:0,face:x<player.x?1:-1,
    hp:golem?120:60,maxHp:golem?120:60,
    state:'chase',t:0,strikeDone:false,flashT:0,airborne:false,
    parts:mkParts(type),dead:false,deadT:0,atkCd:0});
}
function startGame(){
  document.getElementById('overlay').style.display='none';
  player={x:400,y:GY,vx:0,vy:0,face:1,hp:100,maxHp:100,state:'idle',t:0,onGround:true,
    atk:null,queued:false,charge:0,dashT:0,ifr:0,hurtT:0,parryT:0,combo:0,comboT:0,swingId:0};
  enemies=[];parts=[];fx=[];after=[];
  game.wave=1;game.hitCount=0;game.limbBreaks=0;game.freeze=0;game.shake=0;game.slowmo=0;game.flash=0;
  game.playing=true;game.spawnT=0;
  spawnEnemy('hound',900);spawnEnemy('hound',1300);spawnEnemy('golem',1500);
}
// ---------- 攻击数据 ----------
const COMBO=[
 {dur:0.26,hit:0.10,range:64,dmg:9,kb:4,hs:0.05,launch:0,ang:-0.9},
 {dur:0.26,hit:0.11,range:68,dmg:10,kb:5,hs:0.06,launch:0,ang:0.9},
 {dur:0.34,hit:0.14,range:74,dmg:16,kb:9,hs:0.10,launch:-6,ang:-1.3}];
// ---------- 粒子 ----------
function spark(x,y,n,c,spd){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(Math.random()*0.7+0.3)*spd;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:0.3+Math.random()*0.2,t:0,c,r:1+Math.random()*2.5});}}
function limbFly(p,e,big){
  const wx=e.x+p.ox*e.face,wy=e.y+p.oy;
  parts.push({x:wx,y:wy,w:p.w,h:p.h,c:p.c,vx:e.face*(1+Math.random()*3)+(Math.random()-0.5)*3,
    vy:-(4+Math.random()*(big?7:4)),rot:Math.random()*6,vr:(Math.random()-0.5)*0.5,life:1.6,t:0});
}
// ---------- 伤害 ----------
function damageEnemy(e,dmg,dir,kb,hs,launch,heavy){
  e.hp-=dmg;e.flashT=0.12;
  game.hitCount++;player.combo++;player.comboT=2.2;
  game.freeze=Math.max(game.freeze,hs);
  game.shake=Math.min(14,game.shake+dmg*0.35+(heavy?4:0));
  spark(e.x+dir*10,e.y-40,heavy?16:8,heavy?'#ffd27d':'#ffe9a8',heavy?9:6);
  // 肢体伤害
  const intact=e.parts.filter(p=>!p.broken);
  let target=null;
  if(heavy){const limbs=intact.filter(p=>p.limb);target=limbs.length?limbs[Math.floor(Math.random()*limbs.length)]:(intact.filter(p=>p.n==='head')[0]||intact[0]);}
  else target=intact[Math.floor(Math.random()*intact.length)];
  if(target){target.hp-=dmg;
    if(target.hp<=0&&!target.broken){
      if(target.limb){target.broken=true;game.limbBreaks++;limbFly(target,e,heavy);sfx('brk');
        spark(e.x+target.ox*e.face,e.y+target.oy,14,'#ff6b5e',8);
        if(e.type==='golem'){const arms=e.parts.filter(p=>p.limb&&!p.broken).length;if(arms===0)e.hp-=15;}
      } else target.hp=Math.max(6,target.hp*0.5+6);
    }}
  e.vx=dir*kb;if(launch&&e.onGround!==false&&e.type==='hound'){e.vy=launch;e.airborne=true;}
  if(e.type==='golem'){e.vx*=0.3;if(e.state!=='windup'||heavy){e.state='stagger';e.t=heavy?0.7:0.3;}}
  else {e.state='stagger';e.t=heavy?0.6:0.25;}
  sfx(heavy?'heavy':'hit');
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  e.dead=true;e.deadT=1.2;sfx('die');
  e.parts.forEach(p=>{if(!p.broken)limbFly(p,e,true);});
  spark(e.x,e.y-40,26,'#ff9d3c',10);
  game.shake=Math.min(16,game.shake+6);game.freeze=Math.max(game.freeze,0.12);
}
function hurtPlayer(dmg,dir){
  if(player.ifr>0||player.dashT>0)return;
  if(player.parryT>0){ // 弹反成功
    sfx('parry');game.freeze=0.28;game.slowmo=0.5;game.flash=0.25;
    spark(player.x+player.face*20,player.y-40,24,'#9df2ff',10);
    enemies.forEach(e=>{if(!e.dead&&Math.abs(e.x-player.x)<160){e.state='stagger';e.t=1.6;e.vx=dir*8;}});
    player.parryT=0;player.state='idle';player.ifr=0.6;return;
  }
  player.hp-=dmg;player.hurtT=0.5;player.ifr=0.9;player.state='hurt';player.t=0;
  player.vx=dir*6;player.vy=-3;player.atk=null;player.charge=0;
  game.shake=Math.min(12,game.shake+5);game.freeze=Math.max(game.freeze,0.06);
  spark(player.x,player.y-40,10,'#ff5e5e',7);sfx('hurt');
  if(player.hp<=0){player.hp=0;player.state='dead';game.playing=false;
    setTimeout(()=>{document.getElementById('overlay').style.display='flex';
      document.getElementById('overlay').querySelector('h1').textContent='阵 亡';
      document.getElementById('startBtn').textContent='再 战 (Enter / R)';},900);}
}
// ---------- 更新 ----------
function startSwing(i){
  player.swingId++;
  player.atk={i,t:0,hitDone:false,id:player.swingId};
  player.state='attack';player.t=0;sfx('swing');
}
function releaseHeavy(){
  const c=Math.min(1,player.charge/0.9);
  player.atk={i:99,t:0,hitDone:false,id:++player.swingId,heavy:true,pow:c};
  player.state='attack';player.t=0;player.charge=0;sfx('swing');
}
function updPlayer(dt){
  const p=player,L=keys.KeyA||keys.ArrowLeft,R=keys.KeyD||keys.ArrowRight;
  p.t+=dt;if(p.ifr>0)p.ifr-=dt;if(p.comboT>0){p.comboT-=dt;if(p.comboT<=0)p.combo=0;}
  if(p.state==='dead')return;
  // 弹反
  if(pressed.KeyI&&p.state!=='attack'&&p.dashT<=0&&p.hurtT<=0){p.parryT=0.22;p.state='parry';p.t=0;sfx('dash');}
  if(p.state==='parry'){p.parryT-=dt;if(p.t>0.35)p.state='idle';}
  // 疾冲
  if(pressed.KeyL&&p.dashT<=0&&p.hurtT<=0&&p.state!=='charging'){
    p.dashT=0.22;p.state='dash';p.vx=p.face*14;sfx('dash');
    after.push({x:p.x,y:p.y,face:p.face,t:0.25});
  }
  if(p.dashT>0){p.dashT-=dt;p.x+=p.vx;if(p.dashT<=0){p.state='idle';p.vx=0;}p.x=Math.max(30,Math.min(WORLD_W-30,p.x));return;}
  // 攻击推进
  if(p.state==='attack'&&p.atk){
    const a=p.atk,dat=a.heavy?{dur:0.42,hit:0.16,range:86+40*a.pow}:COMBO[a.i];
    if(a.t>=dat.hit&&!a.hitDone){
      a.hitDone=true;
      enemies.forEach(e=>{
        if(e.dead)return;
        const dx=e.x-p.x,inR=Math.abs(dx)<dat.range+22&&Math.sign(dx||p.face)===p.face,dy=Math.abs((e.y-40)-(p.y-40))<70;
        if(inR&&dy){
          if(a.heavy)damageEnemy(e,20+26*a.pow,p.face,10+8*a.pow,0.14+0.1*a.pow,-9,true);
          else damageEnemy(e,dat.dmg,p.face,dat.kb,dat.hs,dat.launch,false);
        }});
    }
    if(a.t>=dat.dur){
      if(p.queued&&!a.heavy&&a.i<2){p.queued=false;startSwing(a.i+1);}
      else{p.atk=null;p.state='idle';p.queued=false;}
    }
    if(pressed.KeyJ&&a.t>dat.hit)p.queued=true;
    p.x+=p.face*(a.heavy?1.2:1.6)*dt*8;
  }
  // 蓄力
  if(p.state==='charging'){
    if(keys.KeyK){p.charge+=dt;if(Math.random()<dt*8)spark(p.x+p.face*18,p.y-50,1,'#ffd27d',3);}
    else releaseHeavy();
  } else if(pressed.KeyK&&p.state!=='attack'&&p.hurtT<=0&&p.onGround){p.state='charging';p.charge=0;sfx('charge');}
  // 普通攻击
  if(pressed.KeyJ&&p.state!=='attack'&&p.state!=='charging'&&p.hurtT<=0)startSwing(0);
  // 移动
  if(p.state!=='attack'&&p.state!=='charging'&&p.state!=='parry'&&p.hurtT<=0){
    const mv=(R?1:0)-(L?1:0);
    p.vx=mv*5;if(mv)p.face=mv;
    p.state=p.onGround?(mv?'run':'idle'):'air';
  }
  if(pressed.Space&&p.onGround&&p.hurtT<=0){p.vy=-11.5;p.onGround=false;sfx('jump');}
  if(p.hurtT>0)p.hurtT-=dt;
  // 重力
  p.vy+=0.55;p.y+=p.vy;p.x+=p.vx;
  if(p.y>=GY){if(!p.onGround&&p.vy>6)spark(p.x,GY,5,'#8a8aa8',3);p.y=GY;p.vy=0;p.onGround=true;}
  p.x=Math.max(30,Math.min(WORLD_W-30,p.x));
}
function enemyHitbox(e){return{x:e.x-24,y:e.y-(e.type==='golem'?96:52),w:48,h:e.type==='golem'?96:52};}
function updEnemy(e,dt){
  if(e.dead){e.deadT-=dt;return;}
  e.t+=dt;e.flashT=Math.max(0,e.flashT-dt);e.atkCd=Math.max(0,e.atkCd-dt);
  e.vy+=0.55;e.y+=e.vy;
  if(e.y>=GY){if(e.airborne){spark(e.x,GY,6,'#8a8aa8',4);}e.y=GY;e.vy=0;e.airborne=false;}
  const dx=player.x-e.x,adx=Math.abs(dx),dir=Math.sign(dx)||1;
  const legs=e.parts.filter(p=>p.n.indexOf('leg')===0&&!p.broken).length;
  const arms=e.parts.filter(p=>p.n.indexOf('arm')===0&&!p.broken).length;
  const speedMul=e.type==='hound'?(legs===0?0.35:legs===1?0.65:1):1;
  switch(e.state){
   case 'chase':
    e.face=dir;
    if(e.type==='hound'){
      if(adx>60)e.vx=dir*3.2*speedMul;else e.vx=0;
      if(adx<85&&e.atkCd<=0){e.state='windup';e.t=0;e.vx=0;}
    }else{
      if(adx>80)e.vx=dir*1.5;else e.vx=0;
      if(adx<(arms>0?110:60)&&e.atkCd<=0){e.state='windup';e.t=0;e.vx=0;}
    }
    break;
   case 'windup':
    e.vx=0;
    if(e.t>(e.type==='hound'?0.45:0.75)){e.state='strike';e.t=0;e.strikeDone=false;sfx('swing');
      if(e.type==='hound'){e.vx=e.face*9;e.vy=-2;}}
    break;
   case 'strike':
    if(e.type==='hound'){
      e.x+=e.vx;
      if(!e.strikeDone&&adx<60&&Math.abs(player.y-e.y)<60){e.strikeDone=true;hurtPlayer(12,e.face);}
      if(e.t>0.3){e.state='recover';e.t=0;e.vx=0;}
    }else{
      if(!e.strikeDone&&e.t>0.08){
        e.strikeDone=true;game.shake=Math.min(12,game.shake+4);
        spark(e.x+e.face*50,GY,10,'#8a8aa8',5);nz&&sfx('heavy');
        const reach=arms>0?95:50,dmg=arms===2?20:arms===1?13:7;
        if(player.x>e.x-20&&Math.abs(player.x-(e.x+e.face*reach*0.6))<reach*0.7&&player.y>GY-90)hurtPlayer(dmg,e.face);
      }
      if(e.t>0.3){e.state='recover';e.t=0;}
    }
    break;
   case 'recover':e.vx=0;if(e.t>(e.type==='hound'?0.5:0.9)){e.state='chase';e.atkCd=e.type==='hound'?0.6:1.4;}break;
   case 'stagger':e.vx*=0.85;if(e.t<=0)e.state='chase';else e.t-=dt*0;{if(e.t>0)e.t-=dt;else e.state='chase';}break;
  }
  if(e.state!=='strike'||e.type!=='hound')e.x+=e.vx*(e.state==='stagger'?0.5:1)*dt*60/60;
  e.x=Math.max(30,Math.min(WORLD_W-30,e.x));
}
// ---------- 主循环 ----------
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min(0.033,(now-last)/1000);last=now;
  if(game.slowmo>0){game.slowmo-=dt;dt*=0.35;}
  if(game.freeze>0){game.freeze-=dt;render();return;}
  if(game.playing||player){
    if(game.playing){
      updPlayer(dt);
      enemies.forEach(e=>updEnemy(e,dt));
      enemies=enemies.filter(e=>!e.dead||e.deadT>0);
      // 刷新
      const alive=enemies.filter(e=>!e.dead).length;
      if(alive===0){game.spawnT-=dt;
        if(game.spawnT<=0){game.wave++;
          const n=Math.min(2+game.wave,5);
          for(let i=0;i<n;i++){const side=Math.random()<0.5?-1:1;
            spawnEnemy(i%3===2?'golem':'hound',Math.max(60,Math.min(WORLD_W-60,player.x+side*(400+Math.random()*400))));}
          game.spawnT=1.2;}
      }
    }
    // 粒子
    fx.forEach(f=>{f.t+=dt;f.x+=f.vx;f.y+=f.vy;f.vy+=0.3;});fx=fx.filter(f=>f.t<f.life);
    parts.forEach(p=>{p.t+=dt;p.vy+=0.5;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      if(p.y>GY){p.y=GY;p.vy*=-0.4;p.vx*=0.7;p.vr*=0.5;}});
    parts=parts.filter(p=>p.t<p.life);
    after.forEach(a=>a.t-=dt);after=after.filter(a=>a.t>0);
    // 相机
    const tx=Math.max(0,Math.min(WORLD_W-W,player.x-W/2));
    game.camX+=(tx-game.camX)*0.12;
    game.shake*=0.86;game.flash=Math.max(0,game.flash-dt);
    game.shakeX=(Math.random()-0.5)*game.shake;game.shakeY=(Math.random()-0.5)*game.shake;
  }
  if(pressed.KeyR){startGame();}
  for(const k in pressed)pressed[k]=false;
  render();
}
requestAnimationFrame(loop);
// ---------- 绘制 ----------
function drawPlayerFig(x,y,face,pose,alpha){
  ctx.save();ctx.translate(x,y);ctx.scale(face,1);ctx.globalAlpha=alpha;
  const p=player;
  // 腿
  ctx.strokeStyle='#2b2b3d';ctx.lineWidth=5;ctx.lineCap='round';
  const run=pose==='run'?Math.sin(p.t*14)*7:0;
  ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(-6+run,0);ctx.moveTo(0,-24);ctx.lineTo(6-run,0);ctx.stroke();
  // 身体
  ctx.fillStyle='#3d3d5c';ctx.fillRect(-8,-48,16,26);
  ctx.fillStyle='#ffd27d';ctx.fillRect(-8,-48,16,4);
  // 头
  ctx.fillStyle='#e8d5b0';ctx.beginPath();ctx.arc(2,-56,8,0,7);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(4,-59,4,3);
  // 剑
  let ang=-0.5,reach=38;
  if(p.state==='attack'&&p.atk&&alpha===1){
    const a=p.atk;
    if(a.heavy){const pr=Math.min(1,a.t/0.16);ang=2.2-pr*3.4;reach=44+26*a.pow;}
    else{const dat=COMBO[a.i],pr=Math.min(1,a.t/dat.dur);ang=dat.ang>0?(-1.8+pr*2.8):(1.4-pr*2.8);}
  } else if(p.state==='charging'&&alpha===1){ang=2.4;reach=44;}
  else if(p.state==='parry'&&alpha===1){ang=-1.4;}
  ctx.save();ctx.translate(4,-40);ctx.rotate(ang);
  ctx.fillStyle='#cfd2ff';ctx.fillRect(0,-3,reach,5);
  ctx.fillStyle='#8a6d3b';ctx.fillRect(-6,-5,8,9);
  ctx.restore();
  // 蓄力光环
  if(p.state==='charging'&&alpha===1){const c=Math.min(1,p.charge/0.9);
    ctx.strokeStyle='rgba(255,210,125,'+(0.4+c*0.6)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,-36,18+c*14,0,7);ctx.stroke();}
  // 弹反闪光
  if(p.state==='parry'&&p.parryT>0&&alpha===1){
    ctx.strokeStyle='rgba(157,242,255,0.9)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(10,-40,22,-1.2,1.2);ctx.stroke();}
  ctx.restore();
}
function drawEnemy(e){
  const bob=e.state==='chase'?Math.sin(e.t*8)*2:0;
  ctx.save();ctx.translate(e.x,e.y+bob);ctx.scale(e.face,1);
  const wind=e.state==='windup';
  if(wind&&Math.floor(e.t*12)%2===0){ctx.shadowColor='#ff3b3b';ctx.shadowBlur=18;}
  const stg=e.state==='stagger'?Math.sin(e.t*40)*3:0;
  ctx.translate(stg,0);
  e.parts.forEach(p=>{
    if(p.broken)return;
    ctx.fillStyle=e.flashT>0?'#ffffff':p.c;
    if(e.type==='golem'&&p.n.indexOf('arm')===0&&e.state==='windup'){
      ctx.save();ctx.translate(p.ox,p.oy);ctx.rotate(-e.t*2.2);ctx.fillRect(-p.w/2,0,p.w,p.h);ctx.restore();
    } else if(e.type==='golem'&&p.n.indexOf('arm')===0&&e.state==='strike'){
      ctx.save();ctx.translate(p.ox,p.oy);ctx.rotate(1.4);ctx.fillRect(-p.w/2,0,p.w,p.h);ctx.restore();
    } else ctx.fillRect(p.ox-p.w/2,p.oy-p.h/2,p.w,p.h);
  });
  // 眼睛
  ctx.fillStyle=wind?'#ff3b3b':'#ffb13b';
  ctx.fillRect(e.type==='golem'?2:16,e.type==='golem'?-86:-46,6,4);
  ctx.restore();ctx.shadowBlur=0;
  // 血条
  if(!e.dead){ctx.fillStyle='#222';ctx.fillRect(e.x-24,e.y-(e.type==='golem'?112:66),48,5);
    ctx.fillStyle='#e04b4b';ctx.fillRect(e.x-23,e.y-(e.type==='golem'?111:65),46*Math.max(0,e.hp/e.maxHp),3);}
}
function render(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#141428');g.addColorStop(0.7,'#1c1633');g.addColorStop(1,'#241a2e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-game.camX+game.shakeX,game.shakeY);
  // 远景
  ctx.fillStyle='#1a1a30';
  for(let i=0;i<10;i++){const bx=i*200-((game.camX*0.3)%200);ctx.fillRect(bx,180+(i%3)*40,60,300);}
  ctx.fillStyle='#0f0f1e';
  for(let i=0;i<12;i++){const bx=i*160-((game.camX*0.6)%160);ctx.fillRect(bx,300+(i%2)*30,40,200);}
  // 地面
  ctx.fillStyle='#2a2438';ctx.fillRect(-50,GY,WORLD_W+100,H-GY);
  ctx.fillStyle='#3a3252';ctx.fillRect(-50,GY,WORLD_W+100,6);
  if(!player){ctx.restore();return;}
  // 残影
  after.forEach(a=>drawPlayerFig(a.x,a.y,a.face,'dash',a.t*2.5));
  parts.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,(p.life-p.t)*2);
    ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
  enemies.forEach(e=>{if(!e.dead||e.deadT>0.6)drawEnemy(e);});
  drawPlayerFig(player.x,player.y,player.face,player.state,player.ifr>0&&Math.floor(player.ifr*16)%2===0?0.4:1);
  fx.forEach(f=>{ctx.globalAlpha=1-f.t/f.life;ctx.fillStyle=f.c;ctx.fillRect(f.x-f.r/2,f.y-f.r/2,f.r,f.r);});
  ctx.globalAlpha=1;ctx.restore();
  if(game.flash>0){ctx.fillStyle='rgba(180,240,255,'+game.flash*1.6+')';ctx.fillRect(0,0,W,H);}
  // UI
  ctx.fillStyle='#000a';ctx.fillRect(14,14,220,58);
  ctx.fillStyle='#333';ctx.fillRect(24,26,160,12);
  ctx.fillStyle=player.hp>30?'#5ee07a':'#e04b4b';ctx.fillRect(24,26,160*player.hp/player.maxHp,12);
  ctx.strokeStyle='#888';ctx.strokeRect(24,26,160,12);
  ctx.fillStyle='#cfd2ff';ctx.font='13px Arial';
  ctx.fillText('HP '+Math.ceil(player.hp)+' / '+player.maxHp,24,60);
  ctx.fillStyle='#9fa3d0';ctx.fillText('波次 '+game.wave,190,38);
  if(player.combo>1){ctx.fillStyle='#ffd27d';ctx.font='bold 26px Arial';
    ctx.fillText(player.combo+' HITS',W-150,60);}
  ctx.fillStyle='#666a99';ctx.font='12px Arial';
  ctx.fillText('A/D移动 Space跳 J连斩 K蓄力 L疾冲 I弹反 R重开',16,H-12);
  if(game.playing&&enemies.filter(e=>!e.dead).length===0){
    ctx.fillStyle='#ffd27d';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText('下一波来袭…',W/2,120);ctx.textAlign='left';}
}
// ---------- 检查接口 ----------
window.combatBenchState=function(){
  return{ready:game.ready,
    playerAlive:!!player&&player.hp>0,
    enemyCount:enemies?enemies.filter(e=>!e.dead).length:0,
    hitCount:game.hitCount,
    limbBreakCount:game.limbBreaks,
    playing:game.playing};
};
</script>
