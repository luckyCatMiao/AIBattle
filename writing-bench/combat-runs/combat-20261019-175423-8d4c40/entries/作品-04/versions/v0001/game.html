<div id="stage"><canvas id="game" width="960" height="540" aria-label="绯刃试炼 游戏画面"></canvas></div>
<div id="ui">
  <button id="muteBtn" type="button" aria-pressed="false" title="静音 (M)">🔊 声音</button>
  <button id="fsBtn" type="button" title="切换全屏（可选）">⛶ 全屏</button>
</div>
<script>
/* ==== 00-core.js ==== */
'use strict';
/* ============================================================
   CRIMSON EDGE — core utilities
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutQuad = t => 1 - (1 - t) * (1 - t);
const sign = v => v < 0 ? -1 : 1;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = clamp(Math.round(r + amt), 0, 255);
  g = clamp(Math.round(g + amt), 0, 255);
  b = clamp(Math.round(b + amt), 0, 255);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

/* Deterministic hash noise for background scenery */
function hash1(n) { const s = Math.sin(n * 127.1) * 43758.5453123; return s - Math.floor(s); }

/* ============================================================
   Input — held / pressed / released, pointer-safe, focus-safe
   ============================================================ */
const BIND = {
  left: ['KeyA', 'ArrowLeft'],
  right: ['KeyD', 'ArrowRight'],
  up: ['KeyW', 'ArrowUp'],
  down: ['KeyS', 'ArrowDown'],
  jump: ['Space'],
  atk: ['KeyJ'],
  heavy: ['KeyK'],
  dash: ['KeyL'],
  special: ['KeyI'],
  restart: ['KeyR'],
  start: ['Enter', 'NumpadEnter'],
  mute: ['KeyM']
};
const BLOCK_KEYS = new Set(Object.values(BIND).flat());

const Input = {
  held: Object.create(null),
  pressed: Object.create(null),
  released: Object.create(null),
  anyPressed: false,
  init() {
    window.addEventListener('keydown', e => {
      if (BLOCK_KEYS.has(e.code)) e.preventDefault();
      if (e.repeat) return;
      if (!this.held[e.code]) { this.pressed[e.code] = true; this.anyPressed = true; }
      this.held[e.code] = true;
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      Audio_.unlock();
      if (e.code === 'KeyM') Audio_.toggleMute();
    }, { passive: false });
    window.addEventListener('keyup', e => {
      if (BLOCK_KEYS.has(e.code)) e.preventDefault();
      this.held[e.code] = false;
      this.released[e.code] = true;
    }, { passive: false });
    window.addEventListener('blur', () => this.clear());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.clear(); });
  },
  clear() {
    for (const k in this.held) this.held[k] = false;
    for (const k in this.pressed) this.pressed[k] = false;
  },
  down(action) { return BIND[action].some(c => this.held[c]); },
  hit(action) { return BIND[action].some(c => this.pressed[c]); },
  endFrame() {
    for (const k in this.pressed) this.pressed[k] = false;
    for (const k in this.released) this.released[k] = false;
    this.anyPressed = false;
  }
};

/* ==== 10-audio.js ==== */
'use strict';
/* ============================================================
   Audio — everything synthesized with WebAudio, no assets.
   ============================================================ */
const Audio_ = {
  ctx: null, master: null, muted: false, unlocked: false,
  unlock() {
    if (this.unlocked) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.55;
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 4;
      this.master.connect(comp); comp.connect(this.ctx.destination);
      this.unlocked = true;
      this.noiseBuf = this._makeNoise(1.5);
    } catch (e) { this.ctx = null; }
  },
  _makeNoise(sec) {
    const len = Math.floor(this.ctx.sampleRate * sec);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 0.55, this.ctx.currentTime, 0.01);
    if (this.onToggle) this.onToggle(this.muted);
    return this.muted;
  },
  _now() { return this.ctx.currentTime; },
  _env(gain, t0, peak, attack, decay, curve = 2) {
    gain.gain.cancelScheduledValues(t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peak, t0 + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  },
  noise(dur = 0.2, o = {}) {
    if (!this.ctx || this.muted) return;
    const t0 = this._now();
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = o.rate || 1;
    const f = this.ctx.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f0 || 1200, t0);
    f.frequency.exponentialRampToValueAtTime(o.f1 || 400, t0 + dur);
    f.Q.value = o.q ?? 0.9;
    const g = this.ctx.createGain();
    this._env(g, t0, o.vol ?? 0.3, o.attack ?? 0.004, dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.05);
  },
  tone(freq, dur = 0.15, o = {}) {
    if (!this.ctx || this.muted) return;
    const t0 = this._now() + (o.delay || 0);
    const osc = this.ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + dur);
    const g = this.ctx.createGain();
    this._env(g, t0, o.vol ?? 0.25, o.attack ?? 0.003, dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },

  swing(level = 0) {
    this.noise(0.16 + level * 0.05, { f0: 2200 + level * 500, f1: 500, vol: 0.16 + level * 0.04, q: 1.2, rate: 1.3 });
  },
  heavySwing() {
    this.noise(0.3, { f0: 900, f1: 180, vol: 0.3, q: 0.8, type: 'lowpass' });
    this.tone(150, 0.22, { type: 'sawtooth', f1: 60, vol: 0.1 });
  },
  hit(power = 1) {
    const v = clamp(power, 0.5, 2);
    this.noise(0.06 + 0.05 * v, { f0: 1800, f1: 300, vol: 0.32 * v, q: 0.7, type: 'lowpass' });
    this.tone(150 / v, 0.13 * v, { type: 'square', f1: 60, vol: 0.14 * v });
    this.tone(900, 0.05, { type: 'triangle', f1: 300, vol: 0.07 * v });
  },
  clash() {
    this.tone(1800, 0.35, { type: 'triangle', f1: 900, vol: 0.2 });
    this.tone(2400, 0.28, { type: 'sine', f1: 1500, vol: 0.12, delay: 0.01 });
    this.noise(0.25, { f0: 5000, f1: 1200, vol: 0.22, q: 4 });
  },
  parry() {
    this.clash();
    this.tone(420, 0.4, { type: 'sine', f1: 210, vol: 0.2, delay: 0.05 });
  },
  break_() {
    this.noise(0.28, { f0: 700, f1: 90, vol: 0.45, q: 0.6, type: 'lowpass' });
    this.tone(110, 0.35, { type: 'sawtooth', f1: 40, vol: 0.22 });
    this.noise(0.18, { f0: 3200, f1: 700, vol: 0.12, q: 2, delay: 0.02 });
    this.tone(600, 0.2, { type: 'square', f1: 120, vol: 0.08, delay: 0.03 });
  },
  jump() { this.noise(0.12, { f0: 900, f1: 300, vol: 0.1, q: 1 }); },
  land() { this.noise(0.14, { f0: 400, f1: 80, vol: 0.18, type: 'lowpass' }); this.tone(80, 0.1, { type: 'sine', f1: 40, vol: 0.12 }); },
  dash() { this.noise(0.22, { f0: 3000, f1: 600, vol: 0.18, q: 0.8 }); },
  hurt() {
    this.tone(220, 0.18, { type: 'sawtooth', f1: 80, vol: 0.18 });
    this.noise(0.12, { f0: 700, f1: 150, vol: 0.2, type: 'lowpass' });
  },
  enemyWarn() { this.tone(520, 0.12, { type: 'triangle', f1: 700, vol: 0.07 }); },
  spawn() { this.tone(140, 0.4, { type: 'sine', f1: 70, vol: 0.12 }); },
  wave() {
    this.tone(330, 0.5, { type: 'triangle', f1: 440, vol: 0.1 });
    this.tone(660, 0.6, { type: 'sine', f1: 880, vol: 0.06, delay: 0.08 });
  },
  death() { this.tone(180, 1.2, { type: 'sawtooth', f1: 40, vol: 0.2 }); }
};

/* ==== 20-draw.js ==== */
'use strict';
/* ============================================================
   Drawing helpers — Canvas2D primitives, particles, camera
   ============================================================ */
const W = 960, H = 540, GROUND_Y = 474, GROUND_SCREEN = 500;

const Palette = {
  sky0: '#070a16', sky1: '#151a33', sky2: '#2a2547',
  ink: '#05060c', bone: '#eef2ff', paper: '#dfe6f7',
  crimson: '#e8324f', crimsonDk: '#8c1229', gold: '#ffcf6e',
  cyan: '#7cf5ff', wood: '#c8915c', woodDk: '#7a4a2a',
  silk: '#f2e9da'
};

const Camera = {
  x: 0, y: 0, shake: 0, shakeX: 0, shakeY: 0, trauma: 0, dir: 1, zoom: 1.2,
  init() { this.x = 0; this.y = 0; this.trauma = 0; this.shake = 0; },
  kick(amount) { this.trauma = Math.min(1, this.trauma + amount); },
  update(dt, target) {
    const vw = W / this.zoom;
    const look = (target.facing || 1) * 46;
    const tx = clamp(target.x + look - vw / 2, 0, WORLD.w - vw);
    this.x = lerp(this.x, tx, 1 - Math.pow(0.0009, dt));
    this.trauma = Math.max(0, this.trauma - dt * 1.35);
    const s = this.trauma * this.trauma;
    this.shake = s * 16;
    this.shakeX = rand(-1, 1) * this.shake;
    this.shakeY = rand(-1, 1) * this.shake * 0.7;
  }
};

/* Context transform helper: world coords + shake */
function beginWorld(ctx) {
  ctx.save();
  const z = Camera.zoom, vw = W / z;
  ctx.translate(W / 2 + Camera.shakeX, GROUND_SCREEN + Camera.shakeY);
  ctx.scale(z, z);
  ctx.translate(-(Camera.x + vw / 2), -GROUND_Y);
}
function endWorld(ctx) { ctx.restore(); }
function screenOf(x, y) {
  const z = Camera.zoom, vw = W / z;
  return { x: (x - Camera.x - vw / 2) * z + W / 2 + Camera.shakeX, y: (y - GROUND_Y) * z + GROUND_SCREEN + Camera.shakeY };
}

/* ---------- shape helpers ---------- */
function capsule(ctx, x, y, x2, y2, w) {
  ctx.beginPath();
  const a = Math.atan2(y2 - y, x2 - x);
  ctx.arc(x, y, w / 2, a + Math.PI / 2, a - Math.PI / 2);
  ctx.arc(x2, y2, w / 2, a - Math.PI / 2, a + Math.PI / 2);
  ctx.closePath();
}
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function glowCircle(ctx, x, y, r, color, alpha = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function poly(ctx, pts, close = true) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  if (close) ctx.closePath();
}

/* ============================================================
   Background — moonlit bamboo forest, parallax
   ============================================================ */
const Background = {
  lanterns: [],
  petals: [],
  init() {
    this.lanterns = [];
    for (let i = 0; i < 14; i++) {
      this.lanterns.push({ x: 120 + i * 220 + hash1(i) * 90, y: 90 + hash1(i + 9) * 120, r: 7 + hash1(i + 3) * 4, ph: hash1(i + 5) * TAU });
    }
    this.petals = [];
    for (let i = 0; i < 46; i++) {
      this.petals.push({
        x: Math.random() * W, y: Math.random() * H, s: 2 + Math.random() * 3,
        vx: -18 - Math.random() * 26, vy: 12 + Math.random() * 22,
        rot: Math.random() * TAU, spin: rand(-2, 2), ph: Math.random() * TAU
      });
    }
  },
  update(dt) {
    for (const p of this.petals) {
      p.x += (p.vx + Math.sin(Game.time * 0.7 + p.ph) * 12) * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt;
      if (p.x < -10) { p.x = W + 10; p.y = Math.random() * H; }
      if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
    }
  },
  draw(ctx) {
    /* sky */
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, Palette.sky0);
    sky.addColorStop(0.55, Palette.sky1);
    sky.addColorStop(1, '#1b1730');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    /* moon */
    const mx = W * 0.74 - Camera.x * 0.04, my = 152 - Camera.y * 0.03;
    glowCircle(ctx, mx, my, 250, 'rgba(255,190,160,0.14)', 1);
    ctx.save();
    const mg = ctx.createRadialGradient(mx - 18, my - 18, 8, mx, my, 78);
    mg.addColorStop(0, '#fff1de'); mg.addColorStop(0.7, '#f2cfb2'); mg.addColorStop(1, '#d9a98f');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(mx, my, 76, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.10; ctx.fillStyle = '#7a5a50';
    ctx.beginPath(); ctx.arc(mx - 20, my - 10, 14, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 24, my + 18, 20, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 6, my - 30, 9, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    /* distant ridge */
    ctx.fillStyle = '#0e1024';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 40) {
      const wx = x + Camera.x * 0.08;
      ctx.lineTo(x, 300 + Math.sin(wx * 0.004) * 34 + Math.sin(wx * 0.011 + 2) * 16);
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();

    /* far bamboo layer */
    this.drawBamboo(ctx, 0.16, '#101428', 26, 0.55);
    /* mist band */
    const mist = ctx.createLinearGradient(0, 300, 0, 470);
    mist.addColorStop(0, 'rgba(120,140,190,0)');
    mist.addColorStop(0.7, 'rgba(120,140,190,0.10)');
    mist.addColorStop(1, 'rgba(120,140,190,0)');
    ctx.fillStyle = mist; ctx.fillRect(0, 300, W, 170);
    /* mid bamboo */
    this.drawBamboo(ctx, 0.42, '#0b0d1b', 16, 1);
    /* near bamboo (behind gameplay) */
    this.drawBamboo(ctx, 0.78, '#06080f', 8, 1.55);
    /* hanging lanterns */
    for (const l of this.lanterns) {
      const x = l.x - Camera.x * 0.55;
      if (x < -60 || x > W + 60) continue;
      const sway = Math.sin(Game.time * 0.9 + l.ph) * 6;
      const y = l.y + sway * 0.4;
      ctx.strokeStyle = 'rgba(15,15,28,0.9)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + sway * 0.2, y - l.r); ctx.stroke();
      glowCircle(ctx, x, y, 46, 'rgba(255,140,90,0.18)', 1);
      const g = ctx.createLinearGradient(x, y - l.r, x, y + l.r);
      g.addColorStop(0, '#ffb27a'); g.addColorStop(1, '#e2532e');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(x, y, l.r * 0.8, l.r, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(30,12,8,0.65)';
      ctx.fillRect(x - l.r * 0.85, y - l.r * 0.95, l.r * 1.7, 3);
      ctx.fillRect(x - l.r * 0.85, y + l.r * 0.85, l.r * 1.7, 3);
    }
  },
  drawBamboo(ctx, parallax, color, count, scale) {
    ctx.save();
    ctx.fillStyle = color;
    for (let i = 0; i < count; i++) {
      const seed = i * 3.7 + (parallax > 0.5 ? 200 : parallax > 0.3 ? 100 : 0);
      const bx = ((seed * 173.3) % (W + 300)) - 150 - Camera.x * parallax;
      const w = (7 + hash1(seed) * 7) * scale;
      const lean = (hash1(seed + 1) - 0.5) * 26 * scale;
      const topY = 40 - hash1(seed + 2) * 90;
      const sway = Math.sin(Game.time * 0.6 + seed) * 3 * scale;
      ctx.beginPath();
      ctx.moveTo(bx, H);
      ctx.quadraticCurveTo(bx + lean * 0.4 + sway, 300, bx + lean + sway, topY);
      ctx.lineTo(bx + lean + sway + w, topY);
      ctx.quadraticCurveTo(bx + lean * 0.4 + sway + w, 300, bx + w, H);
      ctx.closePath(); ctx.fill();
      /* nodes */
      ctx.strokeStyle = 'rgba(255,255,255,0.045)';
      ctx.lineWidth = 1.4;
      for (let k = 0; k < 7; k++) {
        const t = k / 7;
        const nx = bx + lerp(0, lean + sway, t * 0.9) + w / 2;
        const ny = lerp(H, topY, t);
        ctx.beginPath(); ctx.moveTo(nx - w / 2, ny); ctx.lineTo(nx + w / 2, ny); ctx.stroke();
      }
      /* leaves */
      if (parallax > 0.3) {
        ctx.fillStyle = color;
        for (let k = 0; k < 4; k++) {
          const t = 0.25 + hash1(seed + k + 7) * 0.7;
          const nx = bx + lerp(0, lean + sway, t);
          const ny = lerp(H, topY, t);
          const dir = (k % 2 ? 1 : -1);
          const ll = (30 + hash1(seed + k) * 40) * scale * 0.5;
          ctx.beginPath();
          ctx.moveTo(nx, ny);
          ctx.quadraticCurveTo(nx + dir * ll * 0.6, ny - 12 * scale, nx + dir * ll, ny + 4 * scale);
          ctx.quadraticCurveTo(nx + dir * ll * 0.5, ny + 4 * scale, nx, ny + 2 * scale);
          ctx.fill();
        }
      }
    }
    ctx.restore();
  },
  drawGround(ctx) {
    /* stone platform */
    const g = ctx.createLinearGradient(0, GROUND_Y - 6, 0, H);
    g.addColorStop(0, '#2a2440'); g.addColorStop(0.25, '#171428'); g.addColorStop(1, '#08070f');
    ctx.fillStyle = g;
    ctx.fillRect(0, GROUND_Y, WORLD.w, H - GROUND_Y + 120);
    /* front lip */
    ctx.fillStyle = 'rgba(200,175,255,0.16)';
    ctx.fillRect(0, GROUND_Y - 2, WORLD.w, 2);
    ctx.fillStyle = 'rgba(120,100,180,0.10)';
    ctx.fillRect(0, GROUND_Y, WORLD.w, 7);
    /* floor seams */
    for (let x = 0; x < WORLD.w; x += 96) {
      ctx.strokeStyle = 'rgba(150,140,210,0.06)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, GROUND_Y + 8); ctx.lineTo(x - 30, H + 60); ctx.stroke();
    }
    /* petal drift shadow on floor */
    ctx.fillStyle = 'rgba(232,50,79,0.05)';
    ctx.fillRect(0, GROUND_Y + 2, WORLD.w, 2);
  },
  drawPetals(ctx) {
    ctx.save();
    ctx.translate(-Camera.x * 0.25, 0);
    for (const p of this.petals) {
      ctx.save();
      ctx.translate(p.x + Camera.x * 0.25 * 0.6, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = 'rgba(255,150,175,0.35)';
      ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.45, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
};

/* ============================================================
   Particle system — sparks, dust, slashes, afterimages
   ============================================================ */
const FX = {
  parts: [],
  slashes: [],
  rings: [],
  texts: [],
  after: [],
  trail: [],
  clear() { this.parts.length = 0; this.slashes.length = 0; this.rings.length = 0; this.texts.length = 0; this.after.length = 0; this.trail.length = 0; },
  addTrail(bx, by, tx, ty, color, width) {
    this.trail.push({ bx, by, tx, ty, color: color || '200,240,255', w: width || 1, life: 0.075, max: 0.075 });
    if (this.trail.length > 22) this.trail.shift();
  },
  emitSwordTrail(pl, root, tip) {
    if (root) this.addTrail(root.x, root.y, tip.x, tip.y, this.swingColor, 1);
  },
  drawTrails(ctx) {
    const tr = this.trail;
    if (tr.length < 2) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i < tr.length; i++) {
      const a = tr[i - 1], b = tr[i];
      const al = clamp(b.life / b.max, 0, 1);
      if (al <= 0) continue;
      const k = Math.pow(i / tr.length, 1.5);
      /* taper: use only the outer half of the blade sweep */
      const abx = lerp(a.bx, a.tx, 0.42), aby = lerp(a.by, a.ty, 0.42);
      const bbx = lerp(b.bx, b.tx, 0.42), bby = lerp(b.by, b.ty, 0.42);
      ctx.beginPath();
      ctx.moveTo(abx, aby);
      ctx.lineTo(a.tx, a.ty);
      ctx.lineTo(b.tx, b.ty);
      ctx.lineTo(bbx, bby);
      ctx.closePath();
      ctx.fillStyle = 'rgba(' + b.color + ',' + (0.20 * al * k) + ')';
      ctx.fill();
      /* bright outer edge */
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * al * k) + ')';
      ctx.lineWidth = 1.2 * b.w * (0.4 + 0.6 * k);
      ctx.beginPath(); ctx.moveTo(a.tx, a.ty); ctx.lineTo(b.tx, b.ty); ctx.stroke();
    }
    ctx.restore();
  },
  spark(x, y, dir, power = 1, color = '#ffe9b0', count = 10) {
    for (let i = 0; i < count; i++) {
      const a = dir + rand(-0.85, 0.85);
      const sp = rand(140, 620) * power;
      this.parts.push({
        type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
        life: rand(0.12, 0.34), max: 0.34, w: rand(1.2, 3.4) * power, color, grav: 900, drag: 3.5
      });
    }
    /* dust puff */
    for (let i = 0; i < 4; i++) {
      this.parts.push({
        type: 'dust', x: x + rand(-10, 10), y: y + rand(-10, 10), vx: rand(-90, 90), vy: rand(-150, -20),
        life: rand(0.25, 0.5), max: 0.5, r: rand(8, 22), color: 'rgba(210,200,240,', grav: 60, drag: 2
      });
    }
  },
  crack(x, y, dir, power = 1) {
    for (let i = 0; i < 14; i++) {
      const a = dir + rand(-1.4, 1.4);
      const sp = rand(220, 760) * power;
      this.parts.push({
        type: 'chip', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 140,
        life: rand(0.5, 0.95), max: 0.95, w: rand(2.5, 6), color: pick(['#d8a066', '#a86f3c', '#f3dcae', '#6c3f22']),
        grav: 1500, drag: 1.4, rot: Math.random() * TAU, spin: rand(-14, 14)
      });
    }
  },
  blood(x, y, dir, amount = 1) {
    for (let i = 0; i < 9 * amount; i++) {
      const a = dir + rand(-1.1, 1.1);
      const sp = rand(100, 460) * amount;
      this.parts.push({
        type: 'ink', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80,
        life: rand(0.3, 0.7), max: 0.7, r: rand(1.6, 4.2), color: '#ff4d63', grav: 1100, drag: 2.2
      });
    }
  },
  ring(x, y, r0, r1, life, color = 'rgba(255,220,160,', width = 3) {
    this.rings.push({ x, y, r0, r1, life, max: life, color, width });
  },
  slash(x, y, ang, radius, arc, life, color, width) {
    this.slashes.push({ x, y, ang, radius, arc, life, max: life, color, width });
  },
  afterimage(snap, life = 0.22, color = 'rgba(150,225,255,', ) {
    this.after.push({ snap, life, max: life, color });
  },
  text(x, y, str, color = '#ffe9b0', size = 20) {
    this.texts.push({ x, y, str, color, size, life: 0.8, max: 0.8, vy: -46 });
  },
  update(dt) {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.life -= dt;
      if (p.life <= 0) { this.parts.splice(i, 1); continue; }
      p.vy += (p.grav || 0) * dt;
      const d = Math.pow(0.5, (p.drag || 0) * dt);
      p.vx *= d; p.vy *= d;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'chip' && p.y > GROUND_Y - 2) { p.y = GROUND_Y - 2; p.vy *= -0.35; p.vx *= 0.7; p.spin *= 0.7; }
      if (p.rot !== undefined) p.rot += p.spin * dt;
    }
    for (let i = this.slashes.length - 1; i >= 0; i--) { this.slashes[i].life -= dt; if (this.slashes[i].life <= 0) this.slashes.splice(i, 1); }
    for (let i = this.rings.length - 1; i >= 0; i--) { this.rings[i].life -= dt; if (this.rings[i].life <= 0) this.rings.splice(i, 1); }
    for (let i = this.texts.length - 1; i >= 0; i--) { const t = this.texts[i]; t.life -= dt; t.y += t.vy * dt; t.vy *= 0.92; if (t.life <= 0) this.texts.splice(i, 1); }
    for (let i = this.after.length - 1; i >= 0; i--) { this.after[i].life -= dt; if (this.after[i].life <= 0) this.after.splice(i, 1); }
    for (let i = this.trail.length - 1; i >= 0; i--) { this.trail[i].life -= dt; if (this.trail[i].life <= 0) this.trail.splice(i, 1); }
  },
  draw(ctx) {
    /* afterimages */
    for (const a of this.after) {
      const t = a.life / a.max;
      ctx.save();
      ctx.globalAlpha = Math.pow(t, 1.4) * 0.85;
      ctx.globalCompositeOperation = 'lighter';
      a.snap(ctx, a.color, t);
      ctx.restore();
    }
    /* crescent slash flashes — tapered brush strokes along an arc */
    for (const s of this.slashes) {
      const t = 1 - s.life / s.max;
      const a = Math.pow(1 - t, 1.25);
      const reveal = clamp(t * 3.4, 0, 1);
      const sweep = s.arc * easeOutCubic(reveal);
      const rad = s.radius * (0.95 + 0.09 * easeOutCubic(t));
      const baseCol = s.color.slice(5, -1);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.ang);
      ctx.globalCompositeOperation = 'lighter';
      const N = 22;
      const a0 = -sweep / 2, a1 = sweep / 2;
      const maxW = s.width * 3.4;
      const arcPts = (rr) => {
        const pts = [];
        for (let i = 0; i <= N; i++) {
          const u = i / N, ang = lerp(a0, a1, u);
          const w = maxW * Math.pow(Math.sin(Math.PI * u), 0.62);
          pts.push({ ang, r: rr, w });
        }
        return pts;
      };
      const passes = [
        { r: rad, widthMul: 2.4, col: 'rgba(' + baseCol + ',' + (0.10 * a) + ')', fill: true },
        { r: rad, widthMul: 1.0, col: 'rgba(' + baseCol + ',' + (0.34 * a) + ')', fill: true },
        { r: rad, widthMul: 0.38, col: 'rgba(255,255,255,' + (0.80 * a) + ')', fill: true }
      ];
      for (const pass of passes) {
        ctx.beginPath();
        /* outer edge */
        for (let i = 0; i <= N; i++) {
          const u = i / N, ang = lerp(a0, a1, u);
          const w = maxW * pass.widthMul * Math.pow(Math.sin(Math.PI * u), 0.62);
          const rr = pass.r + w / 2;
          const x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        /* inner edge back */
        for (let i = N; i >= 0; i--) {
          const u = i / N, ang = lerp(a0, a1, u);
          const w = maxW * pass.widthMul * Math.pow(Math.sin(Math.PI * u), 0.62);
          const rr = pass.r - w / 2;
          ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
        }
        ctx.closePath();
        ctx.fillStyle = pass.col;
        ctx.fill();
      }
      /* motion smear trailing the blade */
      ctx.beginPath();
      for (let i = 0; i <= N; i++) {
        const u = i / N, ang = lerp(a0, a1, u);
        const rr = rad + maxW * 0.5 + 22 * Math.sin(Math.PI * u) * (1 - a);
        const x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'rgba(' + baseCol + ',' + (0.10 * a) + ')';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
    }
    /* sword trails */
    this.drawTrails(ctx);
    /* rings */
    for (const r of this.rings) {
      const t = 1 - r.life / r.max;
      const rad = lerp(r.r0, r.r1, easeOutCubic(t));
      ctx.strokeStyle = r.color + (1 - t) + ')';
      ctx.lineWidth = r.width * (1 - t) + 0.4;
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
    }
    /* particles */
    ctx.globalCompositeOperation = 'lighter';
    for (const p of this.parts) {
      const a = clamp(p.life / p.max, 0, 1);
      if (p.type === 'spark') {
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = a;
        ctx.lineWidth = p.w;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.018, p.y - p.vy * 0.018);
        ctx.stroke();
      } else if (p.type === 'ink') {
        ctx.fillStyle = p.color; ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.5), 0, TAU); ctx.fill();
      } else if (p.type === 'dust') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = p.color + (a * 0.20) + ')';
        ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.6 - a), 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = 'lighter';
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    /* wood chips (solid, with outline) */
    for (const p of this.parts) {
      if (p.type !== 'chip') continue;
      const a = clamp(p.life / p.max, 0, 1);
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    /* floating texts */
    for (const t of this.texts) {
      const a = clamp(t.life / t.max * 1.6, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = `900 ${t.size}px "Crimson SC", "Trebuchet MS", system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(5,6,12,0.9)';
      ctx.strokeText(t.str, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.str, t.x, t.y);
      ctx.restore();
    }
  }
};

'use strict';
/* ============================================================
   Skeletal drawing helpers — tapered limbs, ink outlines,
   joints, masked heads, blades. Shared by player & puppets.
   ============================================================ */
function taperedLimb(ctx, x1, y1, x2, y2, w1, w2, fill, stroke = '#07080f', lineW = 2.4, rim = true) {
  const a = Math.atan2(y2 - y1, x2 - x1) + Math.PI / 2;
  const nx = Math.cos(a), ny = Math.sin(a);
  const pts = [
    x1 + nx * w1 / 2, y1 + ny * w1 / 2,
    x2 + nx * w2 / 2, y2 + ny * w2 / 2,
    x2 - nx * w2 / 2, y2 - ny * w2 / 2,
    x1 - nx * w1 / 2, y1 - ny * w1 / 2
  ];
  poly(ctx, pts);
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineW; ctx.lineJoin = 'round'; ctx.stroke(); }
  /* rounded caps */
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.arc(x1, y1, w1 / 2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x2, y2, w2 / 2, 0, TAU); ctx.fill();
  if (rim) {
    /* cool rim light on the upper edge */
    ctx.strokeStyle = 'rgba(170,205,255,0.30)';
    ctx.lineWidth = Math.max(1, Math.min(w1, w2) * 0.16);
    ctx.beginPath();
    ctx.moveTo(x1 + nx * w1 * 0.34, y1 + ny * w1 * 0.34);
    ctx.lineTo(x2 + nx * w2 * 0.34, y2 + ny * w2 * 0.34);
    ctx.stroke();
  }
}
function jointDot(ctx, x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function blade(ctx, x1, y1, x2, y2, w, glow = false) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const nx = Math.cos(a + Math.PI / 2), ny = Math.sin(a + Math.PI / 2);
  const tx = x2 + Math.cos(a) * w * 3.2, ty = y2 + Math.sin(a) * w * 3.2;
  poly(ctx, [
    x1 + nx * w, y1 + ny * w,
    tx + nx * w * 0.12, ty + ny * w * 0.12,
    tx - nx * w * 0.12, ty - ny * w * 0.12,
    x1 - nx * w, y1 - ny * w
  ]);
  const g = ctx.createLinearGradient(x1, y1, tx, ty);
  g.addColorStop(0, '#f7fbff'); g.addColorStop(0.55, '#cfd9ee'); g.addColorStop(1, '#ffffff');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(10,12,20,0.75)'; ctx.lineWidth = 1; ctx.stroke();
  /* spine highlight */
  ctx.strokeStyle = 'rgba(255,255,255,' + (glow ? 0.95 : 0.55) + ')';
  ctx.lineWidth = Math.max(1, w * 0.5);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(tx, ty); ctx.stroke();
}
function drawScarf(ctx, pts, color, edge) {
  if (pts.length < 2) return;
  for (let pass = 0; pass < 2; pass++) {
    const widths = pts.map((p, i) => lerp(7, 1.4, i / (pts.length - 1)) * (pass === 0 ? 1.7 : 1));
    for (let i = 0; i < pts.length - 1; i++) {
      taperedLimb(ctx, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y,
        widths[i], widths[i + 1], pass === 0 ? edge : color, null);
    }
  }
}

/* Trail ribbon: samples the anchor's history, then resamples it into
   an evenly spaced, wavy scarf. Stable by construction — no explosions. */
class Ribbon {
  constructor(n, len, color, edge) {
    this.n = n; this.len = len; this.color = color; this.edge = edge;
    this.pts = new Array(n).fill(0).map(() => ({ x: 0, y: 0 }));
    this.hist = [];
    this.init = false;
    this.phase = Math.random() * 10;
    this.spacing = len / (n - 1);
  }
  reset(x, y, dir) {
    this.hist.length = 0;
    for (let i = 0; i < 64; i++) this.hist.push({ x: x - i * 3 * dir, y });
    this.init = true;
    this.compute(dir, 1, 0, 0);
  }
  update(dt, x, y, dir, baseVx, baseVy, wind = 1) {
    if (!this.init) this.reset(x, y, dir);
    const h = this.hist;
    h.unshift({ x, y });
    const maxH = 90;
    if (h.length > maxH) h.length = maxH;
    this.compute(dir, wind, baseVy, baseVx);
    this.wind = wind;
  }
  compute(dir, wind = 1, baseVy = 0, baseVx = 0) {
    const h = this.hist;
    const n = this.n;
    let ri = 0;
    let travelled = 0;
    this.pts[0].x = h[0].x; this.pts[0].y = h[0].y;
    let idx = 1;
    for (let i = 1; i < h.length && idx < n; i++) {
      const a = h[i - 1], b = h[i];
      const d = Math.hypot(b.x - a.x, b.y - a.y);
      if (d < 0.0001) continue;
      let local = travelled;
      const segLen = d;
      while (local + this.spacing <= segLen + travelled && idx < n) {
        /* wait: simpler resample below */
        break;
      }
      travelled += d;
      /* resample at multiples of spacing */
      while (idx * this.spacing <= travelled && idx < n) {
        const target = idx * this.spacing;
        const back = travelled - target;
        const t = 1 - clamp(back / segLen, 0, 1);
        this.pts[idx].x = lerp(a.x, b.x, t);
        this.pts[idx].y = lerp(a.y, b.y, t);
        idx++;
      }
    }
    /* not enough history: extend backwards */
    while (idx < n) {
      const prev = this.pts[idx - 1];
      this.pts[idx].x = prev.x - dir * this.spacing;
      this.pts[idx].y = prev.y;
      idx++;
    }
    /* blend toward a relaxed droop so the scarf never points straight up */
    const t = Game.time;
    const ax = this.pts[0].x, ay = this.pts[0].y;
    const speed = Math.hypot(baseVx || 0, baseVy || 0);
    const trailK = clamp((speed - 60) / 260, 0, 1);
    for (let i = 1; i < n; i++) {
      const u = i / (n - 1);
      const restX = ax - dir * this.spacing * i * 0.62;
      const restY = ay + this.spacing * i * 0.55 + u * u * 8;
      const k = trailK * 0.85;
      this.pts[i].x = lerp(restX, this.pts[i].x, k) + Math.sin(t * 5.2 + this.phase + i * 0.62) * 3.4 * u * (wind || 1);
      this.pts[i].y = lerp(restY, this.pts[i].y, k) + Math.cos(t * 4.4 + this.phase + i * 0.5) * 2.8 * u;
    }
  }
  draw(ctx) { drawScarf(ctx, this.pts, this.color, this.edge); }
}

function ik2(rx, ry, tx, ty, l1, l2, bend) {
  let dx = tx - rx, dy = ty - ry;
  let d = Math.hypot(dx, dy);
  const maxD = l1 + l2 - 0.5;
  if (d > maxD) { const s = maxD / d; dx *= s; dy *= s; d = maxD; }
  d = Math.max(d, Math.abs(l1 - l2) + 0.5);
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / d, uy = dy / d;
  const mx = rx + ux * a, my = ry + uy * a;
  return { x: mx - uy * h * bend, y: my + ux * h * bend };
}

function basePose() {
  return {
    hipY: -50, lean: 0.04, head: 0.02,
    fh: [15, -45], bh: [-7, -49],
    ff: [17, 0], bf: [-19, 0],
    sword: 1.02, elbowF: 1, elbowB: -1, kneeF: 1, kneeB: -1,
    chestTwist: 0, squash: 1, scarfWind: 1

}
function clonePose(p) { return JSON.parse(JSON.stringify(p)); }
function lerpPose(a, b, t) {
  const o = {};
  for (const k in b) {
    const av = a[k] !== undefined ? a[k] : b[k];
    const bv = b[k];
    if (Array.isArray(bv)) o[k] = [lerp(av[0], bv[0], t), lerp(av[1], bv[1], t)];
    else o[k] = lerp(av, bv, t);
  }
  return o;
}
function keyPose(keys, t) {
  if (t <= keys[0].t) return clonePose(keys[0].p);
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i].t) {
      const a = keys[i - 1], b = keys[i];
      const u = (t - a.t) / Math.max(0.0001, b.t - a.t);
      const e = b.ease ? b.ease(u) : u;
      return lerpPose(a.p, b.p, e);
    }
  }
  return clonePose(keys[keys.length - 1].p);
}

'use strict';
/* ============================================================
   Player runtime
   ============================================================ */
const GRAV = 2150, MAX_FALL = 980;

class Player {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.facing = 1;
    this.maxHp = 120; this.hp = 120;
    this.onGround = true;
    this.state = 'idle';
    this.act = null;
    this.actT = 0;
    this.queued = null;
    this.buffer = null; this.bufferT = 0;
    this.jumpBuf = 0; this.coyote = 0;
    this.jumps = 0; this.airDashes = 2;
    this.dashCd = 0;
    this.invuln = 0; this.hurtT = 0;
    this.parryT = 0; this.parryCd = 0; this.parrySuccess = 0;
    this.charge = 0; this.charging = false;
    this.combo = 0; this.comboT = 0;
    this.slashTrail = [];
    this.ribbon = new Ribbon(12, 86, '#e8324f', '#4a0714');
    this.bladeGlow = 0;
    this.dead = false;
    this.spawnT = 0.35;
    this.runCycle = 0;
    this.landT = 0;
    this.hitIds = new Set();
    this.lastSwordTip = null;
    this.airSlashUsed = false;
    this.shake = 0;
    this.stepT = 0;
  }

  get alive() { return !this.dead; }
  get centerY() { return this.y - 40; }

  setState(s) { this.state = s; }

  startAttack(name, fromBuffer = false) {
    const def = ATTACKS[name];
    if (!def) return;
    const wasAttacking = this.act && this.act.t < ATTACKS[this.act.name].active[1] + 0.03;
    this.act = { name, def, t: 0, hit: new Set(), lunged: false, slashed: false, swung: false };
    this.actT = 0;
    this.state = 'attack';
    this.hitIds.clear();
    this.queued = null;
    this.charging = false;
    this.charge = 0;
    /* snappy direction correction only at combo start */
    if (!wasAttacking) {
      const dir = (Input.down('right') ? 1 : 0) - (Input.down('left') ? 1 : 0);
      if (dir) this.facing = dir;
    }
    Audio_.swing(def.heavy ? 1.4 : 0.6);
  }

  bufferAction(name) { this.buffer = name; this.bufferT = 0.16; }

  dash() {
    if (this.dashCd > 0) return false;
    if (!this.onGround) {
      if (this.airDashes <= 0) return false;
      this.airDashes--;
    }
    const dir = (Input.down('right') ? 1 : 0) - (Input.down('left') ? 1 : 0);
    if (dir) this.facing = dir;
    this.state = 'dash'; this.act = null;
    this.dashT = 0.17; this.dashDir = this.facing;
    this.vx = this.dashDir * 900; this.vy = this.onGround ? 0 : 40;
    this.invuln = Math.max(this.invuln, 0.22);
    this.dashCd = 0.30;
    this.charging = false; this.charge = 0;
    this.slashTrail.length = 0;
    Audio_.dash();
    for (let i = 0; i < 3; i++) {
      FX.parts.push({ type: 'dust', x: this.x - this.facing * 16, y: this.y - 10 - i * 14, vx: -this.facing * rand(40, 120), vy: rand(-60, -10), life: 0.4, max: 0.4, r: rand(6, 14), color: 'rgba(150,220,255,', grav: 0, drag: 3 });
    }
    return true;
  }

  jump() {
    if (this.jumpBuf <= 0) return;
    if (this.onGround || this.coyote > 0) {
      this.vy = -740; this.onGround = false; this.coyote = 0; this.jumpBuf = 0;
      this.jumps = 1; this.state = 'jump'; Audio_.jump();
      FX.ring(this.x, this.y - 2, 4, 26, 0.3, 'rgba(180,230,255,', 2);
      for (let i = 0; i < 4; i++) FX.parts.push({ type: 'dust', x: this.x + rand(-12, 12), y: this.y, vx: rand(-80, 80), vy: rand(-40, -5), life: 0.35, max: 0.35, r: rand(5, 12), color: 'rgba(200,210,240,', grav: 0, drag: 3 });
    } else if (this.jumps < 2 && !this.charging) {
      this.vy = -660; this.jumps = 2; this.jumpBuf = 0; this.state = 'jump';
      this.airDashes = Math.max(this.airDashes, 1);
      Audio_.jump();
      FX.ring(this.x, this.y - 26, 6, 46, 0.34, 'rgba(140,240,255,', 2.5);
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * TAU;
        FX.parts.push({ type: 'spark', x: this.x + Math.cos(a) * 16, y: this.y - 26 + Math.sin(a) * 8, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120 + 60, life: 0.3, max: 0.3, w: 2, color: '#9fefff', grav: 200, drag: 2.5 });
      }
      this.spinJump = 1;
    }
  }
}

const PLAYER_PROTO = {
  update(dt) {
    if (this.dead) {
      this.vy += GRAV * dt; this.y += this.vy * dt;
      if (this.y > GROUND_Y) { this.y = GROUND_Y; this.vy = 0; }
      this.x += this.vx * dt; this.vx *= 0.85;
      this.ribbon.update(dt, this.x - this.facing * 8, this.y - 46, this.facing, this.vx, this.vy);
      return;
    }
    this.spawnT = Math.max(0, this.spawnT - dt);
    this.comboT -= dt;
    if (this.comboT <= 0) this.combo = 0;
    this.dashCd = Math.max(0, this.dashCd - dt);
    this.invuln = Math.max(0, this.invuln - dt);
    this.parryCd = Math.max(0, this.parryCd - dt);
    this.parrySuccess = Math.max(0, this.parrySuccess - dt);
    this.bufferT = Math.max(0, this.bufferT - dt);
    if (this.bufferT <= 0) this.buffer = null;
    this.jumpBuf = Math.max(0, this.jumpBuf - dt);
    this.landT = Math.max(0, this.landT - dt);
    this.bladeGlow = Math.max(0, this.bladeGlow - dt * 4);

    /* dash movement */
    if (this.state === 'dash') {
      this.dashT -= dt;
      if (this.dashT <= 0) { this.state = this.onGround ? 'idle' : 'fall'; this.vx *= 0.55; }
    }

    /* parry stance */
    if (this.state === 'parry') this.parryT -= dt;

    /* input */
    this.handleInput(dt);

    /* physics */
    if (!this.onGround) { this.vy += GRAV * dt; if (this.vy > MAX_FALL) this.vy = MAX_FALL; }
    let gravityScale = 1;
    if (this.state === 'hurt') {
      this.hurtT -= dt;
      if (this.hurtT <= 0) { this.state = this.onGround ? 'idle' : 'fall'; }
      this.vx *= Math.pow(0.06, dt);
      gravityScale = 1;
    } else if (this.state === 'dash') {
      if (!this.onGround) { this.vy = Math.max(this.vy * 0.6, -40); }
      gravityScale = 0;
    } else if (this.state === 'attack') {
      const def = this.act.def;
      if (this.act.t < def.active[1] && !this.act.lunged) {
        this.vx = this.facing * def.lunge * (def.air ? 0.55 : 1);
        this.act.lunged = true;
      }
      /* stop short of the target so bodies don't interpenetrate */
      const near = Game.enemies.find(e => e.alive && Math.sign(e.x - this.x) === this.facing && Math.abs(e.x - this.x) < 56);
      if (near && this.vx * this.facing > 0) this.vx = 0;
      this.vx *= Math.pow(0.02, dt);
      if (def.dive && this.act.t > 0.03 && this.act.t < 0.26) { this.vy = 1500; }
      else gravityScale = this.onGround ? 0 : (def.air ? 0.55 : 0.3);
    } else if (this.state === 'charge') {
      this.vx *= Math.pow(0.02, dt);
    } else if (this.state === 'parry') {
      this.vx *= Math.pow(0.02, dt);
    }
    this.x += this.vx * dt;
    if (gravityScale) this.y += this.vy * dt;

    /* aim facing when attacking on ground w/ movement */
    if ((this.state !== 'attack' && this.state !== 'dash' && this.state !== 'hurt') || true) {
      /* attacks track the stick lightly before the active frames, never during them */
      const dir = (Input.down('right') ? 1 : 0) - (Input.down('left') ? 1 : 0);
      if (dir && !(this.state === 'attack') && !(this.state === 'dash')) this.facing = dir;
    }

    /* ground collision */
    const wasAir = !this.onGround;
    if (this.y >= GROUND_Y) {
      this.y = GROUND_Y;
      if (wasAir) {
        this.onGround = true; this.jumps = 0; this.airDashes = 2;
        if (this.state === 'attack' && !this.act.def.dive) {
          /* keep attack running */
        } else if (this.state !== 'dash') {
          this.state = 'idle';
        }
        this.landT = 0.14;
        Audio_.land();
        FX.ring(this.x, this.y - 2, 6, 40, 0.32, 'rgba(200,220,255,', 2);
        for (let i = 0; i < 7; i++) FX.parts.push({ type: 'dust', x: this.x + rand(-20, 20), y: this.y, vx: rand(-140, 140), vy: rand(-70, -10), life: rand(0.25, 0.5), max: 0.5, r: rand(5, 14), color: 'rgba(190,200,235,', grav: 100, drag: 3 });
        if (this.state === 'dive' || (this.act && this.act.def.dive)) {
          this.state = 'idle'; this.act = null;
          FX.ring(this.x, this.y - 4, 10, 90, 0.35, 'rgba(160,230,255,', 4);
          Camera.kick(0.2);
        }
      }
      this.vy = 0;
    } else {
      this.onGround = false;
    }

    /* attack progress */
    if (this.state === 'attack' && this.act) {
      this.actT += dt;
      this.act.t = this.actT;
      if (this.actT >= this.act.def.dur) {
        const q = this.queued;
        this.act = null;
        if (q) { this.startAttack(q); }
        else this.state = this.onGround ? 'idle' : 'fall';
      }
    }

    /* clamp arena */
    this.x = clamp(this.x, 40, WORLD.w - 40);

    /* combo timer visual */
    if (this.combo > 0) this.comboT = Math.max(this.comboT, 0.1);

    /* ribbon */
    const scarfRoot = this.getScarfRoot();
    this.ribbon.update(dt, scarfRoot.x, scarfRoot.y, this.facing, this.vx * 1.15 + this.facing * 30, this.vy, this.act ? 1.7 : this.state === 'run' ? 1.6 : 1);

    /* dash trail */
    if (this.state === 'dash') {
      if (!this._trailT) this._trailT = 0;
      this._trailT += dt;
      if (this._trailT > 0.028) {
        this._trailT = 0;
        const snap = this.makeSnapshot();
        FX.afterimage(snap, 0.22, 'rgba(120,220,255,');
      }
    }
  },

  handleInput(dt) {
    /* start / restart/mute */
    if (Input.hit('jump')) this.jumpBuf = 0.13;

    const moveX = (Input.down('right') ? 1 : 0) - (Input.down('left') ? 1 : 0);

    if (this.state === 'attack') {
      const def = this.act.def;
      const t = this.act.t;
      /* buffer next light during active/recovery */
      if (Input.hit('atk') && def.next && t > def.active[0] * 0.6) this.queued = def.next;
      else if (Input.hit('atk') && !def.next && t > def.active[1] && def.air === undefined && !this.onGround) this.queued = 'air2';
      if (Input.hit('heavy') && t > 0.05) this.queued = 'heavy';
      /* jump cancel light recovery */
      if (Input.hit('jump') && !def.air && t > def.active[1] && this.onGround) {
        this.act = null; this.state = 'idle'; this.jump();
      }
      /* dash cancel after active */
      if (Input.hit('dash') && t > def.active[1] * 0.55) {
        if (this.dash()) { this.act = null; }
      }
      return;
    }

    if (this.state === 'hurt') return;
    if (this.state === 'dash') {
      if (Input.hit('atk')) { this.state = 'idle'; this.startAttack(this.onGround ? 'light1' : 'air1'); }
      return;
    }
    if (this.state === 'parry') {
      if (Input.hit('atk')) { this.state = 'counter'; this.startAttack('counter'); }
      if (this.parryT <= 0 && !Input.down('special')) this.state = this.onGround ? 'idle' : 'fall';
      return;
    }

    /* move */
    if (this.onGround) {
      if (this.state !== 'charge') {
        const spd = moveX * 330;
        if (moveX) {
          this.vx = approach(this.vx, spd, 2600 * dt);
          this.facing = moveX;
          this.runCycle += dt * 12;
          if (Math.abs(this.vx) > 60) this.stepT -= dt;
          if (this.stepT <= 0 && Math.abs(this.vx) > 200) {
            this.stepT = 0.22;
            FX.parts.push({ type: 'dust', x: this.x - this.facing * 10, y: this.y - 2, vx: -this.facing * rand(20, 60), vy: rand(-36, -8), life: 0.3, max: 0.3, r: rand(3, 7), color: 'rgba(200,200,235,', grav: 0, drag: 3 });
          }
        } else if (this.state !== 'parry') {
          this.vx = approach(this.vx, 0, 3000 * dt);
        }
      }
      if (this.state === 'idle' || this.state === 'run') this.state = moveX ? 'run' : 'idle';
    } else {
      if (this.state !== 'charge') {
        if (moveX) { this.vx = approach(this.vx, moveX * 300, 1800 * dt); this.facing = moveX; }
        else this.vx = approach(this.vx, 0, 1200 * dt);
      }
      if (this.state !== 'attack' && this.state !== 'charge') this.state = this.vy < 0 ? 'jump' : 'fall';
    }

    /* jump */
    if (Input.hit('jump')) this.jump();

    /* charge (K hold) */
    if (Input.down('heavy')) {
      if (!this.charging && this.state !== 'charge') {
        this.charging = true; this.charge = 0; this.state = 'charge';
        this.act = null;
      }
      if (this.charging) {
        this.charge = Math.min(1, this.charge + dt / 0.62);
        if (this.state !== 'charge') this.state = 'charge';
        if (Math.random() < dt * 26) {
          const a = rand(-2.4, -0.7);
          FX.parts.push({ type: 'spark', x: this.x + Math.cos(a) * 60, y: this.y - 50 + Math.sin(a) * 60, vx: Math.cos(a) * -260, vy: Math.sin(a) * -260, life: 0.25, max: 0.25, w: 2, color: this.charge >= 1 ? '#ff9a5c' : '#ffd76e', grav: 0, drag: 1 });
        }
      }
    } else if (this.charging) {
      this.charging = false;
      const full = this.charge >= 0.99 ? 2 : 1;
      this.startAttack(full === 2 ? 'charge2' : 'charge1');
    }

    if (this.state === 'charge') return;

    /* dash */
    if (Input.hit('dash')) { this.dash(); return; }

    /* parry */
    if (Input.hit('special') && this.parryCd <= 0) {
      this.state = 'parry'; this.parryT = 0.20; this.parryCd = 0.28;
      this.act = null;
      Audio_.swing(0.4);
      FX.slash(this.x + this.facing * 20, this.y - 52, this.facing > 0 ? 0.2 : Math.PI - 0.2, 62, 2.2, 0.18, 'rgba(140,240,255,', 3);
      return;
    }

    /* riposte: J right after a successful parry */
    if (Input.hit('atk') && this.parrySuccess > 0) {
      this.startAttack('counter');
      return;
    }
    /* attacks */
    if (Input.hit('atk')) {
      if (!this.onGround) {
        if (Input.down('down')) this.startAttack('dive');
        else this.startAttack('air1');
      } else {
        this.startAttack('light1');
      }
      return;
    }
    if (Input.hit('heavy') && !this.charging) { this.startAttack('heavy'); }
  },

  getScarfRoot() {
    const P = this.currentSkel;
    const bx = P ? P.neckX : this.x;
    const by = P ? P.neckY + 6 : this.y - 76;
    return { x: bx - this.facing * 6, y: by - 2 };
  },

  hurtBox() {
    if (this.state === 'dash' && this.invuln > 0) return { x: this.x - 14, y: this.y - 96, w: 28, h: 92 };
    return { x: this.x - 15, y: this.y - 92, w: 30, h: 88 };
  },

  hitbox() {
    const def = this.act.def;
    const p = this.pose();
    const tip = p.swordTip;
    const reachW = 26;
    if (this.facing > 0) return { x: this.x - 18, y: this.y - 88, w: def.reach + 18, h: 92 };
    return { x: this.x - def.reach, y: this.y - 88, w: def.reach + 18, h: 92 };
  },

  currentFrameHits(enemies, game) {
    const def = this.act.def;
    if (this.act.t < def.active[0] || this.act.t > def.active[1]) return;
    const hb = this.hitbox();
    for (const e of enemies) {
      if (e.dead || e.hp <= 0) continue;
      if (this.act.hit.has(e.id)) continue;
      if (!overlap(hb, e.hurtBox())) continue;
      this.act.hit.add(e.id);
      game.playerHitsEnemy(e, this, def);
    }
  },

  takeDamage(dmg, dir, opts = {}) {
    if (this.dead || this.invuln > 0 || this.spawnT > 0) return false;
    if (this.parrySuccess > 0) return false;
    this.hp = Math.max(0, this.hp - dmg);
    this.invuln = 0.9;
    this.vx = dir * 260; this.vy = -180;
    this.state = 'hurt'; this.hurtT = 0.32;
    this.act = null; this.charging = false; this.charge = 0;
    this.combo = 0;
    Audio_.hurt();
    Camera.kick(0.32);
    FX.blood(this.x, this.y - 46, dir > 0 ? 0.2 : Math.PI - 0.2, 1.2);
    FX.ring(this.x, this.y - 46, 10, 62, 0.3, 'rgba(255,90,110,', 3);
    Game.hitstop = Math.max(Game.hitstop, 0.06);
    Game.flash = Math.max(Game.flash, 0.22);
    if (this.hp <= 0) this.die();
    return true;
  },

  die() {
    this.dead = true; this.state = 'dead';
    this.vy = -320; this.vx = -this.facing * 120;
    Audio_.death();
    Game.onPlayerDeath();
  },

  pose() {
    const t = Game.time;
    let p;
    if (this.state === 'attack' && this.act) p = keyPose(this.act.def.keys(this.act.def.dur), this.act.t);
    else if (this.state === 'charge') { p = poseChargeHold(); p.hipY += Math.sin(t * 22) * 0.8; }
    else if (this.state === 'parry') p = poseParry();
    else if (this.state === 'dash') p = clonePose(POSE.dash);
    else if (this.state === 'hurt') p = POSE.hurt;
    else if (this.state === 'dead') p = POSE.dead;
    else if (this.state === 'run') {
      const c = (this.runCycle % (Math.PI * 2)) / (Math.PI * 2);
      const k = Math.abs(Math.sin(c * Math.PI * 2));
      p = lerpPose(POSE.runA, POSE.runB, k);
      p.hipY += Math.cos(c * TAU) * 2;
    }
    else if (!this.onGround) p = this.vy < 0 ? POSE.jumpUp : POSE.fall;
    else {
      p = lerpPose(POSE.idle, POSE.idleBreath, (Math.sin(t * 2.0) * 0.5 + 0.5));
      if (this.landT > 0) p = lerpPose(p, POSE.land, this.landT / 0.14);
    }
    const sk = this.solve(p);
    this.currentSkel = sk;
    return sk;
  },

  solve(p) {
    const hipX = this.x, hipY = this.y + p.hipY;
    const lean = p.lean;
    const shoulderY = hipY - SK.torso * Math.cos(lean * 0.6);
    const shoulderX = hipX + SK.torso * Math.sin(lean * 0.6);
    const side = this.facing;
    const neckX = shoulderX + Math.sin(lean) * SK.neck * side;
    const neckY = shoulderY - SK.neck * Math.cos(lean);
    const headX = neckX + side * (Math.sin(lean + p.head) * (SK.headR + 4));
    const headY = neckY - Math.cos(lean + p.head) * (SK.headR + 4);

    const shF = { x: shoulderX + side * 3, y: shoulderY + 2 };
    const shB = { x: shoulderX - side * 3, y: shoulderY + 4 };

    const hipF = { x: hipX + side * 4, y: hipY - 2 };
    const hipB = { x: hipX - side * 4, y: hipY - 2 };

    const handF = { x: hipX + p.fh[0] * side, y: hipY + p.fh[1] };
    const handB = { x: hipX + p.bh[0] * side, y: hipY + p.bh[1] };
    const elbowF = ik2(shF.x, shF.y, handF.x, handF.y, SK.upperArm, SK.foreArm, p.elbowF);
    const elbowB = ik2(shB.x, shB.y, handB.x, handB.y, SK.upperArm, SK.foreArm, p.elbowB);

    const footF = { x: hipX + p.ff[0] * side + (this.vx * 0.012), y: this.y + p.ff[1] - (p.ff[1] === 0 ? 4 : 0) };
    const footB = { x: hipX + p.bf[0] * side + (this.vx * 0.012), y: this.y + p.bf[1] - (p.bf[1] === 0 ? 4 : 0) };
    const kneeF = ik2(hipF.x, hipF.y, footF.x, footF.y, SK.thigh, SK.shin, p.kneeF);
    const kneeB = ik2(hipB.x, hipB.y, footB.x, footB.y, SK.thigh, SK.shin, p.kneeB);

    const ang = p.sword;
    const swordBase = handF;
    const swordTip = { x: swordBase.x + Math.cos(ang) * SK.swordLen * side, y: swordBase.y + Math.sin(ang) * SK.swordLen };

    return { hipX, hipY, shoulderX, shoulderY, neckX, neckY, headX, headY, shF, shB, handF, handB, elbowF, elbowB, hipF, hipB, footF, footB, kneeF, kneeB, swordBase, swordTip, p };
  },

  draw(ctx) {
    if (this.spawnT > 0) {
      const t = this.spawnT / 0.35;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      glowCircle(ctx, this.x, this.y - 48, 60 * t + 20, 'rgba(120,220,255,0.7)', 1);
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * TAU + Game.time * 2;
        FX.parts.push({ type: 'spark', x: this.x + Math.cos(a) * 40 * t, y: this.y - 48 + Math.sin(a) * 46 * t, vx: -Math.cos(a) * 160, vy: -Math.sin(a) * 160, life: 0.2, max: 0.2, w: 2, color: '#9fefff', grav: 0, drag: 2 });
      }
      ctx.restore();
    }
    const P = this.pose();
    const side = this.facing;
    const p = P.p;

    /* shadow */
    ctx.save();
    ctx.globalAlpha = clamp(1 - (GROUND_Y - this.y) / 300, 0.14, 0.48);
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(this.x, GROUND_Y + 1, 27, 6, 0, 0, TAU); ctx.fill();
    ctx.restore();

    /* scarf behind */
    ctx.save();
    this.ribbon.draw(ctx);
    ctx.restore();

    const OUT = '#07080f';
    /* ---------- rear limbs ---------- */
    this.drawLeg(ctx, P.hipB, P.kneeB, P.footB, '#33416b', p, false);
    taperedLimb(ctx, P.shB.x, P.shB.y, P.elbowB.x, P.elbowB.y, 9.5, 7.5, '#33416b');
    taperedLimb(ctx, P.elbowB.x, P.elbowB.y, P.handB.x, P.handB.y, 7.5, 5.5, '#33416b');

    /* ---------- torso: layered kimono ---------- */
    ctx.save();
    const leanN = p.lean;
    /* hakama: flared, split skirt with a centre crease */
    const skirtL = 24 + Math.abs(this.vx) * 0.012;
    const skirtB = P.hipY + 30;
    ctx.beginPath();
    ctx.moveTo(P.hipX - side * 14, P.hipY - 7);
    ctx.lineTo(P.hipX + side * 12, P.hipY - 9);
    ctx.quadraticCurveTo(P.hipX + side * skirtL * 0.55, P.hipY + 12, P.hipX + side * skirtL, skirtB + 2);
    ctx.lineTo(P.hipX + side * 5, skirtB - 3);
    ctx.lineTo(P.hipX - side * 4, skirtB + 3);
    ctx.lineTo(P.hipX - side * skirtL * 0.9, skirtB - 1);
    ctx.quadraticCurveTo(P.hipX - side * skirtL * 0.5, P.hipY + 10, P.hipX - side * 14, P.hipY - 7);
    ctx.closePath();
    const hk = ctx.createLinearGradient(P.hipX - side * 18, P.hipY, P.hipX + side * 16, skirtB);
    hk.addColorStop(0, '#2d3857'); hk.addColorStop(1, '#151b2e');
    ctx.fillStyle = hk; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();
    /* crease */
    ctx.strokeStyle = 'rgba(150,175,235,0.16)'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(P.hipX + side * 2, P.hipY - 4);
    ctx.lineTo(P.hipX + side * 6, skirtB - 4);
    ctx.stroke();

    /* torso body */
    const midX = lerp(P.hipX, P.shoulderX, 0.5), midY = lerp(P.hipY, P.shoulderY, 0.5);
    const wid = 25, widTop = 30;
    ctx.beginPath();
    poly(ctx, [
      P.hipX - side * (wid * 0.5), P.hipY - 2,
      midX - side * (wid * 0.52), midY,
      P.shoulderX - side * (widTop * 0.5), P.shoulderY + 4,
      P.shoulderX + side * (widTop * 0.46), P.shoulderY + 2,
      midX + side * (wid * 0.50), midY,
      P.hipX + side * (wid * 0.5), P.hipY - 2,
    ]);
    const tg = ctx.createLinearGradient(P.shoulderX - side * 16, P.shoulderY, P.hipX + side * 16, P.hipY);
    tg.addColorStop(0, '#5a6ca0'); tg.addColorStop(0.45, '#3f4e7c'); tg.addColorStop(1, '#2a3455');
    ctx.fillStyle = tg; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 2.3; ctx.lineJoin = 'round'; ctx.stroke();

    /* shoulder plate on the sword side */
    ctx.beginPath();
    ctx.ellipse(P.shoulderX + side * 3, P.shoulderY + 4, 9, 8.5, 0, 0, TAU);
    ctx.fillStyle = '#4d5f92'; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();

    /* collar: short V of the kimono at the neck */
    ctx.strokeStyle = '#e8e2d4'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(P.neckX - side * 5, P.neckY + 3);
    ctx.lineTo(lerp(P.neckX, midX, 0.42) - side * 1, lerp(P.neckY, midY, 0.42));
    ctx.lineTo(P.neckX + side * 5, P.neckY + 3);
    ctx.stroke();
    ctx.strokeStyle = '#cf2038'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(P.neckX + side * 5.5, P.neckY + 3.5);
    ctx.lineTo(lerp(P.neckX, midX, 0.44) + side * 1.5, lerp(P.neckY, midY, 0.44));
    ctx.stroke();

    /* crimson obi sash */
    ctx.beginPath();
    poly(ctx, [
      P.hipX - side * 13, P.hipY - 10,
      P.hipX + side * 12, P.hipY - 12,
      P.hipX + side * 12, P.hipY - 1,
      P.hipX - side * 13, P.hipY + 1
    ]);
    ctx.fillStyle = '#cf2038'; ctx.fill();
    ctx.strokeStyle = '#4a0710'; ctx.lineWidth = 1.6; ctx.stroke();
    /* sash knot trailing */
    ctx.strokeStyle = '#e8324f'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(P.hipX - side * 10, P.hipY - 5);
    ctx.quadraticCurveTo(P.hipX - side * 22, P.hipY + 6, P.hipX - side * (26 + Math.sin(Game.time * 6) * 3), P.hipY + 18);
    ctx.stroke();
    ctx.restore();

    /* ---------- front leg ---------- */
    this.drawLeg(ctx, P.hipF, P.kneeF, P.footF, '#4a5b8c', p, true);

    /* ---------- head + hair ---------- */
    this.drawHead(ctx, P, side, p);

    /* ---------- front arm ---------- */
    taperedLimb(ctx, P.shF.x, P.shF.y, P.elbowF.x, P.elbowF.y, 10.5, 8.5, '#55679c');
    taperedLimb(ctx, P.elbowF.x, P.elbowF.y, P.handF.x, P.handF.y, 8.5, 6.5, '#55679c');
    jointDot(ctx, P.elbowF.x, P.elbowF.y, 2.2, '#0a0c16');
    /* hand wrap */
    ctx.fillStyle = '#d9bda2';
    ctx.beginPath(); ctx.arc(P.handF.x, P.handF.y, 3.4, 0, TAU); ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 1.4; ctx.stroke();

    /* ---------- sword ---------- */
    this.drawSword(ctx, P, side);

    /* parry glint */
    if (this.state === 'parry') {
      const a = 0.55 + Math.sin(Game.time * 40) * 0.2;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      glowCircle(ctx, P.handF.x + side * 20, P.handF.y, 40, 'rgba(140,240,255,0.5)', a);
      ctx.restore();
    }
    if (this.parrySuccess > 0) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      glowCircle(ctx, this.x, this.y - 50, 90, 'rgba(150,245,255,0.55)', clamp(this.parrySuccess * 2, 0, 0.8));
      ctx.restore();
    }
  },

  drawLeg(ctx, hip, knee, foot, color, p, front) {
    const OUT = '#07080f';
    const th = front ? 1 : 0.86;
    taperedLimb(ctx, hip.x, hip.y, knee.x, knee.y, 12.5 * th, 9 * th, color);
    taperedLimb(ctx, knee.x, knee.y, foot.x, foot.y, 9.5 * th, 6.5 * th, color);
    /* tabi boot: pointed foot along the facing direction */
    const s = this.facing;
    const toeX = foot.x + s * 11, toeY = foot.y - 1;
    ctx.beginPath();
    ctx.moveTo(foot.x - s * 3, foot.y - 8);
    ctx.quadraticCurveTo(foot.x + s * 6, foot.y - 9, toeX, toeY - 2);
    ctx.quadraticCurveTo(foot.x + s * 8, foot.y + 2, foot.x - s * 2, foot.y + 1);
    ctx.closePath();
    ctx.fillStyle = front ? '#232c47' : '#1a2238';
    ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 1.6; ctx.stroke();
    /* wrap bands */
    ctx.strokeStyle = 'rgba(235,225,205,0.5)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(foot.x - s * 1, foot.y - 7); ctx.lineTo(foot.x - s * 2, foot.y - 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(foot.x + s * 3, foot.y - 7.5); ctx.lineTo(foot.x + s * 2, foot.y - 1); ctx.stroke();
  },

  drawHead(ctx, P, side, p) {
    const hx = P.headX, hy = P.headY;
    const r = 9.4;
    ctx.save();
    ctx.translate(hx, hy);
    const tilt = clamp((P.neckX - hx) * 0.02, -0.12, 0.12) + p.head * 0.3;
    ctx.rotate(tilt);
    ctx.scale(side, 1); /* local space faces +x */
    const OUT = '#07080f';

    /* neck */
    ctx.strokeStyle = '#e8cdb4'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-1, r * 0.9); ctx.lineTo(-1, r * 1.6); ctx.stroke();

    /* skull / face */
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.92, r, 0, 0, TAU);
    ctx.fillStyle = '#f3dcc2'; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();

    /* jaw shadow */
    ctx.beginPath();
    ctx.moveTo(-r * 0.1, r * 0.25);
    ctx.quadraticCurveTo(r * 0.45, r * 0.55, r * 0.86, r * 0.05);
    ctx.strokeStyle = 'rgba(150,110,90,0.35)'; ctx.lineWidth = 2; ctx.stroke();

    /* hair: swept back, layered spikes */
    const hairG = ctx.createLinearGradient(0, -r, 0, r * 0.4);
    hairG.addColorStop(0, '#232a44'); hairG.addColorStop(1, '#12162a');
    ctx.fillStyle = hairG;
    ctx.beginPath();
    ctx.moveTo(-r * 1.02, r * 0.55);
    ctx.quadraticCurveTo(-r * 1.5, -r * 0.15, -r * 1.0, -r * 0.72);
    ctx.quadraticCurveTo(-r * 0.75, -r * 1.28, -r * 0.05, -r * 1.08);
    ctx.quadraticCurveTo(r * 0.62, -r * 1.05, r * 0.92, -r * 0.5);
    ctx.quadraticCurveTo(r * 0.6, -r * 0.72, r * 0.36, -r * 0.34);
    ctx.quadraticCurveTo(r * 0.1, -r * 0.66, -r * 0.28, -r * 0.36);
    ctx.quadraticCurveTo(-r * 0.6, -r * 0.2, -r * 1.02, r * 0.55);
    ctx.closePath();
    ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();

    /* ponytail streaming back */
    const sway = Math.sin(Game.time * 3.4) * 2.2 - clamp(this.vx * 0.02, -5, 5);
    ctx.beginPath();
    ctx.moveTo(-r * 0.85, -r * 0.5);
    ctx.quadraticCurveTo(-r * 2.1, -r * 0.9 + sway, -r * 2.9, -r * 0.15 + sway * 1.6);
    ctx.quadraticCurveTo(-r * 2.2, -r * 0.25 + sway, -r * 1.6, r * 0.45);
    ctx.quadraticCurveTo(-r * 1.3, -r * 0.05, -r * 0.85, -r * 0.5);
    ctx.fillStyle = '#181d33'; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 1.6; ctx.stroke();

    /* red headband */
    ctx.beginPath();
    ctx.moveTo(-r * 0.95, -r * 0.62);
    ctx.quadraticCurveTo(-r * 0.1, -r * 1.02, r * 0.88, -r * 0.56);
    ctx.lineTo(r * 0.9, -r * 0.30);
    ctx.quadraticCurveTo(-r * 0.1, -r * 0.76, -r * 0.95, -r * 0.36);
    ctx.closePath();
    ctx.fillStyle = '#e8324f'; ctx.fill();
    ctx.strokeStyle = '#5c0a1c'; ctx.lineWidth = 1.4; ctx.stroke();
    /* headband tails */
    ctx.strokeStyle = '#e8324f'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 0.9, -r * 0.4);
    ctx.quadraticCurveTo(-r * 1.9, -r * 0.35 + sway * 0.5, -r * 2.5, r * 0.25 + sway);
    ctx.stroke();

    /* eye with gold iris + sharp brow */
    ctx.fillStyle = '#f6f1e6';
    ctx.beginPath(); ctx.ellipse(r * 0.44, 0, 2.5, 1.9, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e0a53c';
    ctx.beginPath(); ctx.arc(r * 0.52, 0, 1.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0b0d18';
    ctx.beginPath(); ctx.arc(r * 0.55, 0, 0.8, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#12152a'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(r * 0.16, -r * 0.3); ctx.lineTo(r * 0.78, -r * 0.19); ctx.stroke();
    /* cheek mark */
    ctx.strokeStyle = 'rgba(207,32,56,0.45)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(r * 0.3, r * 0.42); ctx.lineTo(r * 0.55, r * 0.3); ctx.stroke();
    ctx.restore();
  },

  drawSword(ctx, P, side) {
    const b = P.swordBase, t = P.swordTip;
    ctx.save();
    /* charge glow */
    if (this.state === 'charge' && this.charge > 0.15) {
      const c = this.charge;
      const glowColor = c >= 0.99 ? 'rgba(255,120,60,' : 'rgba(255,200,90,';
      ctx.globalCompositeOperation = 'lighter';
      glowCircle(ctx, b.x, b.y, 22 + c * 48, glowColor + (0.28 + c * 0.5) + ')', 1);
      glowCircle(ctx, t.x, t.y, 16 + c * 34, glowColor + (0.35 + c * 0.45) + ')', 1);
      if (c >= 0.99) {
        for (let i = 0; i < 2; i++) {
          const a = Game.time * 9 + i * Math.PI;
          ctx.strokeStyle = 'rgba(255,170,90,' + (0.35 + Math.sin(Game.time * 20 + i) * 0.2) + ')';
          ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.arc(b.x, b.y, 40 + i * 9, a, a + 2.2); ctx.stroke();
        }
      }
    }
    /* hilt */
    const hx = b.x - Math.cos(this.facing > 0 ? 0 : 0) * 0;
    ctx.strokeStyle = '#0a0c16'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x - Math.cos(this.pose().p.sword) * 10 * side, b.y - Math.sin(this.pose().p.sword) * 10);
    ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.strokeStyle = '#8c1229'; ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(b.x - Math.cos(this.pose().p.sword) * 10 * side, b.y - Math.sin(this.pose().p.sword) * 10);
    ctx.lineTo(b.x, b.y); ctx.stroke();
    /* guard */
    ctx.strokeStyle = '#d8b25a'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(b.x - Math.sin(this.pose().p.sword) * 6, b.y + Math.cos(this.pose().p.sword) * 6);
    ctx.lineTo(b.x + Math.sin(this.pose().p.sword) * 6, b.y - Math.cos(this.pose().p.sword) * 6);
    ctx.stroke();
    /* blade */
    blade(ctx, b.x, b.y, t.x, t.y, 2.6, this.bladeGlow > 0);
    if (this.bladeGlow > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(180,240,255,' + this.bladeGlow + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y); ctx.stroke();
    }
    ctx.restore();
  },

  makeSnapshot() {
    const P = this.pose();
    const side = this.facing;
    const p = P.p;
    return (ctx, color, t) => {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = color + (0.9) + ')';
      ctx.fillStyle = color + (0.28) + ')';
      ctx.lineWidth = 3;
      taperedLimb(ctx, P.hipX, P.hipY, P.shoulderX, P.shoulderY, 26, 30, color + (0.30) + ')', null);
      taperedLimb(ctx, P.hipF.x, P.hipF.y, P.kneeF.x, P.kneeF.y, 12, 9, color + (0.26) + ')', null);
      taperedLimb(ctx, P.kneeF.x, P.kneeF.y, P.footF.x, P.footF.y, 9, 6, color + (0.26) + ')', null);
      taperedLimb(ctx, P.hipB.x, P.hipB.y, P.kneeB.x, P.kneeB.y, 12, 9, color + (0.20) + ')', null);
      taperedLimb(ctx, P.kneeB.x, P.kneeB.y, P.footB.x, P.footB.y, 9, 6, color + (0.20) + ')', null);
      taperedLimb(ctx, P.shF.x, P.shF.y, P.elbowF.x, P.elbowF.y, 10, 8, color + (0.30) + ')', null);
      taperedLimb(ctx, P.elbowF.x, P.elbowF.y, P.handF.x, P.handF.y, 8, 6, color + (0.30) + ')', null);
      ctx.beginPath(); ctx.arc(P.headX, P.headY, 10, 0, TAU); ctx.fill();
      ctx.strokeStyle = color + '0.9)';
      blade(ctx, P.swordBase.x, P.swordBase.y, P.swordTip.x, P.swordTip.y, 3.2, true);
      blade(ctx, P.swordBase.x, P.swordBase.y, P.swordTip.x, P.swordTip.y, 2.4, true);
      ctx.restore();
    };
  }
};
Object.assign(Player.prototype, PLAYER_PROTO);

let ENEMY_ID = 0;

class Puppet {
  constructor(typeName, x, side) {

    this.type = typeName; this.T = T;
    this.x = x; this.y = GROUND_Y; this.vx = 0; this.vy = 0;
