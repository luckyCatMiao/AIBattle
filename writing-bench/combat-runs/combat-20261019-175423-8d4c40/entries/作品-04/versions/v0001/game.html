    this.deadT = 0;
    this.limbs = {
      armL: { hp: T.limbHp.armL, max: T.limbHp.armL, attached: true, ext: 'arm' },
      armR: { hp: T.limbHp.armR, max: T.limbHp.armR, attached: true, ext: 'arm' },
      legL: { hp: T.limbHp.legL, max: T.limbHp.legL, attached: true, ext: 'leg' },
      legR: { hp: T.limbHp.legR, max: T.limbHp.legR, attached: true, ext: 'leg' },
      head: { hp: T.hp * 0.75, max: T.hp * 0.75, attached: true, ext: 'head' }
    };
    this.walkPhase = Math.random() * TAU;
    this.ribbons = [];
    for (let i = 0; i < 5; i++) {
      this.ribbons.push({
        pts: new Array(6).fill(0).map(() => ({ x, y: GROUND_Y - 180, px: x, py: GROUND_Y - 180 })),
        len: 12, init: false, ph: Math.random() * TAU
      });
    }
    this.spawnX = x;
    this.spawnGlow = 1;
    this.armSwing = 0;
    this.aiTimer = 0;
    this.hasToken = false;
    this.stunGlint = 0;
    this.decoys = 0;
  }

  get alive() { return !this.dead && this.hp > 0; }
  get armsOk() { return this.limbs.armL.attached || this.limbs.armR.attached; }
  get legsOk() { return this.limbs.legL.attached || this.limbs.legR.attached; }
  get legsCount() { return (this.limbs.legL.attached ? 1 : 0) + (this.limbs.legR.attached ? 1 : 0); }

  hurtBox() {
    const s = this.scale;
    return { x: this.x - 24 * s, y: this.y - 104 * s, w: 48 * s, h: 102 * s };
  }
  center() { return { x: this.x, y: this.y - 56 * this.scale }; }
  bodyRect() { return { x: this.x - 22 * this.scale, y: this.y - 96 * this.scale, w: 44 * this.scale, h: 94 * this.scale }; }
}

/* ==== 51-enemy-logic.js ==== */
'use strict';
/* ============================================================
   Puppet AI, damage & limb severing
   ============================================================ */
/* Attack tokens keep the fight readable: one puppet commits at a time
   (two from wave 4). Others circle, feint and reposition. */
const TOKEN = { holders: new Set(), max: 1 };
const PUPPET_PROTO = {
  /* ---------- skeleton ---------- */
  solve(p, state) {
    const s = this.scale;
    const hipX = this.x, hipY = this.y + p.hipY * s;
    const lean = p.lean;
    const shoulderX = hipX + Math.sin(lean * 0.6) * SK.torso * s;
    const shoulderY = hipY - SK.torso * Math.cos(lean * 0.6) * s;
    const side = this.facing;
    const neckX = shoulderX + Math.sin(lean) * SK.neck * s * side;
    const neckY = shoulderY - SK.neck * Math.cos(lean) * s;
    const headX = neckX + side * Math.sin(lean + p.head) * 14 * s;
    const headY = neckY - Math.cos(lean + p.head) * 14 * s;

    const shF = { x: shoulderX + side * 3 * s, y: shoulderY + 2 * s };
    const shB = { x: shoulderX - side * 3 * s, y: shoulderY + 4 * s };
    const hipF = { x: hipX + side * 4 * s, y: hipY - 2 * s };
    const hipB = { x: hipX - side * 4 * s, y: hipY - 2 * s };
    const handF = { x: hipX + p.fh[0] * side * s, y: hipY + p.fh[1] * s };
    const handB = { x: hipX + p.bh[0] * side * s, y: hipY + p.bh[1] * s };
    const elbowF = ik2(shF.x, shF.y, handF.x, handF.y, SK.upperArm * s, SK.foreArm * s, p.elbowF);
    const elbowB = ik2(shB.x, shB.y, handB.x, handB.y, SK.upperArm * s, SK.foreArm * s, p.elbowB);
    const footF = { x: hipX + p.ff[0] * side * s, y: this.y + p.ff[1] * s };
    const footB = { x: hipX + p.bf[0] * side * s, y: this.y + p.bf[1] * s };
    const kneeF = ik2(hipF.x, hipF.y, footF.x, footF.y, SK.thigh * s, SK.shin * s, p.kneeF);
    const kneeB = ik2(hipB.x, hipB.y, footB.x, footB.y, SK.thigh * s, SK.shin * s, p.kneeB);

    /* damaged legs: drop the pelvis */
    if (!this.limbs.legL.attached && !this.limbs.legR.attached) { }
    const ang = p.sword;
    const swordBase = handF;
    const swordTip = { x: swordBase.x + Math.cos(ang) * SK.swordLen * s * side, y: swordBase.y + Math.sin(ang) * SK.swordLen * s };
    return { hipX, hipY, shoulderX, shoulderY, neckX, neckY, headX, headY, shF, shB, handF, handB, elbowF, elbowB, hipF, hipB, footF, footB, kneeF, kneeB, swordBase, swordTip, p };
  },

  currentPose() {
    const T = this.T;
    const t = Game.time;
    let p;
    if (this.dead || this.state === 'dying') p = ENEMY_POSE.down;
    else if (this.state === 'spawn') { p = clonePose(ENEMY_POSE.stand); p.hipY += Math.sin(t * 30) * 1.2; }
    else if (this.state === 'attack' && this.attack) {
      const def = this.attack.def;
      p = keyPose(def.keys, this.attack.t);
    }
    else if (this.state === 'hurt') p = ENEMY_POSE.hurt;
    else if (this.state === 'stagger') p = ENEMY_POSE.hurt;
    else if (!this.legsOk) p = ENEMY_POSE.crawl;
    else if (this.legsCount === 1) {
      p = clonePose(ENEMY_POSE.crawl);
      p.hipY = -40; p.lean = 0.34; p.fh = [16, -50]; p.bh = [-6, -48];
      p.ff = [10, 0]; p.bf = [-6, 0];
      p.hipY += Math.sin(this.walkPhase * 2) * 3;
    }
    else if (this.state === 'chase' || this.state === 'reposition') {
      const k = Math.abs(Math.sin(this.walkPhase));
      p = lerpPose(ENEMY_POSE.walkA, ENEMY_POSE.walkB, k);
    }
    else p = lerpPose(ENEMY_POSE.stand, ENEMY_POSE.stand, 0.5);
    /* broken arm pose */
    if (!this.limbs.armR.attached) { p.fh = [22, -52]; }
    if (!this.limbs.armL.attached) { p.bh = [-16, -50]; }
    return this.solve(p, this.state);
  },

  /* ---------- update ---------- */
  update(dt) {
    this.stateT -= dt;
    this.flash = Math.max(0, this.flash - dt * 6);
    this.spawnGlow = Math.max(0, this.spawnGlow - dt * 1.5);
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.staggerT = Math.max(0, this.staggerT - dt);
    this.knockT = Math.max(0, this.knockT - dt);
    this.atkCd = Math.max(0, this.atkCd - dt);
    this.stunGlint = Math.max(0, this.stunGlint - dt);

    /* ribbons trail */
    const P = this.currentPose();
    for (let i = 0; i < this.ribbons.length; i++) {
      const rb = this.ribbons[i];
      const anchor = i === 0 ? { x: P.headX - this.facing * 6, y: P.headY + 3 }
        : i === 1 ? { x: P.handF.x, y: P.handF.y }
          : { x: P.hipX - this.facing * 10, y: P.hipY - 6 };
      if (i === 1 && !this.limbs.armR.attached) { rb.pts[0].x = anchor.x; rb.pts[0].y = anchor.y; continue; }
      this.updateRibbon(rb, anchor, dt);
    }

    if (this.dead) { this.deadT += dt; this.y += this.vy * dt; this.vy += GRAV * dt; if (this.y > GROUND_Y) { this.y = GROUND_Y; this.vy = 0; } this.x += this.vx * dt; this.vx *= 0.9; return; }
    if (this.state === 'dying') {
      this.y += this.vy * dt; this.vy += GRAV * dt;
      if (this.y >= GROUND_Y) { this.y = GROUND_Y; this.vy = 0; this.vx *= 0.82; }
      this.x += this.vx * dt;
      if (this.stateT <= 0) { this.dead = true; this.deadT = 0; }
      return;
    }
    if (this.state === 'spawn') {
      if (this.stateT <= 0) { this.state = 'chase'; this.stateT = 0; }
      return;
    }
    /* a decapitated puppet keeps flailing briefly, then folds */
    if (!this.limbs.head.attached && !this.dead && this.state !== 'dying') {
      this.headlessT = (this.headlessT ?? 2.6) - dt;
      if (this.headlessT <= 0) { this.collapse(); return; }
    }
    if (this.state === 'hurt' || this.state === 'stagger' || this.state === 'launched') {
      this.physics(dt);
      if (this.state === 'hurt' && this.hurtT <= 0) this.state = 'chase';
      if (this.state === 'stagger' && this.staggerT <= 0) this.state = 'chase';
      if (this.state === 'launched') {
        if (this.onGround && this.stateT <= 0 && Math.abs(this.vy) < 10) { this.state = 'downed'; this.stateT = 0.42; }
        else if (this.onGround && this.stateT <= 0) { this.state = 'downed'; this.stateT = 0.4; }
      }
      return;
    }
    if (this.state === 'downed') {
      this.physics(dt);
      this.vx *= 0.9;
      if (this.stateT <= 0) { this.state = 'chase'; this.atkCd = Math.max(this.atkCd, 0.25); }
      return;
    }
    if (this.state === 'attack') {
      this.updateAttack(dt);
      return;
    }

    /* --- chase / reposition --- */
    const pl = Game.player;
    const dx = pl.x - this.x;
    const dist = Math.abs(dx);
    const dir = sign(dx || 1);
    const intent = this.chooseIntent(dx, dist, dt);
    if (intent) return;

    const want = this.T.range;
    const tooClose = dist < want * 0.62;
    const waiting = this.atkCd <= 0 && !this.canAttack();
    let move = 0;
    const legFactor = this.legsCount === 2 ? 1 : this.legsCount === 1 ? 0.55 : 0.18;
    const speed = this.T.speed * legFactor;
    if (waiting) {
      /* circle at a respectful distance while another puppet attacks */
      const ring = this.T.ranged ? 270 : 185;
      if (dist > ring + 40) move = dir;
      else if (dist < ring - 40) move = -dir * 0.7;
      else move = Math.sin(Game.time * 1.6 + this.id) * 0.18;
      this.facing = dir;
    } else if (dist > want * 0.9) move = dir;
    else if (tooClose && !this.T.ranged) move = -dir * 0.45;
    else if (this.T.ranged && dist < 170) move = -dir * 0.8;
    else move = 0;
    this.facing = dist > 8 ? dir : this.facing;

    if (this.legsCount === 0) {
      /* crawl pitifully, very slowly */
      this.x += move * speed * 0.4 * dt;
      this.walkPhase += dt * 6;
    } else {
      this.vx = approach(this.vx, move * speed, 900 * dt);
      this.x += this.vx * dt;
      if (Math.abs(this.vx) > 20) this.walkPhase += dt * (5.5 + Math.abs(this.vx) * 0.02);
    }
    this.x = clamp(this.x, 30, WORLD.w - 30);
    this.y = GROUND_Y;
    this.onGround = true;
  },

  chooseIntent(dx, dist, dt) {
    if (this.atkCd > 0) return false;
    if (this.state === 'reposition') {
      if (this.stateT <= 0) this.state = 'chase';
      return false;
    }
    const pl = Game.player;
    if (pl.dead) return false;
    const rng = this.T.range;
    if (this.T.ranged) {
      if (dist > 130 && dist < 430 && Math.abs(pl.y - this.y) < 120 && this.armsOk) {
        this.beginAttack('throw'); return true;
      }
      if (dist <= 120 && this.armsOk) { this.beginAttack('swipe'); return true; }
      return false;
    }
    if (dist < rng + 16 && Math.abs(pl.y - this.y) < 100 && this.armsOk) {
      this.beginAttack('swipe'); return true;
    }
    return false;
  },

  canAttack() {
    TOKEN.max = Game.wave >= 4 ? 2 : 1;
    if (TOKEN.holders.has(this.id)) return true;
    return TOKEN.holders.size < TOKEN.max;
  },

  beginAttack(name) {
    const T = this.T;
    if (!this.canAttack()) { this.atkCd = rand(0.25, 0.55); this.state = 'reposition'; this.stateT = rand(0.35, 0.7); return; }
    TOKEN.holders.add(this.id);
    this.hasToken = true;
    let def;
    if (name === 'swipe') {
      def = {
        dur: T.windup + T.recover + 0.18, active: [T.windup, T.windup + 0.14],
        dmg: T.dmg, hitstop: 0.09, reach: T.range + 30, arc: 1.4, kb: 260, kbY: -160,
        keys: this.makeSwipeKeys(T.windup, T.recover), lunge: T.type === 'brute' ? 200 : 160,
        ranged: false
      };
      if (!this.limbs.armR.attached) { def.dmg *= 0.45; def.active = [T.windup * 1.25, T.windup * 1.25 + 0.14]; def.dur *= 1.25; }
    } else if (name === 'throw') {
      const totalDur = T.windup + T.recover + 0.25;
      def = {
        dur: T.windup + T.recover + 0.25, active: [T.windup + 0.05, T.windup + 0.2],
        dmg: T.dmg, hitstop: 0.05, reach: 0, ranged: true,
        keys: [{ t: 0, p: ENEMY_POSE.throwWind }, { t: T.windup * 0.7, p: ENEMY_POSE.throwWind }, { t: T.windup, p: ENEMY_POSE.throwOut, ease: easeOutCubic }, { t: T.windup + 0.16, p: ENEMY_POSE.throwOut }, { t: totalDur, p: ENEMY_POSE.stand, ease: easeOutQuad }]
      };
    } else if (name === 'slam') {
      def = {
        dur: T.windup + T.recover + 0.2, active: [T.windup, T.windup + 0.2],
        dmg: T.dmg * 1.4, hitstop: 0.12, reach: T.range + 46, arc: 1.8, kb: 420, kbY: -220,
        keys: this.makeSwipeKeys(T.windup, T.recover, true), lunge: 240, shockwave: true
      };
    }
    this.attack = { name, def, t: 0, fired: false, hit: false, lunged: false, trail: false };
    this.state = 'attack';
    this.stateT = 0;
    this.vx = 0;
    this.attack.t = 0;
    Audio_.enemyWarn();
    this.warnFlash = 0.35;
    /* telegraph ring */
    FX.ring(this.x, this.y - 50 * this.scale, 8, 30, 0.3, 'rgba(255,120,80,', 2);
  },

  makeSwipeKeys(wind, rec, slam) {
    const windPose = clonePose(ENEMY_POSE.windup);
    if (slam) { windPose.sword = 3.4; windPose.fh = [-6, -96]; windPose.hipY = -58; }
    const strike = clonePose(ENEMY_POSE.strike);
    return [
      { t: 0, p: windPose },
      { t: wind * 0.85, p: windPose, ease: easeOutQuad },
      { t: wind, p: strike, ease: easeOutCubic },
      { t: wind + 0.16, p: strike },
      { t: wind + 0.16 + rec, p: ENEMY_POSE.stand, ease: easeOutQuad }
    ];
  },

  updateAttack(dt) {
    const a = this.attack;
    const def = a.def;
    a.t += dt;
    const T = this.T;
    if (!a.lunged && a.t >= def.active[0]) {
      a.lunged = true;
      const pdx = Game.player.x - this.x;
      this.facing = sign(pdx || this.facing);
      if (!def.ranged) this.vx = this.facing * (def.lunge || 150);
      else this.spawnOrb();
    }
    if (def.ranged && a.t >= def.active[0] && !a.fired) { a.fired = true; }
    if (!def.ranged) {
      this.x += this.vx * dt;
      this.vx *= Math.pow(0.001, dt);
      this.x = clamp(this.x, 30, WORLD.w - 30);
    }
    /* hit player */
    if (!def.ranged && a.t >= def.active[0] && a.t <= def.active[1] && !a.hit) {
      const hb = this.attackBox();
      if (overlap(hb, Game.player.hurtBox())) {
        const dir = sign(Game.player.x - this.x || this.facing);
        if (Game.player.state === 'parry' && Game.player.parryT > 0) {
          Game.onParry(this);
          a.hit = true;
        } else {
          if (Game.player.takeDamage(def.dmg, dir, {})) a.hit = true;
        }
      }
    }
    /* shockwave */
    if (def.shockwave && !a.shock) {
      a.shock = true;
      setTimeout(() => { }, 0);
    }
    if (a.t >= def.dur) {
      this.state = 'chase';
      this.attack = null;
      TOKEN.holders.delete(this.id);
      this.hasToken = false;
      this.atkCd = rand(T.cooldown[0], T.cooldown[1]) * (Game.wave > 3 ? 0.82 : 1);
    }
  },

  attackBox() {
    const def = this.attack.def;
    const s = this.scale;
    const r = def.reach;
    if (this.facing > 0) return { x: this.x - 10, y: this.y - 100 * s, w: r + 10, h: 100 * s };
    return { x: this.x - r, y: this.y - 100 * s, w: r + 10, h: 100 * s };
  },

  spawnOrb() {
    const side = this.facing;
    const mx = this.x + side * 30 * this.scale, my = this.y - 62 * this.scale;
    Game.orbs.push(new Orb(mx, my, side, this));
    Audio_.swing(0.4);
  },

  updateRibbon(rb, anchor, dt) {
    const pts = rb.pts;
    pts[0].x = anchor.x; pts[0].y = anchor.y;
    for (let i = 1; i < pts.length; i++) {
      const q = pts[i];
      const vx = (q.x - q.px) * 0.84;
      const vy = (q.y - q.py) * 0.84;
      q.px = q.x; q.py = q.y;
      q.x += vx + Math.sin(Game.time * 3 + rb.ph + i) * 30 * dt;
      q.y += vy + 240 * dt * 0.25;
    }
    for (let k = 0; k < 3; k++) {
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        let dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.001;
        const diff = (d - rb.len) / d;
        b.x -= dx * diff; b.y -= dy * diff;
      }
    }
  },

  physics(dt) {
    this.vy += GRAV * dt;
    this.y += this.vy * dt;
    this.x += this.vx * dt;
    if (this.y >= GROUND_Y) {
      if (this.vy > 260) { Audio_.land(); FX.ring(this.x, GROUND_Y - 6, 6, 44, 0.3, 'rgba(210,190,160,', 2); }
      this.y = GROUND_Y; this.vy = 0; this.onGround = true;
    } else this.onGround = false;
    this.vx *= Math.pow(0.35, dt);
    this.x = clamp(this.x, 30, WORLD.w - 30);
  },

  /* ---------- damage ---------- */
  applyDamage(dmg, opts, game) {
    if (!this.alive || this.state === 'spawn') return null;
    const dir = opts.dir || 1;
    const heavy = opts.heavy;
    /* headless bodies take more damage */
    this.hp -= dmg;
    this.flash = 1;
    const result = { broke: [], died: false, limbHp: {} };
    /* choose a limb to damage */
    const target = this.pickLimb(opts.hitY, opts.dir);
    if (target && this.limbs[target].attached) {
      const lm = this.limbs[target];
      const armorMul = this.T.armor && opts.limbDmg < 40 ? 0.55 : 1;
      lm.hp -= opts.limbDmg * armorMul;
      result.limbHp[target] = lm.hp;
      if (lm.hp <= 0) {
        this.severLimb(target, opts, game);
        result.broke.push(target);
      }
    }
    if (this.hp <= 0) { this.die(opts, game); result.died = true; }
    else if (heavy) {
      TOKEN.holders.delete(this.id); this.hasToken = false;
      this.state = 'launched'; this.stateT = 0.3;
      this.vy = opts.kbY ?? -300; this.vx = dir * (opts.kb ?? 300);
      this.attack = null;
    } else {
      TOKEN.holders.delete(this.id); this.hasToken = false;
      this.state = 'hurt'; this.hurtT = clamp(0.10 + dmg * 0.004, 0.1, 0.24);
      this.vx = dir * (opts.kb ?? 120);
      if (this.attack) { this.attack = null; this.atkCd = Math.max(this.atkCd, 0.3); }
    }
    return result;
  },

  pickLimb(hitY, dir) {
    const s = this.scale;
    const rel = typeof hitY === 'number' ? hitY - this.y : -60 * s; /* negative = above ground */
    const weighted = [];
    for (const k of ['armR', 'armL', 'legR', 'legL', 'head']) {
      const lm = this.limbs[k];
      if (!lm.attached) continue;
      let w = 1;
      if (k === 'head') w = rel < -80 * s ? 1.3 : 0.26;
      else if (k === 'armR' || k === 'armL') w = rel < -42 * s ? 1.7 : 0.55;
      else w = rel < -42 * s ? 0.5 : 1.9;
      if (k === 'armR' || k === 'legR') w *= 1.5;
      if (k === 'armL' || k === 'legL') w *= 0.8;
      /* finish what's already wounded — reads as deliberate dismemberment */
      w *= 1 + 2.2 * (1 - clamp(lm.hp / lm.max, 0, 1));
      weighted.push({ k, w });
    }
    if (!weighted.length) return null;
    let total = weighted.reduce((a, b) => a + b.w, 0);
    let r = Math.random() * total;
    for (const it of weighted) { r -= it.w; if (r <= 0) return it.k; }
    return weighted[0].k;
  },

  severLimb(k, opts, game) {
    const lm = this.limbs[k];
    lm.attached = false;
    lm.hp = 0;
    const P = this.currentPose();
    const s = this.scale;
    let anchor, kind = 'arm';
    if (k === 'armR') { anchor = P.elbowF; kind = 'arm'; }
    else if (k === 'armL') { anchor = P.elbowB; kind = 'arm'; }
    else if (k === 'legR') { anchor = P.kneeF; kind = 'leg'; }
    else if (k === 'legL') { anchor = P.kneeB; kind = 'leg'; }
    else { anchor = { x: P.headX, y: P.headY + 6 * s }; kind = 'head'; }
    const dir = opts.dir || 1;
    Game.onLimbBreak(this, k, anchor, dir, opts, kind);
    /* gameplay consequences */
    if (k === 'head') {
      this.hp = Math.min(this.hp, this.maxHp * 0.35);
      this.state = 'stagger'; this.staggerT = 0.9;
      this.atkCd = 1.0;
    } else if (kind === 'leg') {
      if (!this.legsOk) { this.state = 'stagger'; this.staggerT = 1.1; }
      else { this.state = 'stagger'; this.staggerT = 0.5; }
      this.atkCd = Math.max(this.atkCd, 0.5);
      this.vy = Math.min(this.vy, -180);
    } else {
      /* arms: losing your weapon arm weakens attacks */
      this.state = 'stagger'; this.staggerT = 0.55;
      if (!this.armsOk) this.atkCd = 1.2;
    }
    this.attack = null;
  },

  collapse() {
    this.hp = 0;
    this.state = 'dying'; this.stateT = 0.55;
    this.vy = -140; this.vx = -this.facing * 60;
    TOKEN.holders.delete(this.id); this.hasToken = false;
    Audio_.break_();
    Game.hitstop = Math.max(Game.hitstop, 0.08);
    Camera.kick(0.2);
    for (let i = 0; i < 6; i++) FX.parts.push({ type: 'ink', x: this.x + rand(-14, 14), y: this.y - 40 + rand(-20, 20), vx: rand(-120, 120), vy: rand(-160, -40), life: 0.5, max: 0.5, r: rand(1.5, 3), color: '#e8324f', grav: 900, drag: 1 });
    if (!this.counted) { this.counted = true; Game.killCount++; }
  },

  die(opts, game) {
    TOKEN.holders.delete(this.id); this.hasToken = false;
    this.dead = false;
    this.state = 'dying'; this.stateT = 0.0;
    this.hp = 0;
    this.vy = opts?.kbY ?? -260;
    this.vx = (opts?.dir || 1) * (opts?.kb ?? 220);
    Audio_.break_();
  },

  draw(ctx) {
    if (this.dead && this.deadT > 2.0) return;
    const alpha = this.dead ? clamp(1 - (this.deadT - 1.4) / 0.6, 0, 1) : 1;
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    const P = this.currentPose();
    const T = this.T, s = this.scale, side = this.facing;

    /* spawn warp */
    if (this.state === 'spawn') {
      const t = 1 - this.stateT / 0.55;
      ctx.globalCompositeOperation = 'lighter';
      glowCircle(ctx, this.x, this.y - 50 * s, 80 * (1 - t) + 20, 'rgba(255,90,90,' + (0.5 * (1 - t)) + ')', 1);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = alpha * clamp(t * 1.4, 0, 1);
    }

    /* ground shadow */
    ctx.save(); ctx.globalAlpha *= clamp(1 - (GROUND_Y - this.y) / 260, 0.1, 0.45);
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(this.x, GROUND_Y + 1, 26 * s, 6, 0, 0, TAU); ctx.fill();
    ctx.restore();

    /* marionette control bar + strings */
    if (!this.dead && this.state !== 'dying') {
      const barY = this.y - 138 * s;
      const barW = 54 * s;
      const barX = this.x + Math.sin(Game.time * 1.4 + this.id) * 3;
      ctx.save();
      /* strings */
      const anchors = [
        { x: P.headX, y: P.headY, a: 1 },
        { x: P.handF.x, y: P.handF.y, a: this.limbs.armR.attached ? 0.9 : 0 },
        { x: P.handB.x, y: P.handB.y, a: this.limbs.armL.attached ? 0.9 : 0 },
        { x: P.kneeF.x, y: P.kneeF.y, a: this.limbs.legR.attached ? 0.55 : 0 },
        { x: P.kneeB.x, y: P.kneeB.y, a: this.limbs.legL.attached ? 0.55 : 0 }
      ];
      const offs = [-barW * 0.8, barW * 0.55, -barW * 0.15, barW * 0.2, -barW * 0.45];
      for (let i = 0; i < anchors.length; i++) {
        const an = anchors[i];
        if (!an.a) continue;
        const sx = barX + offs[i], sy = barY + 3;
        const g = ctx.createLinearGradient(sx, sy, an.x, an.y);
        g.addColorStop(0, 'rgba(60,48,40,0.95)');
        g.addColorStop(0.35, 'rgba(200,190,170,' + (0.55 * an.a) + ')');
        g.addColorStop(1, 'rgba(230,220,200,' + (0.16 * an.a) + ')');
        ctx.strokeStyle = g; ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(an.x, an.y); ctx.stroke();
      }
      /* bar */
      ctx.strokeStyle = '#241a12'; ctx.lineWidth = 5.5 * s; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(barX - barW, barY); ctx.lineTo(barX + barW, barY); ctx.stroke();
      ctx.strokeStyle = '#7a5232'; ctx.lineWidth = 3.4 * s;
      ctx.beginPath(); ctx.moveTo(barX - barW, barY); ctx.lineTo(barX + barW, barY); ctx.stroke();
      /* hanging tassels */
      for (let i = -1; i <= 1; i += 2) {
        ctx.strokeStyle = T.ribbon; ctx.lineWidth = 1.6 * s;
        ctx.beginPath();
        ctx.moveTo(barX + i * barW, barY);
        ctx.quadraticCurveTo(barX + i * barW + Math.sin(Game.time * 3 + i) * 3, barY + 14 * s, barX + i * barW - 2 * i, barY + 26 * s);
        ctx.stroke();
      }
      ctx.restore();
    }

    /* back ribbon + back limbs */
    if (this.ribbonAlive(2)) this.drawRibbon(ctx, this.ribbons[2], T.trim, 0.8);
    if (this.limbs.legL.attached) {
      taperedLimb(ctx, P.hipB.x, P.hipB.y, P.kneeB.x, P.kneeB.y, 12 * s, 9 * s, T.color2);
      taperedLimb(ctx, P.kneeB.x, P.kneeB.y, P.footB.x, P.footB.y, 9 * s, 7 * s, T.color2);
      jointDot(ctx, P.kneeB.x, P.kneeB.y, 3 * s, '#2a2018');
      this.drawPuppetFoot(ctx, P.footB, T.color2, s);
    }
    if (this.limbs.armL.attached) {
      taperedLimb(ctx, P.shB.x, P.shB.y, P.elbowB.x, P.elbowB.y, 10 * s, 8 * s, T.color2);
      taperedLimb(ctx, P.elbowB.x, P.elbowB.y, P.handB.x, P.handB.y, 8 * s, 6 * s, T.color2);
      jointDot(ctx, P.elbowB.x, P.elbowB.y, 3 * s, '#2a2018');
    }

    /* torso */
    const tw = P.p.chestTwist || 0;
    taperedLimb(ctx, P.hipX, P.hipY - 4, P.shoulderX, P.shoulderY, 26 * s, 32 * s, T.color);
    ctx.save();
    /* wooden seam lines on torso */
    ctx.strokeStyle = 'rgba(40,26,16,0.45)'; ctx.lineWidth = 1.2 * s;
    for (let i = 0; i < 3; i++) {
      const k = (i + 1) / 4;
      const x0 = lerp(P.hipX, P.shoulderX, k), y0 = lerp(P.hipY - 4, P.shoulderY, k);
      ctx.beginPath(); ctx.arc(x0, y0 + 3 * s, 8 * s, -0.7, 0.7); ctx.stroke();
    }
    /* chest plate */
    ctx.beginPath();
    ctx.ellipse(lerp(P.hipX, P.shoulderX, 0.66) + side * tw * 4, lerp(P.hipY, P.shoulderY, 0.66), 12 * s, 10 * s, 0, 0, TAU);
    ctx.fillStyle = T.color2; ctx.fill();
    ctx.strokeStyle = T.trim; ctx.lineWidth = 2; ctx.stroke();
    /* waist joint */
    ctx.fillStyle = T.trim;
    ctx.beginPath(); ctx.arc(P.hipX, P.hipY - 2, 6 * s, 0, TAU); ctx.fill();
    ctx.restore();

    /* front leg */
    if (this.limbs.legR.attached) {
      taperedLimb(ctx, P.hipF.x, P.hipF.y, P.kneeF.x, P.kneeF.y, 13 * s, 10 * s, T.color);
      taperedLimb(ctx, P.kneeF.x, P.kneeF.y, P.footF.x, P.footF.y, 10 * s, 7 * s, T.color);
      jointDot(ctx, P.kneeF.x, P.kneeF.y, 3.4 * s, '#2a2018');
      this.drawPuppetFoot(ctx, P.footF, T.color, s);
    }

    /* head */
    if (this.limbs.head.attached) this.drawPuppetHead(ctx, P, side, s, T);
    else {
      /* neck stump with a dark socket and slow ink drip */
      ctx.fillStyle = '#241a12';
      ctx.beginPath(); ctx.ellipse(P.neckX, P.neckY - 2, 5 * s, 3.2 * s, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#e8324f'; ctx.lineWidth = 1.4 * s;
      ctx.beginPath(); ctx.moveTo(P.neckX - 1.5 * s, P.neckY - 1); ctx.lineTo(P.neckX - 2.4 * s, P.neckY + 9 * s); ctx.stroke();
    }

    /* front arm */
    if (this.limbs.armR.attached) {
      taperedLimb(ctx, P.shF.x, P.shF.y, P.elbowF.x, P.elbowF.y, 11 * s, 9 * s, T.color);
      taperedLimb(ctx, P.elbowF.x, P.elbowF.y, P.handF.x, P.handF.y, 9 * s, 7 * s, T.color);
      jointDot(ctx, P.elbowF.x, P.elbowF.y, 3.2 * s, '#2a2018');
      /* blade */
      if (this.T.ranged) {
        ctx.fillStyle = '#ffb37a'; ctx.globalAlpha = alpha * 0.9;
        glowCircle(ctx, P.handF.x, P.handF.y, 16 * s, 'rgba(120,240,255,0.6)', 0.7);
        ctx.globalAlpha = alpha;
        ctx.beginPath(); ctx.arc(P.handF.x, P.handF.y, 5 * s, 0, TAU); ctx.fillStyle = '#dffcff'; ctx.fill();
      } else {
        const sBase = P.swordBase, sTip = P.swordTip;
        ctx.save();
        ctx.strokeStyle = '#3a2a1c'; ctx.lineWidth = 5 * s; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(sBase.x - Math.cos(P.p.sword) * 8 * s * side, sBase.y - Math.sin(P.p.sword) * 8 * s); ctx.lineTo(sBase.x, sBase.y); ctx.stroke();
        blade(ctx, sBase.x, sBase.y, sTip.x, sTip.y, 2.4 * s, false);
        ctx.restore();
      }
    }
    if (this.limbs.armL.attached) {
      /* off-hand throwing coil */
      if (this.T.ranged) {
        ctx.save();
        ctx.strokeStyle = 'rgba(120,240,255,0.7)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(P.handB.x, P.handB.y, 8 * s + Math.sin(Game.time * 6) * 2, 0, TAU); ctx.stroke();
        ctx.restore();
      }
    }

    /* front ribbons */
    for (let i = 0; i < 2; i++) if (this.ribbonAlive(i)) this.drawRibbon(ctx, this.ribbons[i], T.ribbon);

    /* telegraph flash on front limb during windup */
    if (this.state === 'attack' && this.attack) {
      const a = this.attack;
      const w0 = this.attack.def.active[0];
      if (a.t < w0 && this.limbs.armR.attached) {
        const k = a.t / w0;
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        glowCircle(ctx, P.swordTip.x, P.swordTip.y, 18 + k * 26, 'rgba(255,110,70,' + (0.25 + k * 0.55) + ')', 1);
        ctx.restore();
        /* arc guide */
        ctx.save();
        ctx.strokeStyle = 'rgba(255,120,80,' + (0.18 + k * 0.35) + ')';
        ctx.lineWidth = 2 + k * 2;
        ctx.setLineDash([9, 7]);
        ctx.beginPath();
        const r = this.attack.def.reach * 0.85;
        if (this.facing > 0) ctx.arc(this.x, this.y - 60 * s, r, -1.15, 0.65);
        else ctx.arc(this.x, this.y - 60 * s, r, Math.PI - 0.65, Math.PI + 1.15);
        ctx.stroke();
        ctx.restore();
      }
    }

    /* white hit flash */
    if (this.flash > 0.02) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      glowCircle(ctx, this.x, this.y - 55 * s, 34 * s, 'rgba(255,240,210,1)', this.flash * 0.5 * alpha);
      ctx.restore();
    }
    /* stun stars */
    if ((this.state === 'stagger' || this.state === 'downed') && this.staggerT > 0.25) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) {
        const a = Game.time * 5 + i * TAU / 3;
        const xx = (this.limbs.head.attached ? P.headX : this.x) + Math.cos(a) * 22;
        const yy = (this.limbs.head.attached ? P.headY : this.y - 70 * s) - 20 + Math.sin(a) * 6;
        glowCircle(ctx, xx, yy, 7, 'rgba(255,220,120,1)', 0.8);
      }
      ctx.restore();
    }
    ctx.restore();

    /* health pip above */
    if (!this.dead && this.state !== 'dying') {
      const w = 54 * s, hpK = clamp(this.hp / this.maxHp, 0, 1);
      const by = this.y - 128 * s;
      ctx.save();
      ctx.fillStyle = 'rgba(8,6,14,0.78)';
      roundRect(ctx, this.x - w / 2 - 1, by - 1, w + 2, 7, 3); ctx.fill();
      ctx.fillStyle = hpK > 0.5 ? '#e7c07a' : hpK > 0.25 ? '#ff9a4a' : '#ff4a5e';
      roundRect(ctx, this.x - w / 2, by + 0.5, w * hpK, 4.5, 2); ctx.fill();
      /* limb damage pips */
      const keys = ['armR', 'armL', 'legR', 'legL', 'head'];
      for (let i = 0; i < keys.length; i++) {
        const lm = this.limbs[keys[i]];
        const px = this.x - 18 * s + i * 9 * s;
        ctx.fillStyle = lm.attached ? 'rgba(200,190,220,0.55)' : 'rgba(255,60,70,0.9)';
        ctx.beginPath(); ctx.arc(px, by - 5, 2 * s + 0.4, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  },

  ribbonAlive(i) {
    if (i === 0) return this.limbs.head.attached;
    if (i === 1) return this.limbs.armR.attached;
    return true;
  },
  drawRibbon(ctx, rb, color, widthMul = 1) {
    const pts = rb.pts;
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < pts.length - 1; i++) {
        const w = lerp(3.4, 0.7, i / (pts.length - 1)) * widthMul * (pass === 0 ? 1.8 : 1);
        taperedLimb(ctx, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y, w, w * 0.8, pass === 0 ? '#1a0d12' : color, null);
      }
    }
  },
  drawPuppetFoot(ctx, f, color, s) {
    ctx.fillStyle = color;
    roundRect(ctx, f.x - 6 * s, f.y - 7 * s, 17 * s, 9 * s, 3 * s); ctx.fill();
    ctx.strokeStyle = '#1d1610'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(40,26,16,0.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(f.x + 2 * s, f.y - 6 * s); ctx.lineTo(f.x + 2 * s, f.y + 1 * s); ctx.stroke();
  },
  drawPuppetHead(ctx, P, side, s, T) {
    const hx = P.headX, hy = P.headY;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(P.p.head * 0.35 * side + 0.06);
    /* head block */
    ctx.fillStyle = T.color;
    roundRect(ctx, -10 * s, -11 * s, 20 * s, 22 * s, 5 * s); ctx.fill();
    ctx.strokeStyle = '#1d1610'; ctx.lineWidth = 2; ctx.stroke();
    /* hair/rag */
    ctx.fillStyle = T.trim;
    ctx.beginPath();
    ctx.moveTo(-11 * s, -6 * s);
    ctx.quadraticCurveTo(0, -16 * s, 11 * s, -6 * s);
    ctx.lineTo(10 * s, -10 * s);
    ctx.quadraticCurveTo(0, -19 * s, -10 * s, -10 * s);
    ctx.fill();
    /* mask plate */
    ctx.fillStyle = T.mask;
    roundRect(ctx, -8 * s + side * 1.2 * s, -5 * s, 15 * s, 12 * s, 3 * s); ctx.fill();
    ctx.strokeStyle = 'rgba(40,30,20,0.7)'; ctx.lineWidth = 1.2; ctx.stroke();
    /* eyes */
    const eyeGlow = (this.state === 'attack' || this.state === 'spawn') ? 1 : 0.65;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    glowCircle(ctx, side * 4.6 * s, 0.6 * s, 7 * s, 'rgba(255,80,60,' + (0.6 * eyeGlow) + ')', 1);
    ctx.restore();
    ctx.fillStyle = T.eye;
    ctx.beginPath(); ctx.ellipse(side * 4.2 * s, 0.2 * s, 2.4 * s, 1.8 * s, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(side * -1.6 * s, 0.2 * s, 1.7 * s, 1.6 * s, 0, 0, TAU); ctx.fill();
    /* crack line */
    if (this.hp < this.maxHp * 0.5) {
      ctx.strokeStyle = 'rgba(30,20,14,0.8)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-2 * s, -5 * s); ctx.lineTo(1 * s, -1 * s); ctx.lineTo(-1 * s, 3 * s); ctx.stroke();
    }
    /* neck peg */
    ctx.fillStyle = '#2a2018';
    ctx.beginPath(); ctx.arc(0, 11 * s, 3.4 * s, 0, TAU); ctx.fill();
    ctx.restore();
  }
};
Object.assign(Puppet.prototype, PUPPET_PROTO);

/* ==== 60-limbs.js ==== */
'use strict';
/* ============================================================
   Severed limbs — physical debris that settles on the floor
   ============================================================ */
class SeveredLimb {
  constructor(x, y, vx, vy, kind, color, color2, scale, spin, ownerType, maskColor) {
    this.maskColor = maskColor;
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.kind = kind; this.color = color; this.color2 = color2 || color;
    this.scale = scale;
    this.rot = rand(-0.4, 0.4); this.spin = spin;
    this.len = kind === 'leg' ? 44 : kind === 'head' ? 13 : 32;
    this.life = 14;
    this.rest = false;
    this.bounces = 0;
    this.ownerType = ownerType;
    this.stringLen = rand(30, 60);
    this.settled = false;
    this.glow = 0.4;
    this.seed = Math.random() * 100;
  }
  update(dt) {
    this.life -= dt;
    if (this.rest) return;
    this.vy += GRAV * 0.9 * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.rot += this.spin * dt;
    /* thin red trail while flying */
    if (!this.settled && Math.random() < 0.55) {
      FX.parts.push({ type: 'ink', x: this.x + rand(-4, 4), y: this.y + rand(-4, 4), vx: this.vx * 0.12, vy: this.vy * 0.1, life: 0.28, max: 0.28, r: rand(1, 2.4), color: '#ff4d63', grav: 300, drag: 1 });
    }
    const gy = GROUND_Y - (this.kind === 'head' ? 10 : 3);
    if (this.y > gy) {
      this.y = gy;
      if (Math.abs(this.vy) > 120 && this.bounces < 3) {
        this.vy *= -0.40; this.vx *= 0.68; this.spin *= 0.5;
        this.bounces++;
        FX.parts.push({ type: 'dust', x: this.x, y: GROUND_Y, vx: rand(-90, 90), vy: rand(-70, -14), life: 0.4, max: 0.4, r: rand(6, 14), color: 'rgba(210,190,160,', grav: 50, drag: 3 });
        FX.parts.push({ type: 'ink', x: this.x, y: GROUND_Y - 2, vx: rand(-160, 160), vy: rand(-190, -40), life: 0.4, max: 0.4, r: rand(1.5, 3.5), color: '#e8324f', grav: 900, drag: 0.5 });
        Audio_.land();
      } else {
        this.vy = 0; this.vx *= 0.80; this.spin *= 0.75;
        if (Math.abs(this.vx) < 26) {
          this.rest = true; this.settled = true;
          /* lie flat-ish */
          this.rot = this.kind === 'head' ? this.rot : Math.PI / 2 * sign(Math.sin(this.rot) || 1) * (0.8 + Math.random() * 0.2);
        }
      }
    }
    if (this.y >= gy) this.y = gy;
  }
  draw(ctx) {
    const a = clamp(this.life > 10 ? 1 : this.life / 10, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    const s = this.scale;
    if (this.kind === 'head') {
      ctx.fillStyle = this.color;
      roundRect(ctx, -10 * s, -11 * s, 20 * s, 22 * s, 5 * s); ctx.fill();
      ctx.strokeStyle = '#1d1610'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = this.color2;
      ctx.beginPath(); ctx.moveTo(-11 * s, -6 * s); ctx.quadraticCurveTo(0, -16 * s, 11 * s, -6 * s); ctx.lineTo(10 * s, -10 * s); ctx.quadraticCurveTo(0, -19 * s, -10 * s, -10 * s); ctx.fill();
      ctx.fillStyle = this.maskColor || '#e8dfc8';
      roundRect(ctx, -8 * s, -5 * s, 15 * s, 12 * s, 3 * s); ctx.fill();
      ctx.strokeStyle = 'rgba(40,30,20,0.7)'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = '#2a2018';
      ctx.beginPath(); ctx.arc(0, 11 * s, 3.4 * s, 0, TAU); ctx.fill();
      /* dangling strings */
      ctx.strokeStyle = 'rgba(220,210,200,0.25)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, 11 * s); ctx.lineTo(Math.sin(Game.time * 2 + this.seed) * 8, 11 * s + this.stringLen); ctx.stroke();
    } else {
      /* limb segment */
      taperedLimb(ctx, -this.len / 2 * s, 0, this.len / 2 * s, 0, 11 * s, 7 * s, this.color, '#1d1610', 2);
      /* joint knobs */
      ctx.fillStyle = '#2a2018';
      ctx.beginPath(); ctx.arc(-this.len / 2 * s, 0, 4 * s, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(this.len / 2 * s, 0, 3.3 * s, 0, TAU); ctx.fill();
      /* splintered end with dark socket */
      const ex = -this.len / 2 * s;
      ctx.fillStyle = '#241a12';
      ctx.beginPath(); ctx.arc(ex + 2 * s, 0, 4.6 * s, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ecd9a6';
      poly(ctx, [ex, -4 * s, ex - 7 * s, -1 * s, ex - 4 * s, 1 * s, ex - 7 * s, 3 * s, ex, 4 * s]); ctx.fill();
      /* strings */
      ctx.strokeStyle = 'rgba(220,210,200,0.22)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, 2 * s); ctx.lineTo(Math.sin(Game.time * 2 + this.seed) * 10, this.stringLen); ctx.stroke();
    }
    ctx.restore();
  }
}

/* ============================================================
   Enemies' thrown lantern orbs
   ============================================================ */
class Orb {
  constructor(x, y, dir, owner) {
    this.x = x; this.y = y; this.vx = dir * 300; this.vy = 0;
    this.r = 9; this.life = 3.2; this.dir = dir;
    this.dead = false; this.t = 0;
    this.owner = owner;
    this.hb = { x: x - 12, y: y - 12, w: 24, h: 24 };
    this.dmg = owner ? owner.T.dmg : 10;
  }
  update(dt) {
    this.t += dt; this.life -= dt;
    this.vy += 240 * dt * 0.35;
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.y > GROUND_Y - 6) { this.y = GROUND_Y - 6; this.vy = -220; this.burst(); return; }
    if (this.x < 20 || this.x > WORLD.w - 20) this.dead = true;
    if (this.life <= 0) this.burst();
    this.hb = { x: this.x - 10, y: this.y - 10, w: 20, h: 20 };
    /* trail */
    if (Math.random() < 0.7) {
      FX.parts.push({ type: 'spark', x: this.x, y: this.y, vx: rand(-30, 30), vy: rand(-30, 30), life: 0.25, max: 0.25, w: 1.6, color: '#8ff0ff', grav: -30, drag: 2 });
    }
  }
  burst() {
    if (this.dead) return;
    this.dead = true;
    Audio_.break_();
    FX.ring(this.x, this.y, 4, 44, 0.3, 'rgba(120,240,255,', 3);
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * TAU;
      FX.parts.push({ type: 'spark', x: this.x, y: this.y, vx: Math.cos(a) * rand(60, 220), vy: Math.sin(a) * rand(60, 220), life: rand(0.2, 0.4), max: 0.4, w: 2, color: '#9ff6ff', grav: 200, drag: 3 });
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    glowCircle(ctx, this.x, this.y, 34, 'rgba(110,230,255,0.55)', 1);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#dffcff';
    ctx.beginPath(); ctx.arc(this.x, this.y, 7 + Math.sin(this.t * 24) * 1.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(90,220,255,0.9)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(this.x, this.y, 11, this.t * 8, this.t * 8 + 2.2); ctx.stroke();
    ctx.restore();
  }
}

/* ==== 70-game.js ==== */
'use strict';
/* ============================================================
   Game — loop, combat resolution, waves, HUD, state API
   ============================================================ */
const WORLD = { w: 1920 };

const Game = {
  time: 0, realTime: 0, last: 0,
  ready: false, playing: false, started: false,
  hitstop: 0, slowmo: 0, slowmoT: 0,
  flash: 0, flashColor: '255,60,80',
  player: null, enemies: [], orbs: [], limbs: [],
  hitCount: 0, limbBreakCount: 0, killCount: 0,
  wave: 0, waveT: 0, waveState: 'idle', spawnQueue: [],
  banner: null, bannerT: 0,
  deathT: 0,
  comboTimer: 0,
  firstKill: false,
  canvas: null, ctx: null,
  dpr: 1,

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
    Input.init();
    Background.init();
    this.player = new Player(300, GROUND_Y);
    this.reset();
    this.ready = true;
    this.last = performance.now();
    requestAnimationFrame(t => this.frame(t));
  },

  resize() {
    const c = this.canvas;
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(vw / W, vh / H);
    const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
    c.style.width = cw + 'px';
    c.style.height = ch + 'px';
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = Math.floor(W * this.dpr);
    c.height = Math.floor(H * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.viewScale = scale;
    this.offsetX = (vw - cw) / 2;
    this.offsetY = (vh - ch) / 2;
  },

  reset() {
    this.player = new Player(320, GROUND_Y);
    this.enemies.length = 0;
    this.orbs.length = 0;
    this.limbs.length = 0;
    FX.clear();
    Camera.init();
    Camera.x = clamp(this.player.x - W / Camera.zoom / 2, 0, WORLD.w - W / Camera.zoom);
    this.hitCount = 0; this.limbBreakCount = 0; this.killCount = 0;
    this.wave = 0; this.waveT = 0; this.waveState = 'idle';
    this.spawnQueue = [];
    this.hitstop = 0; this.slowmo = 0; this.slowmoT = 0; this.flash = 0;
    this.deathT = 0;
    this.playing = false;
    this.banner = null; this.bannerT = 0;
    this.pendingWave = false;
    TOKEN.holders.clear();
  },

  startGame() {
    if (this.playing) return;
    this.reset();
    this.playing = true;
    this.started = true;
    Audio_.unlock();
    Audio_.wave();
    this.startWave();
  },

  startWave() {
    this.wave++;
    this.waveState = 'active';
    const n = Math.min(2 + Math.floor(this.wave * 0.8), 6);
    this.spawnQueue = [];
    for (let i = 0; i < n; i++) {
      let type = 'warden';
      const r = Math.random();
      if (this.wave >= 2 && r < 0.34) type = 'thrower';
      if (this.wave >= 3 && r > 0.80) type = 'brute';
      this.spawnQueue.push({ type, delay: 0.15 + i * 0.55 + Math.random() * 0.25 });
    }
    this.maxAlive = Math.min(2 + Math.floor(this.wave / 2), 5);
    this.showBanner('第 ' + this.wave + ' 波', 'WAVE ' + this.wave, 1.1);
    Audio_.wave();
  },

  spawnEnemy(type) {
    const p = this.player;
    let x;
    /* spawn offscreen-ish but nearby; alternate sides */
    const side = Math.random() < 0.5 ? -1 : 1;
    x = clamp(p.x + side * rand(300, 430), 60, WORLD.w - 60);
    if (Math.abs(x - p.x) < 250) x = clamp(p.x - side * rand(280, 390), 60, WORLD.w - 60);
    const e = new Puppet(type, x, sign(p.x - x) || 1);
    this.enemies.push(e);
    Audio_.spawn();
    FX.ring(x, GROUND_Y - 40, 6, 70, 0.5, 'rgba(255,90,90,', 3);
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * TAU;
      FX.parts.push({ type: 'spark', x, y: GROUND_Y - 50 + Math.sin(a) * 30, vx: Math.cos(a) * rand(40, 160), vy: Math.sin(a) * rand(40, 160) - 60, life: rand(0.3, 0.6), max: 0.6, w: 2, color: '#ff8a7a', grav: 200, drag: 2 });
    }
    return e;
  },

  showBanner(txt, sub, dur = 1.2) { this.banner = { txt, sub }; this.bannerT = dur; this.bannerMax = dur; },

  /* ---------------- combat ---------------- */
  playerHitsEnemy(enemy, player, def) {
    const px = clamp(player.x + player.facing * def.reach * 0.55, enemy.x - 20, enemy.x + 20);
    const targetY = enemy.y - 96 * enemy.scale * (def.hitH ?? 0.55);
    const py = targetY + rand(-6, 6);
    const dir = player.facing;
    const dmg = def.dmg;
    const opts = {
      dir, heavy: !!def.heavy, kb: def.kb, kbY: def.kbY,
      limbDmg: def.limbDmg, hitDef: def, hitY: py
    };
    const wasAlive = enemy.alive;
    const res = enemy.applyDamage(dmg, opts, this);
    if (!res) return;
    this.hitCount++;
    this.comboHits = (this.comboHits || 0) + 1;
    this.comboTimer = 2.2;

    /* hit stop by power */
    const freeze = def.hitstop * (res.broke.length ? 1.5 : 1);
    this.hitstop = Math.max(this.hitstop, Math.min(0.24, freeze));
    this.flash = Math.max(this.flash, 0.12);
    this.flashColor = '255,80,100';
    Camera.kick(def.shake * 0.55 + (res.broke.length ? 0.22 : 0));
    player.bladeGlow = 1;

    /* impact fx */
    const sparkDir = dir > 0 ? 0 : Math.PI;
    FX.spark(px, py, sparkDir, def.heavy ? 1.5 : 1.0, '#ffe7ad', def.heavy ? 16 : 10);
    FX.ring(px, py, 4, def.heavy ? 58 : 34, 0.26, 'rgba(255,225,160,', 2.4);
    if (def.heavy) {
      FX.crack(px, py, sparkDir, 1);
      FX.blood(px, py, sparkDir, 0.7);
    }
    /* slash vfx at hit point */
    if (def.slash && !this._lastSlashT) {
      this._lastSlashT = 1;
    }
    Audio_.hit(def.heavy ? 1.5 : 1.0);
    Game.shakeHit = 1;

    /* combo counter on hud */
    if (this.comboHits > 1 && (this.comboHits % 5 === 0 || this.comboHits === 3)) {
      FX.text(px + rand(-8, 8), py - 78, this.comboHits + ' 斩', this.comboHits > 6 ? '#ffcf6e' : '#bff4ff', 18 + Math.min(this.comboHits, 8) * 1.4);
    }
    if (def.counter) FX.text(px, py - 62, '反 击', '#9ff6ff', 26);

    /* broken limbs fx handled in onLimbBreak */
    if (res.died) this.onKill(enemy);
  },

  onLimbBreak(enemy, key, anchor, dir, opts, kind) {
    this.limbBreakCount++;
    const T = enemy.T;
    const s = enemy.scale;
    /* spawn physical debris */
    const vel = kind === 'head' ? 520 : 400;
    this.limbs.push(new SeveredLimb(
      anchor.x, anchor.y,
      dir * rand(150, 300) * (kind === 'head' ? 1.7 : 1) + enemy.vx * 0.3,
      -rand(200, 430) * (kind === 'head' ? 1.4 : 1),
      kind, T.color, T.trim, s, dir * rand(6, 13), enemy.type
    ));
    /* extra splinter */
    for (let i = 0; i < 2; i++) {
      this.limbs.push(new SeveredLimb(anchor.x, anchor.y, dir * rand(80, 240), -rand(150, 330), 'shard', T.color2, T.trim, s * 0.35, rand(-16, 16), enemy.type, T.mask));
    }
    FX.crack(anchor.x, anchor.y, dir > 0 ? 0 : Math.PI, 1.6);
    FX.blood(anchor.x, anchor.y, dir > 0 ? 0 : Math.PI, 1.6);
    FX.ring(anchor.x, anchor.y, 8, 82, 0.4, 'rgba(255,190,120,', 4);
    FX.text(anchor.x, anchor.y - 52, kind === 'head' ? '断 首!' : kind === 'leg' ? '断 腿!' : '断 臂!', '#ffd98a', kind === 'head' ? 32 : 26);
    Audio_.break_();
    this.hitstop = Math.max(this.hitstop, kind === 'head' ? 0.2 : 0.14);
    this.hitstop += 0.06;
    Camera.kick(kind === 'head' ? 0.65 : 0.5);
    this.slowmoT = kind === 'head' ? 0.3 : 0.18;
    this.slowmo = 0.35;
    this.flash = Math.max(this.flash, 0.16);
  },

  onKill(enemy) {
    this.killCount++;
    this.hitstop = Math.max(this.hitstop, 0.12);
    Camera.kick(0.4);
    FX.blood(enemy.x, enemy.y - 60 * enemy.scale, 0, 1);
    Audio_.break_();
    /* kill shatter: spawn a couple extra shards */
    for (let i = 0; i < 3; i++) {
      const k = pick(['arm', 'leg', 'shard']);
      this.limbs.push(new SeveredLimb(enemy.x + rand(-16, 16), enemy.y - rand(20, 80), rand(-220, 220), -rand(180, 380), k, enemy.T.color, enemy.T.trim, enemy.scale, rand(-12, 12), enemy.type, enemy.T.mask));
    }
  },

  onParry(enemy) {
    const pl = this.player;
    pl.parrySuccess = 0.55;
    pl.invuln = Math.max(pl.invuln, 0.5);
    this.hitCount++;
    Audio_.parry();
    this.hitstop = Math.max(this.hitstop, 0.14);
    this.slowmoT = 0.16; this.slowmo = 0.3;
    Camera.kick(0.5);
    this.flash = Math.max(this.flash, 0.2); this.flashColor = '150,245,255';
    FX.ring(pl.x + pl.facing * 26, pl.y - 54, 10, 110, 0.42, 'rgba(150,245,255,', 4);
    FX.spark(pl.x + pl.facing * 26, pl.y - 54, pl.facing > 0 ? 0 : Math.PI, 1.8, '#d8feff', 22);
    FX.text(pl.x, pl.y - 120, '弹 返', '#9ff6ff', 30);
    /* knock attacking enemy back */
    enemy.state = 'stagger'; enemy.staggerT = 0.85; enemy.attack = null;
    enemy.atkCd = 1.0;
    enemy.vx = -enemy.facing * 240;
    enemy.vy = -220; enemy.onGround = false;
    Game.comboHits = (Game.comboHits || 0) + 2;
    this.comboTimer = 2.2;
  },

  onPlayerDeath() {
    this.deathT = 0;
    this.playing = false;
    this.hitstop = Math.max(this.hitstop, 0.2);
    Camera.kick(0.8);
    this.slowmoT = 0.6; this.slowmo = 0.25;
  },

  /* ---------------- frame ---------------- */
  frame(now) {
    let dt = (now - this.last) / 1000;
    this.last = now;
    dt = Math.min(dt, 1 / 20);
    this.realTime += dt;

    /* global start key */
    if (Input.anyPressed) Audio_.unlock();

    if (!this.playing && !this.started) {
      if (Input.hit('start') || Input.hit('atk') || Input.hit('jump')) this.startGame();
    } else if (!this.playing && this.deathT > 0 && (Input.hit('start') || Input.hit('restart'))) {
      this.startGame();
    }
    if (this.playing && Input.hit('restart')) this.startGame();

    Audio_.muted; // no-op

    let scale = 1;
    if (this.hitstop > 0) {
      scale = 0;
      /* keep FX breathing during freeze */
      FX.update(dt * 0.22);
    } else if (this.slowmoT > 0) {
      this.slowmoT -= dt;
      scale = this.slowmo;
    }

    if (this.playing) {
      this.update(dt * scale, dt);
    } else {
      if (this.started) this.deathT += dt;
      /* idle background still alive */
      Background.update(dt);
      FX.update(dt);
      this.updateWorldDressing(dt);
      this.player && this.player.dead && this.player.update(dt * 0.6);
    }
    this.time += dt * (scale || 0.0001);
    this.render();
    if (this.hitstop <= 0) Input.endFrame();
    else this.hitstop = Math.max(0, this.hitstop - dt);
    requestAnimationFrame(t => this.frame(t));
  },

  updateWorldDressing(dt) {
    for (let i = this.limbs.length - 1; i >= 0; i--) { this.limbs[i].update(dt); if (this.limbs[i].life <= 0) this.limbs.splice(i, 1); }
  },

  update(dt, rawDt) {
    this.time += 0; /* time advanced in frame */
    Background.update(dt);
    this.player.update(dt);
    /* spawn queue */
    if (this.spawnQueue.length) {
      for (let i = this.spawnQueue.length - 1; i >= 0; i--) {
        this.spawnQueue[i].delay -= dt;
        if (this.spawnQueue[i].delay <= 0) {
          const alive = this.enemies.filter(e => e.alive || e.dead === false).length;
          if (alive < this.maxAlive) {
            this.spawnEnemy(this.spawnQueue[i].type);
            this.spawnQueue.splice(i, 1);
          }
        }
      }
    }
    for (const e of this.enemies) e.update(dt);
    for (const o of this.orbs) o.update(dt);
    for (const l of this.limbs) l.update(dt);

    /* player attack hits */
    if (this.player.state === 'attack' && this.player.act) {
      this.player.currentFrameHits(this.enemies, this);
      /* combo scaling: build combo damage bonus, but keep it modest */
      const def = this.player.act.def;
      const P = this.player.currentSkel;
      if (P && this.player.act.t >= def.active[0] - 0.03 && this.player.act.t <= def.active[1] && def.heavy) {
        if (!this._ghostT) this._ghostT = 0;
        this._ghostT += rawDt;
        if (this._ghostT > 0.035) {
          this._ghostT = 0;
          FX.afterimage(this.player.makeSnapshot(), 0.24, 'rgba(255,170,90,');
        }
      }
      if (P && this.player.act.t <= def.active[1] + 0.06) {
        const prev = this.player._lastTip;
        const col = def.slash ? def.slash.color.slice(5, -1) : '200,240,255';
        const w = def.heavy ? 1.9 : 1.2;
        const steps = prev ? 5 : 1;
        for (let i = 0; i < steps; i++) {
          const u = (i + 1) / steps;
          const tx = prev ? lerp(prev.x, P.swordTip.x, u) : P.swordTip.x;
          const ty = prev ? lerp(prev.y, P.swordTip.y, u) : P.swordTip.y;
          const bx = lerp(P.swordBase.x, tx, 0.28), by = lerp(P.swordBase.y, ty, 0.28);
          FX.addTrail(bx, by, tx, ty, col, w);
        }
        this.player._lastTip = { x: P.swordTip.x, y: P.swordTip.y };
      } else {
        this.player._lastTip = null;
      }
    }

    /* orb vs player */
    for (const o of this.orbs) {
      if (o.dead) continue;
      const pl = this.player;
      if (!pl.dead && overlap(o.hb, pl.hurtBox())) {
        if (pl.state === 'parry' && pl.parryT > 0) {
          o.burst();
          this.onParry(o.owner);
          this.hitCount++;
        } else {
          if (pl.takeDamage(o.dmg, sign(pl.x - o.x || 1))) { o.burst(); }
        }
      }
    }

    /* body collision push apart */
    this.separate();

    /* cleanup */
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (e.dead && e.deadT > 2.4) this.enemies.splice(i, 1);
    }
    for (let i = this.orbs.length - 1; i >= 0; i--) if (this.orbs[i].dead) this.orbs.splice(i, 1);
    for (let i = this.limbs.length - 1; i >= 0; i--) if (this.limbs[i].life <= 0) this.limbs.splice(i, 1);

    /* combo timer */
    if (this.comboTimer > 0) { this.comboTimer -= dt; if (this.comboTimer <= 0) this.comboHits = 0; }
    if (this.bannerT > 0) this.bannerT -= dt;

    /* wave management */
    if (this.waveState === 'active') {
      const alive = this.enemies.filter(e => !e.dead && e.state !== 'dying').length;
      if (!this.spawnQueue.length && alive === 0) {
        this.waveState = 'clear';
        this.waveT = 1.15;
        this.showBanner('波次肃清', 'WAVE CLEAR', 1.0);
        this.player.hp = Math.min(this.player.maxHp, this.player.hp + 12);
      }
    } else if (this.waveState === 'clear') {
      this.waveT -= dt;
      if (this.waveT <= 0) this.startWave();
    }

    /* camera */
    Camera.update(dt, this.player);
    FX.update(dt);
    this.flash = Math.max(0, this.flash - rawDt * 0.9);
  },

  separate() {
    const p = this.player;
    const live = this.enemies.filter(e => !e.dead && e.state !== 'dying');
    for (const e of live) {
      if (e.state === 'launched') continue;
      const d = e.x - p.x;
      if (Math.abs(d) < 58 && Math.abs(e.y - p.y) < 80) {
        const push = (58 - Math.abs(d)) * sign(d || 1) * 0.5;
        if (e.state !== 'attack') e.x += push * 0.7;
        p.x -= push * 0.35;
      }
    }
    /* keep puppets from stacking on each other */
    for (let i = 0; i < live.length; i++) {
      for (let j = i + 1; j < live.length; j++) {
        const a = live[i], b = live[j];
        if (a.state === 'launched' || b.state === 'launched') continue;
        const d = b.x - a.x;
        const min = 74;
        if (Math.abs(d) < min) {
          const push = (min - Math.abs(d)) * 0.5 * sign(d || 1);
          if (a.state !== 'attack') a.x -= push * 0.6;
          if (b.state !== 'attack') b.x += push * 0.6;
        }
      }
    }
    for (const e of live) e.x = clamp(e.x, 30, WORLD.w - 30);
  },

  /* ---------------- render ---------------- */
  render() {
    const ctx = this.ctx;
    ctx.save();
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    Background.draw(ctx);

    beginWorld(ctx);
    Background.drawGround(ctx);
    /* ground glow near player */
    Background.drawPetals(ctx);

    /* severed limbs (behind characters) */
    for (const l of this.limbs) l.draw(ctx);

    /* enemies behind player by depth order */
    const sorted = this.enemies.slice().sort((a, b) => a.y - b.y);
    for (const e of sorted) e.draw(ctx);

    /* orbs */
    for (const o of this.orbs) o.draw(ctx);

    /* player (hidden behind the title card until the run begins) */
    if (this.player && this.started) this.player.draw(ctx);

    /* attack trails for player */
    this.drawPlayerAttackFX(ctx);

    FX.draw(ctx);
    endWorld(ctx);

    /* screen-space overlays */
    this.drawVignette(ctx);
    if (this.flash > 0.005) {
      ctx.fillStyle = 'rgba(' + this.flashColor + ',' + (this.flash * 0.30) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    this.drawHUD(ctx);
    this.drawBanner(ctx);
    if (!this.started) this.drawTitle(ctx);
    else if (!this.playing && this.deathT > 0) this.drawDeath(ctx);
    ctx.restore();
  },

  drawPlayerAttackFX(ctx) {
    const pl = this.player;
    if (!pl || pl.state !== 'attack' || !pl.act) return;
    const def = pl.act.def;
    const t = pl.act.t;
    const P = pl.pose();
    const s = def.slash;
    if (t >= def.active[0] - 0.02 && t <= def.active[1] + 0.08 && !pl.act.slashed) {
      pl.act.slashed = true;
      const prog = clamp((t - def.active[0] + 0.02) / 0.1, 0, 1);
      FX.slash(pl.x + pl.facing * 16, pl.y - 52,
        (pl.facing > 0 ? s.ang : Math.PI - s.ang), s.r, s.arc, 0.17, s.color, 3.0);
      if (def.shock) {
        FX.ring(pl.x + pl.facing * 40, pl.y - 40, 10, 130, 0.4, 'rgba(255,150,100,', 4);
      }
    }
    /* charge aura while winding big attack */
    if (pl.act.name === 'charge1' || pl.act.name === 'charge2') {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      glowCircle(ctx, P.swordTip.x, P.swordTip.y, 40, 'rgba(255,150,90,0.6)', 0.8);
      ctx.restore();
    }
  },

  drawVignette(ctx) {
    /* subtle darkened edges — no full-screen white */
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.95);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(4,4,10,0.55)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    /* low-health red edge pulse */
    const pl = this.player;
    if (pl && pl.alive && pl.hp < pl.maxHp * 0.3 && this.playing) {
      const a = 0.12 + Math.sin(this.realTime * 6) * 0.08;
      const rg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
      rg.addColorStop(0, 'rgba(255,0,40,0)');
      rg.addColorStop(1, 'rgba(255,20,50,' + a + ')');
      ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    }
  },

  drawHUD(ctx) {
    const pl = this.player;
    if (!pl) return;
    if (!this.started) {
      /* only the control strip is shown on the title card */
      this.drawControls(ctx);
      return;
    }
    /* player health */
    const hx = 24, hy = 24, hw = 250, hh = 13;
    ctx.save();
    ctx.fillStyle = 'rgba(6,7,14,0.72)';
    roundRect(ctx, hx - 4, hy - 4, hw + 8, hh + 8, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(190,210,255,0.25)'; ctx.lineWidth = 1; ctx.stroke();
    const k = clamp(pl.hp / pl.maxHp, 0, 1);
    const hg = ctx.createLinearGradient(hx, 0, hx + hw, 0);
    hg.addColorStop(0, '#e8324f'); hg.addColorStop(1, '#ff8a6a');
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(ctx, hx, hy, hw, hh, 3); ctx.fill();
    ctx.fillStyle = k > 0.3 ? hg : '#ff3b52';
    roundRect(ctx, hx, hy, hw * k, hh, 3); ctx.fill();
    /* hp ticks */
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    for (let i = 1; i < 6; i++) ctx.fillRect(hx + hw * i / 6, hy, 1, hh);
    ctx.font = '700 12px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.fillStyle = '#f0e9ff'; ctx.textAlign = 'left';
    ctx.fillText('绯  HP ' + Math.ceil(pl.hp) + ' / ' + pl.maxHp, hx, hy - 9);
    /* state tags */
    const tags = [];
    if (pl.parrySuccess > 0) tags.push({ t: '弹返!', c: '#9ff6ff' });
    if (pl.state === 'charge') tags.push({ t: pl.charge >= 0.99 ? '蓄力·满' : '蓄力', c: pl.charge >= 0.99 ? '#ff9a5c' : '#ffd76e' });
    if (pl.state === 'dash') tags.push({ t: '疾影', c: '#9fe8ff' });
    ctx.font = '800 13px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    let tx = hx + 2, ty = hy + 44;
    for (const t of tags) { ctx.fillStyle = t.c; ctx.fillText(t.t, tx, ty); tx += ctx.measureText(t.t).width + 14; }

    /* combo */
    if (this.comboHits > 1 && this.comboTimer > 0) {
      const n = this.comboHits;
      const scale = 1 + Math.min(0.35, n * 0.012);
      ctx.save();
      ctx.translate(W - 96, 150);
      ctx.rotate(-0.05);
      ctx.scale(scale, scale);
      ctx.textAlign = 'center';
      ctx.font = '900 54px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(5,6,12,0.85)';
      ctx.strokeText(String(n), 0, 0);
      const cg = ctx.createLinearGradient(0, -40, 0, 10);
      cg.addColorStop(0, '#fff3cf'); cg.addColorStop(1, '#ffb54a');
      ctx.fillStyle = cg; ctx.fillText(String(n), 0, 0);
      ctx.font = '800 15px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
      ctx.fillStyle = '#ffd98a';
      ctx.fillText('连 斩', 0, 20);
      /* combo timer bar */
      ctx.fillStyle = 'rgba(255,220,140,0.5)';
      ctx.fillRect(-42, 28, 84 * clamp(this.comboTimer / 2.2, 0, 1), 2);
      ctx.restore();
    }

    /* wave + stats top right — offset for mute button */
    ctx.textAlign = 'right';
    ctx.font = '800 14px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(230,235,255,0.85)';
    ctx.fillText('WAVE ' + Math.max(1, this.wave), W - 24, 76);
    ctx.font = '600 11px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(190,200,235,0.65)';
    ctx.fillText('斩击 ' + this.hitCount + '   断肢 ' + this.limbBreakCount + '   击破 ' + this.killCount, W - 24, 94);

    /* controls strip */
    this.drawControls(ctx);
    ctx.restore();
  },

  drawControls(ctx) {
    const items = [
      { k: 'A D / ← →', t: '移动' }, { k: 'Space', t: '跳跃·二段' },
      { k: 'J', t: '连斩' }, { k: 'K', t: '蓄力重斩' },
      { k: 'L', t: '瞬步·无敌' }, { k: 'I', t: '架势·弹反' },
      { k: 'R', t: '重开' }
    ];
    ctx.save();
    ctx.font = '700 11px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.textAlign = 'left';
    let total = 0;
    const pads = items.map(it => {
      const w = ctx.measureText(it.k).width + ctx.measureText(it.t).width + 30;
      total += w + 7; return w;
    });
    const startX = W / 2 - total / 2;
    const baseY = H - 14;
    ctx.fillStyle = 'rgba(5,6,14,0.55)';
    roundRect(ctx, startX - 10, baseY - 20, total + 12, 27, 7); ctx.fill();
    let x = startX;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const kw = ctx.measureText(it.k).width;
      ctx.fillStyle = 'rgba(220,230,255,0.92)';
      ctx.fillText(it.k, x, baseY);
      x += kw + 5;
      ctx.fillStyle = 'rgba(150,165,205,0.8)';
      ctx.font = '600 10px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
      ctx.fillText(it.t, x, baseY);
      x += ctx.measureText(it.t).width + 7 + 12;
      ctx.font = '700 11px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    }
    ctx.restore();
  },

  drawBanner(ctx) {
    if (!this.banner || this.bannerT <= 0) return;
    const t = 1 - this.bannerT / this.bannerMax;
    const a = Math.min(clamp(t / 0.14, 0, 1), clamp(this.bannerT / 0.22, 0, 1));
    const slide = (1 - easeOutCubic(clamp(t / 0.2, 0, 1))) * -18;
    ctx.save();
    ctx.translate(0, slide);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = '900 40px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(6,7,14,0.85)';
    ctx.strokeText(this.banner.txt, W / 2, 132);
    const g = ctx.createLinearGradient(0, 92, 0, 142);
    g.addColorStop(0, '#fff2d0'); g.addColorStop(1, '#e8324f');
    ctx.fillStyle = g;
    ctx.fillText(this.banner.txt, W / 2, 132);
    /* thin rule under the banner */
    ctx.strokeStyle = 'rgba(255,190,130,0.55)'; ctx.lineWidth = 1.4;
    const bw = 120;
    ctx.beginPath(); ctx.moveTo(W / 2 - bw, 146); ctx.lineTo(W / 2 + bw, 146); ctx.stroke();
    ctx.font = '700 12px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,210,150,0.75)';
    ctx.fillText(this.banner.sub, W / 2, 162);
    ctx.restore();
  },

  drawTitle(ctx) {
    /* hide the in-game HUD behind the title card */
    this._titleMode = true;
    ctx.save();
    ctx.fillStyle = 'rgba(4,5,12,0.58)';
    ctx.fillRect(0, 0, W, H);
    /* ink brush banner */
    ctx.textAlign = 'center';
    const g = ctx.createLinearGradient(0, 150, 0, 250);
    g.addColorStop(0, '#fff4dc'); g.addColorStop(0.55, '#ffd08a'); g.addColorStop(1, '#e8324f');
    ctx.font = '900 74px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(5,6,12,0.9)';
    ctx.strokeText('绯 刃 试 炼', W / 2, 196);
    ctx.fillStyle = g; ctx.fillText('绯 刃 试 炼', W / 2, 196);
    ctx.font = '700 16px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(230,235,255,0.85)';
    ctx.fillText('CRIMSON EDGE — 缚偶斩', W / 2, 230);
    ctx.font = '600 13.5px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(205,215,245,0.75)';
    ctx.fillText('斩断傀儡的四肢：断腿则跪地爬行，断臂则无力挥刀，断首则当场崩解。', W / 2, 268);
    ctx.fillText('K 蓄力，J 连斩接挑空，I 在刀刃贴身的瞬间弹反，L 瞬步无敌穿身。', W / 2, 290);
    const a = 0.55 + Math.sin(this.realTime * 4) * 0.35;
    ctx.globalAlpha = a;
    ctx.font = '800 20px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.fillStyle = '#ffe9b0';
    ctx.fillText('按 Enter / J 开始', W / 2, 400);
    ctx.globalAlpha = 1;
    ctx.font = '600 12px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(180,190,225,0.6)';
    ctx.fillText('M 静音　·　R 重开　·　鼠标仅用于按钮', W / 2, 424);
    ctx.restore();
  },

  drawDeath(ctx) {
    ctx.save();
    const a = clamp(this.deathT / 0.6, 0, 1);
    ctx.fillStyle = 'rgba(10,2,8,' + (0.55 * a) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.globalAlpha = a;
    ctx.font = '900 62px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(5,6,12,0.9)';
    ctx.strokeText('刃 折', W / 2, 232);
    ctx.fillStyle = '#e8324f'; ctx.fillText('刃 折', W / 2, 232);
    ctx.font = '700 17px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(235,235,255,0.85)';
    ctx.fillText('坚持到第 ' + this.wave + ' 波　·　斩击 ' + this.hitCount + ' 次　·　断肢 ' + this.limbBreakCount + ' 处', W / 2, 280);
    const p = 0.6 + Math.sin(this.realTime * 4) * 0.35;
    ctx.globalAlpha = a * p;
    ctx.font = '800 19px "Crimson SC", "Trebuchet MS", system-ui, sans-serif';
    ctx.fillStyle = '#ffe9b0';
    ctx.fillText('按 R 或 Enter 再战', W / 2, 350);
    ctx.restore();
  }
};

'use strict';
/* ============================================================
   Boot, buttons, public state API
   ============================================================ */
function buildDOM() {
  const canvas = document.getElementById('game');
  const muteBtn = document.getElementById('muteBtn');
  const fsBtn = document.getElementById('fsBtn');

  const syncMute = () => {
    const muted = Audio_.muted;
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.innerHTML = muted ? '🔇 静音' : '🔊 声音';
    muteBtn.blur();
  };
  Audio_.onToggle = syncMute;
  muteBtn.addEventListener('click', () => { Audio_.unlock(); Audio_.toggleMute(); });
  fsBtn && fsBtn.addEventListener('click', () => {
    /* fullscreen is optional and never forced */
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => { });
    else if (document.exitFullscreen) document.exitFullscreen().catch(() => { });
    fsBtn.blur();
  });

  /* clicking the canvas also starts, unlocks audio */
  canvas.addEventListener('mousedown', () => {
    Audio_.unlock();
    if (!Game.started) Game.startGame();
  });

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  return canvas;
}

window.addEventListener('load', () => {
  const canvas = buildDOM();
  Game.init(canvas);

  /* Public read-only state for the harness */
  const makeState = () => {
    const pl = Game.player;
    const enemyCount = Game.enemies.filter(e => !e.dead && e.hp > 0 && e.state !== 'dying').length;
    const s = {
      ready: !!Game.ready,
      playerAlive: !!(pl && pl.alive),
      enemyCount,
      hitCount: Game.hitCount | 0,
      limbBreakCount: Game.limbBreakCount | 0,
      playing: !!Game.playing
    };
    return Object.freeze(s);
  };
  window.combatBenchState = makeState;
});

</script>
