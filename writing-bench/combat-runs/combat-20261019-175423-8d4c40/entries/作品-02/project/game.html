  :root {
    --ink: #0a0b12;
    --ink2: #12141f;
    --paper: #f2e9d8;
    --crimson: #d63a52;
    --ember: #ff8a5c;
    --gold: #ffd166;
    --ice: #9fe9ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05060a;
    color: #e9eef8;
    font-family: "Segoe UI", 'KirSans', system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(1200px 700px at 50% 8%, #141826 0%, #06070c 62%, #030409 100%);
  }
  #topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0;
    z-index: 30;
    pointer-events: none;
  }
  #mute {
    position: absolute;
    top: 14px;
    right: 16px;
    z-index: 40;
    pointer-events: auto;
    appearance: none;
    border: 1px solid rgba(150, 180, 220, 0.28);
    background: rgba(10, 13, 22, 0.72);
    color: #cfe2f7;
    font: 700 12px/1 "Segoe UI", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.06em;
    padding: 9px 14px 9px 12px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  #mute:hover { background: rgba(24, 32, 48, 0.92); border-color: rgba(180, 210, 250, 0.5); }
  #mute:active { transform: scale(0.96); }
  #mute.off { color: #8d9bb2; border-color: rgba(120, 140, 170, 0.24); }

  #stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: stretch;
    justify-content: center;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    background: #07080d;
    outline: none;
    touch-action: none;
  }

  /* ---------------- start overlay ---------------- */
  #startOverlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    cursor: pointer;
    background:
      radial-gradient(900px 560px at 50% 42%, rgba(28, 34, 54, 0.55), rgba(4, 5, 10, 0.86) 68%, rgba(2, 3, 6, 0.96));
    transition: opacity 0.28s ease;
    padding: 24px;
  }
  #startOverlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .start-title {
    display: flex;
    align-items: center;
    gap: 22px;
    transform: translateY(-6px);
  }
  .start-title .seal {
    display: grid;
    place-items: center;
    width: 78px;
    height: 78px;
    border: 2px solid rgba(214, 58, 82, 0.62);
    border-radius: 50%;
    color: #ffcdae;
    font: 900 40px/1 'KirSerif', serif;
    box-shadow: 0 0 42px rgba(214, 58, 82, 0.24), inset 0 0 26px rgba(214, 58, 82, 0.12);
    animation: sealPulse 3.4s ease-in-out infinite;
  }
  @keyframes sealPulse {
    0%, 100% { box-shadow: 0 0 42px rgba(214,58,82,0.24), inset 0 0 26px rgba(214,58,82,0.12); }
    50% { box-shadow: 0 0 64px rgba(255,140,100,0.34), inset 0 0 34px rgba(214,58,82,0.2); }
  }
  .start-title .jp {
    font: 900 clamp(38px, 7.4vw, 76px)/1 'KirSerif', serif;
    letter-spacing: 0.10em;
    background: linear-gradient(180deg, #fff8ea 0%, #ffd9a0 52%, #ff7a5c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 5px 22px rgba(255, 110, 60, 0.22));
  }
  .start-sub {
    font: 700 clamp(10px, 1.3vw, 13px)/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.52em;
    color: rgba(178, 200, 228, 0.62);
    margin-top: -4px;
    text-indent: 0.52em;
  }
  .start-btn {
    margin-top: 16px;
    appearance: none;
    border: 1px solid rgba(255, 160, 120, 0.55);
    background: linear-gradient(180deg, rgba(70, 26, 34, 0.9), rgba(30, 12, 18, 0.94));
    color: #ffe9d6;
    font: 800 clamp(15px, 1.9vw, 19px)/1 'KirSans', sans-serif;
    letter-spacing: 0.16em;
    padding: 16px 38px;
    border-radius: 3px;
    cursor: pointer;
    box-shadow: 0 12px 38px rgba(214, 58, 82, 0.18), inset 0 1px 0 rgba(255, 200, 170, 0.16);
    transition: transform 0.12s ease, box-shadow 0.18s ease, background 0.18s;
    animation: btnGlow 2.6s ease-in-out infinite;
  }
  .start-btn .key {
    display: inline-block;
    border: 1px solid rgba(255, 210, 180, 0.3);
    border-radius: 3px;
    padding: 4px 8px;
    margin-right: 12px;
    font: 800 11px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.1em;
    color: #ffcfa8;
    vertical-align: 2px;
  }
  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 50px rgba(255, 90, 70, 0.28), inset 0 1px 0 rgba(255, 210, 180, 0.26);
    background: linear-gradient(180deg, rgba(96, 34, 44, 0.94), rgba(40, 15, 22, 0.96));
  }
  .start-btn:active { transform: translateY(0) scale(0.985); }
  @keyframes btnGlow {
    0%, 100% { box-shadow: 0 12px 38px rgba(214, 58, 82, 0.16), inset 0 1px 0 rgba(255, 200, 170, 0.16); }
    50% { box-shadow: 0 14px 54px rgba(255, 110, 70, 0.3), inset 0 1px 0 rgba(255, 200, 170, 0.22); }
  }
  .start-hint {
    margin-top: 22px;
    font: 600 clamp(10px, 1.2vw, 12px)/1.6 'KirSans', 'Segoe UI', sans-serif;
    letter-spacing: 0.14em;
    color: rgba(168, 188, 214, 0.55);
  }
  .start-hint b { color: rgba(255, 200, 160, 0.8); font-weight: 800; }

  body.in-game #startOverlay { opacity: 0; pointer-events: none; }

  /* subtle film grain overlay */
  #grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    opacity: 0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: screen;
  }
  @media (max-width: 640px) {
    .start-title { gap: 14px; }
    .start-title .seal { width: 58px; height: 58px; font-size: 30px; }
    #mute { top: 10px; right: 10px; padding: 7px 11px; font-size: 11px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" tabindex="0" aria-label="断缘傀儡 战斗试玩"></canvas>
    <div id="grain"></div>
    <div id="startOverlay">
      <!-- populated by hud.js for crisp DOM title; canvas also draws its own title underneath -->
    </div>
  </div>
  <div id="topbar">
    <button id="mute" type="button" aria-pressed="false" title="切换音效 (静音)">
      🔊 音效
    </button>
  </div>
</div>
<script>
(function(){
"use strict";
/* ===== js/util.js ===== */
'use strict';
// ---------------------------------------------------------------------------
// Small math / helper library
// ---------------------------------------------------------------------------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const chance = (p) => Math.random() < p;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const sign = (v) => v < 0 ? -1 : 1;
const sq = (v) => v * v;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);

const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outQuart: t => 1 - Math.pow(1 - t, 4),
  inQuart: t => t * t * t * t,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
  outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -9 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
  smooth: t => t * t * (3 - 2 * t),

// Range map with clamping
const mapRange = (v, a, b, c, d) => c + (d - c) * clamp((v - a) / (b - a), 0, 1);

// Angle helpers (radians, screen space: +x right, +y down)
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const angNorm = a => { a %= TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; };
const angDamp = (a, b, lambda, dt) => a + angNorm(b - a) * (1 - Math.exp(-lambda * dt));

// 2-bone IK: hip/shoulder at (hx,hy), target (tx,ty), lengths l1,l2.
// Returns joint position. bend sign flips the elbow/knee direction.
function ik(hx, hy, tx, ty, l1, l2, bend = 1) {
  let dx = tx - hx, dy = ty - hy;
  let d = Math.hypot(dx, dy);
  const maxD = l1 + l2 - 0.001;
  if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
  if (d < 0.001) return { x: hx, y: hy, ex: tx, ey: ty };
  const a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const base = Math.atan2(dy, dx);
  const ang = base + a * bend;
  return { x: hx + Math.cos(ang) * l1, y: hy + Math.sin(ang) * l1, ex: hx + Math.cos(base) * d, ey: hy + Math.sin(base) * d };
}

// Simple 2D value noise for organic sway
function hash2(x, y) {
  let h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return h - Math.floor(h);
}
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

// Format numbers nicely
const fmt = n => n >= 10000 ? (n / 1000).toFixed(1) + 'k' : Math.round(n).toString();

// Deterministic value for visual variety
const hash1 = (n) => { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); };

// Closest point on segment AB to point P
function closestOnSeg(px, py, ax, ay, bx, by) {
  const abx = bx - ax, aby = by - ay;
  const len2 = abx * abx + aby * aby;
  let t = len2 > 0 ? ((px - ax) * abx + (py - ay) * aby) / len2 : 0;
  t = clamp(t, 0, 1);
  return { x: ax + abx * t, y: ay + aby * t, t };
}

// Minimum distance between two segments (returns {d, px, py}) — px,py on segment 2
function segSegDist(ax, ay, bx, by, cx, cy, dx, dy) {
  // Check endpoint projections both ways + intersection fallback
  let best = { d: Infinity, px: cx, py: cy };
  const c1 = closestOnSeg(ax, ay, cx, cy, dx, dy);
  let d = Math.hypot(ax - c1.x, ay - c1.y);
  if (d < best.d) best = { d, px: c1.x, py: c1.y };
  const c2 = closestOnSeg(bx, by, cx, cy, dx, dy);
  d = Math.hypot(bx - c2.x, by - c2.y);
  if (d < best.d) best = { d, px: c2.x, py: c2.y };
  const c3 = closestOnSeg(cx, cy, ax, ay, bx, by);
  d = Math.hypot(c3.x - cx, c3.y - cy);
  if (d < best.d) best = { d, px: c3.x, py: c3.y };
  const c4 = closestOnSeg(dx, dy, ax, ay, bx, by);
  d = Math.hypot(c4.x - dx, c4.y - dy);
  if (d < best.d) best = { d, px: c4.x, py: c4.y };
  // Proper intersection test
  const den = (bx - ax) * (dy - cy) - (by - ay) * (dx - cx);
  if (Math.abs(den) > 1e-6) {
    const t = ((cx - ax) * (dy - cy) - (cy - ay) * (dx - cx)) / den;
    const u = ((cx - ax) * (by - ay) - (cy - ay) * (bx - ax)) / den;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
      const ix = ax + (bx - ax) * t, iy = ay + (by - ay) * t;
      best = { d: 0, px: ix, py: iy };
    }
  }
  return best;
}

function pointSegDist(px, py, ax, ay, bx, by) {
  const c = closestOnSeg(px, py, ax, ay, bx, by);
  return { d: Math.hypot(px - c.x, py - c.y), x: c.x, y: c.y };
}

// Blend two hex colours (#rrggbb) — used for hit flashes / tints
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ar = (pa >> 16) & 255, ag = (pa >> 8) & 255, ab = pa & 255;
  const br = (pb >> 16) & 255, bg = (pb >> 8) & 255, bb = pb & 255;
  const r = Math.round(ar + (br - ar) * t), g = Math.round(ag + (bg - ag) * t), bl = Math.round(ab + (bb - ab) * t);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}

'use strict';
// ---------------------------------------------------------------------------
// Input: keyboard state + buffered actions
// ---------------------------------------------------------------------------
const Input = (() => {
  const held = new Set();
  const pressed = [];          // queue of action names, consumed by game
  const pressedThisFrame = {};
  let anyInput = false;
  let muted = false;

  const KEYMAP = {
    KeyA: 'left', ArrowLeft: 'left',
    KeyD: 'right', ArrowRight: 'right',
    KeyW: 'up', ArrowUp: 'up',
    KeyS: 'down', ArrowDown: 'down',
    Space: 'jump',
    KeyJ: 'light',
    KeyK: 'heavy',
    KeyL: 'dash',
    KeyI: 'manual',
    KeyR: 'skill3',        // 裂空斩 (hold to charge)
    KeyF: 'skill1',        // 千刃风暴
    KeyQ: 'skill2',        // 断界一闪
    KeyU: 'skill4',        // 终式·万刃归一
    KeyT: 'restart',       // restart moved to T (R is now a skill)
    Backspace: 'restart',
    Enter: 'confirm',
    Escape: 'pause',
    NumpadEnter: 'confirm',
  };
  const GAME_CODES = new Set([
    'KeyA','KeyD','KeyW','KeyS','ArrowLeft','ArrowRight','ArrowUp','ArrowDown',
    'Space','KeyJ','KeyK','KeyL','KeyI','KeyF','KeyQ','KeyR','KeyU','KeyT','Backspace','Enter','NumpadEnter',
  ]);

  const down = new Set(); // physical codes currently held
  const buffered = [];    // {action, t}
  const BUFFER_TIME = 0.16;
  let enabled = true;

  function actionFor(e) {
    const a = KEYMAP[e.code];
    if (a) return a;
    // fallback for layouts / repeated events
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft') return 'left';
    if (k === 'd' || k === 'arrowright') return 'right';
    if (k === 'w' || k === 'arrowup') return 'up';
    if (k === 's' || k === 'arrowdown') return 'down';
    if (k === ' ' || e.code === 'Space') return 'jump';
    if (k === 'j') return 'light';
    if (k === 'k') return 'heavy';
    if (k === 'l') return 'dash';
    if (k === 'i') return 'manual';
    if (k === 'r') return 'skill3';
    if (k === 'f') return 'skill1';
    if (k === 'q') return 'skill2';
    if (k === 'u') return 'skill4';
    if (k === 't' || k === 'backspace') return 'restart';
    if (k === 'enter') return 'confirm';
    return null;
  }

  function onKeyDown(e) {
    if (e.code === 'Space' || e.code === 'Tab' || e.code.startsWith('Arrow') || e.code === 'Backspace') {
      // prevent page scroll for gameplay keys even before start
      if (GAME_CODES.has(e.code) || e.code === 'Tab') e.preventDefault();
    }
    const a = actionFor(e);
    if (GAME_CODES.has(e.code)) e.preventDefault();
    if (!a) return;
    if (GAME_CODES.has(e.code)) e.preventDefault();
    anyInput = true;
    if (e.repeat) return;
    down.add(e.code);
    // find best code for action-hold tracking using e.code primarily
    buffer(a);
  }

  function onKeyUp(e) {
    down.delete(e.code);
    if (GAME_CODES.has(e.code)) e.preventDefault();
  }

  function buffer(action) {
    buffered.push({ action, t: 0 });
    if (buffered.length > 24) buffered.shift();
  }

  function clearAll() {
    down.clear();
    buffered.length = 0;
  }

  function heldAction(a) {
    // check any physical code mapped to this action
    for (const code of down) {
      if (KEYMAP[code] === a) return true;
    }
    return false;
  }

  function axisX() {
    let x = 0;
    if (heldAction('left')) x -= 1;
    if (heldAction('right')) x += 1;
    return x;
  }

  // Called by game each frame: returns action if a buffered press exists (consumes)
  function consume(action) {
    for (let i = 0; i < buffered.length; i++) {
      if (buffered[i].action === action && buffered[i].t <= BUFFER_TIME) {
        buffered.splice(i, 1);
        return true;
      }
    }
    return false;
  }
  function peek(action) {
    for (let i = 0; i < buffered.length; i++) {
      if (buffered[i].action === action && buffered[i].t <= BUFFER_TIME) return buffered[i].t;
    }
    return -1;
  }
  function consumeAny(actions) {
    for (const a of actions) if (consume(a)) return a;
    return null;
  }
  function clearBuffer(action) {
    for (let i = buffered.length - 1; i >= 0; i--) if (!action || buffered[i].action === action) buffered.splice(i, 1);
  }

  function update(dt) {
    for (const b of buffered) b.t += dt;
  }

  window.addEventListener('keydown', onKeyDown, { passive: false });
  window.addEventListener('keyup', onKeyUp, { passive: false });
  window.addEventListener('blur', () => clearAll());
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearAll(); });

  return {
    axisX, consume, consumeAny, peek, clearAll, clearBuffer, update, heldAction,
    buffer, get anyInput() { return anyInput; },
    get enabled() { return enabled; }, set enabled(v) { enabled = v; },
  };
})();

'use strict';

// Procedural audio: every sound is synthesized with WebAudio, no assets.

const Sound = (() => {
  let ctx = null;

  let comp = null;

      comp.knee.value = 12;
      comp.ratio.value = 6;

        g.gain.exponentialRampToValueAtTime(0.20, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
        o.connect(g); g.connect(musicBus);
        o.start(t); o.stop(t + 0.34);
        // click
        const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
        o2.type = 'triangle'; o2.frequency.setValueAtTime(1400, t);
        g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(0.05, t + 0.003);
        g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
        o2.connect(g2); g2.connect(musicBus); o2.start(t); o2.stop(t + 0.08);
      }
      // sparse melodic plucks
      if (beatIdx % 8 === 3 || beatIdx % 8 === 6) {
        const n = scale[Math.floor(Math.random() * scale.length)];
        const f = 220 * Math.pow(2, n / 12);
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
        o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 1.3);
      }
      beatIdx++;
      next += 0.46;
      const delayMs = Math.max(20, (next - ctx.currentTime - 0.25) * 1000);
      musicTimer = setTimeout(scheduleBeat, delayMs);
    }
    scheduleBeat();
  }

  function setMuted(v) {
    muted = v;
    if (master) master.gain.setTargetAtTime(v ? 0 : 0.9, ctx.currentTime, 0.02);
    return muted;
  }
  function toggleMuted() { return setMuted(!muted); }

  // duck music slightly during big hits
  function duck(amount = 0.5, dur = 0.3) {
    if (!musicBus || !ready) return;
    const t = ctx.currentTime;
    const cur = musicBus.gain.value;
    musicBus.gain.setValueAtTime(cur, t);
    musicBus.gain.linearRampToValueAtTime(0.32 * amount, t + 0.05);
    musicBus.gain.linearRampToValueAtTime(0.32, t + dur);
  }

  return {
    init, resume, SFX, setMuted, toggleMuted, duck,
    getMasterGain() { return master ? master.gain.value : -1; },
    get muted() { return muted; },
    get ready() { return ready; },
    get ctx() { return ctx; },
  };
})();

'use strict';
// ---------------------------------------------------------------------------
// Particles, sparks, slash ribbons, damage numbers, decals
// ---------------------------------------------------------------------------
class Particles {
  constructor(max = 1400) {
    this.list = [];
    this.max = max;
  }
  add(p) {
    if (this.list.length >= this.max) {
      // replace oldest non-critical
      this.list.shift();
    }
    p.life = p.life ?? 0.5;
    p.maxLife = p.life;
    p.vx = p.vx ?? 0;
    p.vy = p.vy ?? 0;
    p.grav = p.grav ?? 0;
    p.drag = p.drag ?? 0;
    p.size = p.size ?? 3;
    p.rot = p.rot ?? 0;
    p.vr = p.vr ?? 0;
    p.add = p.add ?? false;
    p.type = p.type ?? 'dot';
    p.col = p.col ?? '#fff';
    p.fade = p.fade ?? 1;
    this.list.push(p);
    return p;
  }
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.life -= dt;
      if (p.life <= 0) { L.splice(i, 1); continue; }
      p.vy += p.grav * dt;
      if (p.drag) {
        const d = Math.exp(-p.drag * dt);
        p.vx *= d; p.vy *= d;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.floor !== undefined && p.y > p.floor) {
        p.y = p.floor;
        if (p.bounce && Math.abs(p.vy) > 40) { p.vy *= -p.bounce; p.vx *= 0.6; p.vr *= 0.6; }
        else { p.vy = 0; p.vx *= 0.86; p.vr *= 0.8; }
      }
    }
  }
  draw(ctx) {
    const L = this.list;
    // additive pass first
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < L.length; i++) {
      const p = L[i];
      if (!p.add) continue;
      this._drawOne(ctx, p);
    }
    ctx.restore();
    for (let i = 0; i < L.length; i++) {
      const p = L[i];
      if (p.add) continue;
      this._drawOne(ctx, p);
    }
  }
  _drawOne(ctx, p) {
    const t = clamp(p.life / p.maxLife, 0, 1);
    const a = p.fade === 1 ? t : Math.pow(t, p.fade);
    ctx.globalAlpha = a * (p.alpha ?? 1);
    const s = p.size * (p.grow ? lerp(1, p.grow, 1 - t) : 1);
    switch (p.type) {
      case 'dot':
        ctx.fillStyle = p.col;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.3, s * (0.4 + t * 0.6)), 0, TAU);
        ctx.fill();
        break;
      case 'spark': {
        const len = s * (1.6 + (1 - t) * 2.4);
        ctx.strokeStyle = p.col;
        ctx.lineWidth = Math.max(0.6, s * 0.5 * t);
        ctx.lineCap = 'round';
        ctx.beginPath();
        const vx = p.vx * 0.014, vy = p.vy * 0.014;
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - vx * len, p.y - vy * len);
        ctx.stroke();
        break;
      }
      case 'shard': {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.col;
        ctx.beginPath();
        ctx.moveTo(-s * 0.5, -s * 0.5);
        ctx.lineTo(s * 0.9, 0);
        ctx.lineTo(-s * 0.5, s * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        break;
      }
      case 'petal': {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        const c = p.col;
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.bezierCurveTo(s * 0.9, -s * 0.6, s * 0.7, s * 0.7, 0, s);
        ctx.bezierCurveTo(-s * 0.55, s * 0.5, -s * 0.8, -s * 0.4, 0, -s);
        ctx.fill();
        ctx.restore();
        break;
      }
      case 'streak': {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.strokeStyle = p.col;
        ctx.lineWidth = s * 0.45;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-s * 2.2, 0);
        ctx.lineTo(s * 0.6, 0);
        ctx.stroke();
        ctx.restore();
        break;
      }
      case 'ring': {
        ctx.strokeStyle = p.col;
        ctx.lineWidth = Math.max(0.5, s * 0.14 * t);
        ctx.beginPath();
        ctx.arc(p.x, p.y, s * (1.2 - t * 0.8), 0, TAU);
        ctx.stroke();
        break;
      }
      case 'dust': {
        ctx.fillStyle = p.col;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, s * (1.6 - t * 0.5), s * (0.65 + (1 - t) * 0.3), 0, 0, TAU);
        ctx.fill();
        break;
      }
      case 'smoke': {
        ctx.fillStyle = p.col;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s * (1.4 - t * 0.5), 0, TAU);
        ctx.fill();
        break;
      }
      case 'ember': {
        ctx.fillStyle = p.col;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.4, s * t * (0.6 + 0.4 * Math.sin(p.life * 22 + p.rot))), 0, TAU);
        ctx.fill();
        break;
      }
    }
    ctx.globalAlpha = 1;
  }
}

// Slash ribbon trails swept by a blade.
// Each sample stores the blade's base and tip; we build a tapered ribbon between
// consecutive samples, fading out over its lifetime, drawn additively.
class Slashes {
  constructor() { this.list = []; }
  add(opts) {
    this.list.push({
      samples: [],                               // [{bx,by,tx,ty}]
      life: opts.life ?? 0.20,
      maxLife: opts.life ?? 0.20,
      width: opts.width ?? 26,
      col: opts.col ?? '#ffffff',
      col2: opts.col2 ?? '#ff4d6d',
      follow: opts.follow || null,
      core: opts.core ?? 1,
      grow: opts.grow ?? 0,
    });
    if (this.list.length > 48) this.list.shift();
  }
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const s = this.list[i];
      s.life -= dt;
      if (s.life <= 0) { this.list.splice(i, 1); continue; }
      if (s.follow) {
        const f = s.follow();
        const last = s.samples[s.samples.length - 1];
        const moved = !last || Math.hypot(f.x - last.tx, f.y - last.ty) > 2.2;
        if (moved) {
          s.samples.push({ bx: f.bx, by: f.by, tx: f.x, ty: f.y });
          if (s.samples.length > 26) s.samples.shift();
        }
      }
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const s of this.list) {
      const N = s.samples.length;
      if (N < 2) continue;
      const t = clamp(s.life / s.maxLife, 0, 1);      // 1 -> 0
      const a = Math.pow(t, 0.85);
      // Draw as successive quads between samples with tapering width.
      for (let i = 1; i < N; i++) {
        const p0 = s.samples[i - 1], p1 = s.samples[i];
        const age0 = i / N, age1 = (i + 1) / N;         // 0 = old, 1 = new
        const w0 = s.width * Math.pow(age0, 1.6) * (0.30 + a * 0.55);
        const w1 = s.width * Math.pow(age1, 1.6) * (0.30 + a * 0.55);
        // direction along the blade
        let bx0 = p0.tx - p0.bx, by0 = p0.ty - p0.by;
        let bx1 = p1.tx - p1.bx, by1 = p1.ty - p1.by;
        const l0 = Math.hypot(bx0, by0) || 1, l1 = Math.hypot(bx1, by1) || 1;
        bx0 /= l0; by0 /= l0; bx1 /= l1; by1 /= l1;
        // Perpendicular = sweep direction feel; we expand toward the tip.
        const tipFade = 0.72;
        ctx.beginPath();
        ctx.moveTo(p0.bx - bx0 * w0 * 0.10, p0.by - by0 * w0 * 0.10);
        ctx.lineTo(p0.tx + bx0 * w0 * tipFade, p0.ty + by0 * w0 * tipFade);
        ctx.lineTo(p1.tx + bx1 * w1 * tipFade, p1.ty + by1 * w1 * tipFade);
        ctx.lineTo(p1.bx - bx1 * w1 * 0.10, p1.by - by1 * w1 * 0.10);
        ctx.closePath();
        const edge = age1;
        ctx.globalAlpha = a * edge * 0.30;
        ctx.fillStyle = s.col2;
        ctx.fill();
        // hot core near the blade edge
        ctx.globalAlpha = a * edge * 0.85 * s.core;
        ctx.strokeStyle = s.col;
        ctx.lineWidth = 1.6 + 2.6 * edge * a;
        ctx.beginPath();
        ctx.moveTo(p0.tx, p0.ty);
        ctx.lineTo(p1.tx, p1.ty);
        ctx.stroke();
      }
      // leading edge flash
      const last = s.samples[N - 1];
      const prev = s.samples[N - 2];
      ctx.globalAlpha = a * 0.75;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.2 + 2.5 * a;
      ctx.beginPath();
      ctx.moveTo(prev.tx, prev.ty);
      ctx.lineTo(last.tx, last.ty);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// Floating damage / text popups
class Popups {
  constructor() { this.list = []; }
  add(text, x, y, opts = {}) {
    // nudge apart so limb-break labels and damage numbers never overprint
    let ny = y;
    const isLabel = /[A-Z]{3,}/.test(text);
    for (let pass = 0; pass < 4; pass++) {
      let clash = false;
      for (const q of this.list) {
        if (q.life <= 0.2) continue;
        const bigQ = /[A-Z]{3,}/.test(q.text);
        const sepX = (isLabel || bigQ) ? 120 : 62;
        const sepY = (isLabel || bigQ) ? 30 : 22;
        if (Math.abs(q.x - x) < sepX && Math.abs(q.y - ny) < sepY) { ny -= sepY; clash = true; break; }
      }
      if (!clash) break;
    }
    y = ny;
    this.list.push({
      text, x, y,
      vx: opts.vx ?? rand(-18, 18),
      vy: opts.vy ?? -95,
      life: opts.life ?? 0.75, maxLife: opts.life ?? 0.75,
      size: opts.size ?? 26,
      col: opts.col ?? '#fff',
      crit: opts.crit ?? false,
      shake: opts.shake ?? 0,
      delay: opts.delay ?? 0,
      font: opts.font ?? 'heavy',
    });
    if (this.list.length > 60) this.list.shift();
  }
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.life -= dt;
      if (p.life <= 0) { this.list.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 220 * dt;
      p.vx *= 0.94;
    }
  }
  draw(ctx) {
    for (const p of this.list) {
      if (p.delay > 0) continue;
      const t = 1 - p.life / p.maxLife;
      const pop = t < 0.18 ? ease.outBack(t / 0.18) : 1;
      const a = p.life < 0.25 ? p.life / 0.25 : 1;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y);
      ctx.scale(pop, pop);
      const sz = p.size * (p.crit ? 1.35 : 1);
      ctx.font = `900 ${sz}px "Arial Black", Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(2, sz * 0.16);
      ctx.strokeStyle = 'rgba(12,8,16,0.9)';
      ctx.strokeText(p.text, 0, 0);
      if (p.crit) {
        const g = ctx.createLinearGradient(0, -sz * 0.6, 0, sz * 0.6);
        g.addColorStop(0, '#fff7d6');
        g.addColorStop(0.5, '#ffcf5c');
        g.addColorStop(1, '#ff6a3d');
        ctx.fillStyle = g;
      } else {
        ctx.fillStyle = p.col;
      }
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
  }
}

// Scorch marks / sap splats on the ground
class Decals {
  constructor(max = 90) { this.list = []; this.max = max; }
  add(d) {
    d.life = d.life ?? 14; d.maxLife = d.life;
    d.rot = d.rot ?? rand(0, TAU);
    d.seed = rand(0, 100);
    this.list.push(d);
    if (this.list.length > this.max) this.list.shift();
  }
  update(dt) { for (let i = this.list.length - 1; i >= 0; i--) { const d = this.list[i]; d.life -= dt; if (d.life <= 0) this.list.splice(i, 1); } }
  draw(ctx) {
    for (const d of this.list) {
      const t = clamp(d.life / d.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = Math.min(1, t * 2) * (d.alpha ?? 0.5);
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot);
      ctx.fillStyle = d.col || '#2a0e12';
      ctx.beginPath();
      const n = 7;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU;
        const r = (d.r || 18) * (0.6 + hash1(d.seed + i) * 0.7);
        const x = Math.cos(a) * r, y = Math.sin(a) * r * (d.flat ?? 0.35);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }
}

function sampleKeys(keys, t) {
  let a = keys[0], b = keys[keys.length - 1];
  for (let i = 0; i < keys.length - 1; i++) {
    if (t >= keys[i][0] && t <= keys[i + 1][0]) { a = keys[i]; b = keys[i + 1]; break; }
  }
  const span = Math.max(0.0001, b[0] - a[0]);
  let f = clamp((t - a[0]) / span, 0, 1);
  const e = b[2] || 'smooth';
  f = (ease[e] || ease.smooth)(f);
  const pa = a[1], pb = b[1];
  const o = {};
  for (const k in pa) o[k] = typeof pa[k] === 'number' ? lerp(pa[k], pb[k] ?? pa[k], f) : pa[k];
  return o;
}
