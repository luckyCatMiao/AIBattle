<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>断傀夜行 · Dismantle</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05060e; overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  #game { display: block; position: absolute; inset: 0; }
  #mute {
    position: fixed; top: 10px; right: 12px; z-index: 10;
    width: 40px; height: 40px; border-radius: 10px;
    border: 1px solid rgba(140,190,255,0.35);
    background: rgba(10,14,28,0.65); color: #fff;
    font-size: 19px; cursor: pointer; line-height: 1;
    transition: background 0.15s;
  }
  #mute:hover { background: rgba(40,60,110,0.8); }
  #mute.muted { opacity: 0.55; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="mute" title="静音 (M)">🔊</button>
<script>
// ===== util.js =====
// ---- math / util ----
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const sign = v => v < 0 ? -1 : 1;
const approach = (v, target, step) => v < target ? Math.min(target, v + step) : Math.max(target, v - step);
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
const easeInQuad = t => t * t;
const easeOutBack = t => { const c = 1.70158; const u = t - 1; return 1 + (c + 1) * u * u * u + c * u * u; };
const smoothstep = t => t * t * (3 - 2 * t);
const dist2 = (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; };
const angleLerp = (a, b, t) => {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return a + d * t;
};

// ===== audio.js =====
// ---- audio: all sounds synthesized with WebAudio, no assets ----
'use strict';
class AudioSys {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = false;
    this.chargeNodes = null;
    this._beepAlt = false;
  }
  ensure() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        // gentle limiter so stacked hits don't clip harshly
        const comp = this.ctx.createDynamicsCompressor();
        comp.threshold.value = -18; comp.knee.value = 22; comp.ratio.value = 8;
        this.master.connect(comp); comp.connect(this.ctx.destination);
        // shared noise buffer
        const len = this.ctx.sampleRate;
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { this.ctx = null; return false; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  }
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.5;
  }
  toggleMute() { this.setMuted(!this.muted); return this.muted; }
  _noise(dur, filterType, freq, q, gain, sweepTo) {
    if (!this.ctx || this.muted) return null;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf; src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = filterType; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(30, sweepTo), t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
    return { src, f, g };
  }
  _tone(type, f0, f1, dur, gain, delay) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(20, f0), t);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  // ---------- SFX ----------
  swing(power) { // power 0..1
    const p = clamp(power, 0, 1);
    this._noise(0.1 + p * 0.12, 'bandpass', 2200 - p * 900, 1.2, 0.25 + p * 0.3, 500);
  }
  hitLight() {
    this._noise(0.09, 'lowpass', 3200, 0.8, 0.5, 400);
    this._tone('triangle', 200, 60, 0.1, 0.5);
  }
  hitHeavy() {
    this._noise(0.16, 'lowpass', 2400, 0.8, 0.7, 200);
    this._tone('triangle', 130, 40, 0.2, 0.8);
    this._tone('sine', 60, 30, 0.25, 0.7);
  }
  clang() { // armored deflect
    this._tone('square', 640, 500, 0.06, 0.28);
    this._tone('square', 933, 700, 0.05, 0.2);
    this._noise(0.06, 'highpass', 4000, 1, 0.3);
  }
  limbBreak() {
    this._noise(0.22, 'lowpass', 2600, 1, 0.8, 250);
    this._tone('sawtooth', 240, 45, 0.28, 0.55);
    this._tone('square', 320, 120, 0.1, 0.3);
    this._tone('sine', 90, 35, 0.3, 0.6);
    for (let i = 0; i < 3; i++) this._tone('square', rand(900, 2200), 200, 0.05, 0.12, 0.03 + i * 0.035); // metallic bits
  }
  explosion() {
    this._noise(0.7, 'lowpass', 1400, 0.6, 1.0, 60);
    this._tone('sine', 100, 26, 0.6, 0.9);
    this._tone('sawtooth', 180, 40, 0.3, 0.4);
  }
  jump() { this._tone('sine', 280, 620, 0.1, 0.22); }
  dash() { this._noise(0.16, 'highpass', 900, 0.7, 0.35, 3200); }
  land() { this._noise(0.07, 'lowpass', 900, 0.7, 0.25, 200); }
  shot() {
    this._tone('square', 950, 180, 0.09, 0.3);
    this._noise(0.07, 'highpass', 2600, 1, 0.25);
  }
  boltBreak() { this._tone('square', 1300, 300, 0.06, 0.2); this._noise(0.05, 'highpass', 3000, 1, 0.18); }
  telegraph() { this._tone('square', 1150, 1150, 0.035, 0.16); }
  beep() { // self-destruct alternating
    this._beepAlt = !this._beepAlt;
    this._tone('square', this._beepAlt ? 980 : 1450, 0, 0.09, 0.22);
  }
  hurt() {
    this._tone('sawtooth', 170, 60, 0.18, 0.5);
    this._noise(0.12, 'lowpass', 1200, 0.8, 0.4, 200);
  }
  chargeStart() {
    if (!this.ensure() || this.muted) return;
    this.chargeStop();
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(70, t);
    o.frequency.linearRampToValueAtTime(160, t + 0.9);
    const trem = this.ctx.createOscillator(); trem.frequency.value = 26;
    const tg = this.ctx.createGain(); tg.gain.value = 0.5;
    const g = this.ctx.createGain(); g.gain.value = 0.0;
    g.gain.linearRampToValueAtTime(0.14, t + 0.15);
    trem.connect(tg); tg.connect(g.gain);
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start(t); trem.start(t);
    this.chargeNodes = { o, trem, g };
  }
  chargeStop() {
    if (this.chargeNodes && this.ctx) {
      const { o, trem, g } = this.chargeNodes;
      const t = this.ctx.currentTime;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      o.stop(t + 0.1); trem.stop(t + 0.1);
      this.chargeNodes = null;
    }
  }
  uiConfirm() { this._tone('sine', 520, 780, 0.09, 0.25); this._tone('sine', 780, 1040, 0.1, 0.2, 0.07); }
  uiMove() { this._tone('sine', 700, 900, 0.04, 0.12); }
  stagger() { this._tone('square', 300, 90, 0.2, 0.3); this._noise(0.15, 'bandpass', 700, 2, 0.3, 200); }
  slam() {
    this._noise(0.25, 'lowpass', 1800, 0.7, 0.8, 100);
    this._tone('sine', 80, 28, 0.3, 0.8);
  }
  gameOver() {
    this._tone('sawtooth', 220, 55, 0.9, 0.4);
    this._tone('sine', 110, 40, 1.1, 0.4, 0.1);
  }
}
const AUDIO = new AudioSys();

// ===== input.js =====
// ---- keyboard input ----
'use strict';
const KEYMAP = {
  left: ['KeyA', 'ArrowLeft'],
  right: ['KeyD', 'ArrowRight'],
  jump: ['Space'],
  light: ['KeyJ'],
  heavy: ['KeyK'],
  dash: ['KeyL'],
  special: ['KeyI'],
  restart: ['KeyR'],
  confirm: ['Enter'],
  mute: ['KeyM'],
};
const GAME_CODES = new Set();
for (const k in KEYMAP) KEYMAP[k].forEach(c => GAME_CODES.add(c));
GAME_CODES.add('ArrowUp'); GAME_CODES.add('ArrowDown'); // keep page still

const Input = {
  down: Object.create(null),     // code -> bool
  pressed: Object.create(null),  // code -> bool (consumed per frame)
  init(canvas) {
    window.addEventListener('keydown', e => {
      if (GAME_CODES.has(e.code)) e.preventDefault();
      if (!e.repeat) {
        this.down[e.code] = true;
        this.pressed[e.code] = true;
        AUDIO.ensure(); // first gesture unlocks audio
      }
    });
    window.addEventListener('keyup', e => { this.down[e.code] = false; });
    window.addEventListener('blur', () => this.clearAll());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.clearAll(); });
    canvas.addEventListener('pointerdown', () => { AUDIO.ensure(); });
  },
  clearAll() {
    for (const k in this.down) this.down[k] = false;
    for (const k in this.pressed) this.pressed[k] = false;
  },
  isDown(action) {
    const codes = KEYMAP[action];
    for (let i = 0; i < codes.length; i++) if (this.down[codes[i]]) return true;
    return false;
  },
  wasPressed(action) {
    const codes = KEYMAP[action];
    for (let i = 0; i < codes.length; i++) if (this.pressed[codes[i]]) return true;
    return false;
  },
  endFrame() {
    for (const k in this.pressed) this.pressed[k] = false;
  },
};

// ===== particles.js =====
// ---- particles, debris, trails, shockwaves, floating text ----
'use strict';

class Particles {
  constructor() { this.list = []; }
  spawn(o) {
    if (this.list.length > 900) this.list.splice(0, 60);
    this.list.push(Object.assign({
      x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0,
      life: 0.5, age: 0, size: 3, color: '#fff',
      type: 'spark', // spark | dot | ring | flash
      rot: 0, vr: 0,
    }, o));
  }
  burst(x, y, n, opt) {
    for (let i = 0; i < n; i++) {
      const a = opt.angle !== undefined ? opt.angle + rand(-opt.spread || -0.6, opt.spread || 0.6) : rand(0, TAU);
      const sp = rand(opt.spMin || 60, opt.spMax || 320);
      this.spawn({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        g: opt.g !== undefined ? opt.g : 700,
        drag: opt.drag !== undefined ? opt.drag : 2.2,
        life: rand(opt.lifeMin || 0.2, opt.lifeMax || 0.55),
        size: rand(opt.sizeMin || 1.5, opt.sizeMax || 3.5),
        color: Array.isArray(opt.color) ? pick(opt.color) : (opt.color || '#ffd76a'),
        type: opt.type || 'spark',
      });
    }
  }
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.age += dt;
      if (p.age >= p.life) { L.splice(i, 1); continue; }
      p.vy += p.g * dt;
      if (p.drag) { const d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy *= d; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
  }
  draw(ctx) {
    for (const p of this.list) {
      const t = p.age / p.life;
      const a = 1 - t;
      if (p.type === 'spark') {
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = a;
        ctx.lineWidth = p.size * a + 0.4;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03);
        ctx.stroke();
      } else if (p.type === 'dot') {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = a;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.3, p.size * (1 - t * 0.7)), 0, TAU);
        ctx.fill();
      } else if (p.type === 'flash') {
        ctx.globalAlpha = a * 0.8;
        ctx.fillStyle = p.color;
        const s = p.size * (0.4 + t * 1.2);
        ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
}

// severed limbs / wreck chunks with physics
class DebrisSys {
  constructor() { this.list = []; }
  spawn(x, y, opt) {
    if (this.list.length > 70) this.list.shift();
    this.list.push(Object.assign({
      x, y, vx: rand(-220, 220), vy: rand(-420, -140),
      rot: rand(0, TAU), vr: rand(-12, 12),
      g: 1500, len: 26, thick: 9, hue: 30, metal: '#c9a15a',
      life: 2.6, age: 0, bounces: 2, kind: 'limb', seed: rand(0, 9),
    }, opt));
  }
  update(dt, groundY) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const d = L[i];
      d.age += dt;
      if (d.age >= d.life) { L.splice(i, 1); continue; }
      d.vy += d.g * dt;
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.rot += d.vr * dt;
      if (d.y > groundY - 4) {
        d.y = groundY - 4;
        if (d.bounces > 0 && Math.abs(d.vy) > 60) {
          d.vy = -Math.abs(d.vy) * 0.42;
          d.vx *= 0.6; d.vr *= 0.5; d.bounces--;
        } else { d.vy = 0; d.vx *= 0.86; d.vr *= 0.86; d.g = 0; }
      }
    }
  }
  draw(ctx) {
    for (const d of this.list) {
      const a = clamp((d.life - d.age) / 0.6, 0, 1);
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot);
      ctx.globalAlpha = a;
      if (d.kind === 'hammer') {
        ctx.fillStyle = '#3a3f4d';
        ctx.fillRect(-d.len * 0.4, -d.thick * 0.6, d.len * 0.8, d.thick * 1.2);
        ctx.fillStyle = '#6d7890';
        ctx.fillRect(d.len * 0.25, -d.thick, d.len * 0.3, d.thick * 2);
      } else if (d.kind === 'gun') {
        ctx.fillStyle = '#4a5165';
        ctx.fillRect(-d.len * 0.5, -d.thick * 0.45, d.len, d.thick * 0.9);
        ctx.fillStyle = '#8be9ff';
        ctx.fillRect(d.len * 0.3, -d.thick * 0.25, d.len * 0.18, d.thick * 0.5);
      } else { // mecha limb chunk
        const w = d.len, h = d.thick;
        ctx.fillStyle = d.metal;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-w / 2, -h / 2, w, h, h * 0.45); else ctx.rect(-w / 2, -h / 2, w, h);
        ctx.fill();
        // torn joint
        ctx.fillStyle = '#23283a';
        ctx.beginPath(); ctx.arc(w * 0.42, 0, h * 0.42, 0, TAU); ctx.fill();
        // wires
        ctx.strokeStyle = '#ff5f4a';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(w * 0.42, 0);
        ctx.quadraticCurveTo(w * 0.7, Math.sin(d.seed * 7 + d.age * 20) * 6, w * 0.85, 4);
        ctx.moveTo(w * 0.42, 0);
        ctx.quadraticCurveTo(w * 0.75, -5, w * 0.9, -3);
        ctx.stroke();
        // crack shading
        ctx.strokeStyle = 'rgba(0,0,0,0.45)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-w * 0.3, -h * 0.4); ctx.lineTo(-w * 0.1, 0); ctx.lineTo(-w * 0.25, h * 0.4);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

// ribbon trail for the blade
class Trail {
  constructor() { this.pts = []; }
  push(x1, y1, x2, y2) {
    this.pts.push({ x1, y1, x2, y2, age: 0 });
    if (this.pts.length > 14) this.pts.shift();
  }
  clear() { this.pts.length = 0; }
  update(dt) {
    for (let i = this.pts.length - 1; i >= 0; i--) {
      this.pts[i].age += dt;
      if (this.pts[i].age > 0.22) this.pts.splice(i, 1);
    }
  }
  draw(ctx, color, width) {
    const n = this.pts.length;
    if (n < 2) return;
    for (let i = 1; i < n; i++) {
      const a = this.pts[i], b = this.pts[i - 1];
      const t = 1 - a.age / 0.22;
      ctx.strokeStyle = color;
      ctx.globalAlpha = t * 0.85;
      ctx.lineWidth = Math.max(0.5, width * t * (i / n));
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(a.x1, a.y1); ctx.lineTo(a.x2, a.y2);
      ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2);
      // draw quad as two lines for cheap ribbon
      ctx.moveTo(a.x1, a.y1); ctx.lineTo(a.x2, a.y2);
      ctx.stroke();
      // fill ribbon
      ctx.globalAlpha = t * 0.35;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(a.x1, a.y1); ctx.lineTo(a.x2, a.y2); ctx.lineTo(b.x2, b.y2); ctx.lineTo(b.x1, b.y1);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

// pose snapshots for dash/attack afterimages
class Afterimages {
  constructor() { this.list = []; }
  add(skel, color) {
    this.list.push({ skel: skel, color: color || '#7fd8ff', age: 0, life: 0.28 });
    if (this.list.length > 12) this.list.shift();
  }
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      this.list[i].age += dt;
      if (this.list[i].age > this.list[i].life) this.list.splice(i, 1);
    }
  }
  draw(ctx) {
    for (const a of this.list) {
      const t = 1 - a.age / a.life;
      drawSkeletonGhost(ctx, a.skel, a.color, t * 0.4);
    }
  }
}

class Shockwaves {
  constructor() { this.list = []; }
  spawn(x, y, opt) {
    this.list.push(Object.assign({ x, y, r0: 8, r1: 160, life: 0.35, age: 0, color: '#ffd76a', width: 5, ring: true }, opt));
  }
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const s = this.list[i];
      s.age += dt;
      if (s.age > s.life) this.list.splice(i, 1);
    }
  }
  draw(ctx) {
    for (const s of this.list) {
      const t = s.age / s.life;
      const r = lerp(s.r0, s.r1, easeOutCubic(t));
      ctx.globalAlpha = (1 - t) * 0.9;
      if (s.ring) {
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.width * (1 - t) + 1;
        ctx.beginPath(); ctx.ellipse(s.x, s.y, r, r * 0.45, 0, 0, TAU); ctx.stroke();
      } else { // ground crack flash disc
        ctx.fillStyle = s.color;
        ctx.beginPath(); ctx.ellipse(s.x, s.y, r, r * 0.3, 0, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }
}

class Floaters {
  constructor() { this.list = []; }
  spawn(x, y, txt, color, size) {
    this.list.push({ x: x + rand(-8, 8), y, txt, color: color || '#fff', size: size || 17, age: 0, life: 0.8, vy: -80 });
  }
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const f = this.list[i];
      f.age += dt; f.y += f.vy * dt; f.vy *= (1 - 3 * dt);
      if (f.age > f.life) this.list.splice(i, 1);
    }
  }
  draw(ctx) {
    ctx.textAlign = 'center';
    for (const f of this.list) {
      const t = f.age / f.life;
      const pop = t < 0.15 ? easeOutBack(t / 0.15) : 1;
      ctx.globalAlpha = 1 - t * t;
      ctx.font = `bold ${Math.round(f.size * pop)}px "Segoe UI", "Microsoft YaHei", sans-serif`;
      ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 3;
      ctx.strokeText(f.txt, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.txt, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }
}

// shared fx bundle
class FX {
  constructor() {
    this.particles = new Particles();
    this.debris = new DebrisSys();
    this.shocks = new Shockwaves();
    this.floaters = new Floaters();
    this.trails = []; // per-attacker trails keyed externally
  }
  hitSpark(x, y, heavy, dirX) {
    const n = heavy ? 22 : 10;
    this.particles.burst(x, y, n, {
      angle: dirX > 0 ? 0 : Math.PI, spread: 1.1,
      spMin: heavy ? 140 : 80, spMax: heavy ? 520 : 300,
      color: ['#fff6d8', '#ffd76a', '#ff9a3d', '#ff5f4a'],
      lifeMin: 0.15, lifeMax: heavy ? 0.6 : 0.4,
    });
    this.particles.spawn({ x, y, type: 'flash', size: heavy ? 34 : 18, life: 0.12, color: '#fff' });
  }
  clangSpark(x, y) {
    this.particles.burst(x, y, 8, { spMin: 120, spMax: 380, color: ['#cfe8ff', '#8be9ff', '#fff'], lifeMax: 0.3, g: 500 });
    this.particles.spawn({ x, y, type: 'flash', size: 14, life: 0.08, color: '#bfe9ff' });
  }
  bloodOil(x, y, dirX, n) { // dark ichor + embers for mecha
    this.particles.burst(x, y, n || 8, {
      angle: dirX > 0 ? 0 : Math.PI, spread: 0.9,
      spMin: 60, spMax: 300, color: ['#2b2f3d', '#3d4b8f', '#5560d8', '#ffb347'],
      lifeMin: 0.25, lifeMax: 0.6, g: 900, type: 'dot', sizeMin: 2, sizeMax: 5,
    });
  }
  dust(x, y, n) {
    this.particles.burst(x, y, n || 6, {
      angle: -Math.PI / 2, spread: 1.2, spMin: 30, spMax: 130,
      color: ['#5a5f74', '#454a5e'], lifeMin: 0.3, lifeMax: 0.7, g: -40,
      type: 'dot', sizeMin: 3, sizeMax: 7, drag: 3,
    });
  }
  update(dt, groundY) {
    this.particles.update(dt);
    this.debris.update(dt, groundY);
    this.shocks.update(dt);
    this.floaters.update(dt);
  }
  drawWorld(ctx) {
    this.shocks.draw(ctx);
    this.particles.draw(ctx);
    this.debris.draw(ctx);
  }
}

// ===== rig.js =====
// ---- skeletal rig: FK, procedural poses, character rendering ----
'use strict';

function capsule(ctx, x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}
function jointBall(ctx, x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}

// FK: pose angles in canvas radians. f = facing (+1 right, -1 left)
function computeSkeleton(p, dims, f, px, py) {
  const ta = -Math.PI / 2 + (p.lean || 0); // torso dir (up-ish)
  const dx = Math.cos(ta), dy = Math.sin(ta);
  const pxp = Math.cos(ta + Math.PI / 2), pyp = Math.sin(ta + Math.PI / 2);
  const pelvis = { x: px, y: py };
  const chest = { x: px + dx * dims.torsoLen, y: py + dy * dims.torsoLen };
  const head = {
    x: chest.x + dx * (dims.headR + 3) - Math.sin(p.headTilt || 0) * 2,
    y: chest.y + dy * (dims.headR + 3),
  };
  const shL = { x: chest.x + pxp * dims.shoulderW * 0.5, y: chest.y + pyp * dims.shoulderW * 0.5 };
  const shR = { x: chest.x - pxp * dims.shoulderW * 0.5, y: chest.y - pyp * dims.shoulderW * 0.5 };
  const hipL = { x: pelvis.x + pxp * dims.hipW * 0.5, y: pelvis.y + pyp * dims.hipW * 0.5 };
  const hipR = { x: pelvis.x - pxp * dims.hipW * 0.5, y: pelvis.y - pyp * dims.hipW * 0.5 };
  const mkArm = (sh, a, b) => {
    const el = { x: sh.x + Math.cos(a) * dims.upperArm, y: sh.y + Math.sin(a) * dims.upperArm };
    const ha = { x: el.x + Math.cos(a + b * f) * dims.foreArm, y: el.y + Math.sin(a + b * f) * dims.foreArm };
    return { sh, el, ha };
  };
  const mkLeg = (hip, a, b) => {
    const kn = { x: hip.x + Math.cos(a) * dims.upperLeg, y: hip.y + Math.sin(a) * dims.upperLeg };
    const ft = { x: kn.x + Math.cos(a + b) * dims.lowerLeg, y: kn.y + Math.sin(a + b) * dims.lowerLeg };
    return { hip, kn, ft };
  };
  const armL = mkArm(shL, p.armL.a, p.armL.b);
  const armR = mkArm(shR, p.armR.a, p.armR.b);
  const legL = mkLeg(hipL, p.legL.a, p.legL.b);
  const legR = mkLeg(hipR, p.legR.a, p.legR.b);
  // blade from right hand
  const bl = p.blade || { a: armR.a, len: 46, on: true };
  const bladeBase = { x: armR.ha.x, y: armR.ha.y };
  const bladeTip = { x: bladeBase.x + Math.cos(bl.a) * bl.len, y: bladeBase.y + Math.sin(bl.a) * bl.len };
  return {
    pelvis, chest, head, shL, shR, hipL, hipR, armL, armR, legL, legR,
    ta, f, bladeBase, bladeTip, bladeOn: bl.on, bladeLen: bl.len,
    blade: { a: bl.a, len: bl.len, on: bl.on },
  };
}

function basePose() {
  return {
    crouch: 0, lean: 0, headTilt: 0,
    armL: { a: Math.PI / 2 + 0.25, b: 0.3 },
    armR: { a: Math.PI / 2 - 0.15, b: 0.25 },
    legL: { a: Math.PI / 2, b: 0 },
    legR: { a: Math.PI / 2, b: 0 },
    blade: { a: Math.PI / 2, len: 46, on: true },
  };
}
function lerpPose(a, b, t) {
  const o = basePose();
  o.crouch = lerp(a.crouch, b.crouch, t);
  o.lean = lerp(a.lean, b.lean, t);
  o.headTilt = lerp(a.headTilt, b.headTilt, t);
  for (const k of ['armL', 'armR', 'legL', 'legR']) {
    o[k].a = angleLerp(a[k].a, b[k].a, t);
    o[k].b = angleLerp(a[k].b, b[k].b, t);
  }
  o.blade.a = angleLerp(a.blade.a, b.blade.a, t);
  o.blade.len = lerp(a.blade.len, b.blade.len, t);
  o.blade.on = t < 0.5 ? a.blade.on : b.blade.on;
  return o;
}
// mirror a facing-right-space pose for left-facing (flip x: a -> PI - a)
function mirrorPose(p) {
  const o = basePose();
  o.crouch = p.crouch;
  o.lean = -p.lean;
  o.headTilt = -p.headTilt;
  for (const k of ['armL', 'armR', 'legL', 'legR']) {
    o[k].a = Math.PI - p[k].a;
    o[k].b = -p[k].b;
  }
  o.blade.a = Math.PI - p.blade.a;
  o.blade.len = p.blade.len;
  o.blade.on = p.blade.on;
  return o;
}

// simple line-render of a skeleton snapshot (afterimages)
function drawSkeletonGhost(ctx, s, color, alpha) {
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(s.pelvis.x, s.pelvis.y); ctx.lineTo(s.chest.x, s.chest.y);
  ctx.moveTo(s.armL.sh.x, s.armL.sh.y); ctx.lineTo(s.armL.el.x, s.armL.el.y); ctx.lineTo(s.armL.ha.x, s.armL.ha.y);
  ctx.moveTo(s.armR.sh.x, s.armR.sh.y); ctx.lineTo(s.armR.el.x, s.armR.el.y); ctx.lineTo(s.armR.ha.x, s.armR.ha.y);
  ctx.moveTo(s.legL.hip.x, s.legL.hip.y); ctx.lineTo(s.legL.kn.x, s.legL.kn.y); ctx.lineTo(s.legL.ft.x, s.legL.ft.y);
  ctx.moveTo(s.legR.hip.x, s.legR.hip.y); ctx.lineTo(s.legR.kn.x, s.legR.kn.y); ctx.lineTo(s.legR.ft.x, s.legR.ft.y);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---------------- player rendering ----------------
function drawPlayer(ctx, pl, skel) {
  const flash = pl.flashT > 0;
  const body = flash ? '#ffffff' : '#1d2233';
  const cloth = flash ? '#ffffff' : '#c8352f';
  const trim = flash ? '#ffffff' : '#e8b64c';
  const skin = flash ? '#ffffff' : '#e8d5b5';
  // scarf (behind body): chain from neck backwards
  ctx.strokeStyle = flash ? '#fff' : '#b02a26';
  ctx.lineCap = 'round';
  for (let i = 0; i < pl.scarf.length - 1; i++) {
    const a = pl.scarf[i], b = pl.scarf[i + 1];
    ctx.lineWidth = 7 * (1 - i / pl.scarf.length) + 1.5;
    ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // legs
  capsule(ctx, skel.legL.hip.x, skel.legL.hip.y, skel.legL.kn.x, skel.legL.kn.y, 7, body);
  capsule(ctx, skel.legL.kn.x, skel.legL.kn.y, skel.legL.ft.x, skel.legL.ft.y, 6, body);
  capsule(ctx, skel.legR.hip.x, skel.legR.hip.y, skel.legR.kn.x, skel.legR.kn.y, 7, body);
  capsule(ctx, skel.legR.kn.x, skel.legR.kn.y, skel.legR.ft.x, skel.legR.ft.y, 6, body);
  // boots
  ctx.fillStyle = flash ? '#fff' : '#12141f';
  for (const ft of [skel.legL.ft, skel.legR.ft]) {
    ctx.beginPath();
    ctx.ellipse(ft.x + skel.f * 3, ft.y - 2, 6, 3.5, 0, 0, TAU);
    ctx.fill();
  }
  // torso (tapered quad)
  const c = skel.chest, pv = skel.pelvis, pp = { x: Math.cos(skel.ta + Math.PI / 2), y: Math.sin(skel.ta + Math.PI / 2) };
  ctx.fillStyle = cloth;
  ctx.beginPath();
  ctx.moveTo(c.x + pp.x * 9, c.y + pp.y * 9);
  ctx.lineTo(c.x - pp.x * 9, c.y - pp.y * 9);
  ctx.lineTo(pv.x - pp.x * 6.5, pv.y - pp.y * 6.5);
  ctx.lineTo(pv.x + pp.x * 6.5, pv.y + pp.y * 6.5);
  ctx.closePath(); ctx.fill();
  // belt
  ctx.strokeStyle = trim; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(pv.x + pp.x * 7, pv.y + pp.y * 7);
  ctx.lineTo(pv.x - pp.x * 7, pv.y - pp.y * 7);
  ctx.stroke();
  // left arm
  capsule(ctx, skel.armL.sh.x, skel.armL.sh.y, skel.armL.el.x, skel.armL.el.y, 6, body);
  capsule(ctx, skel.armL.el.x, skel.armL.el.y, skel.armL.ha.x, skel.armL.ha.y, 5, body);
  // head
  const hd = skel.head;
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(hd.x, hd.y, 8.5, 0, TAU); ctx.fill();
  // hair / band
  ctx.fillStyle = flash ? '#fff' : '#14161f';
  ctx.beginPath(); ctx.arc(hd.x - skel.f * 1.5, hd.y - 2.5, 8, Math.PI, TAU); ctx.fill();
  ctx.fillRect(hd.x - skel.f * 9, hd.y - 4.5, skel.f * 18, 3);
  // eye
  ctx.fillStyle = flash ? '#fff' : '#0c0e16';
  ctx.beginPath(); ctx.arc(hd.x + skel.f * 3.5, hd.y + 0.5, 1.4, 0, TAU); ctx.fill();
  // right arm + katana
  capsule(ctx, skel.armR.sh.x, skel.armR.sh.y, skel.armR.el.x, skel.armR.el.y, 6, body);
  capsule(ctx, skel.armR.el.x, skel.armR.el.y, skel.armR.ha.x, skel.armR.ha.y, 5, body);
  if (skel.bladeOn) {
    const b = skel.bladeBase, t = skel.bladeTip;
    // glow
    ctx.save();
    ctx.shadowColor = '#9fe8ff'; ctx.shadowBlur = pl.chargeGlow > 0 ? 18 + pl.chargeGlow * 22 : 10;
    const grad = ctx.createLinearGradient(b.x, b.y, t.x, t.y);
    if (pl.chargeGlow > 0) {
      grad.addColorStop(0, '#fff'); grad.addColorStop(0.5, '#ffe9a8'); grad.addColorStop(1, '#ff9a3d');
    } else {
      grad.addColorStop(0, '#dff6ff'); grad.addColorStop(1, '#8be9ff');
    }
    ctx.strokeStyle = grad;
    ctx.lineWidth = pl.chargeGlow > 0 ? 4.5 : 3;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y); ctx.stroke();
    ctx.restore();
    // hilt
    capsule(ctx, skel.armR.ha.x, skel.armR.ha.y, b.x, b.y, 3.5, '#3a2b1c');
  }
  // charge aura
  if (pl.chargeGlow > 0) {
    ctx.globalAlpha = pl.chargeGlow * 0.5;
    ctx.strokeStyle = '#ffd76a';
    ctx.lineWidth = 2;
    const r = 20 + pl.chargeGlow * 26 + Math.sin(pl.animT * 30) * 3;
    ctx.beginPath(); ctx.arc(skel.chest.x, skel.chest.y, r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

// ---------------- enemy rendering ----------------
function drawEnemy(ctx, e, skel) {
  const flash = e.flashT > 0;
  const armor = flash ? '#ffffff' : e.T.color.armor;
  const dark = flash ? '#dfe6ff' : e.T.color.dark;
  const glow = flash ? '#ffffff' : e.T.color.glow;
  const scale = e.scale || 1;
  const broken = e.broken;
  // legs (skip broken)
  const legDraw = (leg, isBroken) => {
    if (isBroken) {
      // torn stump
      capsule(ctx, leg.hip.x, leg.hip.y, leg.kn.x, leg.kn.y, 7 * scale, dark);
      ctx.strokeStyle = '#ff5f4a'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(leg.kn.x, leg.kn.y);
      ctx.lineTo(leg.kn.x + rand(-4, 4), leg.kn.y + rand(2, 7)); ctx.stroke();
      return;
    }
    capsule(ctx, leg.hip.x, leg.hip.y, leg.kn.x, leg.kn.y, 7 * scale, armor);
    capsule(ctx, leg.kn.x, leg.kn.y, leg.ft.x, leg.ft.y, 6 * scale, dark);
    jointBall(ctx, leg.kn.x, leg.kn.y, 3 * scale, dark);
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.ellipse(leg.ft.x + skel.f * 3 * scale, leg.ft.y - 2, 6 * scale, 3.5 * scale, 0, 0, TAU); ctx.fill();
  };
  legDraw(skel.legL, broken.legL);
  legDraw(skel.legR, broken.legR);
  // torso: mecha chest plate
  const c = skel.chest, pv = skel.pelvis;
  const pp = { x: Math.cos(skel.ta + Math.PI / 2), y: Math.sin(skel.ta + Math.PI / 2) };
  const w = 12 * scale;
  ctx.fillStyle = armor;
  ctx.beginPath();
  ctx.moveTo(c.x + pp.x * w, c.y + pp.y * w);
  ctx.lineTo(c.x - pp.x * w, c.y - pp.y * w);
  ctx.lineTo(pv.x - pp.x * w * 0.75, pv.y - pp.y * w * 0.75);
  ctx.lineTo(pv.x + pp.x * w * 0.75, pv.y + pp.y * w * 0.75);
  ctx.closePath(); ctx.fill();
  // chest core (glow, dims when staggered)
  ctx.save();
  ctx.shadowColor = glow; ctx.shadowBlur = 8;
  ctx.fillStyle = glow;
  ctx.globalAlpha = e.staggerT > 0 ? 0.9 : 0.55 + Math.sin(e.animT * 4) * 0.15;
  ctx.beginPath(); ctx.arc(c.x, c.y, 4.5 * scale, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
  // cracks as damage accumulates
  if (e.dmgVis > 0.25 && !flash) {
    ctx.strokeStyle = 'rgba(10,10,16,0.8)';
    ctx.lineWidth = 1.3;
    const n = Math.floor(e.dmgVis * 4);
    for (let i = 0; i < n; i++) {
      const t0 = 0.2 + i * 0.2;
      const bx = lerp(pv.x, c.x, t0), by = lerp(pv.y, c.y, t0);
      ctx.beginPath();
      ctx.moveTo(bx + pp.x * w * 0.6, by + pp.y * w * 0.6);
      ctx.lineTo(bx, by + 4);
      ctx.lineTo(bx - pp.x * w * 0.5, by + 1);
      ctx.stroke();
    }
  }
  // head (skip if broken)
  if (!broken.head) {
    const hd = skel.head;
    ctx.fillStyle = armor;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(hd.x - 8 * scale, hd.y - 8 * scale, 16 * scale, 15 * scale, 3 * scale);
    else ctx.rect(hd.x - 8 * scale, hd.y - 8 * scale, 16 * scale, 15 * scale);
    ctx.fill();
    ctx.fillStyle = dark;
    ctx.fillRect(hd.x - 8 * scale, hd.y - 9 * scale, 16 * scale, 3 * scale);
    // eye: flares during telegraph
    ctx.save();
    const tele = e.telegraphGlow || 0;
    ctx.shadowColor = tele > 0 ? '#ff3b30' : glow;
    ctx.shadowBlur = 6 + tele * 14;
    ctx.fillStyle = tele > 0 ? '#ff5148' : glow;
    ctx.beginPath(); ctx.arc(hd.x + skel.f * 3 * scale, hd.y - 1 * scale, (2.2 + tele * 2) * scale, 0, TAU); ctx.fill();
    ctx.restore();
  } else { // headless: exposed neck wires
    const hd = skel.head;
    ctx.strokeStyle = '#ff5f4a'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(skel.chest.x, skel.chest.y);
    ctx.lineTo(hd.x + Math.sin(e.animT * 9) * 4, hd.y - 6);
    ctx.moveTo(skel.chest.x, skel.chest.y);
    ctx.lineTo(hd.x - 3, hd.y - 8 + Math.cos(e.animT * 7) * 3);
    ctx.stroke();
  }
  // arms + weapons
  const armDraw = (arm, isBroken, isRight) => {
    if (isBroken) {
      capsule(ctx, arm.sh.x, arm.sh.y, arm.el.x, arm.el.y, 6 * scale, dark);
      ctx.strokeStyle = '#ff5f4a'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(arm.el.x, arm.el.y);
      ctx.lineTo(arm.el.x + rand(-4, 4), arm.el.y + rand(2, 6)); ctx.stroke();
      return;
    }
    capsule(ctx, arm.sh.x, arm.sh.y, arm.el.x, arm.el.y, 6 * scale, armor);
    capsule(ctx, arm.el.x, arm.el.y, arm.ha.x, arm.ha.y, 5 * scale, dark);
    jointBall(ctx, arm.el.x, arm.el.y, 3 * scale, dark);
    // weapon from right hand
    if (isRight && e.weapon === 'blade') {
      const b = arm.ha;
      const a = skel.blade.a;
      ctx.save();
      ctx.shadowColor = glow; ctx.shadowBlur = 6;
      ctx.strokeStyle = flash ? '#fff' : '#d9e2f2';
      ctx.lineWidth = 3 * scale;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x + Math.cos(a) * 30 * scale, b.y + Math.sin(a) * 30 * scale);
      ctx.stroke();
      ctx.restore();
    }
    if (isRight && e.weapon === 'hammer' && e.hammerUp) {
      const b = arm.ha;
      const a = skel.blade.a;
      const hx = b.x + Math.cos(a) * 14 * scale, hy = b.y + Math.sin(a) * 14 * scale;
      ctx.save();
      ctx.translate(hx, hy); ctx.rotate(a);
      ctx.fillStyle = dark;
      ctx.fillRect(-6 * scale, -16 * scale, 12 * scale, 20 * scale);
      ctx.fillStyle = flash ? '#fff' : '#6d7890';
      ctx.fillRect(-14 * scale, -24 * scale, 28 * scale, 14 * scale);
      ctx.strokeStyle = 'rgba(255,90,60,0.7)'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-14 * scale, -24 * scale, 28 * scale, 14 * scale);
      ctx.restore();
    }
    if (isRight && e.weapon === 'gun') {
      const b = arm.ha;
      const a = skel.blade.a;
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(a);
      ctx.fillStyle = dark;
      ctx.fillRect(-2 * scale, -5 * scale, 22 * scale, 10 * scale);
      ctx.fillStyle = glow;
      ctx.fillRect(16 * scale, -2.5 * scale, 5 * scale, 5 * scale);
      ctx.restore();
    }
  };
  armDraw(skel.armL, broken.armL, false);
  armDraw(skel.armR, broken.armR, true);
  // stagger stars
  if (e.staggerT > 0) {
    ctx.fillStyle = '#ffe9a8';
    for (let i = 0; i < 3; i++) {
      const a = e.animT * 6 + i * TAU / 3;
      ctx.beginPath();
      ctx.arc(skel.head.x + Math.cos(a) * 14, skel.head.y - 12 + Math.sin(a) * 5, 2, 0, TAU);
      ctx.fill();
    }
  }
  // self-destruct warning ring
  if (e.state === 'selfdestruct') {
    const t = 1 - e.stateT / e.sdDur;
    ctx.strokeStyle = `rgba(255,60,40,${0.4 + 0.5 * Math.sin(e.animT * 20)})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(skel.chest.x, skel.chest.y, 18 + t * 26, 0, TAU); ctx.stroke();
  }
}
