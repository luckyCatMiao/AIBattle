<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>斩骸夜行 · 木偶讨伐试炼</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05060c; }
canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
#muteBtn {
  position: fixed; top: 10px; right: 12px; z-index: 10;
  background: rgba(10,12,24,0.72); color: #cfd4ea;
  border: 1px solid rgba(160,170,210,0.35); border-radius: 999px;
  font: 12px/1 "Songti SC","STSong","SimSun",Georgia,serif;
  padding: 7px 14px; cursor: pointer; letter-spacing: 2px;
  user-select: none; -webkit-user-select: none;
}
#muteBtn:hover { background: rgba(30,34,58,0.88); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" title="切换音效">音效 开</button>
<script>

/* ===== 00_core.js ===== */
'use strict';
(function(){
/* ============================================================
   斩骸夜行 —— 00 核心层
   工具 / 全局状态 / 画布 / 相机 / 输入 / 音频合成 / 粒子特效
   ============================================================ */

/* ---------------- 工具 ---------------- */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const eo3 = t => 1 - (1 - t) ** 3;      // easeOutCubic
const ei3 = t => t * t * t;             // easeInCubic
const eo2 = t => 1 - (1 - t) * (1 - t); // easeOutQuad
const sgn = v => (v < 0 ? -1 : 1);
const lerpAng = (a, b, t) => { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return a + d * t; };
function mkSeed(s){ let x = s >>> 0; return () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; }; }
function rr(x, y, w, h, r){ // 圆角矩形路径
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function strokeCap(x1, y1, x2, y2, w, col){ // 圆头粗线（肢体绘制用）
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function inRect(px, py, l, t, r, b){ return px >= l && px <= r && py >= t && py <= b; }

/* ---------------- 世界常量 / 全局状态 ---------------- */
const ARENA_W = 2560;          // 场地宽度（世界单位）
const GROUND_Y = 560;          // 地面（脚底 y）
const G = {
  state: 'title',              // title | play | dead
  time: 0, rtime: 0,           // 模拟时间 / 真实时间
  timeScale: 1, tsTarget: 1, slowmoT: 0,
  hitStop: 0,                  // 命中顿帧（秒，真实时间消耗）
  paused: false,               // 失焦暂停
  combo: 0, comboT: 0, comboShowT: 0,
  gauge: 0, gaugeFull: false,  // 剑气槽
  wave: 0, waveState: 'idle', waveT: 0, pending: [], spawnT: 0,
  kills: 0, maxCombo: 0,
  hits: 0, limbBreaks: 0,      // 真实统计（bench 读取）
  skillUses: { parry: 0, blink: 0, storm: 0, fall: 0, parryWins: 0 },
  moonBoost: 0, flashT: 0, flashCol: '255,235,190',
  enemies: [], hitboxes: [], debris: [], shots: [], shocks: [],
  hurtVig: 0, insightT: 0,
  banner: null,                // {text, sub, t, life}
  running: false,
};

/* ---------------- 画布 ---------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let DPR = 1, CW = 960, CH = 540, viewScale = 1, viewW = 960, viewH = 540;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(320, window.innerWidth || 960);
  const h = Math.max(240, window.innerHeight || 540);
  canvas.width = Math.max(2, Math.round(w * dpr));
  canvas.height = Math.max(2, Math.round(h * dpr));
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  DPR = dpr; CW = w; CH = h;
  // 视野：高度基准 640，窄窗时保证横向至少可见 1000
  viewScale = Math.min(h / 640, w / 1000);
  viewW = w / viewScale; viewH = h / viewScale;
}
window.addEventListener('resize', resize);

/* ---------------- 相机 ---------------- */
const cam = {
  x: 520, y: 470, zoom: 1, zoomP: 0,
  trauma: 0, sx: 0, sy: 0, look: 0, vx: 0,
};
function addShake(a, dirX){ cam.trauma = Math.min(1, cam.trauma + a); if (dirX) cam.shakeDir = dirX; }
cam.shakeDir = 0;
function addZoom(p){ cam.zoomP = Math.max(cam.zoomP, p); }
function doHitStop(d){ G.hitStop = Math.min(0.24, Math.max(G.hitStop, d)); }
function slowmo(dur, scale){ G.slowmoT = Math.max(G.slowmoT, dur); G.tsTarget = scale; }

function updateCamera(dt, rdt){
  const p = P;
  // 前瞻
  const lookTgt = p.facing * 74 + clamp(p.vx * 0.14, -60, 60);
  cam.look += (lookTgt - cam.look) * Math.min(1, rdt * 3.2);
  let tx = p.x + cam.look;
  const halfW = viewW / 2 / (cam.zoom || 1);
  if (ARENA_W > halfW * 2) tx = clamp(tx, halfW - 60, ARENA_W - halfW + 60);
  else tx = ARENA_W / 2;
  cam.x += (tx - cam.x) * Math.min(1, rdt * 7.5);
  // 纵向：跟随玩家高度
  let ty = 468;
  if (p.y < GROUND_Y - 150) ty = 468 - (GROUND_Y - 150 - p.y) * 0.55;
  cam.y += (ty - cam.y) * Math.min(1, rdt * 5);
  // 震屏（创伤平方，快速衰减，克制不连续轰屏）
  cam.trauma = Math.max(0, cam.trauma - rdt * 2.6);
  const amp = cam.trauma * cam.trauma * 26;
  cam.sx = rnd(-1, 1) * amp + cam.shakeDir * amp * 0.4;
  cam.sy = rnd(-1, 1) * amp * 0.8;
  cam.shakeDir *= Math.max(0, 1 - rdt * 10);
  // 变焦冲击
  cam.zoomP = Math.max(0, cam.zoomP - rdt * 3.4);
  cam.zoom = 1 + cam.zoomP * cam.zoomP * 0.07;
}

/* ---------------- 输入 ---------------- */
const KEYMAP = {
  KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
  Space: 'jump', KeyJ: 'atk', KeyK: 'heavy', KeyL: 'dash', KeyI: 'special',
  KeyR: 'restart', Enter: 'confirm', KeyS: 'down', ArrowDown: 'down',
  KeyW: 'up', ArrowUp: 'up', KeyP: 'pause',
  KeyU: 'parry', KeyO: 'blink', KeyH: 'storm', KeyY: 'fall',
};
const held = {};
const buf = [];   // 输入缓冲 {k, t}
let onKeyHook = null;   // 由 game 层注入（开始/重开等）
let onBlurHook = null;

function pushBuf(k){
  buf.push({ k, t: G.rtime });
  if (buf.length > 30) buf.shift();
}
function consume(k, win){
  win = win || 0.17;
  for (let i = 0; i < buf.length; i++){
    if (buf[i].k === k && G.rtime - buf[i].t <= win){ buf.splice(i, 1); return true; }
  }
  return false;
}
function consumeAny(list, win){
  for (const k of list) if (consume(k, win)) return k;
  return null;
}
function purgeBuf(){
  while (buf.length && G.rtime - buf[0].t > 0.4) buf.shift();
}
function clearKeys(){ for (const k in held) held[k] = false; buf.length = 0; }

window.addEventListener('keydown', (e) => {
  const k = KEYMAP[e.code];
  unlockAudio();
  if (G.paused && k){ if (onKeyHook) onKeyHook('resume'); }
  if (!k) return;
  if (e.cancelable) e.preventDefault();   // 阻止页面滚动等默认行为
  if (e.repeat) return;
  held[k] = true;
  pushBuf(k);
  if (onKeyHook) onKeyHook(k);
}, { passive: false });
window.addEventListener('keyup', (e) => {
  const k = KEYMAP[e.code];
  if (!k) return;
  if (e.cancelable) e.preventDefault();
  held[k] = false;
}, { passive: false });
window.addEventListener('blur', () => {
  clearKeys();
  if (onBlurHook) onBlurHook();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ clearKeys(); if (onBlurHook) onBlurHook(); }
});

/* ---------------- 音频（WebAudio 合成） ---------------- */
let actx = null, master = null, muted = false, audioTried = false, noiseBuf = null;
let ambientStarted = false, sfxThisFrame = 0;

function unlockAudio(){
  if (!audioTried){
    audioTried = true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC){
        actx = new AC();
        master = actx.createGain();
        master.gain.value = muted ? 0 : 0.5;
        const comp = actx.createDynamicsCompressor();
        comp.threshold.value = -18; comp.knee.value = 22; comp.ratio.value = 8;
        master.connect(comp); comp.connect(actx.destination);
        const len = Math.floor(actx.sampleRate * 1.2);
        noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
    } catch (err){ actx = null; }
  }
  if (actx && actx.state === 'suspended'){ try { actx.resume(); } catch (err){} }
  if (actx && !ambientStarted) startAmbient();
}
function setMuted(m){
  muted = m;
  if (master) master.gain.value = m ? 0 : 0.5;
}
function tone(o){
  // {type,f,f2,t,v,delay,attack}
  if (!actx || muted) return;
  try {
    const t0 = actx.currentTime + (o.delay || 0);
    const osc = actx.createOscillator(), g = actx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, o.f || 440), t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t0 + (o.t || 0.1));
    const atk = o.attack || 0.004;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.v || 0.2), t0 + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (o.t || 0.1));
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + (o.t || 0.1) + 0.03);
  } catch (err){}
}
function noiz(o){
  // {t,v,f,f2,q,delay,type}
  if (!actx || muted || !noiseBuf) return;
  try {
    const t0 = actx.currentTime + (o.delay || 0);
    const src = actx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    src.playbackRate.value = o.rate || 1;
    const flt = actx.createBiquadFilter();
    flt.type = o.type || 'bandpass';
    flt.frequency.setValueAtTime(Math.max(10, o.f || 1000), t0);
    if (o.f2) flt.frequency.exponentialRampToValueAtTime(Math.max(10, o.f2), t0 + (o.t || 0.1));
    flt.Q.value = o.q === undefined ? 1 : o.q;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.v || 0.2), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (o.t || 0.1));
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + (o.t || 0.1) + 0.05);
  } catch (err){}
}
function sfx(name, a){
  if (!actx || muted) return;
  if (sfxThisFrame > 9) return;
  sfxThisFrame++;
  switch (name){
    case 'swing': noiz({ t: 0.09, v: 0.13, f: 650, f2: 2600, q: 0.9 }); break;
    case 'swingHeavy': noiz({ t: 0.17, v: 0.18, f: 260, f2: 1500, q: 0.8 }); tone({ type: 'triangle', f: 140, f2: 60, t: 0.13, v: 0.1 }); break;
    case 'swingUp': noiz({ t: 0.1, v: 0.12, f: 900, f2: 3200, q: 1.2 }); break;
    case 'hit': tone({ f: 175, f2: 55, t: 0.09, v: 0.3 }); noiz({ t: 0.05, v: 0.2, f: 2400, f2: 700, q: 0.7 }); break;
    case 'hitHeavy': tone({ f: 95, f2: 38, t: 0.2, v: 0.42 }); noiz({ t: 0.11, v: 0.26, f: 900, f2: 180, q: 0.6 }); tone({ type: 'square', f: 230, f2: 90, t: 0.06, v: 0.05 }); break;
    case 'crack': noiz({ t: 0.045, v: 0.3, f: 3400, f2: 1100, q: 0.5 }); tone({ type: 'square', f: 430, f2: 55, t: 0.13, v: 0.15 }); noiz({ t: 0.2, v: 0.11, f: 480, f2: 110, q: 0.7, delay: 0.015 }); break;
    case 'shatter': noiz({ t: 0.05, v: 0.3, f: 3000, f2: 900, q: 0.5 }); tone({ type: 'square', f: 380, f2: 50, t: 0.16, v: 0.14 }); noiz({ t: 0.42, v: 0.2, f: 240, f2: 55, q: 0.5, delay: 0.02 }); tone({ f: 70, f2: 32, t: 0.4, v: 0.32, delay: 0.01 }); break;
    case 'parry': tone({ type: 'triangle', f: 320, f2: 150, t: 0.13, v: 0.1 }); break;
    case 'parryWin': tone({ f: 1560, t: 0.3, v: 0.16 }); tone({ f: 2340, t: 0.36, v: 0.09, delay: 0.02 }); noiz({ t: 0.2, v: 0.1, f: 5000, f2: 9000, q: 0.4 }); break;
    case 'blink': noiz({ t: 0.22, v: 0.17, f: 900, f2: 2600, q: 0.7 }); tone({ f: 220, f2: 70, t: 0.2, v: 0.12 }); break;
    case 'multiCut': noiz({ t: 0.08, v: 0.2, f: 2800, f2: 600, q: 0.6 }); tone({ type: 'square', f: 500, f2: 70, t: 0.1, v: 0.12 }); break;
    case 'storm': noiz({ t: 0.5, v: 0.14, f: 700, f2: 2400, q: 0.6 }); break;
    case 'fallCast': tone({ type: 'triangle', f: 120, f2: 420, t: 0.5, v: 0.09 }); break;
    case 'meteor': tone({ f: 60, f2: 28, t: 0.5, v: 0.55 }); noiz({ t: 0.3, v: 0.3, f: 400, f2: 60, q: 0.5 }); noiz({ t: 0.05, v: 0.3, f: 3200, f2: 900, q: 0.5 }); break;
    case 'dash': noiz({ t: 0.15, v: 0.13, f: 420, f2: 2100, q: 0.8 }); break;
    case 'jump': tone({ type: 'triangle', f: 290, f2: 540, t: 0.09, v: 0.06 }); break;
    case 'land': tone({ f: 130, f2: 55, t: 0.08, v: 0.11 }); noiz({ t: 0.06, v: 0.07, f: 420, f2: 130, q: 0.7 }); break;
    case 'slam': tone({ f: 68, f2: 30, t: 0.34, v: 0.5 }); noiz({ t: 0.2, v: 0.28, f: 300, f2: 60, q: 0.5 }); break;
    case 'draw': tone({ type: 'triangle', f: 170, f2: 470, t: 0.34, v: 0.05 }); break;
    case 'bow': tone({ type: 'triangle', f: 270, f2: 170, t: 0.08, v: 0.11 }); noiz({ t: 0.08, v: 0.1, f: 1900, f2: 500, q: 0.8 }); break;
    case 'insight': tone({ f: 1250, t: 0.2, v: 0.13 }); tone({ f: 1878, t: 0.26, v: 0.07, delay: 0.02 }); noiz({ t: 0.3, v: 0.06, f: 5000, f2: 8000, q: 0.4 }); break;
    case 'hurt': tone({ type: 'square', f: 190, f2: 70, t: 0.13, v: 0.13 }); noiz({ t: 0.09, v: 0.16, f: 800, f2: 200, q: 0.6 }); break;
    case 'charge': tone({ type: 'triangle', f: 90 + (a || 0) * 260, f2: 120 + (a || 0) * 500, t: 0.14, v: 0.05 }); break;
    case 'gauge': tone({ f: 660, t: 0.16, v: 0.09 }); tone({ f: 990, t: 0.22, v: 0.08, delay: 0.07 }); break;
    case 'kill': tone({ f: 140, f2: 42, t: 0.24, v: 0.26 }); noiz({ t: 0.3, v: 0.14, f: 700, f2: 120, q: 0.6 }); break;
    case 'spawn': tone({ type: 'triangle', f: 130, f2: 85, t: 0.09, v: 0.08 }); tone({ type: 'triangle', f: 160, f2: 100, t: 0.08, v: 0.06, delay: 0.09 }); break;
    case 'wave': tone({ f: 82, f2: 46, t: 0.4, v: 0.3 }); noiz({ t: 0.24, v: 0.1, f: 350, f2: 90, q: 0.6 }); break;
    case 'start': tone({ f: 74, f2: 40, t: 0.5, v: 0.4 }); noiz({ t: 0.3, v: 0.16, f: 420, f2: 80, q: 0.6 }); tone({ type: 'triangle', f: 520, f2: 780, t: 0.3, v: 0.05, delay: 0.1 }); break;
    case 'bounce': tone({ type: 'triangle', f: 200, f2: 120, t: 0.06, v: 0.06 }); break;
    case 'death': tone({ f: 200, f2: 40, t: 0.9, v: 0.3, type: 'sawtooth' }); noiz({ t: 0.7, v: 0.2, f: 900, f2: 60, q: 0.4 }); break;
  }
}
function startAmbient(){
  if (!actx || ambientStarted) return;
  ambientStarted = true;
  try {
    // 低频风声
    const src = actx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const flt = actx.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = 320; flt.Q.value = 0.4;
    const g = actx.createGain(); g.gain.value = 0.028;
    const lfo = actx.createOscillator(); lfo.frequency.value = 0.13;
    const lg = actx.createGain(); lg.gain.value = 0.014;
    lfo.connect(lg); lg.connect(g.gain);
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(); lfo.start();
  } catch (err){}
  schedulePluck();
}
function schedulePluck(){
  // 偶发的三味线式拨弦（五声音阶），极轻
  try {
    if (actx && !muted && G.state === 'play'){
      const scale = [196, 220, 262, 294, 330, 392, 440];
      const f = pick(scale) * (Math.random() < 0.3 ? 2 : 1);
      tone({ type: 'triangle', f: f, f2: f * 0.995, t: 0.9, v: 0.035, attack: 0.002 });
      tone({ type: 'sine', f: f * 2, t: 0.5, v: 0.012, delay: 0.01 });
    }
  } catch (err){}
  setTimeout(schedulePluck, rnd(2600, 7000));
}

/* ---------------- 粒子 / 浮动文字 ---------------- */
const parts = [];
function spawnP(o){
  if (parts.length > 720) parts.splice(0, 50);
  parts.push(Object.assign({ t: 0, g: 0, drag: 0, rot: 0, vr: 0, kind: 'spark', size: 3, life: 0.5, col: '#fff', alpha: 1 }, o));
}
function sparks(x, y, n, dir, col, sp){
  for (let i = 0; i < n; i++){
    const a = dir !== undefined ? dir + rnd(-0.75, 0.75) : rnd(0, TAU);
    const v = (sp || 340) * rnd(0.35, 1.25);
    spawnP({ kind: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - rnd(0, 80), g: 420, drag: 2.4,
      life: rnd(0.12, 0.3), size: rnd(1.4, 3.4), col: col || (Math.random() < 0.7 ? '#fff3d8' : '#ffb44d') });
  }
}
function chips(x, y, n, col){
  for (let i = 0; i < n; i++){
    const a = rnd(0, TAU);
    spawnP({ kind: 'chip', x, y, vx: Math.cos(a) * rnd(60, 380), vy: Math.sin(a) * rnd(60, 380) - rnd(40, 190), g: 900, drag: 0.6,
      life: rnd(0.5, 1.1), size: rnd(2, 5.5), rot: rnd(0, TAU), vr: rnd(-14, 14), col: col || '#9c6f4a' });
  }
}
function dust(x, y, n, sc, dir){
  for (let i = 0; i < n; i++){
    const a = dir !== undefined ? rnd(-0.6, 0.6) + (dir > 0 ? 0 : PI) : rnd(0, TAU);
    spawnP({ kind: 'dust', x: x + rnd(-10, 10) * (sc || 1), y: y + rnd(-4, 4), vx: Math.cos(a) * rnd(30, 130) * (sc || 1), vy: -rnd(10, 60) * (sc || 1),
      g: -60, drag: 2.2, life: rnd(0.3, 0.7), size: rnd(5, 13) * (sc || 1), col: '188,196,226' });
  }
}
function ring(x, y, r0, r1, life, col, w){
  spawnP({ kind: 'ring', x, y, r0, r1, life, col: col || '255,240,210', size: w || 3, g: 0 });
}
function flashFx(x, y, r, life, col){
  spawnP({ kind: 'flash', x, y, size: r, life: life || 0.14, col: col || '255,235,190' });
}
function cutLine(x, y, ang, len, life, col){
  spawnP({ kind: 'cut', x, y, rot: ang, size: len, life: life || 0.16, col: col || '#ff4d5e', g: 0 });
}
function ember(x, y, n, col){
  for (let i = 0; i < n; i++){
    spawnP({ kind: 'ember', x, y, vx: rnd(-70, 70), vy: rnd(-140, -20), g: -40, drag: 1.6, life: rnd(0.4, 0.9), size: rnd(1.5, 3), col: col || '#ffc861' });
  }
}
function updateParticles(dt){
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life){ parts.splice(i, 1); continue; }
    if (p.kind === 'ring' || p.kind === 'cut' || p.kind === 'flash' || p.kind === 'crescent') continue;
    p.vy += (p.g || 0) * dt;
    if (p.drag){ p.vx -= p.vx * p.drag * dt; p.vy -= p.vy * p.drag * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'chip' || p.kind === 'shard'){
      p.rot += p.vr * dt;
      if (p.y > GROUND_Y){ p.y = GROUND_Y; p.vy *= -0.4; p.vx *= 0.55; p.vr *= 0.5; if (Math.abs(p.vy) < 40) p.vy = 0; }
    }
  }
}
function drawParticles(){
  for (const p of parts){
    const u = p.t / p.life, al = clamp(1 - u, 0, 1);
    switch (p.kind){
      case 'spark': {
        const l = Math.max(3, Math.hypot(p.vx, p.vy) * 0.045);
        const a = Math.atan2(p.vy, p.vx);
        ctx.globalAlpha = al;
        ctx.strokeStyle = p.col; ctx.lineWidth = p.size * al; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - Math.cos(a) * l, p.y - Math.sin(a) * l); ctx.stroke();
        break;
      }
      case 'chip': case 'shard': {
        ctx.globalAlpha = Math.min(1, al * 1.6);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.col;
        const s = p.size;
        ctx.beginPath(); ctx.moveTo(-s, -s * 0.5); ctx.lineTo(0, -s); ctx.lineTo(s, -s * 0.3); ctx.lineTo(s * 0.6, s * 0.8); ctx.lineTo(-s * 0.7, s * 0.5); ctx.closePath(); ctx.fill();
        ctx.restore();
        break;
      }
      case 'dust': {
        const r = p.size * (0.6 + u * 0.9);
        ctx.globalAlpha = al * 0.24;
        ctx.fillStyle = 'rgb(' + p.col + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
        break;
      }
      case 'ring': {
        const r = lerp(p.r0, p.r1, eo3(u));
        ctx.globalAlpha = al * 0.8;
        ctx.strokeStyle = 'rgba(' + p.col + ',' + al + ')';
        ctx.lineWidth = p.size * al + 0.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, r), 0, TAU); ctx.stroke();
        break;
      }
      case 'flash': {
        ctx.globalAlpha = al * 0.85;
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Math.max(1, p.size * (0.5 + u)));
        grad.addColorStop(0, 'rgba(' + p.col + ',' + (al * 0.9) + ')');
        grad.addColorStop(1, 'rgba(' + p.col + ',0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + u), 0, TAU); ctx.fill();
        break;
      }
      case 'cut': {
        ctx.globalAlpha = al;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        const lg = ctx.createLinearGradient(-p.size / 2, 0, p.size / 2, 0);
        lg.addColorStop(0, 'rgba(255,255,255,0)');
        lg.addColorStop(0.5, p.col);
        lg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = lg; ctx.lineWidth = 2.6 * al + 0.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-p.size / 2, 0); ctx.lineTo(p.size / 2, 0); ctx.stroke();
        ctx.restore();
        break;
      }
      case 'ember': {
        ctx.globalAlpha = al * 0.9;
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + al * 0.6), 0, TAU); ctx.fill();
        break;
      }
      case 'crescent': {
        // 满月斩的月牙刀气
        const grow = eo3(Math.min(1, u * 1.6));
        const R = p.size * grow, fade = u < 0.7 ? 1 : (1 - u) / 0.3;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = fade * 0.9;
        const cg = ctx.createLinearGradient(-R, -R, R, R);
        cg.addColorStop(0, 'rgba(255,240,220,0.95)');
        cg.addColorStop(0.5, p.col);
        cg.addColorStop(1, 'rgba(255,110,120,0.1)');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(0, 0, R, -PI * 0.42, PI * 0.42);
        ctx.arc(R * 0.42, 0, R * 0.86, PI * 0.36, -PI * 0.36, true);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        break;
      }
    }
  }
  ctx.globalAlpha = 1;
}

const texts = [];
function addText(x, y, str, col, size, vy, life){
  texts.push({ x, y, str, col: col || '#fff', size: size || 18, vy: vy === undefined ? -46 : vy, t: 0, life: life || 0.8, scale: 0 });
}
function addDmg(x, y, n, big){
  texts.push({ x: x + rnd(-8, 8), y, str: '' + n, col: big ? '#ffd76a' : '#f4e9d8', size: big ? 21 : 14, vy: -60, t: 0, life: big ? 0.85 : 0.6, scale: 0, dmg: true });
}
function updateTexts(dt){
  for (let i = texts.length - 1; i >= 0; i--){
    const t = texts[i];
    t.t += dt; t.y += t.vy * dt; t.vy += 90 * dt;
    if (t.t >= t.life) texts.splice(i, 1);
  }
}
function drawTexts(){
  for (const t of texts){
    const u = t.t / t.life;
    const al = u < 0.75 ? 1 : 1 - (u - 0.75) / 0.25;
    const sc = t.t < 0.12 ? eo3(t.t / 0.12) * (t.dmg ? 1.25 : 1.15) : (t.dmg ? 1 : 1);
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.scale(sc, sc);
    ctx.globalAlpha = clamp(al, 0, 1);
    ctx.font = '700 ' + t.size + 'px "Songti SC","STSong","SimSun",Georgia,serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillText(t.str, 1.5, 1.5);
    ctx.fillStyle = t.col;
    ctx.fillText(t.str, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}


/* ===== 01_world.js ===== */
'use strict';
/* ============================================================
   斩骸夜行 —— 01 世界层
   背景（夜幕/月/远山/鸟居/灯火）/ 花瓣 / 地面与石台 / 断肢实体 / 弩箭 / 冲击波
   ============================================================ */

/* ---------------- 背景数据（启动时生成一次） ---------------- */
let bgLayers = [], decorTrees = [], lanterns = [], stoneCracks = [], grasses = [];
const PLATFORMS = [
  { x: 560,  y: 420, w: 190, h: 16 },
  { x: 1280, y: 396, w: 230, h: 18 },
  { x: 1980, y: 424, w: 180, h: 16 },
];

function initBackground(){
  const R = mkSeed(20261019);
  // 三层远山剪影
  bgLayers = [];
  const cfg = [
    { f: 0.12, base: 385, amp: 70, col: '#171c30', jag: 9 },
    { f: 0.28, base: 425, amp: 95, col: '#111527', jag: 11 },
    { f: 0.52, base: 470, amp: 120, col: '#0b0e1d', jag: 13 },
  ];
  for (const c of cfg){
    const pts = [];
    const span = ARENA_W * 1.6;
    let x = -span * 0.3;
    while (x < span){
      pts.push({ x, y: c.base - R() * c.amp });
      x += span / c.jag * (0.5 + R());
    }
    bgLayers.push({ ...c, pts, span });
  }
  // 枯树剪影
  decorTrees = [];
  for (let i = 0; i < 9; i++){
    decorTrees.push({ x: R() * ARENA_W, s: 0.6 + R() * 0.9, lean: (R() - 0.5) * 0.5, layer: R() < 0.5 ? 0.62 : 0.82 });
  }
  // 石灯笼
  lanterns = [];
  for (let i = 0; i < 7; i++){
    lanterns.push({ x: 160 + i * (ARENA_W - 320) / 6 + (R() - 0.5) * 60, ph: R() * TAU, layer: 0.94 });
  }
  // 地面裂纹与草
  stoneCracks = [];
  for (let i = 0; i < 42; i++) stoneCracks.push({ x: R() * ARENA_W, y: GROUND_Y + 8 + R() * 60, w: 10 + R() * 46, h: 1 + R() * 2.2, a: 0.05 + R() * 0.1 });
  grasses = [];
  for (let i = 0; i < 46; i++) grasses.push({ x: R() * ARENA_W, h: 4 + R() * 9, ph: R() * TAU });
}

/* ---------------- 花瓣 ---------------- */
let petals = [];
function initPetals(){
  petals = [];
  for (let i = 0; i < 84; i++){
    petals.push({ x: rnd(0, ARENA_W), y: rnd(-100, GROUND_Y), vx: rnd(-26, -6), vy: rnd(18, 52), rot: rnd(0, TAU), vr: rnd(-3, 3), s: rnd(2.2, 4.6), ph: rnd(0, TAU), depth: rnd(0.5, 1.3) });
  }
}
function updatePetals(dt){
  const l = cam.x - viewW / 2 - 60, r = cam.x + viewW / 2 + 60;
  for (const p of petals){
    p.ph += dt * 1.7;
    p.x += (p.vx + Math.sin(p.ph) * 16) * dt;
    p.y += p.vy * dt * (0.6 + Math.sin(p.ph * 0.7) * 0.3);
    p.rot += p.vr * dt;
    if (p.y > GROUND_Y + 8){ p.y = rnd(-140, -20); p.x = rnd(l, r); }
    if (p.x < l) p.x = r - rnd(0, 30);
    if (p.x > r) p.x = l + rnd(0, 30);
  }
}
function petalBlast(x, y, rad, dir){
  for (const p of petals){
    const dx = p.x - x, dy = p.y - y;
    if (dx * dx + dy * dy < rad * rad){
      p.vx += dir * rnd(60, 200); p.vy -= rnd(20, 110);
      p.vr += rnd(-8, 8);
    }
  }
}
function drawPetals(front){
  for (const p of petals){
    if (front ? p.depth < 1 : p.depth >= 1) continue;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot + Math.sin(p.ph) * 0.5);
    ctx.globalAlpha = 0.5 * Math.min(1, p.depth);
    ctx.fillStyle = '#e9a8b8';
    ctx.beginPath();
    ctx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ---------------- 背景绘制 ---------------- */
function drawBackground(rt){
  // 天空
  const sky = ctx.createLinearGradient(0, 0, 0, CH);
  sky.addColorStop(0, '#070912');
  sky.addColorStop(0.45, '#12142a');
  sky.addColorStop(0.8, '#221a38');
  sky.addColorStop(1, '#2e1f36');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, CW, CH);

  // 月（几乎不动；「落月·断罪」施放时月辉增强）
  const mb = 1 + (G.moonBoost || 0) * 0.9;
  const mx = CW * 0.72 - (cam.x - ARENA_W / 2) * 0.012;
  const my = CH * 0.2;
  const mr = Math.min(CW, CH) * 0.13 + 26;
  const mg = ctx.createRadialGradient(mx, my, mr * 0.2, mx, my, mr * 2.6 * mb);
  mg.addColorStop(0, 'rgba(244,236,214,' + Math.min(0.5, 0.22 * mb) + ')');
  mg.addColorStop(1, 'rgba(244,236,214,0)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, my, mr * 2.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#efe6cd';
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(210,200,175,0.5)';
  ctx.beginPath(); ctx.arc(mx - mr * 0.3, my - mr * 0.2, mr * 0.16, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + mr * 0.25, my + mr * 0.28, mr * 0.1, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + mr * 0.05, my - mr * 0.45, mr * 0.07, 0, TAU); ctx.fill();

  // 云带横过月面
  ctx.fillStyle = 'rgba(14,15,30,0.55)';
  ctx.beginPath();
  ctx.ellipse(mx - mr * 0.7, my + mr * 0.15, mr * 1.5, mr * 0.16, -0.06, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(mx + mr * 0.9, my - mr * 0.4, mr * 1.1, mr * 0.1, 0.04, 0, TAU);
  ctx.fill();

  // 远山（视差）
  for (const L of bgLayers){
    const off = cam.x * L.f;
    ctx.fillStyle = L.col;
    ctx.beginPath();
    ctx.moveTo(-60, CH);
    for (const p of L.pts){
      const sx = p.x - off;
      if (sx < -260 || sx > viewW + 260) continue;
      ctx.lineTo(sx, p.y - (cam.y - 470) * L.f * 0.5);
    }
    ctx.lineTo(viewW + 60, CH);
    ctx.closePath();
    ctx.fill();
  }

  // 枯树剪影
  ctx.fillStyle = '#0a0c18';
  for (const t of decorTrees){
    const sx = t.x - cam.x * t.layer + (cam.x - ARENA_W / 2) * t.layer;
    if (sx < -80 || sx > viewW + 80) continue;
    const gy = GROUND_Y + 6 - (cam.y - 470) * t.layer * 0.9;
    ctx.save();
    ctx.translate(sx, gy);
    ctx.rotate(t.lean);
    ctx.scale(t.s, t.s);
    ctx.beginPath();
    ctx.moveTo(-4, 0);
    ctx.lineTo(-2.5, -70);
    ctx.lineTo(-8, -100);
    ctx.lineTo(-3, -104);
    ctx.lineTo(2, -74);
    ctx.lineTo(6, -108);
    ctx.lineTo(12, -112);
    ctx.lineTo(13, -106);
    ctx.lineTo(7, -70);
    ctx.lineTo(4, 0);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-2, -86);
    ctx.lineTo(-24, -108);
    ctx.lineTo(-21, -112);
    ctx.lineTo(0, -94);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // 石灯笼（暖光）
  for (const l of lanterns){
    const sx = l.x - cam.x * l.layer + (cam.x - ARENA_W / 2) * l.layer;
    if (sx < -60 || sx > viewW + 60) continue;
    const gy = GROUND_Y + 4 - (cam.y - 470) * l.layer * 0.9;
    const fl = 0.82 + Math.sin(rt * 5 + l.ph) * 0.1 + Math.sin(rt * 13.7 + l.ph * 3) * 0.05;
    const lg = ctx.createRadialGradient(sx, gy - 34, 2, sx, gy - 34, 46);
    lg.addColorStop(0, 'rgba(255,190,110,' + (0.3 * fl) + ')');
    lg.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(sx, gy - 34, 46, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0d0f1c';
    ctx.fillRect(sx - 3, gy - 26, 6, 26);
    ctx.fillRect(sx - 11, gy - 44, 22, 16);
    ctx.fillStyle = 'rgba(255,196,120,' + (0.85 * fl) + ')';
    ctx.fillRect(sx - 7, gy - 41, 14, 10);
    ctx.fillStyle = '#0d0f1c';
    ctx.beginPath(); ctx.moveTo(sx - 15, gy - 44); ctx.lineTo(sx + 15, gy - 44); ctx.lineTo(sx + 9, gy - 52); ctx.lineTo(sx - 9, gy - 52); ctx.closePath(); ctx.fill();
  }
}

/* ---------------- 地面 / 石台 / 场地边界 ---------------- */
function drawGround(rt){
  // 主地面
  const gg = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 120);
  gg.addColorStop(0, '#232a45');
  gg.addColorStop(0.08, '#151a2e');
  gg.addColorStop(1, '#0a0c16');
  ctx.fillStyle = gg;
  ctx.fillRect(-200, GROUND_Y, ARENA_W + 400, 260);
  // 地表高光线
  ctx.strokeStyle = 'rgba(150,166,220,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-200, GROUND_Y + 1); ctx.lineTo(ARENA_W + 200, GROUND_Y + 1); ctx.stroke();
  // 石缝
  for (const c of stoneCracks){
    ctx.fillStyle = 'rgba(8,10,20,' + c.a + ')';
    ctx.fillRect(c.x, c.y, c.w, c.h);
  }
  // 草
  for (const g of grasses){
    const sway = Math.sin(rt * 2 + g.ph) * 2.4;
    ctx.strokeStyle = 'rgba(96,120,170,0.4)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(g.x, GROUND_Y + 2);
    ctx.quadraticCurveTo(g.x + sway, GROUND_Y - g.h * 0.5, g.x + sway * 2, GROUND_Y - g.h);
    ctx.stroke();
  }
  // 两端鸟居门（出生点）
  for (const gx of [70, ARENA_W - 70]){
    drawTorii(gx, GROUND_Y, 1);
  }
  // 边界雾墙
  for (const [bx, bdir] of [[28, 1], [ARENA_W - 28, -1]]){
    const fg = ctx.createLinearGradient(bx - (bdir > 0 ? 90 : 0), 0, bx + (bdir > 0 ? 0 : 90), 0);
    fg.addColorStop(0, 'rgba(10,12,26,0)');
    fg.addColorStop(1, 'rgba(10,12,26,0.72)');
    ctx.fillStyle = fg;
    ctx.fillRect(bx - (bdir > 0 ? 90 : 0), GROUND_Y - 320, 90, 340);
  }
  // 高台（单向平台）
  for (const p of PLATFORMS){
    const pg = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
    pg.addColorStop(0, '#2c3557');
    pg.addColorStop(0.25, '#1a2140');
    pg.addColorStop(1, '#10132a');
    ctx.fillStyle = pg;
    rr(p.x - p.w / 2, p.y, p.w, p.h + 10, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(160,176,230,0.55)';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(p.x - p.w / 2 + 3, p.y + 1); ctx.lineTo(p.x + p.w / 2 - 3, p.y + 1); ctx.stroke();
    // 支撑石柱
    ctx.fillStyle = 'rgba(18,22,44,0.9)';
    ctx.fillRect(p.x - p.w / 2 + 10, p.y + p.h, 8, GROUND_Y - p.y - p.h);
    ctx.fillRect(p.x + p.w / 2 - 18, p.y + p.h, 8, GROUND_Y - p.y - p.h);
    // 垂落的草
    ctx.strokeStyle = 'rgba(96,120,170,0.3)';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 4; i++){
      const hx = p.x - p.w / 2 + 14 + i * (p.w - 28) / 3;
      ctx.beginPath(); ctx.moveTo(hx, p.y + p.h + 10); ctx.lineTo(hx + Math.sin(rt * 1.6 + i) * 2, p.y + p.h + 16 + (i % 2) * 5); ctx.stroke();
    }
  }
}
function drawTorii(x, gy, s){
  ctx.save();
  ctx.translate(x, gy);
  ctx.scale(s, s);
  ctx.fillStyle = '#251b2e';
  ctx.fillRect(-26, -150, 9, 150);
  ctx.fillRect(17, -150, 9, 150);
  ctx.fillRect(-38, -158, 76, 10);
  ctx.beginPath(); ctx.moveTo(-46, -170); ctx.lineTo(46, -170); ctx.lineTo(40, -160); ctx.lineTo(-40, -160); ctx.closePath(); ctx.fill();
  ctx.fillRect(-7, -140, 14, 6);
  ctx.fillStyle = 'rgba(210,90,110,0.16)';
  ctx.fillRect(-38, -158, 76, 3);
  ctx.restore();
}

/* ---------------- 断肢实体（可见的肢体破坏） ---------------- */
function spawnDebrisPoly(x, y, pts, vx, vy, col, stroke, big){
  G.debris.push({
    x, y, vx, vy, rot: rnd(0, TAU), vr: rnd(-9, 9),
    pts, col, stroke: stroke || '#2b1d12',
    life: rnd(5.5, 7.5), t: 0, landed: false, bounces: 0, hitEnemies: false, big: !!big,
  });
}
function updateDebris(dt){
  for (let i = G.debris.length - 1; i >= 0; i--){
    const d = G.debris[i];
    d.t += dt;
    if (d.t > d.life){ G.debris.splice(i, 1); continue; }
    if (d.landed){
      d.vx *= Math.max(0, 1 - dt * 4);
      d.vr *= Math.max(0, 1 - dt * 4);
      continue;
    }
    d.vy += 1500 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.rot += d.vr * dt;
    // 撞到其他敌人（飞出的肢体有碰撞威力）
    if (!d.hitEnemies && Math.abs(d.vx) + Math.abs(d.vy) > 380){
      for (const e of G.enemies){
        if (e.dead || e.state === 'spawn') continue;
        if (Math.abs(d.x - e.x) < e.w * 0.6 && d.y > e.y - e.h && d.y < e.y){
          d.hitEnemies = true;
          damageEnemyLight(e, 5, sgn(d.vx), d.x, d.y);
          break;
        }
      }
    }
    // 场地侧壁反弹（碎块不飘出场外）
    if (d.x < 34){ d.x = 34; d.vx = Math.abs(d.vx) * 0.5; }
    if (d.x > ARENA_W - 34){ d.x = ARENA_W - 34; d.vx = -Math.abs(d.vx) * 0.5; }
    // 落地
    let floor = GROUND_Y;
    for (const p of PLATFORMS){
      if (Math.abs(d.x - p.x) < p.w / 2 && d.y >= p.y && d.y - d.vy * dt <= p.y + 4) floor = Math.min(floor, p.y);
    }
    if (d.y >= floor){
      d.y = floor;
      if (Math.abs(d.vy) > 120){
        d.vy *= -0.36; d.vx *= 0.6; d.vr *= 0.55; d.bounces++;
        chips(d.x, d.y, d.big ? 5 : 3, d.col);
        dust(d.x, d.y, 3, 0.7, sgn(d.vx));
        if (d.bounces <= 2) sfx('bounce');
      } else {

function spawnBolt(x, y, tx, ty, dmg){
  const a = Math.atan2(ty - y, tx - x);
  const sp = 545;
  G.shots.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, a, dmg, t: 0, dead: false, trail: [] });

}
function updateShots(dt){
  for (let i = G.shots.length - 1; i >= 0; i--){
    const s = G.shots[i];
    s.t += dt;
    if (s.dead || s.t > 5){ G.shots.splice(i, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.trail.push([s.x, s.y]);
    if (s.trail.length > 7) s.trail.shift();
    if (s.x < -60 || s.x > ARENA_W + 60 || s.y > GROUND_Y + 10){
      if (s.y > GROUND_Y){ chips(s.x, GROUND_Y, 3, '#7a5a40'); dust(s.x, GROUND_Y, 3, 0.6, sgn(s.vx)); }
      G.shots.splice(i, 1); continue;
    }
    // 命中玩家（弹反架势中 → 拨挡反弹）
    const p = P;
    if (!p.dead && p.parryT > 0 && !s.friendly &&
        s.x > p.x - 24 && s.x < p.x + 24 && s.y > p.y - p.h - 10 && s.y < p.y + 10){
      s.vx = -s.vx * 1.6;
      s.vy = -Math.abs(s.vy) * 0.6 - 60;
      s.friendly = true;
      s.dmg = 14;
      s.insight = true;
      parrySuccess(null);
      continue;
    }
    if (!p.dead && !s.friendly && p.iFrames <= 0 && p.dashInv <= 0 &&
        s.x > p.x - 16 && s.x < p.x + 16 && s.y > p.y - p.h && s.y < p.y){
      damagePlayer(s.dmg, sgn(s.vx) || 1, { kb: 190 });
      G.shots.splice(i, 1); continue;
    }
    // 反弹的箭矢伤害敌人
    if (s.friendly){
      for (const e of G.enemies){
        if (e.dead) continue;
        if (s.x > e.x - e.w / 2 && s.x < e.x + e.w / 2 && s.y > e.y - e.h && s.y < e.y){
          damageEnemy(e, {
            rect: () => ({ l: s.x - 10, r: s.x + 10, t: s.y - 10, b: s.y + 10 }),
            dmg: s.dmg, kb: 160, kbY: -120, hs: 0.04, partMul: 1,
          });
          G.shots.splice(i, 1);
          break;
        }

    if (p.dashInv > 0 && !s.insight && s.x > p.x - 20 && s.x < p.x + 20 && s.y > p.y - p.h - 8 && s.y < p.y + 8){
      s.insight = true;
      triggerInsight(s.x, s.y);
    }
  }
}

    ctx.globalAlpha = 1;
  }
}

function sampleTrack(tr, u){
  u = clamp(u, 0, 1);
  let a = tr[0], b = tr[tr.length - 1];
  for (let i = 0; i < tr.length - 1; i++){
    if (u >= tr[i].t && u <= tr[i + 1].t){ a = tr[i]; b = tr[i + 1]; break; }
  }
  const span = Math.max(0.0001, b.t - a.t);
  let t = (u - a.t) / span;
  if (b.e === 'i') t = ei3(t);
  else if (b.e === 'o') t = eo3(t);
  return {
    hx: lerp(a.hx, b.hx, t), hy: lerp(a.hy, b.hy, t),
    ba: lerp(a.ba, b.ba, t), lean: lerp(a.lean, b.lean, t),
    dip: lerp(a.dip || 0, b.dip || 0, t),
  };
}

  p.iFrames = Math.max(p.iFrames, 0.4);
  p.skillCd.parry = 0.8;   // 成功后快速返还
  G.skillUses.parryWins++;
  doHitStop(0.16);
  slowmo(0.6, 0.3);
  addShake(0.3);
  sfx('parryWin');
  flashFx(p.x, p.y - 50, 90, 0.22, '220,240,255');
  ring(p.x, p.y - 46, 12, 110, 0.45, '200,230,255', 4);
  ring(p.x, p.y - 46, 6, 60, 0.3, '255,255,255', 3);
  cutLine(p.x, p.y - 46, rnd(-0.4, 0.4), 130, 0.24, '#bfe6ff');
  sparks(p.x, p.y - 46, 14, 0, '#dff0ff', 420);
  addText(p.x, p.y - 104, '弹反', '#bfe6ff', 26, -24, 0.9);
  addGauge(25);
  if (src && !src.dead){
    p.riposteT = 0.13;
    p.riposteTarget = src;
  }
}
function doRiposte(e){
  const p = P;
  const dir = sgn(e.x - p.x) || p.facing;
  // 瞬步到目标面前，拔刀一闪
  p.x = clamp(e.x - dir * 58, 50, ARENA_W - 50);
  if (!e.airborne) p.y = Math.min(p.y, GROUND_Y);
  p.facing = dir;
  p.move = null; p.charging = false; p.diving = false;
  p.sheathT = 0.4;
  sfx('multiCut'); sfx('hitHeavy');
  flashFx(e.x, e.y - e.h / 2, 70, 0.16, '255,240,220');
  cutLine(e.x, e.y - e.h * 0.45, dir > 0 ? 0.2 : PI - 0.2, 150, 0.22, '#ff5a66');
  e.staggerT = Math.max(e.staggerT, 0.8);
  damageEnemy(e, {
    rect: () => ({ l: e.x - 60, r: e.x + 60, t: e.y - e.h - 30, b: e.y + 14 }),
    dmg: 26, kb: 300, kbY: -320, hs: 0.13, heavy: 1, partMul: 3, forceLaunch: 1, riposte: 1,
  });
}

/* O · 瞬影·一閃 —— 墨影穿行，路径上的敌人延迟同时受斩 */
function startBlink(){
  const p = P;
  p.skillCd.blink = 5;
  p.blinkT = 0.17;
  p.blinkDir = held.left ? -1 : held.right ? 1 : p.facing;
  p.facing = p.blinkDir;
  p.blinkHit = new Set();
  p.move = null; p.charging = false; p.diving = false; p.dashT = 0;
  p.state = 'skill';
  G.skillUses.blink++;
  sfx('blink');
  spawnAfterimage();
  dust(p.x, p.y, 4, 0.9, -p.blinkDir);
}

/* H · 樱吹雪 —— 消耗剑气的三段回旋 AoE */
function startStorm(){
  const p = P;
  p.skillCd.storm = 9;
  spendGauge(40);
  p.stormT = 0.7; p.stormTick = 0;
  p.move = null; p.charging = false; p.diving = false;
  p.state = 'skill';
  G.skillUses.storm++;
  sfx('storm');
  addText(p.x, p.y - 112, '樱吹雪', '#ffb3c8', 22, -26, 0.9);
  petalBlast(p.x, p.y - 40, 130, 0);
}
function stormTick(tick){
  const p = P;
  sfx(tick === 3 ? 'swingHeavy' : 'swing');
  ring(p.x, p.y - 40, 20, 150, 0.35, '255,235,210', 3);
  petalBlast(p.x, p.y - 40, 150, 0);
  let hitAny = false;
  for (const e of G.enemies){
    if (e.dead) continue;
    if (Math.abs(e.x - p.x) < 150 && Math.abs((e.y - e.h / 2) - (p.y - 40)) < 130){
      damageEnemy(e, {
        rect: () => ({ l: e.x - 50, r: e.x + 50, t: e.y - e.h, b: e.y }),
        dmg: 10, kb: 140, kbY: tick === 3 ? -300 : -90, hs: 0.045, air: 1, partMul: 1.3,
      });
      hitAny = true;
    }
  }
  if (hitAny) doHitStop(0.05);
  if (tick === 3 && hitAny){ addShake(0.22); addZoom(0.4); }
}

/* Y · 落月·断罪 —— 跃起引满月坠落，大范围砸地击飞 */
function startFall(){
  const p = P;
  p.skillCd.fall = 14;
  p.fallPhase = 1; p.fallT = 0; p.fallRisen = false;
  p.move = null; p.charging = false; p.diving = false; p.dashT = 0;
  p.state = 'skill';
  G.skillUses.fall++;
  sfx('fallCast');
  G.moonBoost = 1;
  flashFx(p.x, p.y - 110, 54, 0.3, '255,230,170');
  spawnP({ kind: 'crescent', x: p.x, y: p.y - 128, rot: p.facing > 0 ? -0.35 : PI + 0.35, size: 34, life: 0.32, t: 0, col: '#ffd76a', g: 0 });
}
function removeFallRise(){
  for (let i = G.hitboxes.length - 1; i >= 0; i--) if (G.hitboxes[i].fallrise) G.hitboxes.splice(i, 1);
}
function fallImpact(){
  const p = P;
  p.fallPhase = 0; p.fallRisen = false;
  removeFallRise();
  const floorY = p.y;
  p.vy = 0; p.vx = p.facing * 100; p.air = false;
  p.landSquash = 1; p.landT = 0.2;
  doHitStop(0.16);
  slowmo(0.7, 0.32);
  addShake(0.5, p.facing);
  addZoom(1);
  sfx('meteor');
  G.moonBoost = 1.2;
  G.flashT = 0.22;
  dust(p.x, floorY, 20, 2.2, 0);
  chips(p.x, floorY, 14, '#5a6284');
  ring(p.x, floorY, 12, 200, 0.5, '255,220,160', 5);
  ring(p.x, floorY, 6, 120, 0.35, '255,250,230', 3);
  flashFx(p.x, floorY - 30, 130, 0.25, '255,225,170');
  spawnP({ kind: 'crescent', x: p.x + p.facing * 30, y: floorY - 40, rot: p.facing > 0 ? 0.35 : PI - 0.35, size: 170, life: 0.4, t: 0, col: '#ffcf70', g: 0 });
  let n = 0;
  for (const e of G.enemies){
    if (e.dead) continue;
    if (Math.abs(e.x - p.x) < 205 && Math.abs(e.y - floorY) < 160){
      n++;
      damageEnemy(e, {
        rect: () => ({ l: e.x - 50, r: e.x + 50, t: e.y - e.h, b: e.y }),
        dmg: 26, kb: 420, kbY: -520, hs: 0.08, heavy: 1, partMul: 3.2, forceLaunch: 1, meteor: 1,
      });
    }
  }
  if (n > 0) sfx('shatter');
}

/* ---------------- 玩家受击 ---------------- */
function damagePlayer(dmg, dir, opts){
  opts = opts || {};
  if (P.dead || P.iFrames > 0 || P.dashInv > 0) return;
  P.hp -= dmg;
  // 连锁受击保护：短时间连吃 3 刀则获得摆脱窗口，避免被围死在墙角无限硬直
  P.hitChain = (P.hitChainT > 0 ? P.hitChain : 0) + 1;
  P.hitChainT = 1.6;
  P.iFrames = P.hitChain >= 3 ? 1.5 : 1.0;
  if (P.hitChain >= 3){ P.hitChain = 0; ring(P.x, P.y - 46, 8, 66, 0.4, '255,150,150', 3); }
  P.hitstun = 0.15;
  P.charging = false;
  P.diving = false;
  P.diveHitbox = false;
  P.parryT = 0; P.blinkT = 0; P.stormT = 0; P.fallPhase = 0; P.fallRisen = false;
  P.riposteT = 0; P.riposteTarget = null;
  removeDiveHitbox();
  removeFallRise();
  P.move = null;
  P.state = 'hurt';
  P.vx = dir * (opts.kb || 240);
  if (opts.vy) P.vy = opts.vy; else if (!P.air) P.vy = -170;
  P.air = true;
  G.hurtVig = 1;
  G.hurtFlash = 0.25;
  addShake(0.24, dir);
  doHitStop(0.06);
  sfx('hurt');
  sparks(P.x, P.y - 50, 7, dir, '#ff6b7a', 300);
  G.combo = 0;
  G.gauge = Math.max(0, G.gauge - 22);
  if (P.hp <= 0){
    P.hp = 0;
    P.dead = true; P.deadT = 0;
    P.state = 'dead';
    slowmo(1.2, 0.28);
    addShake(0.5, dir);
    sfx('death');
    sparks(P.x, P.y - 46, 22, dir, '#ff6b7a', 420);
    ring(P.x, P.y - 46, 10, 120, 0.6, '255,110,120', 4);
    G.state = 'dead';
  }
}

/* ---------------- 玩家更新 ---------------- */
function updatePlayer(dt, rdt){
  const p = P;
  // 计时器
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.iFrames = Math.max(0, p.iFrames - dt);
  p.hitstun = Math.max(0, p.hitstun - dt);
  p.landT = Math.max(0, p.landT - dt);
  p.coyote = Math.max(0, p.coyote - dt);
  p.kiFlash = Math.max(0, p.kiFlash - dt);
  p.hurtFlash = Math.max(0, (p.hurtFlash || 0) - dt);
  if (p.hitChainT > 0){ p.hitChainT -= dt; if (p.hitChainT <= 0) p.hitChain = 0; }
  G.insightT = Math.max(0, G.insightT - dt);
  p.landSquash = Math.max(0, p.landSquash - dt * 6);
  p.skillCd.parry = Math.max(0, p.skillCd.parry - dt);
  p.skillCd.blink = Math.max(0, p.skillCd.blink - dt);
  p.skillCd.storm = Math.max(0, p.skillCd.storm - dt);
  p.skillCd.fall = Math.max(0, p.skillCd.fall - dt);
  p.sheathT = Math.max(0, p.sheathT - dt);

  if (p.dead){
    p.deadT += dt;
    // 倒地滑行
    p.vx *= Math.max(0, 1 - dt * 4);
    physicsStep(p, dt, 0);
    updateScarf(dt, rdt);
    return;
  }

  const canAct = p.hitstun <= 0 && p.dashT <= 0 && !p.diving;

  /* --- 冲刺 --- */
  if (p.dashT > 0){
    p.dashT -= dt;
    p.dashInv = Math.max(0, p.dashInv - dt);
    p.vx = p.dashDir * 640;
    p.vy = 0;
    if (Math.random() < 0.9) spawnAfterimage();
    if (p.dashT <= 0){ p.state = p.air ? 'air' : 'idle'; p.vx = p.dashDir * 250; }
    physicsStep(p, dt, 0);
    updateScarf(dt, rdt);
    return;
  }

  /* --- 坠斩 --- */
  if (p.diving){
    p.diveT += dt;
    p.vx = p.facing * 250;
    p.vy = 780;
    if (!p.diveHitbox){
      p.diveHitbox = true;
      G.hitboxes.push({
        owner: 'p', t: 0, dur: 1.2, dive: true, hit: new Set(),
        rect: function(){
          return { l: p.x - 30, r: p.x + 30, t: p.y - 74, b: p.y + 6 };
        },
        dmg: 16, kb: 130, kbY: 0, hs: 0.1, spike: true, partMul: 2.4, heavy: 1,
      });
    }
    if (Math.random() < 0.7) spawnAfterimage();
    if (!p.air || p.diveT > 1.1){
      diveImpact();
    }
    physicsStep(p, dt, 0);
    updateScarf(dt, rdt);
    return;
  }

  /* --- 弹反成功后的追斩 --- */
  if (p.riposteT > 0){
    p.riposteT -= dt;
    if (p.riposteT <= 0){
      const t = p.riposteTarget;
      p.riposteTarget = null;
      if (t && !t.dead) doRiposte(t);
    }
  }

  /* --- 弹反架势 --- */
  if (p.parryT > 0){
    p.parryT -= dt;
    const mv = (held.right ? 1 : 0) - (held.left ? 1 : 0);
    p.vx = mv * 60;
    if (Math.random() < 0.3) spawnP({ kind: 'ember', x: p.x + rnd(-16, 16), y: p.y - rnd(30, 70), vx: 0, vy: -30, g: 0, drag: 1, life: 0.3, size: 1.8, col: '#bfe6ff' });
    if (p.parryT <= 0) p.state = p.air ? 'air' : 'idle';
    physicsStep(p, dt, mv);
    updateScarf(dt, rdt);
    return;
  }

  /* --- 瞬影·一閃 --- */
  if (p.blinkT > 0){
    p.blinkT -= dt;
    p.vx = p.blinkDir * 2300;
    p.vy = 0;
    p.dashInv = Math.max(p.dashInv, 0.05);
    if (Math.random() < 0.95) spawnAfterimage();
    for (let i = 0; i < 2; i++){
      spawnP({ kind: 'spark', x: p.x - p.blinkDir * rnd(0, 34), y: p.y - rnd(10, 70), vx: -p.blinkDir * rnd(200, 420), vy: rnd(-40, 40), g: 0, drag: 3, life: 0.25, size: rnd(1.5, 3), col: '#25304f' });
    }
    // 收集途经敌人并留下斩痕
    for (const e of G.enemies){
      if (e.dead || p.blinkHit.has(e)) continue;
      if (Math.abs(e.x - p.x) < 64 && Math.abs((e.y - e.h / 2) - (p.y - 42)) < 80){
        p.blinkHit.add(e);
        spawnP({ kind: 'cut', x: e.x, y: e.y - e.h * 0.5, rot: rnd(-0.3, 0.3) + (p.blinkDir > 0 ? 0 : PI), size: 90, life: 0.28, t: 0, col: '#ff4d5e', g: 0 });
      }
    }
    // 穿越时斩落箭矢
    for (let j = G.shots.length - 1; j >= 0; j--){
      const s = G.shots[j];
      if (Math.abs(s.x - p.x) < 50 && s.y > p.y - 80 && s.y < p.y + 10){
        sparks(s.x, s.y, 7, 0, '#ffe2b0', 320);
        G.shots.splice(j, 1);
        addGauge(2);
      }
    }
    if (p.blinkT <= 0){
      p.vx = p.blinkDir * 280;
      p.state = p.air ? 'air' : 'idle';
      if (p.blinkHit && p.blinkHit.size){
        doHitStop(0.14);
        slowmo(0.4, 0.4);
        addShake(0.3, p.blinkDir);
        sfx('multiCut'); sfx('hitHeavy');
        flashFx(p.x, p.y - 46, 60, 0.18, '220,235,255');
        addText(p.x, p.y - 108, '一閃', '#cfe0ff', 22, -26, 0.8);
        for (const e of p.blinkHit){
          if (e.dead) continue;
          const dir = sgn(e.x - p.x) || p.blinkDir;
          cutLine(e.x, e.y - e.h * 0.45, dir > 0 ? 0.15 : PI - 0.15, 120, 0.2, '#ff5a66');
          sparks(e.x, e.y - e.h * 0.45, 8, dir, '#ffe2b0', 380);
          damageEnemy(e, {
            rect: () => ({ l: e.x - 46, r: e.x + 46, t: e.y - e.h, b: e.y }),
            dmg: 20, kb: 260, kbY: -190, hs: 0.05, heavy: 1, partMul: 2.4, air: 1,
          });
        }
      }
      p.blinkHit = new Set();
    }
    physicsStep(p, dt, 0);
    updateScarf(dt, rdt);
    return;
  }

  /* --- 樱吹雪 --- */
  if (p.stormT > 0){
    p.stormT -= dt;
    p.iFrames = Math.max(p.iFrames, 0.07);
    p.vx *= Math.max(0, 1 - dt * 8);
    const elapsed = 0.7 - p.stormT;
    for (let k = 1; k <= 3; k++){
      const tt = 0.1 + (k - 1) * 0.2;
      if (elapsed >= tt && p.stormTick < k){ p.stormTick = k; stormTick(k); }
    }
    // 花瓣涡旋
    for (let i = 0; i < 2; i++){
      const a = G.time * 9 + i * PI;
      const r = 90 - (p.stormT * 90);
      spawnP({ kind: 'ember', x: p.x + Math.cos(a) * r, y: p.y - 40 + Math.sin(a) * r * 0.7 - rnd(0, 30), vx: -Math.sin(a) * 180, vy: Math.cos(a) * 130 - 60, g: 0, drag: 1.5, life: 0.3, size: 2.2, col: '#ffb3c8' });
    }
    sampleTrail();
    if (p.stormT <= 0){ p.state = 'idle'; p.stormTick = 0; }
    physicsStep(p, dt, 0);
    updateScarf(dt, rdt);
    return;
  }

  /* --- 落月·断罪 --- */
  if (p.fallPhase > 0){
    p.fallT += dt;
    p.iFrames = Math.max(p.iFrames, 0.06);
    if (p.fallPhase === 1){
      p.vx *= Math.max(0, 1 - dt * 10);
      if (p.fallT > 0.26){
        p.fallPhase = 2; p.fallT = 0;
        p.vy = -640; p.vx = p.facing * 210; p.air = true;
        dust(p.x, p.y, 8, 1.1, 0);
        addShake(0.15);
        sfx('swingUp');
        addText(p.x, p.y - 116, '落月·断罪', '#ffd76a', 20, -20, 1.0);
      }
    } else if (p.fallPhase === 2){
      if (p.fallT > 0.02 && !p.fallRisen){
        p.fallRisen = true;
        G.hitboxes.push({
          owner: 'p', t: 0, dur: 0.34, fallrise: true, hit: new Set(),
          rect: function(){
            return { l: p.x - 44, r: p.x + 44, t: p.y - 120, b: p.y + 8 };
          },
          dmg: 10, kb: 160, kbY: -420, hs: 0.05, launcher: 1, partMul: 1.6,
        });
      }
      if (p.vy > -60 || p.fallT > 0.42){
        p.fallPhase = 3; p.fallT = 0;
        p.vy = 900; p.vx = p.facing * 150;
        sfx('swingHeavy');
        spawnAfterimage();
      }
    } else if (p.fallPhase === 3){
      if (Math.random() < 0.7) spawnAfterimage();
      if (!p.air || p.fallT > 0.6) fallImpact();
    }
    physicsStep(p, dt, 0);
    updateScarf(dt, rdt);
    return;
  }

  /* --- 蓄力 --- */
  if (p.charging){
    p.chargeT += dt;
    p.chargeTick -= dt;
    if (p.chargeTick <= 0){
      p.chargeTick = 0.11;
      sfx('charge', clamp(p.chargeT / 0.85, 0, 1));
      // 汇聚的剑气粒子
      const hx = p.x + p.facing * 4, hy = p.y - 78;
      spawnP({ kind: 'ember', x: hx + rnd(-46, 46), y: hy + rnd(-40, 40), vx: 0, vy: 0, g: 0, drag: 0, life: 0.18, size: rnd(1.6, 3), col: p.chargeT >= 0.82 ? '#ff5a66' : '#9fd8ff' });
    }
    if (p.chargeT >= 0.82 && !p.chargeFlash){ p.chargeFlash = true; flashFx(p.x, p.y - 76, 34, 0.2, '255,110,120'); sfx('gauge'); }
    if (p.chargeT > 1.5){ releaseCharge(); }
    else if (consume('dash', 0.05) && p.dashCd <= 0){ startDash(); }
    else if (!held.heavy){ releaseCharge(); }
    // 蓄力时缓慢移动
    const mv = (held.right ? 1 : 0) - (held.left ? 1 : 0);
    p.vx = mv * 72;
    if (mv) p.facing = mv;
    physicsStep(p, dt, mv);
    updateScarf(dt, rdt);
    return;
  }

  /* --- 攻击进行中 --- */
  if (p.move){
    const m = MOVES[p.move];
    p.moveT += dt;
    const a0 = m.act[0] * m.dur, a1 = m.act[1] * m.dur;
    const inActive = p.moveT >= a0 && p.moveT <= a1 + 0.05;

    if (inActive && !p.spawnedHit){
      p.spawnedHit = true;
      addPlayerHit(m);
      if (m.crescent) spawnCrescentFx();
    }
    // 突进
    if (p.moveT >= a0 - 0.02 && p.moveT <= a1 + 0.04){
      if (!m.air) p.vx = p.facing * (m.lunge || 0);
      else p.vx = lerp(p.vx, p.facing * 150, dt * 4);
    }
    if (!m.air && p.moveT < a0) p.vx *= Math.max(0, 1 - dt * 12);
    // 刀光采样
    if (inActive || (p.moveT > a0 - 0.05 && p.moveT < a0)) sampleTrail();

    // 恢复期取消/连段
    if (p.moveT > a1 + 0.02){
      let chained = false;
      if (m.next && consume('atk', 0.2)){ startMove(m.next, true); chained = true; }
      else if (consume('dash', 0.05) && p.dashCd <= 0){ startDash(); chained = true; }
      else if (!m.air && consume('jump', 0.08)){ doJump(); chained = true; }
      else if (!m.air && consume('special', 0.12)){ startMove('launch'); chained = true; }
      else if (!m.air && consume('heavy', 0.1) && held.heavy){ startCharge(); chained = true; }
      else if (m.air && p.air && consume('heavy', 0.08) && held.heavy){ startDive(); chained = true; }
      else if (consume('parry', 0.1) && p.skillCd.parry <= 0){ startParry(); chained = true; }
      else if (consume('blink', 0.1) && p.skillCd.blink <= 0){ startBlink(); chained = true; }
      else if (consume('storm', 0.1) && p.skillCd.storm <= 0 && !p.air && G.gauge >= 40){ startStorm(); chained = true; }
      else if (consume('fall', 0.1) && p.skillCd.fall <= 0 && !p.air){ startFall(); chained = true; }
      if (!chained && p.moveT >= m.dur){
        p.move = null;
        p.state = p.air ? 'air' : 'idle';
      }
    }
    physicsStep(p, dt, m.air ? ((held.right ? 1 : 0) - (held.left ? 1 : 0)) * 0.5 : 0);
    updateScarf(dt, rdt);
    return;
  }

  /* --- 自由行动 --- */
  if (canAct){
    // 冲刺
    if (consume('dash', 0.08) && p.dashCd <= 0 && !(p.air && p.airDashed)){
      startDash();
      physicsStep(p, dt, 0);
      updateScarf(dt, rdt);
      return;
    }
    // 跳跃
    if (consume('jump', 0.11)){
      if (!p.air || p.coyote > 0){ doJump(); }
      else if (p.jumps < 1){ doJump(true); }
    }
    // 挑空
    if (!p.air && consume('special', 0.1)){
      startMove('launch');
      physicsStep(p, dt, 0);
      updateScarf(dt, rdt);
      return;
    }
    // 奥义技能
    if (consume('parry', 0.1) && p.skillCd.parry <= 0){ startParry(); physicsStep(p, dt, 0); updateScarf(dt, rdt); return; }
    if (consume('blink', 0.1) && p.skillCd.blink <= 0){ startBlink(); physicsStep(p, dt, 0); updateScarf(dt, rdt); return; }
    if (consume('storm', 0.1) && p.skillCd.storm <= 0 && !p.air && G.gauge >= 40){ startStorm(); physicsStep(p, dt, 0); updateScarf(dt, rdt); return; }
    if (consume('fall', 0.1) && p.skillCd.fall <= 0 && !p.air){ startFall(); physicsStep(p, dt, 0); updateScarf(dt, rdt); return; }
    // 重击（地面蓄力重斩 / 空中坠斩）—— 点按即出重斩，按住蓄力
    if (consume('heavy', 0.1)){
      if (p.air){ startDive(); physicsStep(p, dt, 0); updateScarf(dt, rdt); return; }
      startCharge(); physicsStep(p, dt, 0); updateScarf(dt, rdt); return;
    }
    // 轻击
    if (consume('atk', 0.14)){
      startMove(p.air ? 'a1' : 'l1');
      physicsStep(p, dt, 0);
      updateScarf(dt, rdt);
      return;
    }
  }

  // 移动
  const mv = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  if (p.hitstun <= 0){
    if (mv){
      p.vx += mv * (p.air ? 1700 : 2700) * dt;
      p.vx = clamp(p.vx, -308, 308);
      if (!p.move) p.facing = mv;
    } else {
      p.vx *= Math.max(0, 1 - (p.air ? dt * 1.2 : dt * 11));
      if (Math.abs(p.vx) < 6) p.vx = 0;
    }
  }
  if (!p.move) p.state = p.air ? (Math.abs(p.vy) > 30 ? 'air' : 'air') : (Math.abs(p.vx) > 20 ? 'run' : 'idle');
  if (!p.air && Math.abs(p.vx) > 40 && Math.random() < dt * 6) dust(p.x - p.facing * 8, p.y, 1, 0.5, -p.facing);

  physicsStep(p, dt, mv);
  updateScarf(dt, rdt);
}

function doJump(isDouble){
  const p = P;
  p.vy = isDouble ? -530 : -575;
  p.air = true;
  p.coyote = 0;
  p.jumps = isDouble ? 1 : 0;
  sfx('jump');
  dust(p.x, p.y, 4, 0.7);
  if (isDouble){
    ring(p.x, p.y, 4, 34, 0.3, '170,190,255', 2);
    petalBlast(p.x, p.y, 46, 0);
  }
}

function removeDiveHitbox(){
  for (let i = G.hitboxes.length - 1; i >= 0; i--) if (G.hitboxes[i].dive) G.hitboxes.splice(i, 1);
}
function diveImpact(){
  const p = P;
  p.diving = false;
  p.diveHitbox = false;
  removeDiveHitbox();
  const floorY = p.y;   // 落点（主地面或高台）
  p.vy = 0; p.air = false;
  p.vx = p.facing * 120;
  p.landT = 0.16; p.landSquash = 1;
  sfx('slam');
  addShake(0.3, p.facing);
  doHitStop(0.05);
  dust(p.x, floorY, 12, 1.5, 0);
  ring(p.x, floorY, 10, 120, 0.45, '255,220,170', 4);
  chips(p.x, floorY, 8, '#5a6284');
  // 落地冲击伤害附近地面敌人
  for (const e of G.enemies){
    if (e.dead || e.state === 'spawn') continue;
    if (!e.airborne && Math.abs(e.x - p.x) < 130 && Math.abs(e.y - floorY) < 30){
      damageEnemyLight(e, 8, sgn(e.x - p.x) || 1, e.x, e.y - 20);
    }
  }
}

function physicsStep(p, dt, mv){
  p.lastVy = p.vy;
  if (p.dashT > 0){ /* 冲刺中无重力 */ }
  else p.vy += 1500 * dt;
  p.vy = Math.min(p.vy, 980);
  const prevY = p.y;
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  // 边界
  if (p.x < 40){ p.x = 40; p.vx = Math.max(0, p.vx); }
  if (p.x > ARENA_W - 40){ p.x = ARENA_W - 40; p.vx = Math.min(0, p.vx); }
  // 地面
  let landed = false;
  if (p.y >= GROUND_Y){
    p.y = GROUND_Y;
    landed = true;
  } else if (p.vy > 0){
    // 单向高台
    for (const plat of PLATFORMS){
      if (Math.abs(p.x - plat.x) < plat.w / 2 + 8 && prevY <= plat.y + 1 && p.y >= plat.y && !held.down){
        p.y = plat.y; landed = true; p.onPlatform = plat; break;
      }
    }
  }
  if (landed){
    if (p.air){
      // 落地反馈
      if (p.lastVy > 620 || p.diving){
        dust(p.x, p.y, 8, 1.1, 0);
        addShake(Math.min(0.16, p.lastVy / 6000));
        sfx('land');
        p.landSquash = 1;
      } else if (p.lastVy > 240){
        dust(p.x, p.y, 4, 0.7, 0);
        sfx('land');
        p.landSquash = 0.7;
      }
      p.air = false; p.jumps = 0; p.airDashed = false; p.coyote = 0;
      if (p.state === 'air') p.state = 'idle';
      p.landT = 0.07;
    }
    p.vy = 0;
    p.coyote = 0.09;
  } else {
    if (!p.air && p.vy > 0){ p.air = true; }
  }
  // 跑动相位
  if (!p.air) p.runPhase += Math.abs(p.vx) * dt * 0.052;
  // 站在平台上按下则下落
  if (p.onPlatform && held.down && !p.air){
    p.y += 4; p.air = true; p.vy = 80; p.onPlatform = null;
  }
  if (p.air || Math.abs(p.y - GROUND_Y) > 2) p.onPlatform = null;
}

/* ---------------- 拖尾 / 残影 ---------------- */
let poseCache = null;
function sampleTrail(){
  const p = P, sk = poseCache || computeSkeleton(p);
  p.trail.push({ x1: sk.handX, y1: sk.handY, x2: sk.tipX, y2: sk.tipY, t: G.rtime });
}
function spawnAfterimage(){
  P.afterimages.push({ x: P.x, y: P.y, f: P.facing, t: G.rtime, ba: poseCache ? poseCache.baWorld : 0.5, hx: poseCache ? poseCache.handX : 0, hy: poseCache ? poseCache.handY : 0 });
  if (P.afterimages.length > 14) P.afterimages.shift();
}
function updateScarf(dt, rdt){
  const p = P;
  const sk = poseCache || computeSkeleton(p);
  const nx = sk.neckX, ny = sk.neckY;
  // verlet
  for (let i = 0; i < p.scarf.length; i++){
    const n = p.scarf[i];
    const vx = (n.x - n.px) * 0.86, vy = (n.y - n.py) * 0.86;
    n.px = n.x; n.py = n.y;
    if (i === 0){ n.x = nx - p.facing * 5; n.y = ny + 3; continue; }
    n.x += vx + (-p.facing * (66 + Math.abs(p.vx) * 0.42) + Math.sin(G.time * 8 + i) * 26) * dt;
    n.y += vy + (300 - p.vy * 0.28) * dt;
  }
  for (let i = 1; i < p.scarf.length; i++){
    const a = p.scarf[i - 1], b = p.scarf[i];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 0.001, target = 7.4;
    const k = (d - target) / d;
    b.x -= dx * k; b.y -= dy * k;
  }
  for (let i = 0; i < p.hair.length; i++){
    const n = p.hair[i];
    const vx = (n.x - n.px) * 0.8, vy = (n.y - n.py) * 0.8;
    n.px = n.x; n.py = n.y;
    if (i === 0){ n.x = sk.headX - p.facing * 7; n.y = sk.headY - 7; continue; }
    n.x += vx - p.facing * 40 * dt;
    n.y += vy + 240 * dt;
  }
  for (let i = 1; i < p.hair.length; i++){
    const a = p.hair[i - 1], b = p.hair[i];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 0.001;
    const k = (d - 6.5) / d;
    b.x -= dx * k; b.y -= dy * k;
  }
}

/* ---------------- 骨骼计算 ---------------- */
function ik(sx, sy, tx, ty, l1, l2, bend){
  let dx = tx - sx, dy = ty - sy;
  let d = Math.hypot(dx, dy);
  const md = l1 + l2 - 0.6;
  if (d > md){ dx *= md / d; dy *= md / d; d = md; }
  if (d < 0.01){ d = 0.01; dx = 0.01; }
  const a = Math.acos(clamp((d * d + l1 * l1 - l2 * l2) / (2 * d * l1), -1, 1));
  const ang = Math.atan2(dy, dx);
  const ea = ang + a * bend;
  return { ex: sx + Math.cos(ea) * l1, ey: sy + Math.sin(ea) * l1, tx: sx + dx, ty: sy + dy };
}

function computeSkeleton(p){
  const f = p.facing;
  let lean = 0, dip = 0, hx = 12, hy = 6, ba = 0.55;
  let armBx = -12, armBy = 8, crouch = 0;

  if (p.dead){
    // 倒地姿态
    lean = -f * 1.1; dip = 30; hx = -20; hy = 26; ba = 2.2; armBx = -24; armBy = 30;
  } else if (p.move){
    const m = MOVES[p.move];
    const tr = sampleTrack(TRACKS[p.move] || TRACKS.l1, p.moveT / m.dur);
    hx = tr.hx; hy = tr.hy; ba = tr.ba; lean = tr.lean * PI / 180; dip = tr.dip;
    armBx = -hx * 0.5; armBy = -hy * 0.4 + 14;
  } else if (p.parryT > 0){
    // 弹反架势：刀竖于身前
    hx = 17; hy = 2; ba = -1.5; lean = 8; dip = 3;
    armBx = -13; armBy = 10;
  } else if (p.blinkT > 0){
    // 瞬影：前倾掠影
    hx = -6; hy = 8; ba = 2.5; lean = 0.5; dip = 2;
    armBx = -18; armBy = 12;
  } else if (p.stormT > 0){
    // 樱吹雪：全身回旋，刀角连续旋转
    hx = 10; hy = -6; ba = -((G.time * 16) % TAU); lean = Math.sin(G.time * 10) * 0.1; dip = -2;
    armBx = -12; armBy = 6;
  } else if (p.fallPhase === 1){
    // 落月蓄势：引刀向上
    hx = 2; hy = -34; ba = -1.7; lean = -10; dip = 8;
    armBx = -14; armBy = 8;
  } else if (p.fallPhase === 2){
    // 升空斩
    hx = 12; hy = -12; ba = -2.3; lean = -14; dip = -6;
    armBx = -16; armBy = -2;
  } else if (p.fallPhase === 3){
    // 坠月
    hx = 16; hy = 18; ba = 1.2; lean = 22; dip = 2;
    armBx = -18; armBy = 14;
  } else if (p.sheathT > 0){
    // 收刀
    hx = 10; hy = 12; ba = 2.5; lean = 4; dip = 2;
    armBx = -12; armBy = 10;
  } else if (p.charging){
    const t = clamp(p.chargeT / 0.85, 0, 1);
    hx = lerp(-10, 6 - Math.sin(p.chargeT * 34) * 2 * t, t);
    hy = lerp(-10, -34, t) + (t > 0.95 ? rnd(-1.5, 1.5) : 0);
    ba = lerp(-1.4, -1.85, t);
    lean = -0.28 * t; dip = 3 * t;
    armBx = -14; armBy = 6;
  } else if (p.dashT > 0 || p.diving){
    lean = f * 0.42; dip = p.diving ? -4 : 4;
    hx = p.diving ? 14 : 18; hy = p.diving ? 22 : -2;
    ba = p.diving ? 1.35 : 0.2;
    armBx = -18; armBy = p.diving ? -14 : 10;
  } else if (p.hitstun > 0){
    lean = -f * 0.3; dip = 4; hx = -16; hy = 4; ba = 1.8; armBx = -20; armBy = 14;
  } else {
    if (p.air){
      lean = clamp(p.vx * f * 0.0008, -0.15, 0.3);
      hx = 14; hy = -8; ba = 0.35;
      armBx = -14; armBy = -2;
      dip = -2;
    } else if (Math.abs(p.vx) > 30){
      lean = f * 0.16;
      hx = 12; hy = 6; ba = 0.6;
      armBx = -12; armBy = 8;
      dip = Math.sin(p.runPhase * 2) * 1.6;
    } else {
      lean = Math.sin(G.time * 1.7) * 0.02;
      hx = 13; hy = 7; ba = 0.62;
      armBx = -11; armBy = 9;
      dip = Math.sin(G.time * 2.2) * 1.2;
    }
  }

  const squash = p.landSquash > 0 ? p.landSquash : 0;
  const sq = 1 - squash * 0.16;
  const feetY = p.y;
  const hipY = feetY - 40 * sq + dip;
  const hipX = p.x;
  const leanR = lean * f;
  const neckX = hipX + Math.sin(leanR) * 34 * f * (lean === 0 ? 0 : 1) + leanR * 14;
  const neckY = hipY - 34 * sq * (1 - Math.abs(leanR) * 0.2);
  // 头
  const headX = neckX + Math.sin(leanR) * 12 * f;
  const headY = neckY - 12 * sq;
  // 手（局部 → 世界）
  const shX = neckX - f * 2, shY = neckY + 5;
  const handLX = shX + f * hx, handLY = shY + hy;
  const armF = ik(shX, shY, handLX, handLY, 15, 15, f > 0 ? 1 : -1);
  const shBX = neckX - f * 5, shBY = neckY + 6;
  const handBLX = shBX + f * armBx, handBLY = shBY + armBy;
  const armB = ik(shBX, shBY, handBLX, handBLY, 14, 14, f > 0 ? 1 : -1);
  // 腿
  let footF, footB;
  if (p.dead){
    footF = { tx: hipX + f * 30, ty: feetY - 2 }; footB = { tx: hipX - f * 10, ty: feetY - 2 };
  } else if (p.air || p.dashT > 0){
    if (p.diving){
      footF = { tx: hipX - f * 14, ty: feetY - 26 }; footB = { tx: hipX - f * 24, ty: feetY - 18 };
    } else if (p.vy < -80){
      footF = { tx: hipX + f * 10, ty: feetY - 22 }; footB = { tx: hipX - f * 12, ty: feetY - 8 };
    } else {
      footF = { tx: hipX + f * 6, ty: feetY - 14 }; footB = { tx: hipX - f * 14, ty: feetY - 4 };
    }
  } else if (Math.abs(p.vx) > 30){
    const ph = p.runPhase;
    footF = { tx: hipX + f * Math.sin(ph) * 17, ty: feetY - Math.max(0, -Math.cos(ph)) * 9 };
    footB = { tx: hipX + f * Math.sin(ph + PI) * 17, ty: feetY - Math.max(0, -Math.cos(ph + PI)) * 9 };
  } else {
    footF = { tx: hipX + f * 7, ty: feetY };
    footB = { tx: hipX - f * 7, ty: feetY };
  }
  const legF = ik(hipX, hipY, footF.tx, footF.ty, 21, 21, f > 0 ? 1 : -1);
  const legB = ik(hipX, hipY, footB.tx, footB.ty, 21, 21, f > 0 ? 1 : -1);

  const baWorld = f > 0 ? ba : PI - ba;
  const tipX = armF.tx + Math.cos(baWorld) * 56;
  const tipY = armF.ty + Math.sin(baWorld) * 56;

  const sk = {
    hipX, hipY, neckX, neckY, headX, headY, shX, shY,
    armF, armB, legF, legB, baWorld, tipX, tipY,
    handX: armF.tx, handY: armF.ty, lean, dip, f,
  };
  poseCache = sk;
  return sk;
}

/* ---------------- 玩家绘制 ---------------- */
function drawPlayer(rt){
  const p = P;
  const sk = computeSkeleton(p);
  const f = p.facing;
  // 受击闪烁（半透明）；死亡后缓慢淡出
  const blink = p.iFrames > 0 && p.hitstun <= 0 && !p.dead && Math.sin(G.rtime * 40) > 0;
  let bodyAlpha = blink ? 0.45 : 1;
  if (p.dead){
    bodyAlpha = clamp(1 - (p.deadT - 1.8) / 0.8, 0, 1);
    if (bodyAlpha <= 0) return;
  }

  // 阴影
  ctx.globalAlpha = bodyAlpha * 0.8;
  drawShadow(p.x, Math.min(p.y, GROUND_Y) === p.y ? p.y : GROUND_Y, 20 * (1 - clamp((GROUND_Y - p.y) / 400, 0, 0.7)));

  // 残影
  for (const a of p.afterimages){
    const age = G.rtime - a.t;
    if (age > 0.24) continue;
    const al = (1 - age / 0.24) * 0.3;
    ctx.globalAlpha = al;
    ctx.fillStyle = '#7ea2ff';
    ctx.beginPath();
    ctx.ellipse(a.x, a.y - 44, 11, 30, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#a8c2ff';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(a.hx, a.hy);
    ctx.lineTo(a.hx + Math.cos(a.ba) * 50, a.hy + Math.sin(a.ba) * 50);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  p.afterimages = p.afterimages.filter(a => G.rtime - a.t < 0.3);

  // ---- 围巾（后层）----
  ctx.globalAlpha = bodyAlpha;
  drawScarf();

  // ---- 后臂 ----
  strokeCap(sk.shX - f * 4, sk.shY + 2, sk.armB.ex, sk.armB.ey, 4.4, '#b9bede');
  strokeCap(sk.armB.ex, sk.armB.ey, sk.armB.tx, sk.armB.ty, 3.8, '#cfd3ea');

  // ---- 后腿 ----
  strokeCap(sk.hipX, sk.hipY, sk.legB.ex, sk.legB.ey, 6, '#565b86');
  strokeCap(sk.legB.ex, sk.legB.ey, sk.legB.tx, sk.legB.ty, 5, '#6a6f9d');
  // 后脚
  strokeCap(sk.legB.tx, sk.legB.ty, sk.legB.tx + f * 6, sk.legB.ty - 1, 3.2, '#2c3050');

  // ---- 身体（和服）----
  const bodyLean = sk.lean * f;
  ctx.save();
  ctx.translate(sk.hipX, sk.hipY);
  ctx.rotate(bodyLean * 0.6);
  // 下摆
  const hemSw = clamp(-p.vx * 0.035, -10, 10) + Math.sin(G.time * 6) * 1.6;
  ctx.fillStyle = '#e8e6f4';
  ctx.beginPath();
  ctx.moveTo(-f * 11, -2);
  ctx.quadraticCurveTo(-f * (15 + hemSw * 0.4), 16, -f * (13 + hemSw), 26);
  ctx.lineTo(f * (10 + hemSw * 0.7), 24);
  ctx.quadraticCurveTo(f * 13, 10, f * 11, -2);
  ctx.closePath();
  ctx.fill();
  // 躯干
  const torsoG = ctx.createLinearGradient(0, -40, 0, 4);
  torsoG.addColorStop(0, '#f2f0fa');
  torsoG.addColorStop(1, '#d9d8ec');
  ctx.fillStyle = torsoG;
  ctx.beginPath();
  ctx.moveTo(-f * 10, 0);
  ctx.quadraticCurveTo(-f * 12, -22, -f * 9, -36);
  ctx.lineTo(f * 9, -36);
  ctx.quadraticCurveTo(f * 12, -22, f * 10, 0);
  ctx.closePath();
  ctx.fill();
  // 衣领与腰带
  ctx.strokeStyle = '#3a3f66';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(-f * 8, -34); ctx.lineTo(f * 5, -26); ctx.stroke();
  ctx.strokeStyle = '#b8354a';
  ctx.lineWidth = 4.2;
  ctx.beginPath();
  ctx.moveTo(-f * 10, -6); ctx.lineTo(f * 10, -6); ctx.stroke();
  ctx.restore();

  // ---- 前腿 ----
  strokeCap(sk.hipX, sk.hipY, sk.legF.ex, sk.legF.ey, 6.4, '#6a6f9d');
  strokeCap(sk.legF.ex, sk.legF.ey, sk.legF.tx, sk.legF.ty, 5.4, '#7d82ad');
  strokeCap(sk.legF.tx, sk.legF.ty, sk.legF.tx + f * 7, sk.legF.ty - 1, 3.4, '#343a5e');

  // ---- 头 ----
  drawHair(sk, f);
  ctx.fillStyle = '#f5d9c4';
  ctx.beginPath(); ctx.arc(sk.headX, sk.headY, 10.5, 0, TAU); ctx.fill();
  // 发髻
  ctx.fillStyle = '#23263f';
  ctx.beginPath(); ctx.arc(sk.headX - f * 3, sk.headY - 9, 5.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(sk.headX - f * 8, sk.headY - 5, 3.6, 0, TAU); ctx.fill();
  // 眼睛（一条利落的线）
  ctx.strokeStyle = '#1c1f33';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(sk.headX + f * 2, sk.headY - 1);
  ctx.lineTo(sk.headX + f * 8, sk.headY - 1 + (p.dead ? 2 : 0));
  ctx.stroke();
  // 红色发饰
  ctx.fillStyle = '#d8354a';
  ctx.beginPath(); ctx.arc(sk.headX - f * 6.5, sk.headY - 11, 2.1, 0, TAU); ctx.fill();

  // ---- 前臂 + 刀 ----
  strokeCap(sk.shX, sk.shY, sk.armF.ex, sk.armF.ey, 4.8, '#d9d8ec');
  strokeCap(sk.armF.ex, sk.armF.ey, sk.handX, sk.handY, 4.2, '#f2f0fa');
  // 手
  ctx.fillStyle = '#f5d9c4';
  ctx.beginPath(); ctx.arc(sk.handX, sk.handY, 3.4, 0, TAU); ctx.fill();
  drawBlade(sk, p);

  ctx.globalAlpha = 1;

  // ---- 刀光拖尾 ----
  drawTrail();
}

function drawBlade(sk, p){
  const a = sk.baWorld;
  const hx = sk.handX, hy = sk.handY;
  const gx = Math.cos(a), gy = Math.sin(a);
  // 柄
  strokeCap(hx - gx * 7, hy - gy * 7, hx, hy, 3.6, '#2b2b3f');
  // 护手
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(a);
  ctx.fillStyle = '#c9a44c';
  ctx.fillRect(-1.6, -5.4, 3.2, 10.8);
  ctx.restore();
  // 刃
  const bx = hx + gx * 4, by = hy + gy * 4;
  const tx = hx + gx * 58, ty = hy + gy * 58;
  const glow = p.charging ? clamp(p.chargeT / 0.85, 0, 1) : (p.move ? 1 : 0.25);
  const full = p.charging && p.chargeT >= 0.82;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.28 + glow * 0.45;
  ctx.strokeStyle = full ? '#ff5a66' : '#bcd2ff';
  ctx.lineWidth = 7 + glow * 7;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.restore();
  const bg = ctx.createLinearGradient(bx, by, tx, ty);
  bg.addColorStop(0, '#c8d2e8');
  bg.addColorStop(0.55, '#f4f7ff');
  bg.addColorStop(1, '#ffffff');
  ctx.strokeStyle = bg;
  ctx.lineWidth = 3.4;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.stroke();
  // 刃尖偶尔闪光
  if (!p.move && Math.random() < 0.012) flashFx(tx, ty, 10, 0.2, '220,235,255');
  // 破军状态红光
  if (G.gaugeFull && !p.charging && Math.random() < 0.3){
    spawnP({ kind: 'ember', x: lerp(bx, tx, Math.random()), y: lerp(by, ty, Math.random()), vx: 0, vy: -20, g: 0, drag: 1, life: 0.3, size: 2, col: '#ff8090' });
  }
}

function drawTrail(){
  const tr = P.trail;
  const cutoff = G.rtime - 0.15;
  while (tr.length && tr[0].t < cutoff) tr.shift();
  if (tr.length < 2) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 1; i < tr.length; i++){
    const a = tr[i - 1], b = tr[i];
    const age = G.rtime - b.t;
    const al = clamp(1 - age / 0.15, 0, 1);
    if (al <= 0) continue;
    // 宽拖尾（朱红）
    ctx.strokeStyle = 'rgba(255,80,100,' + (al * 0.36) + ')';
    ctx.lineWidth = 13 * al;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x1, a.y1); ctx.lineTo(b.x1, b.y1); ctx.stroke();
    // 白芯
    ctx.strokeStyle = 'rgba(255,255,255,' + (al * 0.85) + ')';
    ctx.lineWidth = 4.6 * al;
    ctx.beginPath(); ctx.moveTo(a.x2, a.y2); ctx.lineTo(b.x2, b.y2); ctx.stroke();
  }
  ctx.restore();
}

function drawScarf(){
  const s = P.scarf;
  if (s.length < 3) return;
  ctx.beginPath();
  // 一侧
  for (let i = 0; i < s.length; i++){
    const n = s[i];
    const prev = s[Math.max(0, i - 1)], next = s[Math.min(s.length - 1, i + 1)];
    const dx = next.x - prev.x, dy = next.y - prev.y;
    const d = Math.hypot(dx, dy) || 1;
    const w = lerp(4.6, 1.2, i / s.length);
    const px = -dy / d * w, py = dx / d * w;
    if (i === 0) ctx.moveTo(n.x + px, n.y + py);
    else ctx.lineTo(n.x + px, n.y + py);
  }
  for (let i = s.length - 1; i >= 0; i--){
    const n = s[i];
    const prev = s[Math.max(0, i - 1)], next = s[Math.min(s.length - 1, i + 1)];
    const dx = next.x - prev.x, dy = next.y - prev.y;
    const d = Math.hypot(dx, dy) || 1;
    const w = lerp(4.6, 1.2, i / s.length);
    const px = -dy / d * w, py = dx / d * w;
    ctx.lineTo(n.x - px, n.y - py);
  }
  ctx.closePath();
  const sg = ctx.createLinearGradient(s[0].x, s[0].y, s[s.length - 1].x, s[s.length - 1].y);
  sg.addColorStop(0, '#e04358');
  sg.addColorStop(1, '#8f2436');
  ctx.fillStyle = sg;
  ctx.fill();
}

function drawHair(sk, f){
  const h = P.hair;
  if (h.length >= 2){
    ctx.strokeStyle = '#23263f';
    ctx.lineWidth = lerp(4, 1.6, 1);
    ctx.lineCap = 'round';
    for (let i = 1; i < h.length; i++){
      ctx.lineWidth = 4.6 - i;
      ctx.beginPath();
      ctx.moveTo(h[i - 1].x, h[i - 1].y);
      ctx.lineTo(h[i].x, h[i].y);
      ctx.stroke();
    }
  }
}

function drawShadow(x, y, r){
  ctx.fillStyle = 'rgba(4,6,14,0.5)';
  ctx.beginPath();
  ctx.ellipse(x, y + 3, r, r * 0.26, 0, 0, TAU);
  ctx.fill();
}
