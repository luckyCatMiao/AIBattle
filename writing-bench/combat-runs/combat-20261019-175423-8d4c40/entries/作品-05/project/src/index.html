<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>裂帛 · RIVEN</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>

  <div id="hud" class="hidden">
    <div id="leftHud">
      <div class="pName"><span class="glyph">✦</span> 织命者 <em>WEAVER</em></div>
      <div id="hpWrap">
        <div id="hpBack"></div>
        <div id="hpGhost"></div>
        <div id="hpFill"></div>
        <div id="hpTicks"></div>
        <div id="hpText"></div>
      </div>
      <div id="stamWrap"><div id="stamFill"></div><div id="stamText">气</div></div>
      <div id="comboWrap">
        <div id="comboNum">0</div>
        <div id="comboLbl">连斩</div>
        <div id="comboBar"><i></i></div>
      </div>
    </div>

    <div id="rightHud">
      <div class="waveLine"><span class="lbl">WAVE</span> <b id="waveNum">1</b></div>
      <div class="waveLine"><span class="lbl">残响</span> <b id="echoNum">0</b></div>
      <div class="waveLine"><span class="lbl">敌</span> <b id="enemyNum">0</b></div>
    </div>

    <div id="muteBtn" title="静音 (M)" role="button" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="mutePath" d="M4 9v6h4l5 4V5L8 9H4z"/><path id="wave1" d="M16.5 8.5a4.5 4.5 0 0 1 0 7"/><path id="wave2" d="M19 6a8 8 0 0 1 0 12"/></svg>
      <span id="muteTxt">音效</span>
    </div>

    <div id="keys">
      <div class="krow"><kbd>A</kbd><kbd>D</kbd><span>移动</span></div>
      <div class="krow"><kbd>空格</kbd><span>跳跃</span></div>
      <div class="krow"><kbd>J</kbd><span>斩击</span></div>
      <div class="krow"><kbd>K</kbd><span>裂空(重)</span></div>
      <div class="krow"><kbd>L</kbd><span>闪身</span></div>
      <div class="krow"><kbd>I</kbd><span>裂影</span></div>
      <div class="krow dim"><kbd>R</kbd><span>重开</span></div>
    </div>

    <div id="toast"></div>
  </div>

  <div id="title" class="screen">
    <div class="titleInner">
      <div class="kanji">裂</div>
      <div class="titleText">
        <h1>裂 帛</h1>
        <div class="sub">R I V E N &nbsp;·&nbsp; 断 肢 试 炼</div>
        <p class="blurb">刀锋撕开丝线。<br>砍断它们的手、脚与头——残躯仍会爬向你。</p>
        <div class="cta">按 <b>Enter</b> 或点击开始</div>
        <div class="spec">A D 移动 · 空格 跳 · J 斩 · K 裂空 · L 闪身 · I 裂影</div>
      </div>
    </div>
  </div>

  <div id="death" class="screen hidden">
    <div class="deathInner">
      <div class="dKanji">绝</div>
      <h2>丝线已断</h2>
      <div class="stats">
        <div><span>波次</span><b id="dWave">1</b></div>
        <div><span>斩击命中</span><b id="dHits">0</b></div>
        <div><span>肢体断裂</span><b id="dLimbs">0</b></div>
        <div><span>最高连斩</span><b id="dCombo">0</b></div>
      </div>
      <div class="cta">按 <b>Enter</b> / <b>R</b> 或点击重开</div>
    </div>
  </div>

  <div id="paused" class="screen hidden">
    <div class="pauseInner">
      <div class="dKanji small">歇</div>
      <h2>暂停</h2>
      <p>Esc / P 继续</p>
    </div>
  </div>
</div>
<script>
/*__JS__*/
</script>
</body>
</html>
