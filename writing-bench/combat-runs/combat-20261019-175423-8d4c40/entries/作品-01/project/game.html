const GRAVITY = 2050;
const GROUND_Y = 470;          // ground surface y in world space
const ARENA = { x1: 80, x2: 1920 };

// Combo definitions. Startup / active / recovery in seconds.
// box: {x offset from player front, y offset from player y (feet at +? player.y is centre of torso)}
const ATTACKS = {
  // light chain
  L1: { startup: 0.055, active: 0.085, recovery: 0.14, damage: 10, box: { ox: 18, oy: -58, w: 78, h: 64 }, kb: 120, lift: 40, hitstop: 0.045, heavy: false, next: 'L2', cancelAt: 0.55, sfx: 'light', step: 110, arc: -0.8 },
  L2: { startup: 0.06, active: 0.09, recovery: 0.15, damage: 11, box: { ox: 20, oy: -60, w: 82, h: 66 }, kb: 140, lift: 50, hitstop: 0.05, heavy: false, next: 'L3', cancelAt: 0.55, sfx: 'light', step: 130, arc: 0.9 },
  L3: { startup: 0.075, active: 0.1, recovery: 0.18, damage: 13, box: { ox: 22, oy: -58, w: 90, h: 64 }, kb: 190, lift: 30, hitstop: 0.06, heavy: false, next: 'L4', cancelAt: 0.6, sfx: 'light', step: 150, arc: -1.0 },
  L4: { startup: 0.11, active: 0.12, recovery: 0.28, damage: 22, box: { ox: 20, oy: -92, w: 96, h: 100 }, kb: 380, lift: -320, hitstop: 0.085, heavy: false, next: null, cancelAt: 0.75, launcher: true, sfx: 'heavy', step: 150, arc: 1.5, up: true },
  // air
  AIR1: { startup: 0.05, active: 0.09, recovery: 0.16, damage: 9, box: { ox: 14, oy: -46, w: 76, h: 70 }, kb: 90, lift: -30, hitstop: 0.04, heavy: false, next: 'AIR2', cancelAt: 0.5, sfx: 'light', step: 30, arc: -0.6, air: true },
  AIR2: { startup: 0.055, active: 0.1, recovery: 0.2, damage: 14, box: { ox: 16, oy: -40, w: 82, h: 82 }, kb: 200, lift: 260, hitstop: 0.06, heavy: false, next: null, cancelAt: 0.55, sfx: 'light', step: 40, arc: 1.2, air: true },
  // heavy
  H1: { startup: 0.24, active: 0.12, recovery: 0.34, damage: 34, box: { ox: 22, oy: -66, w: 116, h: 84 }, kb: 820, lift: 230, hitstop: 0.13, heavy: true, next: null, cancelAt: 1, sfx: 'heavy', step: 260, arc: -1.35 },
  H2: { startup: 0.28, active: 0.13, recovery: 0.34, damage: 42, box: { ox: 24, oy: -64, w: 124, h: 92 }, kb: 980, lift: 140, hitstop: 0.15, heavy: true, next: null, cancelAt: 1, sfx: 'heavy', step: 300, arc: 1.4 },
  H3: { startup: 0.32, active: 0.14, recovery: 0.38, damage: 52, box: { ox: 24, oy: -78, w: 132, h: 104 }, kb: 1150, lift: 320, hitstop: 0.18, heavy: true, next: null, cancelAt: 1, sfx: 'heavy', step: 330, arc: -1.5, smash: true },
  // air heavy — pogo plunge
  AIRH: { startup: 0.16, active: 0.34, recovery: 0.18, damage: 30, box: { ox: -34, oy: -40, w: 92, h: 130 }, kb: 260, lift: 60, hitstop: 0.12, heavy: true, next: null, cancelAt: 1, sfx: 'heavy', step: 0, arc: 1.6, plunge: true }
};

class Player {
  constructor(world) {
    this.world = world;
    this.reset();
  }
  reset() {
    this.x = 240;
    this.y = GROUND_Y;
    this.vx = 0; this.vy = 0;
    this.w = 30; this.h = 68;
    this.hp = 100; this.maxHp = 100;
    this.facing = 1;
    this.onGround = true;
    this.runT = 0;
    this.state = 'idle'; // idle|run|air|attack|hurt|dash|parry|dead|land
    this.attack = null;
    this.attackT = 0;
    this.attackHits = null;
    this.attackChain = null;
    this.stage = null;
    this.combo = 0;
    this.comboTimer = 0;
    this.comboBest = 0;
    this.queuedNext = null;
    this.dashT = 0; this.dashCd = 0;
    this.parryT = 0; this.parryCd = 0; this.parrySuccess = 0;
    this.iframe = 0;
    this.chargeT = 0; this.charging = false; this.chargeLevel = 0;
    this.hurtT = 0;
    this.koFlash = 0;
    this.trail = [];
    this.stepTimer = 0;
    this.focus = 1;            // focus gauge for special (0..1)
    this.skillCd = [0, 0, 0, 0];
    this.skillId = -1;
    this.skillT = 0;
    this.skillDur = 0;
    this.skillFired = false;
    this.skillDashDir = 1;
    this.specialT = 0;
    this.specialHits = null; this.specialSeq = 0;
    this.lastHitTarget = null;
    this.anim = { armA: 0, armB: 0.4, legA: 0, legB: 0, lean: 0, swordA: -0.9, bladeGlow: 0 };
    this.prevY = this.y;
    this.landTimer = 0;
    this.dashTrailT = 0;
    this.sweepGlow = 0;
  }

  get cx() { return this.x; }
  get cy() { return this.y - this.h * 0.5; }
  get top() { return this.y - this.h; }

  hitbox() { return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h }; }

  canAct() {
    return this.state !== 'dead' && this.state !== 'hurt' && this.state !== 'skill' && !(this.state === 'attack' && !this.canCancel()) && this.state !== 'dash' && this.specialT <= 0;
  }
  canCancel() {
    if (!this.attack) return true;
    if (this.state !== 'attack') return true;
    const def = this.attack;
    const total = def.startup + def.active + def.recovery;
    return this.attackT >= total * def.cancelAt || (this.attackHits && this.attackHits.size > 0 && this.attackT >= def.startup + def.active * 0.5);
  }

  tryAttack(defKey, isHeavy) {
    const def = ATTACKS[defKey];
    if (!def) return false;
    this.state = 'attack';
    this.attack = def;
    this.attackKey = defKey;
    this.attackT = 0;
    this.attackHits = new Set();
    this.attackChain = this.stage;
    this.stage = defKey;
    this.charging = false;
    this.chargeT = 0;
    this.anim.bladeGlow = 1;
    // attack lunge
    const step = def.step || 0;
    const groundedStep = this.onGround ? 1 : 0.35;
    this.vx += this.facing * step * groundedStep;
    if (this.onGround) this.vy = 0;
    if (def.launcher) this.vy = -120;
    if (def.plunge) this.vy = 1250;
    if (def.air && this.onGround) {
      // air moves initiated on ground give a little hop
      this.vy = -180;
      this.onGround = false;
    }
    Sfx.swing(!!def.heavy);
    const w = this.world;
    // sword arc light
    const arcColor = def.heavy ? 'rgba(255,150,110,0.85)' : 'rgba(190,235,255,0.8)';
    const cy = this.cy - 6;
    w.fx.slashLight(this.x + this.facing * 18, cy, this.facing > 0 ? (def.arc || 0) : Math.PI - (def.arc || 0), 1.9, def.heavy ? 104 : 78, arcColor, def.heavy ? 0.3 : 0.2, def.heavy ? 15 : 8);
    w.fx.spark(this.x + this.facing * 46, cy, { count: def.heavy ? 10 : 5, speed: 260, size: 2, life: 0.18, color: '#bfefff', dir: this.facing > 0 ? 0 : Math.PI, spread: 1.2, grav: 300 });
    return true;
  }

  update(dt, input) {
    const w = this.world;
    this.iframe = Math.max(0, this.iframe - dt);
    for (let i = 0; i < 4; i++) this.skillCd[i] = Math.max(0, this.skillCd[i] - dt);
    this.dashCd = Math.max(0, this.dashCd - dt);
    this.parryCd = Math.max(0, this.parryCd - dt);
    this.parrySuccess = Math.max(0, this.parrySuccess - dt);
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.koFlash = Math.max(0, this.koFlash - dt * 3);
    this.anim.bladeGlow = Math.max(0, this.anim.bladeGlow - dt * 4.5);
    this.sweepGlow = Math.max(0, this.sweepGlow - dt * 3);
    this.comboTimer = Math.max(0, this.comboTimer - dt);
    if (this.comboTimer <= 0 && this.combo > 0) this.combo = 0;
    if (this.specialT > 0) this.specialT -= dt;

    if (this.state === 'dead') {
      this.vy += GRAVITY * dt;
      this.y = Math.min(GROUND_Y, this.y + this.vy * dt);
      return;
    }

    if (this.state === 'hurt') {
      this.hurtT -= dt;
      this.vx *= Math.pow(0.02, dt);
      if (this.hurtT <= 0) this.state = this.onGround ? 'idle' : 'air';
    }

    // ---- input intents (buffered) ----
    const wantLeft = input.held('left');
    const wantRight = input.held('right');
    const dir = (wantRight ? 1 : 0) - (wantLeft ? 1 : 0);

    // ---- skills (1-4) ----
    if (this.state !== 'dead' && this.state !== 'hurt') {
      for (let i = 0; i < 4; i++) {
        if (this.state !== 'skill' && input.consume('skill' + (i + 1)) && this.skillCd[i] <= 0) {
          this.startSkill(i);
          return this.updateSkill(dt);
        }
      }
    }
    if (this.state === 'skill') return this.updateSkill(dt);

    // parry (I)
    if (input.consume('special') && this.parryCd <= 0 && this.state !== 'hurt' && this.state !== 'dash' && this.specialT <= 0) {
      this.state = 'parry';
      this.parryT = 0.24;
      this.parryCd = 0.62;
      this.vx *= 0.3;
      Sfx.swing(false);
      w.fx.ring(this.x, this.cy, 12, 56, 'rgba(160,220,255,0.9)', 0.24, 2.5);
    }

    // dash (L)
    if (input.consume('dash') && this.dashCd <= 0 && this.state !== 'hurt' && this.state !== 'dead' && this.specialT <= 0) {
      this.state = 'dash';
      this.dashT = 0.17;
      this.dashCd = 0.16;
      this.iframe = Math.max(this.iframe, 0.2);
      this.charging = false; this.chargeT = 0;
      const d = dir !== 0 ? dir : this.facing;
      this.facing = d;
      this.vx = d * 880;
      this.vy = this.onGround ? 0 : Math.min(this.vy, 0) * 0.2;
      Sfx.dash();
      w.fx.streak(this.x, this.cy, d > 0 ? Math.PI : 0, 54, 3, 'rgba(160,225,255,0.9)', 0.2);
      w.fx.burst(this.x - d * 10, this.cy, 'rgba(150,210,255,0.8)', 5, 200, 2, 0.3, 100);
      this.dashTrailT = 0;
    }

    // jump (buffered)
    if (input.buffered('jump')) {
      if (this.onGround && this.state !== 'hurt' && this.state !== 'dead' && this.state !== 'parry') {
        input.consume('jump');
        this.vy = -720;
        this.onGround = false;
        this.state = 'air';
        this.charging = false;
        Sfx.jump();
        w.fx.dust(this.x, GROUND_Y, 6, 0);
        w.fx.ring(this.x, GROUND_Y - 1, 6, 34, 'rgba(220,200,180,0.5)', 0.25, 1.5);
      } else if (!this.onGround && this.jumpUsed === false) {
        // no double jump implemented — keep tight
        input.consume('jump');
      }
    }

    // ---- attacks ----
    if (this.state === 'parry') {
      this.parryT -= dt;
      this.vx *= Math.pow(0.08, dt);
      if (this.parryT <= 0) this.state = this.onGround ? 'idle' : 'air';
    }

    if (this.state === 'dash') {
      this.dashT -= dt;
      this.dashTrailT -= dt;
      if (this.dashTrailT <= 0) {
        this.dashTrailT = 0.025;
        w.fx.addPart({ kind: 'smoke', x: this.x + rand(-8, 8), y: this.cy + rand(-22, 22), vx: -this.facing * 40, vy: rand(-10, 10), life: 0.26, max: 0.26, size: rand(7, 13), color: 'rgba(110,190,255,0.35)', grav: 0, drag: 4 });
      }
      if (this.dashT <= 0) { this.state = this.onGround ? 'idle' : 'air'; this.vx *= 0.45; }
    }

    // heavy charge start
    if (this.state !== 'attack' && this.state !== 'hurt' && this.state !== 'dash' && this.state !== 'parry' && this.specialT <= 0) {
      if (input.held('heavy')) {
        if (!this.charging) { this.charging = true; this.chargeT = 0; }
        this.chargeT += dt;
        if (this.chargeT > 0.05 && this.chargeT < 0.09) Sfx.charge(0);
        if (this.chargeT > 0.62 && this.chargeT < 0.66) Sfx.charge(1);
        if (this.chargeT > 1.08 && this.chargeT < 1.12) Sfx.charge(2);
        if (this.chargeT > 1.35 && Math.random() < dt * 20) {
          w.fx.ember(this.x + this.facing * 30 + rand(-8, 8), this.cy + rand(-20, 20), 1);
        }
      } else if (this.charging) {
        // release heavy
        const lvl = this.chargeT > 1.08 ? 3 : this.chargeT > 0.62 ? 2 : 1;
        this.charging = false;
        if (this.chargeT > 0.12) {
          const key = this.onGround ? ('H' + Math.min(3, lvl)) : 'AIRH';
          this.tryAttack(key, true);
          this.lastChargeLevel = lvl;
          this.charging = false;
          this.chargeT = 0;
          return this.postAttackInput(dt, input, dir);
        }
        this.chargeT = 0;
      }
    }

    if (this.state === 'attack') {
      this.attackT += dt;
      const def = this.attack;
      const total = def.startup + def.active + def.recovery;
      const inActive = this.attackT >= def.startup && this.attackT < def.startup + def.active;

      // light chain buffered input
      if (input.buffered('attack')) {
        if (this.attackHits && this.attackHits.size > 0 && this.attackT >= def.startup + def.active * 0.35 && def.next) {
          input.consume('attack');
          const nextKey = def.next;
          this.tryAttack(nextKey, false);
          return this.postAttackInput(dt, input, dir);
        } else if (this.attackT >= total * def.cancelAt && this.attackT > 0.02) {
          input.consume('attack');
          if (this.onGround) this.tryAttack('L1', false);
          else this.tryAttack('AIR1', false);
          return this.postAttackInput(dt, input, dir);
        }
      }

      if (inActive) {
        if (def.hitstop && this.attackHits && this.attackHits.size > 0) {
          this.vx *= Math.pow(0.001, dt * 8);
        }
        w.resolvePlayerAttack(this, def);
      }
      if (this.attackT >= total) {
        this.state = this.onGround ? 'idle' : 'air';
        this.attack = null;
      }
    }

    // light attack start
    if (input.buffered('attack') && this.state !== 'hurt' && this.state !== 'dash' && this.state !== 'parry' && this.specialT <= 0) {
      const canStart = this.state !== 'attack' || (this.attack && this.canCancel() && !this.attack.next);
      if (canStart) {
        input.consume('attack');
        this.charging = false; this.chargeT = 0;
        if (this.onGround) this.tryAttack('L1', false);
        else this.tryAttack('AIR1', false);
        return this.postAttackInput(dt, input, dir);
      }
    }

    // ---- movement ----
    const control = this.state !== 'attack' && this.state !== 'hurt' && this.state !== 'dash' && this.state !== 'parry' && this.specialT <= 0;
    const accel = this.onGround ? 3600 : 2100;
    const maxSpeed = this.onGround ? 340 : 300;
    if (control) {
      if (dir !== 0) {
        this.vx = approach(this.vx, dir * maxSpeed, accel * dt);
        this.facing = dir;
      } else {
        this.vx = approach(this.vx, 0, (this.onGround ? 3000 : 700) * dt);
      }
      if (dir !== 0 && this.onGround) {
        this.runT += dt;
        this.stepTimer -= dt;
        if (this.stepTimer <= 0) { this.stepTimer = 0.27; w.fx.dust(this.x - dir * 8, GROUND_Y, 2, -dir); }
      } else if (this.onGround) {
        this.runT = 0;
      }
    } else if (this.state === 'attack') {
      this.vx *= Math.pow(0.045, dt);
    }

    if (this.charging && this.state !== 'attack') {
      this.vx *= Math.pow(0.01, dt);
      if (this.onGround) this.facing = this.facing; // hold facing
    }

    // gravity & integration
    this.prevY = this.y;
    if (!this.onGround) this.vy += GRAVITY * dt;
    // ledge check
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.x = clamp(this.x, ARENA.x1 + 18, ARENA.x2 - 18);

    if (this.y >= GROUND_Y) {
      if (!this.onGround) {
        const impact = this.vy;
        this.onGround = true;
        this.y = GROUND_Y;
        this.vy = 0;
        if (impact > 300) {
          Sfx.land();
          w.fx.dust(this.x, GROUND_Y, impact > 900 ? 12 : 6, 0);
          w.fx.ring(this.x, GROUND_Y - 1, 8, impact > 900 ? 70 : 40, 'rgba(220,200,180,0.55)', 0.3, 2);
          if (impact > 1000) w.cam.shake(2.2, 0.12);
        }
        if (this.state === 'air' || this.state === 'idle') this.state = 'idle';
        if (this.state === 'attack' && this.attack && this.attack.plunge) {
          // pogo landing impact
          w.fx.ring(this.x, GROUND_Y - 1, 10, 100, 'rgba(255,170,120,0.8)', 0.32, 4);
          w.cam.shake(3, 0.14);
          w.damageArea(this.x, GROUND_Y - 10, 92, 44, 12, 200, 1);
          this.state = 'idle';
          this.attack = null;
        } else if (this.state === 'attack') {
          // air attack landing -> brief recovery, keep attack running
        }
        if (this.state === 'run') this.state = 'idle';
        this.landTimer = 0.08;
      }
      this.y = GROUND_Y;
      this.onGround = true;
    } else {
      this.onGround = false;
    }

    if (this.landTimer > 0) this.landTimer -= dt;

    // walk state
    if (this.state === 'idle' || this.state === 'run' || this.state === 'air') {
      if (!this.onGround) this.state = 'air';
      else if (Math.abs(this.vx) > 25) this.state = 'run';
      else this.state = 'idle';
    }

    // ---- animation targets ----
    this.updateAnim(dt);
    this.postAttackInput(dt, input, dir);
  }

  postAttackInput(dt, input, dir) {
    // no-op placeholder for future; kept for structural symmetry
  }

  updateAnim(dt) {
    const a = this.anim;
    let tArmA = 0, tArmB = 0.35, tLegA = 0, tLegB = 0, tLean = 0, tSword = -0.95;
    const runPhase = this.runT * 15;
    if (this.state === 'run') {
      tLegA = Math.sin(runPhase) * 0.85;
      tLegB = -Math.sin(runPhase) * 0.85;
      tArmA = -Math.sin(runPhase) * 0.6;
      tArmB = Math.sin(runPhase) * 0.4;
      tLean = 0.16;
      tSword = -0.7;
    } else if (this.state === 'air') {
      const fall = clamp(this.vy / 900, -0.4, 1);
      tLegA = -0.5 + fall * 0.5; tLegB = 0.3;
      tArmA = -0.5; tArmB = -0.9;
      tLean = 0.08 * this.facing;
      tSword = -1.4;
    } else if (this.state === 'dead') {
      tLegA = -1.2; tLegB = 0.4; tArmA = -1.8; tArmB = -1.2; tLean = -1.1; tSword = -0.1;
    } else if (this.state === 'hurt') {
      tLean = -0.32 * this.facing;
      tArmA = -1.1; tArmB = -1.4; tSword = -0.3;
      tLegA = -0.3; tLegB = 0.3;
    } else if (this.state === 'dash') {
      tLean = 0.5; tLegA = -0.6; tLegB = 0.7; tArmA = -0.8; tArmB = 1.1; tSword = 2.5;
    } else if (this.state === 'parry') {
      tLean = -0.06; tArmA = -1.35; tArmB = -1.1; tSword = -2.4;
      tLegA = -0.25; tLegB = 0.25;
    } else if (this.charging) {
      const e = clamp(this.chargeT / 1.2, 0, 1);
      tLean = -0.18 - e * 0.15;
      tArmA = -2.1 - e * 0.3; tArmB = -1.7; tSword = -2.8 - e * 0.3;
      tLegA = -0.35; tLegB = 0.4;
    } else if (this.state === 'skill') {
      const k = this.skillT / Math.max(0.01, this.skillDur);
      if (this.skillId === 0) {
        tLean = 0.1; tArmA = -1.6 - Math.sin(k * Math.PI) * 1.2; tArmB = 1.2; tSword = tArmA - 0.4;
        tLegA = -0.4; tLegB = 0.4;
      } else if (this.skillId === 1) {
        tLean = 0.6; tLegA = -0.7; tLegB = 0.8; tArmA = 2.1; tArmB = 1.4; tSword = 2.6;
      } else if (this.skillId === 2) {
        tLean = -0.25; tArmA = -2.7; tArmB = -2.4; tSword = -3.0;
        tLegA = k < 0.5 ? -0.7 : 0.2; tLegB = 0.5;
      } else {
        tLean = -0.1; tLegA = -0.35; tLegB = 0.35;
        tArmA = -2.5 + Math.sin(k * 18) * 0.5; tArmB = -2.2; tSword = tArmA - 0.5;
      }
    } else if (this.state === 'attack' && this.attack) {
      const def = this.attack;
      const t = this.attackT;
      const total = def.startup + def.active + def.recovery;
      const k = clamp(t / def.startup, 0, 1);
      const hitK = clamp((t - def.startup) / def.active, 0, 1);
      const recK = clamp((t - def.startup - def.active) / def.recovery, 0, 1);
      if (def.plunge) {
        tLean = 0.9; tArmA = 2.4; tArmB = 1.9; tSword = 2.7;
        tLegA = -0.5; tLegB = 1.0;
      } else {
        const windup = def.arc < 0 ? -2.3 : 2.0;
        const follow = def.arc < 0 ? 2.2 : -2.0;
        if (t < def.startup) {
          tArmA = lerp(-0.4, windup, easeOutQuad(k));
          tArmB = lerp(-0.4, windup + 0.3, easeOutQuad(k));
          tSword = tArmA - 0.5;
          tLean = -0.12;
          tLegA = -0.2; tLegB = 0.25;
        } else if (t < def.startup + def.active + 0.02) {
          const blow = def.smash ? 1.15 : 1;
          tArmA = lerp(windup, follow * blow, easeOutCubic(Math.min(1, hitK * 1.6)));
          tArmB = lerp(windup + 0.3, follow * blow, easeOutCubic(Math.min(1, hitK * 1.6)));
          tSword = tArmA - 0.6;
          tLean = 0.22 + hitK * 0.12;
          tLegA = -0.45; tLegB = 0.4;
        } else {
          tArmA = lerp(follow, -0.6, easeOutQuad(recK));
          tArmB = lerp(follow, 0.1, easeOutQuad(recK));
          tSword = tArmA - 0.4;
          tLean = lerp(0.2, 0.02, recK);
          tLegA = -0.2; tLegB = 0.2;
        }
      }
    } else if (this.state === 'idle') {
      const b = Math.sin(this.world.time * 2.6);
      tArmA = -0.1 + b * 0.04;
      tArmB = 0.3 + b * 0.05;
      tLean = 0.02;
      tSword = -1.05 + b * 0.03;
    }
    const speed = 22;
    a.armA = lerp(a.armA, tArmA, Math.min(1, speed * dt));
    a.armB = lerp(a.armB, tArmB, Math.min(1, speed * dt));
    a.legA = lerp(a.legA, tLegA, Math.min(1, speed * dt));
    a.legB = lerp(a.legB, tLegB, Math.min(1, speed * dt));
    a.lean = lerp(a.lean, tLean, Math.min(1, speed * dt));
    a.swordA = lerp(a.swordA, tSword, Math.min(1, 34 * dt));
  }

  getChargeLevel() {
    if (!this.charging) return 0;
    return this.chargeT > 1.08 ? 3 : this.chargeT > 0.62 ? 2 : this.chargeT > 0.12 ? 1 : 0;
  }

  /* ---------------- skills ---------------- */
  startSkill(id) {
    const w = this.world;
    this.state = 'skill';
    this.skillId = id;
    this.skillT = 0;
    this.skillFired = false;
    this.skillDur = [0.55, 0.54, 0.6, 1.75][id];
    this.skillCd[id] = [4.5, 6.5, 8.5, 20][id];
    this.charging = false; this.chargeT = 0; this.attack = null;
    this.iframe = Math.max(this.iframe, [0.35, 0.3, 0.25, 1.75][id]);
    Sfx.skill(id);
    if (id === 0) {
      this.vx = 0;
      w.fx.ring(this.x, this.cy, 14, 150, 'rgba(255,110,180,0.9)', 0.45, 5);
      w.fx.word2(this.x, this.cy - 74, '月轮斩', 'MOON WHEEL', '#ffb3d9', 22, 0.95);
    } else if (id === 1) {
      this.skillDashDir = this.facing;
      this.vx = 0;
      w.fx.word2(this.x, this.cy - 74, '影袭·断踪', 'SHADOW REND', '#ff9a7a', 20, 0.95);
    } else if (id === 2) {
      this.vy = -620; this.onGround = false;
      w.startBladeRain(this);
      w.fx.word2(this.x, this.cy - 84, '刃雨', 'BLADE RAIN', '#cfe6ff', 20, 0.95);
    } else {
      this.vx = 0; this.vy = 0;
      w.startUltimate(this);
    }
  }

  updateSkill(dt) {
    const w = this.world;
    this.skillT += dt;
    const id = this.skillId, t = this.skillT;
    this.prevY = this.y;
    if (id === 0) {
      this.vx *= Math.pow(0.01, dt);
      if (!this.skillFired && t >= 0.1) { this.skillFired = true; w.doMoonWheel(this); }
    } else if (id === 1) {
      if (t < 0.17) {
        this.x += this.skillDashDir * 1850 * dt;
        this.iframe = Math.max(this.iframe, 0.06);
        w.markShadow(this);
        if (Math.random() < dt * 46) {
          w.fx.addPart({ kind: 'smoke', x: this.x - this.skillDashDir * 10, y: this.cy + rand(-18, 18), vx: -this.skillDashDir * 70, vy: rand(-20, 20), life: 0.3, max: 0.3, size: rand(8, 15), color: 'rgba(255,90,140,0.4)', grav: 0, drag: 4 });
        }
      } else {
        this.vx *= Math.pow(0.02, dt);
        if (!this.skillFired && t >= 0.34) { this.skillFired = true; w.detonateShadow(this); }
      }
    } else if (id === 2) {
      this.vx *= Math.pow(0.05, dt);
    } else {
      this.vx *= Math.pow(0.02, dt);
      // the world ticks the ultimate sequence itself
    }
    if (!this.onGround) this.vy += GRAVITY * dt;
    this.x = clamp(this.x + this.vx * dt, ARENA.x1 + 18, ARENA.x2 - 18);
    this.y += this.vy * dt;
    if (this.y >= GROUND_Y) { this.y = GROUND_Y; this.vy = 0; this.onGround = true; }
    else this.onGround = false;
    this.updateAnim(dt);
    if (this.skillT >= this.skillDur) {
      this.state = this.onGround ? 'idle' : 'air';
      this.skillId = -1;
    }
  }

  takeHit(amount, fromX, opts) {
    if (this.state === 'dead' || this.iframe > 0) return false;
    const o = opts || {};
    // parry window check
    if (this.state === 'parry' && this.parryT > 0) {
      this.world.onParry(this, o.source || null, o.projectile || null);
      return 'parried';
    }
    this.hp -= amount;
    this.hp = Math.max(0, this.hp);
    this.iframe = o.trueHit ? 0.25 : 0.7;
    this.state = 'hurt';
    this.hurtT = 0.32;
    this.charging = false; this.chargeT = 0;
    this.attack = null;
    this.combo = 0;
    const dir = sign(this.x - fromX);
    this.vx = dir * 380;
    this.vy = -240;
    this.onGround = false;
    Sfx.hurt();
    this.world.cam.shake(4.5, 0.22);
    this.world.fx.burst(this.x, this.cy, '#ff5a5a', 14, 380, 3, 0.45, 700);
    this.world.fx.ring(this.x, this.cy, 10, 60, 'rgba(255,90,90,0.8)', 0.3, 3);
    this.world.hitstop(0.1, true);
    this.world.uiDamageFlash = 0.6;
    if (this.hp <= 0) {
      this.state = 'dead';
      this.vy = -380;
      this.world.onPlayerDeath();
    }
    return true;
  }

  draw(ctx, cam) {
    const a = this.anim;
    const x = this.x, y = this.y;
    const f = this.facing;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(f, 1);

    // aim blade tip for trails
    const hipY = -38;
    const armLen = 20;
    const swordLen = 56;
    const shoulderX = 2, shoulderY = -52;
    const drawArm = (ang, len, width, colA, colB, withSword) => {
      const ex = shoulderX + Math.sin(ang) * len;
      const ey = shoulderY + Math.cos(ang) * len;
      capsule(ctx, shoulderX, shoulderY, ex, ey, width, width * 0.78);
      ctx.fillStyle = colA; ctx.fill();
      ctx.strokeStyle = colB; ctx.lineWidth = 1.4; ctx.stroke();
      if (withSword) {
        const sAng = ang + 0.55;
        const hx = ex + Math.sin(sAng) * 4;
        const hy = ey + Math.cos(sAng) * 4;
        const tx = hx + Math.sin(sAng) * swordLen;
        const ty = hy + Math.cos(sAng) * swordLen;
        // blade
        const glow = this.anim.bladeGlow;
        if (glow > 0.02) {
          ctx.save();
          ctx.globalAlpha = glow * 0.5;
          ctx.strokeStyle = '#ffcf9a';
          ctx.lineWidth = 9;
          ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
          ctx.restore();
        }
        ctx.strokeStyle = '#cfe6ee';
        ctx.lineWidth = 4.4;
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
        // guard
        ctx.strokeStyle = '#caa25a'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(hx - 7, hy - 4); ctx.lineTo(hx + 5, hy + 4); ctx.stroke();
        // trail anchor
        this.bladeTip = { x: tx, y: ty, hx, hy, ang: sAng };
      }
    };


    // cape
    const capeSwing = clamp(this.vx / 400, -1, 1);
    ctx.beginPath();
    ctx.moveTo(-8, -58);
    ctx.quadraticCurveTo(-30 - capeSwing * 14, -38 + Math.sin(this.world.time * 7) * 3, -26 - capeSwing * 22, -8);
    ctx.quadraticCurveTo(-10, -16, -2, -20);
    ctx.closePath();
    ctx.fillStyle = '#7d1420';
    ctx.fill();
    ctx.strokeStyle = '#3d0810'; ctx.lineWidth = 2; ctx.stroke();
    // cape edge accent
    ctx.beginPath();
    ctx.moveTo(-9, -56);
    ctx.quadraticCurveTo(-28 - capeSwing * 13, -36 + Math.sin(this.world.time * 7) * 3, -25 - capeSwing * 21, -10);
    ctx.strokeStyle = 'rgba(255,120,100,0.45)'; ctx.lineWidth = 1.2; ctx.stroke();

    // back leg
    capsule(ctx, -4, -24, -4 + Math.sin(a.legB) * 15, -2 + Math.abs(Math.cos(a.legB)) * 2, 7, 5.5);
    ctx.fillStyle = '#1b1520'; ctx.fill();
    ctx.strokeStyle = '#0a0709'; ctx.lineWidth = 1.2; ctx.stroke();
    // back arm
    drawArm(Math.PI * 0.15 + a.armB, armLen, 6.2, '#2a2130', '#0a0709', false);

    // torso
    ctx.save();
    ctx.translate(0, -40);
    ctx.rotate(a.lean * 0.35);
    poly(ctx, [[-9, -20], [10, -18], [12, 8], [4, 18], [-9, 16], [-13, -2]]);
    ctx.fillStyle = '#252030'; ctx.fill();
    ctx.strokeStyle = '#0b080e'; ctx.lineWidth = 1.6; ctx.stroke();
    // chest armour plate
    poly(ctx, [[-6, -16], [8, -14], [9, 2], [0, 8], [-8, 4]]);
    ctx.fillStyle = '#34304a'; ctx.fill();
    ctx.strokeStyle = '#8b6a3a'; ctx.lineWidth = 1.1; ctx.stroke();
    // red sash
    ctx.beginPath();
    ctx.moveTo(-8, 2); ctx.lineTo(10, 6);
    ctx.strokeStyle = '#a8202c'; ctx.lineWidth = 4; ctx.stroke();
    ctx.restore();

    // head
    const headBob = Math.sin(this.world.time * 2.6) * 0.8 + (this.state === 'run' ? Math.sin(this.runT * 15) * 1.4 : 0);
    ctx.save();
    ctx.translate(3, -60 + headBob);
    ctx.rotate(a.lean * 0.18);
    ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, TAU);
    ctx.fillStyle = '#1c1622'; ctx.fill();
    ctx.strokeStyle = '#0a0709'; ctx.lineWidth = 1.4; ctx.stroke();
    // oni mask wedge
    poly(ctx, [[-2, -6], [9, -2], [7, 6], [-1, 5], [-5, 0]]);
    ctx.fillStyle = '#d9d4c4'; ctx.fill();
    ctx.strokeStyle = '#6b5f4a'; ctx.lineWidth = 1; ctx.stroke();
    // eye slit
    ctx.strokeStyle = '#ff3b2f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(1, -1); ctx.lineTo(7, 1); ctx.stroke();
    // horn
    poly(ctx, [[-6, -7], [-2, -17], [1, -6]]);
    ctx.fillStyle = '#b9a878'; ctx.fill();
    ctx.strokeStyle = '#5a4c32'; ctx.lineWidth = 0.9; ctx.stroke();
    // hair/ribbons
    ctx.beginPath();
    ctx.moveTo(-8, -3);
    ctx.quadraticCurveTo(-22 - capeSwing * 8, -4 + Math.sin(this.world.time * 5) * 2, -27 - capeSwing * 12, 9);
    ctx.strokeStyle = '#8f1a24'; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.restore();

    // front leg
    capsule(ctx, 0, -24, 2 + Math.sin(a.legA) * 15, -2 + Math.abs(Math.cos(a.legA)) * 2, 7.5, 6);
    ctx.fillStyle = '#221a28'; ctx.fill();
    ctx.strokeStyle = '#0a0709'; ctx.lineWidth = 1.2; ctx.stroke();

    // front arm with sword
    drawArm(a.armA, armLen, 7, '#2e2536', '#0a0709', true);

    // parry flash ring on blade
    if (this.state === 'parry') {
      const k = 1 - this.parryT / 0.24;
      ctx.globalAlpha = 0.7 * (1 - k);
      ctx.strokeStyle = '#bfe7ff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(18, -44, 26 + k * 10, -2.4, 0.9); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (this.parrySuccess > 0 && this.bladeTip) {
      glowCircle(ctx, this.bladeTip.x, this.bladeTip.y, 34 * (this.parrySuccess / 0.5), 'rgba(180,235,255,0.9)', 0.7 * (this.parrySuccess / 0.5));
    }

    ctx.restore();

    // charging aura (not mirrored)
    if (this.getChargeLevel() > 0) {
      const lvl = this.getChargeLevel();
      const pulse = 0.6 + Math.sin(this.world.time * 20) * 0.2;
      const col = lvl >= 3 ? '255,90,60' : lvl === 2 ? '255,160,70' : '255,220,150';
      glowCircle(ctx, this.x + this.facing * 12, this.cy - 4, 44 + lvl * 8, 'rgba(' + col + ',0.5)', pulse * 0.5);
      // orbiting sparks
      for (let i = 0; i < 3 + lvl * 2; i++) {
        const ang = this.world.time * 3 + i * 1.7;
        const rr = 30 + (i % 3) * 9;
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = 'rgba(' + col + ',0.9)';
        ctx.beginPath();
        ctx.arc(this.x + Math.cos(ang) * rr, this.cy - 6 + Math.sin(ang) * rr * 0.55, 1.7, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (lvl >= 3) {
        ctx.strokeStyle = 'rgba(255,120,80,0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(this.x, this.cy - 6, 50, this.world.time * 5, this.world.time * 5 + 2.2);
        ctx.stroke();
      }
    }

    // dash afterimages
    if (this.state === 'dash') {
      ctx.globalAlpha = 0.26;
      ctx.fillStyle = '#7fcfff';
      for (let i = 1; i <= 3; i++) {
        const ox = -this.facing * i * 18;
        roundRect(ctx, this.x + ox - 10, this.top + 4, 20, this.h - 6, 8);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // death overlay tint
    if (this.state === 'dead') {
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#000';
      roundRect(ctx, this.x - 12, this.top, 26, this.h, 8);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}


/* ===== enemy.js ===== */
/* =========================================================
   enemy.js — limb-based foes with telegraphed attacks
   Types:
     gnawer  — 碎骨鬼: fast quadruped-ish brawler, swipes in 3-hit chains
     samurai — 铁面武士: armoured, guards frontally, slow heavy chop
     puppet  — 红玉傀儡: hovering caster, throws reflectable orbs
   ========================================================= */

const ENEMY_TYPES = {
  gnawer: {
    name: '碎骨鬼', hp: 84, w: 34, h: 58, speed: 235, air: false,
    bodyColor: '#4c3a44', bodyDark: '#241a22', accent: '#c9553f',
    poise: 7, mass: 1,
    limbs: [
      { id: 'head', label: '头', hp: 58, r: 11, vital: true, ox: 5, oy: -50 },
      { id: 'armL', label: '左爪', hp: 20, r: 9, ox: -8, oy: -34, func: 'claw' },
      { id: 'armR', label: '右爪', hp: 20, r: 9, ox: 9, oy: -34, func: 'claw' },
      { id: 'legs', label: '下肢', hp: 26, r: 13, ox: 0, oy: -14, func: 'legs' }
    ]
  },
  samurai: {
    name: '铁面武士', hp: 205, w: 40, h: 82, speed: 132, air: false,
    bodyColor: '#3a3f52', bodyDark: '#171a26', accent: '#d8a638',
    poise: 30, mass: 2.1, guard: true,
    limbs: [
      { id: 'head', label: '头盔', hp: 108, r: 14, vital: true, ox: 4, oy: -74 },
      { id: 'armL', label: '左臂', hp: 38, r: 11, ox: -14, oy: -54 },
      { id: 'armR', label: '持刀臂', hp: 54, r: 12, ox: 16, oy: -54, func: 'weapon' },
      { id: 'legs', label: '下肢', hp: 62, r: 15, ox: 0, oy: -20, func: 'legs' }
    ]
  },
  puppet: {
    name: '红玉傀儡', hp: 116, w: 34, h: 74, speed: 152, air: true, hover: 132,
    bodyColor: '#6b2b3c', bodyDark: '#2a0f18', accent: '#ff6b8a',
    poise: 12, mass: 1.3,
    limbs: [
      { id: 'head', label: '玉冠', hp: 72, r: 12, vital: true, ox: 4, oy: -66 },
      { id: 'armL', label: '左臂', hp: 28, r: 10, ox: -15, oy: -46, func: 'cast' },
      { id: 'armR', label: '右臂', hp: 28, r: 10, ox: 16, oy: -46, func: 'cast' },
      { id: 'legs', label: '垂足', hp: 32, r: 12, ox: 0, oy: -12, func: 'legs' }
    ]
  }
};

class Enemy {
  constructor(world, typeKey, x, y) {
    this.world = world;
    this.typeKey = typeKey;
    this.def = ENEMY_TYPES[typeKey];
    this.x = x; this.y = y === undefined ? GROUND_Y : y;
    this.spawnX = x; this.spawnY = this.y;
    this.reset();
  }
  reset() {
    const d = this.def;
    this.maxHp = d.hp;
    this.hp = d.hp;
    this.vx = 0; this.vy = 0;
    this.w = d.w; this.h = d.h;
    this.facing = -1;
    this.dead = false;
    this.deathT = 0;
    this.state = 'spawn';
    this.stateT = 0;
    this.spawnT = 0.45;
    this.anim = { armA: 0.2, armB: 0.2, legA: 0, legB: 0, lean: 0, bob: 0, weaponA: 0.6 };
    this.tellT = 0;
    this.tellTotal = 0;
    this.attackT = 0;
    this.attackKey = null;
    this.attackHitDone = false;
    this.cooldown = rand(0.3, 0.9);
    this.stunT = 0;
    this.knockT = 0;
    this.guardBrokenT = 0;
    this.flash = 0;
    this.hurtFlashT = 0;
    this.limbs = d.limbs.map((L) => ({
      id: L.id, label: L.label, hp: L.hp, maxHp: L.hp, r: L.r,
      vital: !!L.vital, func: L.func || null, ox: L.ox, oy: L.oy,
      severed: false, x: 0, y: 0, hitFlash: 0, wobble: 0
    }));
    this.orbitT = rand(0, 6);
    this.fireCd = rand(1.0, 2.0);
    this.circleDir = Math.random() < 0.5 ? 1 : -1;
    this.mode = 'approach';
    this.modeT = 0;
    this.jumps = 0;
    this.legsImpaired = false;
    this.onGround = true;
    this.hitCount = 0;
    this.lastAttackerX = this.x;
    this.contactCd = 0;
    this.aggro = true;
    this.telegraphSoundPlayed = false;
    this.gnawChain = 0;
    this.lungeDir = 1;
  }

  /* ---------- limb helpers ---------- */
  getLimb(id) { for (const l of this.limbs) if (l.id === id) return l; return null; }
  hasFunc(f) { for (const l of this.limbs) if (l.func === f && !l.severed) return true; return false; }
  armsLive() { return this.limbs.filter((l) => l.func && l.func !== 'legs' && !l.severed).length; }
  get coreLimb() { return this.getLimb('legs') || null; }

  armCount() { return this.hasFunc('claw') || this.hasFunc('weapon') || this.hasFunc('cast'); }

  capability() {
    // returns 0..1 combat capability used by AI decisions
    let alive = 0, total = 0;
    for (const l of this.limbs) { total++; if (!l.severed) alive++; }
    return alive / total;
  }

  updateLimbPositions() {
    const f = this.facing;
    const a = this.anim;
    const bobY = a.bob;
    for (const l of this.limbs) {
      if (l.severed) continue;
      let ox = l.ox * f, oy = l.oy + bobY;
      if (l.func === 'claw' || l.func === 'cast') {
        const ang = (l.id === 'armL' ? a.armB : a.armA);
        ox = l.ox * f + Math.cos(ang - Math.PI / 2) * 16 * f;
        oy = l.oy + bobY + Math.sin(ang - Math.PI / 2) * 16;
      } else if (l.func === 'weapon') {
        const ang = a.weaponA;
        ox = l.ox * f + Math.cos(ang - Math.PI / 2) * 20 * f;
        oy = l.oy + bobY + Math.sin(ang - Math.PI / 2) * 20;
      } else if (l.func === 'legs' && this.onGround) {
        ox = l.ox * f + Math.sin(a.legA) * 6 * f;
        oy = l.oy + bobY + Math.abs(Math.cos(a.legA)) * 2;
      }
      l.x = this.x + ox;
      l.y = this.y + oy;
    }
  }

  /* ---------- hit testing ---------- */
  // returns best limb to hit for a given box, or null => core body
  hitTest(box) {
    const bx1 = box.x, by1 = box.y, bx2 = box.x + box.w, by2 = box.y + box.h;
    let best = null, bestScore = 1e9;
    for (const l of this.limbs) {
      if (l.severed) continue;
      const cx = clamp(l.x, bx1, bx2);
      const cy = clamp(l.y, by1, by2);
      const d = dist(l.x, l.y, cx, cy);
      if (d <= l.r + 7) {
        const score = d
          - (l.func && l.func !== 'legs' ? 12 : 0)
          - (l.vital ? 7 : 0);
        if (score < bestScore) { bestScore = score; best = l; }
      }
    }
    if (best) return best;
    if (rectsOverlap(box, this.hurtbox())) return null;
    return undefined;
  }

  hurtbox() { return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h }; }

  /* ---------- damage ---------- */
  // opts: {dmg, dir, kb, lift, hitstop, heavy, x, y, source}
  takeHit(limb, o) {
    if (this.dead) return { hit: false };
    const w = this.world;
    let dmg = o.dmg;
    let guarded = false;
    // frontal guard for armoured types
    if (this.def.guard && this.guardBrokenT <= 0 && this.state !== 'attack' && this.hasFunc('weapon') && o.dir === -this.facing) {
      if (!o.heavy && !o.unguardable) { dmg *= 0.34; guarded = true; }
    }
    this.hp -= dmg;
    this.hitCount++;
    this.hurtFlashT = 0.14;
    this.lastAttackerX = o.x !== undefined ? o.x : this.x - o.dir * 40;
    // knockback
    const massK = 1 / this.def.mass;
    const kbScale = guarded ? 0.25 : 1;
    const kbAmt = o.kb === undefined ? 120 : o.kb;
    this.vx += o.dir * kbAmt * massK * kbScale;
    let lifted = false;
    if (o.lift && !guarded) {
      this.vy = Math.min(this.vy, -Math.abs(o.lift) * massK * 0.85);
      if (o.lift > 120 || o.lift < -60) lifted = true;
      if (o.lift < -80) { this.vy = Math.min(this.vy, o.lift * massK * 1.2); } // spike
    }
    if (this.def.air && !this.def.hover) { /* n/a */ }
    let broke = null;
    // limb damage
    if (limb) {
      limb.hp -= dmg * (o.limbMul || 1) * (guarded ? 0.3 : 1);
      limb.hitFlash = 0.18;
      limb.wobble = 1;
      if (limb.hp <= 0 && !limb.severed) {
        limb.severed = true;
        broke = limb;
        this.onLimbSevered(limb, o);
      }
    }
    // poise / stagger
    const poiseDmg = o.heavy ? 26 : 8;
    if (!guarded) {
      this.poiseStagger = (this.poiseStagger || 0) + poiseDmg;
      if (broke || o.heavy || this.poiseStagger > this.def.poise) {
        this.poiseStagger = 0;
        if (broke || o.heavy || this.isLightEnemy()) {
          this.stunT = Math.max(this.stunT, o.heavy ? 0.34 : 0.18);
          this.state = 'hurt';
          this.stateT = 0;
        }
      }
    } else {
      this.poiseStagger = 0;
    }
    if (o.heavy) this.guardBrokenT = Math.max(this.guardBrokenT, 1.0);

    // airborne / launched tracking
    if (this.vy < -30 || this.y < GROUND_Y - 1) { this.airborne = true; }

    this.flash = 1;
    this.reactT = o.heavy ? 0.22 : 0.12;
    this.reactMax = this.reactT;
    this.reactDir = o.dir;
    if (this.hp <= 0) this.die(o);

    // if a vital limb was destroyed, die
    if (limb && limb.vital && limb.severed) this.die(o);

    return { hit: true, broke, killed: this.dead, guarded };
  }

  isLightEnemy() { return this.def.mass <= 1.4; }

  onLimbSevered(limb, o) {
    const w = this.world;
    w.stats.limbBreakCount++;
    w.hitstop(o.heavy ? 0.14 : 0.09, false);
    w.cam.shake(o.heavy ? 5.5 : 3.6, 0.22);
    Sfx.sever();
    const dir = o.dir || 1;
    // severed piece flies off
    w.spawnSevered(this, limb, dir, o);
    w.fx.burst(limb.x, limb.y, '#ff4b5c', 16, 420, 3.4, 0.5, 620);
    w.fx.ring(limb.x, limb.y, 6, 54, 'rgba(255,120,120,0.85)', 0.3, 3);
    for (let i = 0; i < 12; i++) {
      w.fx.addPart({ kind: 'shard', x: limb.x, y: limb.y, vx: rand(-260, 260) + dir * 120, vy: rand(-320, -40), life: rand(0.4, 0.8), max: 0.8, size: rand(2, 5), rot: rand(0, TAU), vr: rand(-9, 9), grav: 1300, drag: 0.6, color: '#c9553f' });
    }
    const nm = limb.label || '肢体';
    const enName = { head: 'HEAD', armL: 'LEFT ARM', armR: 'RIGHT ARM', legs: 'LEGS' }[limb.id] || 'LIMB';
    w.fx.word2(limb.x, limb.y - 16, nm + '断裂!', 'SEVERED · ' + enName, '#ff8f7a', 19, 1.05);
    // functional consequences
    if (limb.id === 'legs') {
      this.legsImpaired = true;
      this.def = Object.assign({}, this.def);
      w.fx.word2(this.x, this.y - this.h - 26, '下肢崩毁', 'LEGS CRIPPLED', '#ffb27a', 15, 1.1);
    }
    if (limb.func === 'weapon') {
      w.fx.word2(this.x, this.y - this.h - 24, '失去兵刃', 'DISARMED', '#ffd88a', 17, 1.0);
    }
    if (limb.func === 'claw' || limb.func === 'cast') {
      if (this.armsLive() <= 0) {
        w.fx.word2(this.x, this.y - this.h - 24, '攻击尽失', 'HELPLESS', '#ff9a7a', 15, 1.1);
      }
    }
  }

  die(o) {
    if (this.dead) return;
    this.dead = true;
    this.deathT = 0;
    this.state = 'dead';
    const w = this.world;
    w.stats.killCount++;
    Sfx.kill();
    w.cam.shake(5, 0.24);
    w.hitstop(0.1, false);
    w.fx.word2(this.x, this.y - this.h - 10, '斩!', 'KILL', '#ffe9a8', 22, 0.85);
    w.fx.burst(this.x, this.y - this.h * 0.5, '#ff6a4a', 26, 480, 3.6, 0.7, 800);
    w.fx.ring(this.x, GROUND_Y - 1, 10, 96, 'rgba(255,150,110,0.75)', 0.36, 3);
    // leftover limbs peel off
    for (const l of this.limbs) {
      if (!l.severed) {
        const dir = Math.random() < 0.5 ? -1 : 1;
        l.severed = true;
        w.spawnSevered(this, l, dir, { dir, x: o ? o.x : this.x });
      }
    }
    w.onEnemyKilled(this);
  }

  /* ---------- AI ---------- */
  update(dt) {
    const w = this.world;
    const p = w.player;
    this.flash = Math.max(0, this.flash - dt * 5);
    if (this.reactT > 0) this.reactT = Math.max(0, this.reactT - dt);
    this.hurtFlashT = Math.max(0, this.hurtFlashT - dt);
    this.guardBrokenT = Math.max(0, this.guardBrokenT - dt);
    this.contactCd = Math.max(0, this.contactCd - dt);
    for (const l of this.limbs) { l.hitFlash = Math.max(0, l.hitFlash - dt * 4); l.wobble = Math.max(0, l.wobble - dt * 2.4); }

    if (this.state === 'spawn') {
      this.spawnT -= dt;
      this.anim.bob = Math.sin(w.time * 12) * 2 * this.spawnT;
      if (this.spawnT <= 0) { this.state = 'idle'; }
      this.updateLimbPositions();
      return;
    }
    if (this.dead) {
      this.deathT += dt;
      this.vy += GRAVITY * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.vx *= Math.pow(0.02, dt);
      if (this.y >= GROUND_Y) { this.y = GROUND_Y; this.vy = 0; if (!this.groundHit) { this.groundHit = true; w.fx.dust(this.x, GROUND_Y, 8, 0); } }
      this.anim.lean = lerp(this.anim.lean, -1.3, Math.min(1, dt * 6));
      this.anim.weaponA = lerp(this.anim.weaponA, 0.2, Math.min(1, dt * 4));
      this.updateLimbPositions();
      return;
    }

    const dx = p.x - this.x;
    const dy = (p.y - p.h * 0.5) - (this.y - this.h * 0.5);
    const adx = Math.abs(dx);
    if (p.state !== 'dead') this.facing = (dx === 0 ? this.facing : sign(dx)) * (this.def.air ? this.facing : 1);
    // ground types always face the player unless attacking mid-swing
    if (!this.def.air || this.state !== 'attack') {
      if (p.state !== 'dead') this.facing = dx === 0 ? this.facing : sign(dx);
    }
    this.distToPlayer = adx;

    this.cooldown -= dt;
    this.fireCd -= dt;
    this.modeT -= dt;
    if (this.modeT <= 0) {
      this.modeT = rand(0.5, 1.3);
      if (Math.random() < 0.28) this.circleDir *= -1;
    }

    // stun handling
    if (this.stunT > 0) {
      this.stunT -= dt;
      this.state = 'hurt';
      this.airborne = !this.onGround;
    } else if (this.state === 'hurt') {
      this.state = this.onGround ? 'idle' : 'air';
    }

    const canAct = this.stunT <= 0 && this.state !== 'attack' && p.state !== 'dead';

    if (p.state === 'dead') {
      // idle prowl
      this.vx = approach(this.vx, 0, 900 * dt);
      this.physics(dt);
      this.animUpdate(dt);
      return;
    }

    switch (this.typeKey) {
      case 'gnawer': this.aiGnawer(dt, canAct, dx, adx); break;
      case 'samurai': this.aiSamurai(dt, canAct, dx, adx); break;
      case 'puppet': this.aiPuppet(dt, canAct, dx, adx); break;
    }

    // active attack window resolution
    if (this.state === 'attack') this.resolveAttack(dt);

    this.physics(dt);
    this.animUpdate(dt);
    this.updateLimbPositions();

    // contact damage / soft separation from other enemies
    for (const e of w.enemies) {
      if (e === this || e.dead) continue;
      const d = this.x - e.x;
      const minD = (this.w + e.w) * 0.42;
      if (Math.abs(d) < minD && Math.abs(this.y - e.y) < 40) {
        const push = (minD - Math.abs(d)) * 4 * (d === 0 ? 1 : sign(d));
        this.x += push * dt * 4;
      }
    }
  }

  physics(dt) {
    const d = this.def;
    const hovering = this.def.air && this.def.hover && !this.legsImpaired && !this.dead && this.armsLive() > 0;
    this.vy += (hovering ? 0 : GRAVITY) * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.x = clamp(this.x, ARENA.x1 + 14, ARENA.x2 - 14);
    const floor = GROUND_Y;
    if (this.y >= floor) {
      if (!this.onGround) {
        const impact = this.vy;
        this.onGround = true;
        if (impact > 260) {
          Sfx.land();
          this.world.fx.dust(this.x, floor, Math.min(14, 4 + impact / 140), 0);
          this.world.fx.ring(this.x, floor - 1, 8, 40 + Math.min(70, impact / 16), 'rgba(220,200,180,0.5)', 0.28, 2);
          if (impact > 900) {
            this.world.cam.shake(2.4, 0.14);
            if (this.airborne) {
              // landing damage from being launched
              this.hp -= 8;
              this.world.fx.damage(this.x, this.y - this.h * 0.5, 8, '#ffbf8a');
              if (this.hp <= 0) this.die({ dir: 0, x: this.x });
            }
          }
          this.vx *= 0.5;
        }
      }
      this.y = floor;
      this.vy = 0;
      this.airborne = false;
    } else {
      this.onGround = false;
    }
    // ground friction
    const fr = this.onGround ? (this.state === 'attack' ? 6 : 4.2) : 0.7;
    this.vx *= Math.pow(1 - Math.min(0.9, fr * 0.24), dt * 60 / 60 * 1);
    if (this.def.hover) {
      // hard altitude band so retreat impulses can never float it out of reach;
      // it dives to a hittable height for the duration of its cast (risk/reward window)
      if (!this.legsImpaired && !this.dead && (this.armsLive() > 0 || this.state === 'attack')) {
        const diving = this.state === 'attack' && this.attackKey === 'puppetCast';
        const target = GROUND_Y - (diving ? 34 : this.def.hover);
        const band = 26;
        if (this.y < target - band) this.y = target - band;
        if (this.y > target + band) this.y = target + band;
        if (this.y < target - 2) this.vy = Math.max(this.vy, 90);
        else if (this.y > target + 2) this.vy = Math.min(this.vy, -90);
        else this.vy *= 0.6;
        this.vx *= Math.pow(0.02, dt);
      }
    }
  }

  moveToward(tx, speed, dt, keepDist) {
    const dx = tx - this.x;
    const desired = keepDist ? clamp(dx - sign(dx) * keepDist, -1, 1) : clamp(dx, -1, 1);
    const spd = speed * (this.legsImpaired ? 0.42 : 1);
    if (Math.abs(dx) > 6 || !keepDist) {
      this.vx = approach(this.vx, sign(desired === 0 ? dx : desired) * spd, 2400 * dt);
    } else {
      this.vx = approach(this.vx, 0, 2400 * dt);
    }
  }

  startAttack(key) {
    if (this.armsLive() <= 0) return false;
    this.state = 'attack';
    this.attackKey = key;
    this.attackT = 0;
    this.attackHitDone = false;
    this.leapDone = false;
    this.telegraphSoundPlayed = false;
    const a = ATTACKS_ENEMY[key];
    this.tellT = a.tell;
    this.tellTotal = a.tell;
    this.vx *= 0.3;
    return true;
  }

  resolveAttack(dt) {
    const a = ATTACKS_ENEMY[this.attackKey];
    if (!a) { this.state = 'idle'; return; }
    this.attackT += dt;
    // telegraph phase
    if (this.attackT < a.tell) {
      if (!this.telegraphSoundPlayed && this.attackT > a.tell - 0.22) {
        this.telegraphSoundPlayed = true;
        Sfx.charge(this.typeKey === 'samurai' ? 1 : 0);
      }
      // aim during windup (ground types only turn slowly)
      const p = this.world.player;
      if (a.track && this.attackT < a.tell * 0.7) {
        this.facing = p.x === this.x ? this.facing : sign(p.x - this.x);
      }
      if (a.advance) this.vx = approach(this.vx, this.facing * a.advance * 0.4 * (this.legsImpaired ? 0.35 : 1), 2000 * dt);
      return;
    }
    if (this.attackT < a.tell + a.active) {
      if (a.advance && !this.attackHitDone) {
        this.vx = approach(this.vx, this.facing * a.advance * (this.legsImpaired ? 0.35 : 1), 5200 * dt);
      }
      if (a.leap && this.onGround && !this.leapDone) {
        this.leapDone = true;
        this.vy = this.legsImpaired ? -260 : -560;
        this.onGround = false;
        this.world.fx.dust(this.x, GROUND_Y, 5, -this.facing);
      }
      if (a.spawnOrb && !this.attackHitDone) {
        this.attackHitDone = true;
        this.world.spawnOrb(this, this.facing);
      }
      if (!a.spawnOrb && !this.attackHitDone) {
        const box = this.attackBox(a);
        const dmgMul = (this.typeKey === 'samurai' && a.weaponWind !== undefined) ? 0.6 : 1;
        const p = this.world.player;
        if (p.state !== 'dead' && rectsOverlap(box, p.hitbox())) {
          this.attackHitDone = true;
          this.world.enemyHitsPlayer(this, Math.round(a.damage * dmgMul), a);
        }
      }
      if (a.multi && this.attackT > a.tell + a.active * 0.5 && !this.multi2) {
        this.multi2 = true;
        const box = this.attackBox(a);
        const p = this.world.player;
        if (p.state !== 'dead' && rectsOverlap(box, p.hitbox())) this.world.enemyHitsPlayer(this, a.damage * 0.8, a);
      }
      return;
    }
    if (this.attackT >= a.tell + a.active + a.recover) {
      this.state = 'idle';
      this.cooldown = a.cd * rand(0.8, 1.3);
      this.multi2 = false;
      this.gnawChain = (this.gnawChain || 0);
    }
  }

  attackBox(a) {
    const f = this.facing;
    return {
      x: this.x + (f > 0 ? a.box.ox : -a.box.ox - a.box.w),
      y: this.y + a.box.oy,
      w: a.box.w, h: a.box.h
    };
  }

  /* ---------- per-type AI ---------- */
  aiGnawer(dt, canAct, dx, adx) {
    const a = ATTACKS_ENEMY.gnawClaw;
    if (!canAct) return;
    if (this.armsLive() <= 0) {
      // helpless: hold its ground so the player can finish it (no endless chase)
      const dxp = this.world.player.x - this.x;
      if (Math.abs(dxp) < 46) this.vx = approach(this.vx, -sign(dxp) * this.def.speed * 0.22, 900 * dt);
      else this.vx = approach(this.vx, 0, 900 * dt);
      return;
    }
    this.gnawChain = this.gnawChain || 0;
    const reach = 62;
    if (adx > reach && this.cooldown <= 0) {
      this.moveToward(this.world.player.x + this.circleDir * 10, this.def.speed, dt);
      // occasional pounce
      if (!this.legsImpaired && adx > 190 && adx < 400 && this.onGround && Math.random() < dt * 0.55) {
        this.vx = sign(dx) * this.def.speed * 2.1;
        this.vy = -430;
      }
    } else if (adx > reach) {
      this.moveToward(this.world.player.x + this.circleDir * 46, this.def.speed * 0.8, dt, 40);
    } else {
      if (this.cooldown <= 0) {
        const chainKeys = ['gnawClaw', 'gnawClaw2', 'gnawLeap'];
        const key = chainKeys[this.gnawChain % 3];
        if (this.startAttack(key)) {
          this.gnawChain = (this.gnawChain + 1) % 3;
          if (key !== 'gnawClaw') this.cooldown = 0.02;
        }
      } else {
        this.vx = approach(this.vx, 0, 1400 * dt);
      }
    }
  }

  aiSamurai(dt, canAct, dx, adx) {
    if (!canAct) return;
    if (this.armsLive() <= 0) {
      // helpless: hold its ground so the player can finish it (no endless chase)
      const dxp = this.world.player.x - this.x;
      if (Math.abs(dxp) < 46) this.vx = approach(this.vx, -sign(dxp) * this.def.speed * 0.22, 900 * dt);
      else this.vx = approach(this.vx, 0, 900 * dt);
      return;
    }
    const reach = 78;
    const p = this.world.player;
    if (this.guardBrokenT > 0) {
      // reeling: back off a step
      this.moveToward(p.x - this.facing * 60, this.def.speed * 0.6, dt, 0);
      return;
    }
    if (adx > reach) {
      const spd = this.legsImpaired ? this.def.speed * 0.4 : this.def.speed;
      this.moveToward(p.x, spd * (adx > 300 ? 1 : 0.78), dt);
      if (this.cooldown <= 0 && adx > 150 && adx < 330 && Math.random() < dt * 0.5) {
        this.startAttack('samuraiLunge');
      }
    } else if (this.cooldown <= 0) {
      if (Math.random() < 0.6) this.startAttack('samuraiChop');
      else this.startAttack('samuraiLunge');
    } else {
      this.vx = approach(this.vx, 0, 900 * dt);
      if (adx < 46) this.vx = approach(this.vx, -this.facing * 60, 900 * dt);
      else this.moveToward(p.x, this.def.speed * 0.5, dt, 60);
    }
  }

  aiPuppet(dt, canAct, dx, adx) {
    const p = this.world.player;
    this.orbitT += dt;
    if (this.legsImpaired) {
      // grounded crawler: lobs short-range orbs
      if (!canAct) return;
      if (this.fireCd <= 0 && adx < 420 && this.armsLive() > 0) { this.startAttack('puppetCast'); }
      else this.moveToward(p.x, this.def.speed * 0.35, dt, 190);
      return;
    }
    if (!canAct) return;
    if (this.armsLive() <= 0) {
      // helpless: drifts and tries to ram
      this.moveToward(p.x, this.def.speed * 0.5, dt, 0);
      return;
    }
    if (adx < 220 && Math.random() < dt * 0.9) {
      // retreat: teleport-drift away
      this.vx = -sign(dx) * this.def.speed * 1.5 * (this.legsImpaired ? 0.4 : 1);
      if (this.y > GROUND_Y - this.def.hover - 10) this.vy = -120;
      this.world.fx.burst(this.x, this.y - this.h * 0.5, '#ff6b8a', 10, 240, 2.4, 0.4, 120);
    } else {
      this.moveToward(p.x + Math.sin(this.orbitT * 1.2) * 60, this.def.speed * 0.7, dt, 250);
    }
    if (this.fireCd <= 0 && adx < 620) {
      this.startAttack('puppetCast');
      this.fireCd = rand(1.5, 2.4);
    }
  }

  /* ---------- animation ---------- */
  animUpdate(dt) {
    const a = this.anim;
    const t = this.world.time;
    let tArmA = 0.4, tArmB = 0.4, tLegA = 0, tLegB = 0, tLean = 0, tWeapon = 0.9;
    const spdK = clamp(Math.abs(this.vx) / this.def.speed, 0, 1.4);
    if (this.state === 'attack') {
      const A = ATTACKS_ENEMY[this.attackKey];
      if (A) {
        const k = clamp(this.attackT / A.tell, 0, 1);
        const hitK = clamp((this.attackT - A.tell) / A.active, 0, 1);
        const recK = clamp((this.attackT - A.tell - A.active) / A.recover, 0, 1);
        const W = A.wind || -2.2, F = A.follow || 2.1;
        if (this.attackT < A.tell) {
          tArmA = lerp(0.4, W, easeOutQuad(k));
          tArmB = lerp(0.4, W * 0.5, easeOutQuad(k));
          tLean = -0.22 - k * 0.1;
          tWeapon = A.weaponWind === undefined ? W : A.weaponWind;
        } else if (this.attackT < A.tell + A.active + A.recover * 0.2) {
          const kk = easeOutCubic(Math.min(1, hitK * 1.7));
          tArmA = lerp(W, F, kk);
          tArmB = lerp(W * 0.5, F * 0.8, kk);
          tLean = 0.24;
          tWeapon = A.weaponFollow === undefined ? F : A.weaponFollow;
        } else {
          tArmA = lerp(F, 0.4, easeOutQuad(recK));
          tArmB = lerp(F * 0.8, 0.4, easeOutQuad(recK));
          tLean = lerp(0.2, 0.02, recK);
          tWeapon = lerp(F, 0.9, easeOutQuad(recK));
        }
      }
    } else if (this.state === 'hurt') {
      tLean = -0.4; tArmA = -0.9; tArmB = -0.7; tWeapon = -0.4;
    } else if (this.dead) {
      tLean = -1.3; tArmA = -1.5; tArmB = -1.2; tWeapon = 0.2;
    } else {
      tLegA = Math.sin(t * 11 + this.spawnX * 0.1) * 0.7 * spdK;
      tLegB = -tLegA;
      tArmA = 0.4 + Math.sin(t * 9) * 0.25 * spdK;
      tArmB = 0.4 - Math.sin(t * 9) * 0.25 * spdK;
      tLean = 0.1 * spdK * sign(this.vx || 1) * (this.facing > 0 ? 1 : -1);
      tWeapon = 0.9 + Math.sin(t * 7) * 0.1;
    }
    const sp = Math.min(1, dt * 16);
    a.armA = lerp(a.armA, tArmA, sp);
    a.armB = lerp(a.armB, tArmB, sp);
    a.legA = lerp(a.legA, tLegA, sp);
    a.legB = lerp(a.legB, tLegB, sp);
    a.lean = lerp(a.lean, tLean, sp);
    a.weaponA = lerp(a.weaponA, tWeapon, Math.min(1, dt * 18));
    const bobTarget = this.def.air ? Math.sin(t * 3.2 + this.spawnX) * 5 : (this.state === 'idle' ? Math.sin(t * 3 + this.spawnX) * 1.6 : 0);
    a.bob = lerp(a.bob, bobTarget, Math.min(1, dt * 6));
    if (this.reactT > 0) {
      const k = this.reactT / (this.reactMax || 0.1);
      a.lean -= this.reactDir * this.facing * 0.42 * k;
      a.bob += Math.sin(k * Math.PI) * 3;
    }
  }

  /* ---------- draw ---------- */
  draw(ctx) {
    const d = this.def, a = this.anim;
    const f = this.facing;
    if (this.dead && this.deathT > 2.2) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    // shadow
    const shScale = this.def.air ? clamp(1 - (GROUND_Y - this.y) / 400, 0.35, 1) : 1;
    ctx.globalAlpha = 0.32 * shScale;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(0, GROUND_Y - this.y, this.w * 0.62 * shScale, 5.5 * shScale, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.scale(f, 1);
    ctx.save();
    ctx.rotate(a.lean * 0.45);
    const tintK = this.hurtFlashT > 0 ? Math.min(1, this.hurtFlashT / 0.14) : 0;
    const dark = d.bodyDark;
    const body = tintK > 0.5 ? '#c98f92' : d.bodyColor;

    // legs
    const legL = this.getLimb('legs');
    if (!legL.severed) {
      const swing = this.legsImpaired ? 0.1 : Math.sin(a.legA) * 13;
      capsule(ctx, -5, -24, -5 + swing, -2, 7, 5, true);
      ctx.fillStyle = body; ctx.fill(); ctx.strokeStyle = dark; ctx.lineWidth = 1.3; ctx.stroke();
      capsule(ctx, 5, -24, 5 - swing, -2, 7, 5, true);
      ctx.fillStyle = body; ctx.fill(); ctx.strokeStyle = dark; ctx.lineWidth = 1.3; ctx.stroke();
    } else {
      // stumps
      ctx.fillStyle = '#5a1f22';
      ctx.beginPath(); ctx.ellipse(-5, -20, 5, 7, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(5, -20, 5, 7, 0, 0, TAU); ctx.fill();
    }

    // torso
    poly(ctx, [[-11, -54], [12, -54], [14, -24], [-13, -24]]);
    ctx.fillStyle = body; ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6; ctx.stroke();
    if (this.typeKey === 'samurai') {
      poly(ctx, [[-12, -50], [13, -50], [14, -38], [-13, -38]]);
      ctx.fillStyle = this.guardBrokenT > 0 ? '#8a6b2a' : '#4a5068';
      ctx.fill(); ctx.strokeStyle = dark; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.strokeStyle = d.accent; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-12, -44); ctx.lineTo(13, -44); ctx.stroke();
    }
    if (this.typeKey === 'puppet') {
      // jade core
      const pulse = 0.6 + Math.sin(this.world.time * 6) * 0.4;
      glowCircle(ctx, 0, -40, 14, 'rgba(255,90,130,' + (0.35 * pulse) + ')', 1);
      ctx.beginPath(); ctx.arc(0, -40, this.armsLive() > 0 ? 5.5 : 2.5, 0, TAU);
      ctx.fillStyle = '#ff9ab0'; ctx.fill();
    }

    // arms
    const drawArm = (limbId, ang, len, col, withWeapon) => {
      const l = this.getLimb(limbId);
      const shoulderY = -52;
      if (!l.severed) {
        const ex = Math.sin(ang) * len;
        const ey = shoulderY + Math.cos(ang) * len;
        capsule(ctx, 0, shoulderY, ex, ey, 6, 5);
        ctx.fillStyle = col; ctx.fill();
        ctx.strokeStyle = dark; ctx.lineWidth = 1.2; ctx.stroke();
        if (withWeapon && this.typeKey === 'samurai') {
          const wa = a.weaponA;
          const hx = ex, hy = ey;
          const tx = hx + Math.sin(wa) * 58;
          const ty = hy + Math.cos(wa) * 58;
          ctx.strokeStyle = '#b9c6d2'; ctx.lineWidth = 5;
          ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.8;
          ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
        }
        if (l.hitFlash > 0) { ctx.globalAlpha = l.hitFlash * 3; ctx.fillStyle = '#fff'; ctx.fill(); ctx.globalAlpha = 1; }
      } else {
        ctx.fillStyle = '#5a1f22';
        ctx.beginPath(); ctx.arc(0, shoulderY, 5.5, 0, TAU); ctx.fill();
      }
    };
    drawArm('armB' === 'x' ? 'armL' : 'armL', a.armB * 1.15 + 0.15, 17, dark, false);
    drawArm('armR', a.armA, 18, body, true);

    // head
    const hl = this.getLimb('head');
    if (!hl.severed) {
      const hy = this.typeKey === 'gnawer' ? -62 : -66;
      ctx.save();
      ctx.translate(2, hy + a.bob * 0.3);
      ctx.rotate(a.lean * 0.2);
      ctx.beginPath(); ctx.arc(0, 0, this.typeKey === 'samurai' ? 11 : 9.5, 0, TAU);
      ctx.fillStyle = body; ctx.fill();
      ctx.strokeStyle = dark; ctx.lineWidth = 1.4; ctx.stroke();
      // eyes / mask
      ctx.fillStyle = this.state === 'attack' && this.attackT < (ATTACKS_ENEMY[this.attackKey] || {}).tell ? '#fff04a' : d.accent;
      if (this.typeKey === 'samurai') {
        poly(ctx, [[-9, -3], [9, -3], [7, 7], [-7, 7]]);
        ctx.fillStyle = '#8e2b2b'; ctx.fill();
        ctx.strokeStyle = '#d8a638'; ctx.lineWidth = 1.1; ctx.stroke();
        ctx.fillStyle = '#ffdc5a';
        ctx.fillRect(-6, -1, 4, 2);
        ctx.fillRect(2, -1, 4, 2);
        // horns
        poly(ctx, [[-8, -8], [-13, -20], [-4, -9]]); ctx.fillStyle = '#c8b06a'; ctx.fill();
        poly(ctx, [[8, -8], [13, -20], [4, -9]]); ctx.fillStyle = '#c8b06a'; ctx.fill();
      } else if (this.typeKey === 'puppet') {
        poly(ctx, [[-8, -4], [8, -4], [5, 6], [-5, 6]]);
        ctx.fillStyle = '#f4dfe4'; ctx.fill();
        ctx.strokeStyle = '#a8455e'; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = '#ff3b6b';
        ctx.beginPath(); ctx.arc(-3.5, 0, 1.7, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(3.5, 0, 1.7, 0, TAU); ctx.fill();
        // crown
        poly(ctx, [[-7, -8], [0, -18], [7, -8]]);
        ctx.fillStyle = '#e8477a'; ctx.fill();
      } else {
        // gnawer: jagged maw
        poly(ctx, [[-8, -3], [9, 1], [3, 8], [-7, 5]]);
        ctx.fillStyle = '#e8e2cf'; ctx.fill();
        ctx.strokeStyle = '#6b5f4a'; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = '#ff3b2f';
        ctx.beginPath(); ctx.arc(-2, -1, 2.1, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(4, 0, 2.1, 0, TAU); ctx.fill();
        // spikes
        poly(ctx, [[-8, -6], [-3, -15], [0, -6]]); ctx.fillStyle = '#8a7a63'; ctx.fill();
      }
      if (hl.hitFlash > 0) { ctx.globalAlpha = hl.hitFlash * 3; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
      ctx.restore();
    } else {
      ctx.fillStyle = '#5a1f22';
      ctx.beginPath(); ctx.arc(2, -60, 6, 0, TAU); ctx.fill();
    }

    ctx.restore(); // lean
    ctx.restore(); // facing

    // --- telegraph & state overlays (world space, unmirrored) ---
    if (this.state === 'attack') {
      const A = ATTACKS_ENEMY[this.attackKey];
      if (A) {
        if (this.attackT < A.tell) {
          const k = this.attackT / A.tell;
          const f2 = this.facing;
          // ground reach marker
          ctx.save();
          ctx.globalAlpha = 0.18 + k * 0.32;
          ctx.strokeStyle = this.typeKey === 'samurai' ? 'rgba(255,90,70,0.95)' : 'rgba(255,170,80,0.9)';
          ctx.lineWidth = 2 + k * 2;
          const bx = this.x + (f2 > 0 ? A.box.ox : -A.box.ox - A.box.w);
          const by = this.y + A.box.oy;
          roundRect(ctx, bx, by, A.box.w, A.box.h, 6);
          ctx.stroke();
          // fill sweep showing timing
          ctx.globalAlpha = 0.08 + k * 0.14;
          ctx.fillStyle = this.typeKey === 'samurai' ? 'rgba(255,80,60,0.7)' : 'rgba(255,170,80,0.6)';
          const w2 = A.box.w * k;
          roundRect(ctx, f2 > 0 ? bx : bx + A.box.w - w2, by, w2, A.box.h, 6);
          ctx.fill();
          ctx.restore();
          // warning mark
          if (k > 0.55) {
            ctx.save();
            ctx.globalAlpha = (k - 0.55) / 0.45;
            ctx.fillStyle = '#ff4a3a';
            ctx.font = '900 22px "Trebuchet MS",sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('!', this.x, this.y - this.h - 14);
            ctx.restore();
          }
        } else if (this.attackT < A.tell + A.active) {
          const k = (this.attackT - A.tell) / A.active;
          ctx.save();
          ctx.globalAlpha = (1 - k) * 0.9;
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = A.slashColor || 'rgba(255,220,180,0.9)';
          ctx.lineWidth = 12 * (1 - k) + 3;
          const cx2 = this.x + this.facing * 26;
          const cy2 = this.y - this.h * 0.5;
          ctx.beginPath();
          ctx.arc(cx2, cy2, A.slashR || 72, (this.facing > 0 ? -1.1 : Math.PI + 1.1), (this.facing > 0 ? 1.1 : Math.PI - 1.1), this.facing < 0);
          ctx.stroke();
          ctx.restore();
        }
      }
    }
    if (this.guardBrokenT > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(this.guardBrokenT, 0, 1) * 0.8;
      ctx.strokeStyle = '#ffd76a';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(this.x, this.y - this.h * 0.5, this.w * 0.9, 0, TAU * clamp(this.guardBrokenT, 0, 1)); ctx.stroke();
      ctx.restore();
    }
    if (this.flash > 0.02) {
      ctx.save();
      ctx.globalAlpha = this.flash * 0.16;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = '#ffd9c0';
      roundRect(ctx, this.x - this.w * 0.5, this.y - this.h - 2, this.w, this.h + 2, 8);
      ctx.fill();
      ctx.restore();
    }
  }
}
