<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>绯月 · 断刃 — 横版斩击试炼</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #06040a;
  overflow: hidden;
  color: #f0e2c8;
  font-family: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}
#app {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 50% 38%, #1a0d17 0%, #08050c 62%, #030206 100%);
  overflow: hidden;
}
#app::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 1px, transparent 3px);
  opacity: 0.35;
  z-index: 3;
}
canvas#stage {
  display: block;
  position: relative;
  z-index: 1;
  background: #07040a;
  box-shadow:
    0 0 0 1px rgba(210,170,110,0.22),
    0 0 60px rgba(120,20,40,0.35),
    0 30px 80px rgba(0,0,0,0.8);
  border-radius: 3px;
}
#overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.hidden { display: none !important; }

#titlePanel {
  pointer-events: none;
  text-align: center;
  padding: 28px 40px 24px;
  background: linear-gradient(180deg, rgba(14,7,13,0.86) 0%, rgba(10,5,10,0.94) 100%);
  border: 1px solid rgba(214,168,96,0.32);
  border-radius: 6px;
  box-shadow: 0 20px 70px rgba(0,0,0,0.7), inset 0 0 60px rgba(130,20,40,0.12);
  max-width: min(560px, 88vw);
  animation: panelIn 0.5s ease-out both;
}
@keyframes panelIn {
  from { opacity: 0; transform: translateY(12px) scale(0.985); }
  to { opacity: 1; transform: none; }
}
#titlePanel .kanji {
  font-size: clamp(34px, 6vw, 52px);
  font-weight: 900;
  letter-spacing: 8px;
  color: #f4dfb4;
  text-shadow: 0 0 24px rgba(255,90,70,0.35), 0 2px 0 rgba(0,0,0,0.6);
}
#titlePanel .kanji span { color: #d8433c; }
#titlePanel .sub {
  margin-top: 6px;
  font-size: 11px;
  letter-spacing: 6px;
  color: rgba(214,180,130,0.6);
}
#titlePanel .rule {
  width: 84%;
  height: 1px;
  margin: 16px auto;
  background: linear-gradient(90deg, transparent, rgba(216,64,60,0.7), transparent);
}
#titlePanel .prompt {
  font-size: 15px;
  color: #ffd9a4;
  letter-spacing: 1px;
  animation: breathe 1.8s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
#titlePanel b { color: #fff1cf; }
#titlePanel .controls-title {
  margin: 18px 0 8px;
  font-size: 11px;
  letter-spacing: 7px;
  color: rgba(220,190,150,0.55);
}
#titlePanel .keys {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 20px;
  text-align: left;
  font-size: 12px;
  color: rgba(232,218,194,0.82);
}
#titlePanel .keys div { display: flex; align-items: center; gap: 5px; }
#titlePanel .keys span { margin-left: 4px; }
kbd {
  display: inline-block;
  min-width: 19px;
  padding: 2px 5px;
  border-radius: 3px;
  background: rgba(255,230,190,0.1);
  border: 1px solid rgba(255,215,170,0.32);
  font-family: inherit;
  font-size: 11px;
  font-weight: 800;
  color: #ffe9c4;
  text-align: center;
  line-height: 1.2;
}
#titlePanel .tip {
  margin-top: 14px;
  font-size: 11px;
  color: rgba(200,170,140,0.55);
  letter-spacing: 0.5px;
}

#deathPanel {
  pointer-events: none;
  text-align: center;
  padding: 34px 56px 30px;
  background: linear-gradient(180deg, rgba(20,6,10,0.9), rgba(9,3,6,0.95));
  border: 1px solid rgba(214,70,60,0.4);
  border-radius: 6px;
  box-shadow: 0 20px 80px rgba(0,0,0,0.8), inset 0 0 80px rgba(180,20,30,0.2);
  animation: panelIn 0.45s ease-out both;
}
#deathPanel .dead-title {
  font-size: 54px;
  font-weight: 900;
  letter-spacing: 16px;
  color: #ff6a58;
  text-shadow: 0 0 30px rgba(255,40,40,0.5);
}
#deathPanel .dead-sub {

  margin-top: 20px;

#muteBtn {
  position: absolute;
  right: 14px;
  bottom: 12px;
  z-index: 5;
  padding: 7px 13px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  color: rgba(240,222,190,0.85);
  background: rgba(14,8,14,0.78);
  border: 1px solid rgba(214,168,96,0.3);
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
#muteBtn:hover { background: rgba(40,18,24,0.9); border-color: rgba(240,190,110,0.55); }
#muteBtn:focus { outline: none; }

</style>

<body>
<div id="app">
  <canvas id="stage" width="960" height="540" aria-label="绯月断刃 战斗场景"></canvas>
  <div id="overlay">
    <div id="titlePanel">
      <div class="kanji">绯月 <span>·</span> 断刃</div>
      <div class="sub">CRIMSON MOON · BROKEN BLADE</div>
      <div class="rule"></div>
      <div class="prompt">按 <b>Enter</b> 或 点击画面 开始</div>
      <div class="controls-title">操 作</div>
      <div class="keys">
        <div><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd><span>移动</span></div>
        <div><kbd>Space</kbd><span>跳跃</span></div>
        <div><kbd>J</kbd><span>轻斩 · 四段连击，四段挑空</span></div>
        <div><kbd>K</kbd><span>按住蓄力 · 重斩，破肢体</span></div>
        <div><kbd>L</kbd><span>瞬步闪避（带无敌帧）</span></div>
        <div><kbd>I</kbd><span>弹反 · 精准架开</span></div>
        <div><kbd>R</kbd><span>重新开始</span></div>
        <div><kbd>1</kbd><span>月轮斩 · 360° 刀轮</span></div>
        <div><kbd>2</kbd><span>影袭 · 瞬身斩痕引爆</span></div>
        <div><kbd>3</kbd><span>刃雨 · 灵刃天降</span></div>
        <div><kbd>4</kbd><span>千刃一闪 · 终式</span></div>
      </div>
      <div class="tip">挑空后跳起追击 · 空中按 K 下劈 · 弹反红玉 · 技能 1-4 有冷却，随时可用</div>
    </div>
    <div id="deathPanel" class="hidden">
      <div class="dead-title">败 北</div>
      <div class="dead-sub">斩击已尽，绯月未落</div>
      <div class="dead-prompt">按 <b>R</b> 或 <b>Enter</b> 重新踏阵</div>
    </div>
  </div>
  <button id="muteBtn" title="静音 / 取消静音">♪ 音效 开</button>
</div>
<script>
(function(){
"use strict";

/* ===== util.js ===== */
/* =========================================================
   util.js — math, input, camera, vector drawing helpers
   ========================================================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const sign = (v) => (v < 0 ? -1 : 1);
const approach = (v, target, delta) => (v < target ? Math.min(v + delta, target) : Math.max(v - delta, target));
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeOutQuad = (t) => 1 - (1 - t) * (1 - t);
const easeInQuad = (t) => t * t;
const easeOutBack = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

/* ---- rect / arc overlap ---- */
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
// distance from point to line segment
function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  if (l2 === 0) return dist(px, py, x1, y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / l2;
  t = clamp(t, 0, 1);
  return dist(px, py, x1 + t * dx, y1 + t * dy);
}

/* =========================================================
   Input
   ========================================================= */
const KEY_ACTIONS = {
  KeyA: 'left', ArrowLeft: 'left',
  KeyD: 'right', ArrowRight: 'right',
  Space: 'jump',
  KeyJ: 'attack',
  KeyK: 'heavy',
  KeyL: 'dash',
  KeyI: 'special',
  KeyR: 'restart',
  Enter: 'confirm',
  KeyP: 'pause',
  Digit1: 'skill1', Numpad1: 'skill1',
  Digit2: 'skill2', Numpad2: 'skill2',
  Digit3: 'skill3', Numpad3: 'skill3',
  Digit4: 'skill4', Numpad4: 'skill4'
};

class Input {
  constructor() {
    this.down = Object.create(null);       // action -> bool
    this.pressed = Object.create(null);    // action -> frames since press (for buffer)
    this.released = Object.create(null);
    this.bufferFrames = 9;
    this.anyKeyThisFrame = false;
    this.attach();
  }
  attach() {
    window.addEventListener('keydown', (e) => {
      const a = KEY_ACTIONS[e.code];
      if (a) {
        e.preventDefault();
        if (!e.repeat) {
          this.down[a] = true;
          this.pressed[a] = 0;
          this.anyKeyThisFrame = true;
        }
      }
      // also block page scroll on space/arrows even if unmapped
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
    }, { passive: false });
    window.addEventListener('keyup', (e) => {
      const a = KEY_ACTIONS[e.code];
      if (a) { this.down[a] = false; this.released[a] = true; e.preventDefault(); }
    }, { passive: false });
    window.addEventListener('blur', () => this.clear());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.clear(); });
  }
  clear() {
    for (const k in this.down) this.down[k] = false;
    for (const k in this.pressed) delete this.pressed[k];
    for (const k in this.released) delete this.released[k];
  }
  // call at end of each sim step
  step() {
    for (const k in this.pressed) {
      this.pressed[k]++;
      if (this.pressed[k] > this.bufferFrames) delete this.pressed[k];
    }
    for (const k in this.released) delete this.released[k];
    this.anyKeyThisFrame = false;
  }
  // consume a buffered press (returns true once)
  consume(action) {
    if (this.pressed[action] !== undefined) { delete this.pressed[action]; return true; }
    return false;
  }
  buffered(action) { return this.pressed[action] !== undefined; }
  held(action) { return !!this.down[action]; }
  clearBuffer(action) { delete this.pressed[action]; }
}

/* =========================================================
   Camera — follow with lookahead, clamp to arena, shake, zoom punch
   ========================================================= */
class Camera {
  constructor() {
    this.x = 0; this.y = 0;
    this.vw = 960; this.vh = 540;
    this.shakeMag = 0; this.shakeT = 0; this.shakeDur = 0.2;
    this.offX = 0; this.offY = 0;
    this.zoom = 1; this.zoomTarget = 1;
    this.zoomKick = 0;
    this._seed = Math.random() * 1000;
  }
  resize(vw, vh) { this.vw = vw; this.vh = vh; }
  shake(mag, dur) {
    // never stack into endless rumble: take the strongest, keep it short
    if (mag >= this.shakeMag || this.shakeT <= 0) { this.shakeMag = Math.min(mag, 11); }
    this.shakeDur = dur || 0.18;
    this.shakeT = Math.max(this.shakeT, this.shakeDur);
  }
  punch(amount) { this.zoomKick = Math.max(this.zoomKick, amount); }
  update(dt, world) {
    const p = world.player;
    let tx = p ? p.x + p.facing * 40 : 0;
    let ty = (p ? p.y : 400) - 60;
    // lookahead toward nearest living enemy in front/behind
    let nearest = null, nd = 1e9;
    for (const e of world.enemies) {
      if (e.dead) continue;
      const d = Math.abs(e.x - (p ? p.x : 0));
      if (d < nd) { nd = d; nearest = e; }
    }
    if (nearest && p) {
      const t = clamp(1 - nd / 620, 0, 1) * 0.55;
      tx = lerp(tx, (p.x * 0.45 + nearest.x * 0.55), t);
      ty = lerp(ty, Math.min(p.y, nearest.y) - 80, t * 0.8);
    }
    // keep player (and fight) roughly in frame
    tx = clamp(tx, p ? p.x - 150 : -1e9, p ? p.x + 150 : 1e9);
    const halfW = this.vw / 2, halfH = this.vh / 2;
    const arenaMin = world.arena.x1 + halfW * 0.72;
    const arenaMax = world.arena.x2 - halfW * 0.72;
    if (arenaMin <= arenaMax) tx = clamp(tx, arenaMin, arenaMax);
    else tx = (world.arena.x1 + world.arena.x2) / 2;
    ty = clamp(ty, -260, 300);
    const k = 1 - Math.pow(0.001, dt);
    this.x = lerp(this.x, tx, k * 0.9);
    this.y = lerp(this.y, ty, k * 0.75);

    // shake decay
    if (this.shakeT > 0) {
      this.shakeT = Math.max(0, this.shakeT - dt);
      const t = this.shakeT / this.shakeDur;
      const mag = this.shakeMag * t * t;
      this._seed += dt * 61;
      this.offX = Math.sin(this._seed * 37.1) * mag;
      this.offY = Math.cos(this._seed * 27.7) * mag * 0.7;
      if (this.shakeT === 0) { this.shakeMag = 0; this.offX = 0; this.offY = 0; }
    } else { this.offX = 0; this.offY = 0; }

    this.zoomKick = Math.max(0, this.zoomKick - dt * 3.2);
    this.zoom = 1 + easeOutQuad(this.zoomKick) * 0.03;
  }
  apply(ctx) {
    ctx.translate(this.vw / 2, this.vh / 2);
    ctx.scale(this.zoom, this.zoom);
    ctx.translate(-this.vw / 2, -this.vh / 2);
    ctx.translate(Math.round(-this.x + this.vw / 2 + this.offX), Math.round(-this.y + this.vh / 2 + this.offY));
  }
}

/* =========================================================
   Shape helpers
   ========================================================= */
function capsule(ctx, x1, y1, x2, y2, w1, w2) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const nx = Math.cos(a + Math.PI / 2), ny = Math.sin(a + Math.PI / 2);
  ctx.beginPath();
  ctx.moveTo(x1 + nx * w1, y1 + ny * w1);
  ctx.lineTo(x2 + nx * w2, y2 + ny * w2);
  ctx.arc(x2, y2, w2, a + Math.PI / 2, a - Math.PI / 2, true);
  ctx.lineTo(x1 - nx * w1, y1 - ny * w1);
  ctx.arc(x1, y1, w1, a - Math.PI / 2, a + Math.PI / 2, true);
  ctx.closePath();
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function poly(ctx, pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}

// crescent slash ribbon: inner radius arc + outer radius arc
function crescent(ctx, cx, cy, r0, r1, a0, a1) {
  ctx.beginPath();
  ctx.arc(cx, cy, r1, a0, a1, false);
  ctx.arc(cx, cy, r0, a1, a0, true);
  ctx.closePath();
}

function glowCircle(ctx, x, y, r, color, alpha) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}

function hexColor(h, a) { return 'rgba(' + h[0] + ',' + h[1] + ',' + h[2] + ',' + a + ')'; }

/* =========================================================
   Screen-space text helper (drawn without camera transform)
   ========================================================= */
function gameFont(ctx, size, weight) {
  ctx.font = (weight || 700) + ' ' + size + 'px "Trebuchet MS", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif';
}


/* ===== audio.js ===== */
/* =========================================================
   绯月 · 断刃  —  procedural audio (WebAudio, no assets)
   ========================================================= */
const Sfx = (function () {
  let ctx = null, master = null, ambient = null;
  let muted = false;
  let noiseBuf = null;
  let timers = [];

  function makeNoise() {
    const len = Math.floor(ctx.sampleRate * 0.7);
    const b = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.75;
      master.connect(ctx.destination);
      noiseBuf = makeNoise();
      startAmbient();
    } catch (e) { ctx = null; }
  }

  function now() { return ctx ? ctx.currentTime : 0; }

  function tone(freq, dur, vol, type, slideTo, delay, dest) {
    if (!ctx) return;
    const t0 = now() + (delay || 0);
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(Math.max(20, freq), t0);
    if (slideTo) {
      try { o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur); } catch (e) {}
    }
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + Math.min(0.012, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(dest || master);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  function noise(dur, vol, f0, f1, q, delay, dest) {
    if (!ctx || !noiseBuf) return;
    const t0 = now() + (delay || 0);
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t0);
    if (f1) {
      try { f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur); } catch (e) {}
    }
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(dest || master);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }

  function startAmbient() {
    // Low, sparse ritual ambience: a breathing drone and distant wooden pulse.
    const g = ctx.createGain();
    g.gain.value = 0.055;
    g.connect(master);
    const freqs = [55, 82.41, 110.2];
    freqs.forEach((fr, i) => {
      const o = ctx.createOscillator();
      const og = ctx.createGain();
      o.type = i === 2 ? 'triangle' : 'sine';
      o.frequency.value = fr;
      og.gain.value = i === 0 ? 0.55 : 0.16;
      const lfo = ctx.createOscillator();
      const lg = ctx.createGain();
      lfo.frequency.value = 0.05 + i * 0.023;
      lg.gain.value = og.gain.value * 0.45;
      lfo.connect(lg); lg.connect(og.gain);
      lfo.start();
      o.connect(og); og.connect(g); o.start();
    });

    timers.push(setInterval(() => {
      if (!ctx || muted) return;
      // taiko pulse
      const t = 0.13 + Math.random() * 0.04;
      tone(64, 0.36, 0.09, 'sine', 38, 0);
      noise(0.09, 0.035, 220, 90, 0.8, 0);
      if (Math.random() < 0.35) {
        tone(392, 0.9, 0.02, 'sine', 391, 0.2);
        tone(587.3, 0.8, 0.012, 'sine', 586, 0.22);
      }
    }, 1650));

    timers.push(setInterval(() => {
      if (!ctx || muted) return;
      tone(880, 1.6, 0.016, 'sine', 878, 0);
      tone(1318.5, 1.5, 0.008, 'sine', 1316, 0.02);
    }, 9000));
  }

  function setMuted(m) {
    muted = !!m;
    if (master) master.gain.setTargetAtTime(muted ? 0 : 0.75, now(), 0.05);
    return muted;
  }

  return {
    init,
    setMuted,
    isMuted: () => muted,
    isReady: () => !!ctx,
    swing(heavy) {

/* =========================================================
   fx.js — particles, impacts, trails, floating text
   ========================================================= */
class FX {
  constructor() {
    this.parts = [];
    this.rings = [];
    this.arclights = [];
    this.texts = [];
    this.streaks = [];
    this.maxParts = 320;
  }
  reset() {
    this.parts.length = 0; this.rings.length = 0;
    this.arclights.length = 0; this.texts.length = 0; this.streaks.length = 0;
  }
  addPart(p) {
    if (this.parts.length >= this.maxParts) this.parts.shift();
    this.parts.push(p);
  }
  spark(x, y, opts) {
    const o = opts || {};
    const n = o.count || 8;
    const dir = o.dir === undefined ? rand(-Math.PI, Math.PI) : o.dir;
    const spread = o.spread === undefined ? Math.PI : o.spread;
    const color = o.color || '#fff3d6';
    const speed = o.speed || 520;
    for (let i = 0; i < n; i++) {
      const a = dir + rand(-spread / 2, spread / 2);
      const s = speed * rand(0.35, 1.15);
      this.addPart({
        kind: 'spark', x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - (o.lift || 0),
        life: (o.life || 0.3) * rand(0.6, 1.25), max: 0.4,
        size: (o.size || 2.6) * rand(0.6, 1.5),
        color, grav: o.grav === undefined ? 900 : o.grav,
        drag: o.drag === undefined ? 2.6 : o.drag,
        shape: o.shape || 'line'
      });
    }
  }
  burst(x, y, color, count, speed, size, life, grav) {
    this.spark(x, y, { count, speed: speed || 300, size: size || 3, life: life || 0.5, color, grav: grav === undefined ? 700 : grav, spread: Math.PI * 2 });
  }
  dust(x, y, count, dir) {
    for (let i = 0; i < (count || 6); i++) {
      this.addPart({
        kind: 'smoke', x: x + rand(-10, 10), y: y + rand(-3, 2),
        vx: rand(-80, 80) + (dir || 0) * 40, vy: rand(-90, -20),
        life: rand(0.35, 0.7), max: 0.7, size: rand(5, 12),
        color: 'rgba(196,181,168,0.5)', grav: -60, drag: 3.4
      });
    }
  }
  ember(x, y, count) {
    for (let i = 0; i < (count || 1); i++) {
      this.addPart({
        kind: 'ember', x: x + rand(-6, 6), y: y + rand(-6, 6),
        vx: rand(-30, 30), vy: rand(-70, -20),
        life: rand(0.6, 1.4), max: 1.4, size: rand(1.2, 2.6),
        color: Math.random() < 0.5 ? '#ff5a4a' : '#ffb84a', grav: -30, drag: 0.8
      });
    }
  }
  streak(x, y, angle, len, w, color, life) {
    this.streaks.push({ x, y, angle, len, w, color, life: life || 0.16, t: 0 });
  }
  ring(x, y, r0, r1, color, life, width) {
    this.rings.push({ x, y, r0, r1, color, life: life || 0.3, t: 0, width: width || 3 });
  }
  slashLight(x, y, angle, spread, radius, color, life, width) {
    this.arclights.push({ x, y, angle, spread, radius, color, life: life || 0.22, t: 0, width: width || 10 });
  }
  // keep simultaneous combat words from piling on the same pixels
  stackOffset(x, y) {
    let n = 0, hasSub = false;
    for (const t of this.texts) {
      if (t.t < 0.35 && Math.abs(t.x - x) < 110) { n++; if (t.sub) hasSub = true; }
    }
    return { x: x + (n % 2 ? -22 : 22) * (n > 0 ? 1 : 0), y: y - n * 30, dense: n > 0 && hasSub };
  }
  damage(x, y, value, color, big) {
    const o = this.stackOffset(x, y);
    this.texts.push({ x: o.x, y: o.y, vx: rand(-20, 20), vy: -95, str: '' + value, color: color || '#fff6df', life: 0.7, t: 0, size: big ? 26 : 18, kind: 'num' });
    if (this.texts.length > 30) this.texts.splice(0, this.texts.length - 30);
  }
  word(x, y, str, color, size, life) {
    const o = this.stackOffset(x, y);
    this.texts.push({ x: o.x, y: o.y, vx: 0, vy: -36, str, color: color || '#ffdd88', life: life || 0.9, t: 0, size: size || 20, kind: 'word' });
    if (this.texts.length > 30) this.texts.splice(0, this.texts.length - 30);
  }
  word2(x, y, str, sub, color, size, life) {
    const o = this.stackOffset(x, y);
    // when several labels are live at once, drop the sub-line so the stack stays readable
    this.texts.push({ x: o.x, y: o.y, vx: 0, vy: -36, str, sub: o.dense ? undefined : sub, color: color || '#ffdd88', life: life || 0.9, t: 0, size: size || 20, kind: 'word' });
    if (this.texts.length > 30) this.texts.splice(0, this.texts.length - 30);
  }
  update(dt, freezePart) {
    const k = freezePart ? 0.22 : 1;
    dt *= k;
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.life -= dt;
      if (p.life <= 0) { this.parts.splice(i, 1); continue; }
      p.vy += (p.grav || 0) * dt;
      const dr = Math.max(0, 1 - (p.drag || 0) * dt);
      p.vx *= dr; p.vy *= dr;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.kind === 'smoke') p.size += 22 * dt;
      if (p.kind === 'severed' && p.y > p.floor) {
        p.y = p.floor;
        if (p.vy > 40) { p.vy *= -0.32; p.vx *= 0.6; p.vr *= 0.5; p.bounces = (p.bounces || 0) + 1; }
        else { p.vy = 0; p.vx *= 0.8; p.vr *= 0.7; p.rest = true; }
      }
    }
    for (let i = this.streaks.length - 1; i >= 0; i--) {
      const s = this.streaks[i];
      s.t += dt; if (s.t >= s.life) this.streaks.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i]; r.t += dt; if (r.t >= r.life) this.rings.splice(i, 1);
    }
    for (let i = this.arclights.length - 1; i >= 0; i--) {
      const a = this.arclights[i]; a.t += dt; if (a.t >= a.life) this.arclights.splice(i, 1);
    }
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i]; t.t += dt;
      t.x += t.vx * dt; t.y += t.vy * dt; t.vy += (t.kind === 'word' ? 30 : 190) * dt;
      if (t.t >= t.life) this.texts.splice(i, 1);
    }
  }
  drawBack(ctx) {
    // ground-level rings & dust
    for (const r of this.rings) {
      const k = r.t / r.life;
      ctx.globalAlpha = (1 - k) * 0.8;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.width * (1 - k) + 0.5;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, lerp(r.r0, r.r1, easeOutCubic(k)), lerp(r.r0, r.r1, easeOutCubic(k)) * 0.38, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  draw(ctx, additive) {
    ctx.save();
    if (additive) ctx.globalCompositeOperation = 'lighter';
    for (const p of this.parts) {
      const lifeK = clamp(p.life / p.max, 0, 1);
      if (p.kind === 'smoke') {
        ctx.globalAlpha = lifeK * 0.45;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
      } else if (p.kind === 'severed') {
        // handled by world drawing severed limbs separately
      } else if (p.kind === 'spark') {
        ctx.globalAlpha = Math.min(1, lifeK * 1.4);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(1, p.size * lifeK);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.022, p.y - p.vy * 0.022);
        ctx.stroke();
      } else if (p.kind === 'ember') {
        ctx.globalAlpha = lifeK * 0.9;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * lifeK + 0.4, 0, TAU); ctx.fill();
      } else if (p.kind === 'shard') {
        ctx.globalAlpha = lifeK;
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot || 0);
        ctx.fillRect(-p.size, -p.size * 0.35, p.size * 2, p.size * 0.7);
        ctx.restore();
      }
    }
    // speed streaks
    for (const s of this.streaks) {
      const k = 1 - s.t / s.life;
      ctx.globalAlpha = k * 0.8;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.w * k;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - Math.cos(s.angle) * s.len, s.y - Math.sin(s.angle) * s.len);
      ctx.stroke();
    }
    // slash arcs
    for (const a of this.arclights) {
      const k = a.t / a.life;
      const alpha = (1 - k);
      ctx.globalAlpha = alpha;
      const r0 = a.radius * (0.62 + 0.38 * k);
      ctx.strokeStyle = a.color;
      ctx.lineWidth = a.width * (1 - k * 0.7);
      ctx.beginPath();
      ctx.arc(a.x, a.y, r0, a.angle - a.spread / 2, a.angle + a.spread / 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  drawTexts(ctx) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const t of this.texts) {
      const k = t.t / t.life;
      const pop = t.t < 0.09 ? 1.35 - (t.t / 0.09) * 0.35 : 1;
      ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
      ctx.font = '900 ' + Math.round(t.size * pop) + 'px "Trebuchet MS","PingFang SC","Microsoft YaHei",sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(20,10,14,0.85)';
      ctx.strokeText(t.str, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.str, t.x, t.y);
      if (t.sub) {
        ctx.font = '800 11px "Trebuchet MS",sans-serif';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(20,10,14,0.85)';
        ctx.strokeText(t.sub, t.x, t.y + t.size * 0.82);
        ctx.fillStyle = 'rgba(255,240,220,0.85)';
        ctx.fillText(t.sub, t.x, t.y + t.size * 0.82);
      }
    }
    ctx.restore();
  }
}
