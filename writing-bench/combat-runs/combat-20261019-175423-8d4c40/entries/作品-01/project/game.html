/* ===== world.js ===== */
/* =========================================================
   world.js — simulation owner: hits, hitstop, waves, orbs,
   severed limbs, parry, stats, restart
   ========================================================= */
let NEXT_ENEMY_ID = 1;

class World {
  constructor() {
    this.arena = ARENA;
    this.cam = new Camera();
    this.fx = new FX();
    this.player = new Player(this);
    this.enemies = [];
    this.orbs = [];
    this.severed = [];
    this.stats = { hitCount: 0, limbBreakCount: 0, killCount: 0, parryCount: 0, wave: 0 };
    this.time = 0;
    this.realTime = 0;
    this.freeze = 0;
    this.ready = true;
    this.playing = false;
    this.deathT = 0;
    this.waveState = 'idle';
    this.waveTimer = 0;
    this.spawnQueue = [];
    this.spawnTimer = 0;
    this.waveBannerT = 0;
    this.waveBannerText = '';
    this.uiDamageFlash = 0;
    this.hintT = 0;
    this.slowmo = 0;
    this.slowmoT = 0;
    this.bladeRain = [];
    this.ultimate = null;
    this.enemyId = 0;
    this.ambientEmbers = [];
    for (let i = 0; i < 34; i++) {
      this.ambientEmbers.push({
        x: rand(ARENA.x1, ARENA.x2), y: rand(120, 470),
        vy: rand(-14, -4), vx: rand(-12, 12),
        ph: rand(0, TAU), r: rand(0.8, 2)
      });
    }
  }

  reset() {
    this.player.reset();
    this.enemies.length = 0;
    this.orbs.length = 0;
    this.severed.length = 0;
    this.fx.reset();
    this.stats = { hitCount: 0, limbBreakCount: 0, killCount: 0, parryCount: 0, wave: 0 };
    this.freeze = 0;
    this.deathT = 0;
    this.waveState = 'idle';
    this.waveTimer = 0.35;
    this.spawnQueue = [];
    this.spawnTimer = 0;
    this.waveBannerT = 0;
    this.slowmoT = 0;
    this.bladeRain.length = 0;
    this.ultimate = null;
    this.uiDamageFlash = 0;
    this.playing = true;
    this.time = 0;
    this.cam.x = 0; this.cam.y = 300;
    this.cam.shakeMag = 0; this.cam.shakeT = 0;
    this.nextWave = 1;
  }

  start() {
    this.reset();
    this.cam.x = this.player.x + 150;
    this.cam.y = 340;
  }

  restart() {
    this.start();
    Sfx.select();
  }

  /* ---------------- core loop ---------------- */
  update(dt) {
    this.realTime += dt;
    this.uiDamageFlash = Math.max(0, this.uiDamageFlash - dt * 2.5);
    this.waveBannerT = Math.max(0, this.waveBannerT - dt);

    if (this.freeze > 0) {
      this.freeze = Math.max(0, this.freeze - dt);
      // frozen sim: only camera and a slowed trickle of particles keep moving
      this.cam.update(dt * 0.4, this);
      this.fx.update(dt * 0.22, true);
      return;
    }
    this.time += dt;

    const input = this.input;
    if (this.playing) {
      this.player.update(dt, input);
    }

    const eDt = dt * (this.slowmoT > 0 ? 0.35 : 1);
    if (this.slowmoT > 0) this.slowmoT = Math.max(0, this.slowmoT - dt);
    for (const e of this.enemies) {
      if (e._shadowMarked) e._shadowMarked = Math.max(0, e._shadowMarked - eDt * 2);
      e.update(eDt);
    }
    this.updateOrbs(eDt);
    this.updateSevered(eDt);
    this.updateBladeRain(dt);
    if (this.ultimate) this.updateUltimateTick(dt);
    this.fx.update(dt, false);
    this.updateWaves(dt);
    this.cam.update(dt, this);

    // cull dead enemies after fade
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (e.dead && e.deathT > 2.4) this.enemies.splice(i, 1);
    }

    if (this.player.state === 'dead') {
      this.deathT += dt;
      if (this.deathT > 1.0) this.playing = false;
    }
  }

  hitstop(dur, playerHurt) {
    this.freeze = Math.max(this.freeze, dur);
    if (!playerHurt) this.cam.punch(0.6);
  }

  /* ---------------- player attack resolution ---------------- */
  resolvePlayerAttack(player, def) {
    const f = player.facing;
    const b = def.box;
    const box = {
      x: f > 0 ? player.x + b.ox : player.x - b.ox - b.w,
      y: player.y + b.oy,
      w: b.w, h: b.h
    };
    this._lastAttackBox = box;
    for (const e of this.enemies) {
      if (e.dead) continue;
      const key = 'e' + e.uid;
      if (player.attackHits.has(key)) continue;
      const limb = e.hitTest(box);
      if (limb === undefined) continue;
      player.attackHits.add(key);
      this.landPlayerHit(player, e, limb, def, box);
    }
    // reflect / cut orbs
    for (let i = this.orbs.length - 1; i >= 0; i--) {
      const o = this.orbs[i];
      if (!o.reflected && rectsOverlap(box, { x: o.x - o.r - 4, y: o.y - o.r - 4, w: (o.r + 4) * 2, h: (o.r + 4) * 2 })) {
        this.reflectOrb(o, player);
      }
    }
  }

  landPlayerHit(player, e, limb, def, box) {
    const dir = player.facing;
    const heavy = !!def.heavy;
    const lvl = heavy ? (this.player.lastChargeLevel || 1) : 0;
    const dmgMul = heavy && lvl > 1 ? 1 + (lvl - 1) * 0.22 : 1;
    const dmg = Math.round(def.damage * dmgMul * rand(0.95, 1.05));
    const contactX = limb ? limb.x : (box.x + box.w * 0.5);
    const contactY = limb ? limb.y : (box.y + box.h * 0.5);

    const res = e.takeHit(limb, {
      dmg, dir, kb: def.kb, lift: def.lift, heavy,
      x: player.x, y: contactY, limbMul: heavy ? 2.2 : 1
    });
    if (!res.hit) return;

    // combo bookkeeping
    player.combo++;
    player.comboTimer = 2.2;
    player.comboBest = Math.max(player.comboBest, player.combo);
    player.focus = Math.min(1, player.focus + 0.055);
    this.stats.hitCount++;

    // ---- impact feel ----
    const hs = def.hitstop + (res.broke ? 0.035 : 0);
    this.hitstop(hs, false);
    this.cam.shake(def.hitstop * (heavy ? 48 : 40), 0.16 + hs);
    const dirA = dir > 0 ? 0 : Math.PI;
    const sparkCount = heavy ? 16 : 8;
    this.fx.spark(contactX, contactY, {
      count: sparkCount, speed: heavy ? 780 : 520, size: heavy ? 3.4 : 2.4,
      life: 0.24, color: heavy ? '#ffd09a' : '#fff1cf', dir: dirA,
      spread: 1.5, lift: 60, grav: 700
    });
    this.fx.spark(contactX, contactY, {
      count: heavy ? 10 : 4, speed: 200, size: 2.2, life: 0.5,
      color: '#ff7a5a', dir: dirA + Math.PI, spread: 1.2, lift: 140, grav: 300
    });
    this.fx.streak(contactX, contactY, dirA, heavy ? 120 : 70, heavy ? 7 : 4, 'rgba(255,240,210,0.95)', 0.16);
    this.fx.ring(contactX, contactY, 4, heavy ? 78 : 42, heavy ? 'rgba(255,170,110,0.95)' : 'rgba(255,240,210,0.8)', 0.22, heavy ? 5 : 2.5);
    this.fx.damage(contactX, contactY - 24, dmg, res.guarded ? '#b8c8d8' : heavy ? '#ffe08a' : '#fff6df', heavy);
    if (res.guarded) this.fx.word(e.x, e.top - 20, '格挡', '#b8c8d8', 15, 0.6);
    if (res.broke) {
      // extra juice on break handled in onLimbSevered
      this.fx.spark(contactX, contactY, { count: 18, speed: 900, size: 3, life: 0.45, color: '#ff9a7a', spread: TAU, grav: 900 });
    }

    // audio
    if (heavy) Sfx.heavyHit(); else Sfx.hit(clamp(def.damage / 30, 0.2, 1));

    // hit effects on the player: brief recoil
    if (this.player.onGround) this.player.vx -= dir * 40;

    // blade trail flash
    player.anim.bladeGlow = 1;
    this.lastHitLimb = limb;

    // parryable counter? no.
  }

  damageArea(x, y, w, h, dmg, kb, lift) {
    const box = { x: x - w / 2, y: y - h / 2, w, h };
    for (const e of this.enemies) {
      if (e.dead) continue;
      const limb = e.hitTest(box);
      if (limb === undefined) continue;
      const res = e.takeHit(limb, { dmg, dir: 0, kb, lift, heavy: true, x, y, limbMul: 1.2 });
      if (res.hit) {
        this.stats.hitCount++;
        this.fx.damage(e.x, e.y - e.h, dmg, '#ffd28a', true);
        this.fx.burst(e.x, e.y - e.h * 0.5, '#ffd28a', 10, 300, 2.5, 0.4, 500);
      }
    }
  }

  enemyHitsPlayer(enemy, dmg, a) {
    const p = this.player;
    if (p.state === 'dead') return;
    if (p.iframe > 0) return;
    // parry check gives the player agency
    if (p.state === 'parry' && p.parryT > 0) {
      this.onParry(p, enemy, null);
      return;
    }
    const hit = p.takeHit(dmg, enemy.x, { source: enemy });
    if (hit === true) {
      this.fx.spark(p.x, p.cy, { count: 12, speed: 460, size: 3, life: 0.35, color: '#ff6a6a', spread: TAU, grav: 800 });
    }
  }

  onParry(p, source, projectile) {
    this.stats.parryCount++;
    p.parrySuccess = 0.5;
    p.parryT = 0;
    p.state = p.onGround ? 'idle' : 'air';
    p.iframe = Math.max(p.iframe, 0.22);
    p.parryCd = Math.min(p.parryCd, 0.25);
    p.focus = Math.min(1, p.focus + 0.3);
    this.hitstop(0.19, false);
    this.cam.shake(5, 0.24);
    this.cam.punch(1.4);
    Sfx.parry();
    const bx = p.x + p.facing * 34, by = p.cy - 8;
    this.fx.slashLight(bx, by, p.facing > 0 ? 0 : Math.PI, Math.PI * 1.4, 64, 'rgba(190,240,255,1)', 0.3, 12);
    this.fx.ring(bx, by, 6, 92, 'rgba(170,230,255,0.95)', 0.3, 4);
    this.fx.spark(bx, by, { count: 22, speed: 760, size: 3, life: 0.4, color: '#cfeeff', spread: TAU, grav: 300 });
    this.fx.word2(p.x, p.cy - 58, '弹反!', 'PARRY!', '#bff0ff', 26, 0.85);
    for (let i = 0; i < 4; i++) {
      this.fx.addPart({ kind: 'spark', x: bx, y: by, vx: rand(-200, 200), vy: rand(-300, 100), life: 0.5, max: 0.5, size: 2.5, color: '#e8fbff', grav: 100, drag: 3 });
    }
    if (projectile) {
      this.reflectOrb(projectile, p);
    }
    if (source && !source.dead) {
      // perfect parry staggers and opens guards; damages a bit
      source.takeHit(null, { dmg: 9, dir: p.facing, kb: 300, lift: 0, heavy: true, x: p.x, unguardable: true });
      source.stunT = Math.max(source.stunT, 0.55);
      source.guardBrokenT = Math.max(source.guardBrokenT, 1.4);
      const lb = source.hitTest({ x: bx - 20, y: by - 20, w: 40, h: 40 });
      if (lb) lb.hp -= 8;
    }
  }

  /* ---------------- projectiles ---------------- */
  spawnOrb(enemy, dir) {
    const p = this.player;
    const ox = enemy.x + dir * 22, oy = enemy.y - enemy.h * 0.6;
    const ang = Math.atan2((p.cy) - oy, p.x - ox);
    this.orbs.push({
      x: ox, y: oy, vx: Math.cos(ang) * 300, vy: Math.sin(ang) * 300,
      r: 10, owner: enemy, reflected: false, life: 4.5, t: 0,
      homing: 0.9, dmg: 10, col: '#ff5b86'
    });
    this.fx.ring(ox, oy, 2, 26, 'rgba(255,120,160,0.8)', 0.2, 2);
    Sfx.orb();
  }

  reflectOrb(o, player) {
    if (o.reflected) return;
    o.reflected = true;
    o.owner = player;
    const p = this.player;
    let target = null, best = 1e9;
    for (const e of this.enemies) {
      if (e.dead) continue;
      const d = dist2(o.x, o.y, e.x, e.y - e.h * 0.5);
      if (d < best) { best = d; target = e; }
    }
    let ang;
    if (target) ang = Math.atan2((target.y - target.h * 0.5) - o.y, target.x - o.x);
    else ang = player.facing > 0 ? 0 : Math.PI;
    o.vx = Math.cos(ang) * 780;
    o.vy = Math.sin(ang) * 780;
    o.homing = 3.2;
    o.col = '#ffd76a';
    o.dmg = 26;
    o.life = 2.2;
    Sfx.reflect();
    this.fx.burst(o.x, o.y, '#ffd76a', 8, 300, 2.5, 0.3, 100);
  }

  updateOrbs(dt) {
    const p = this.player;
    for (let i = this.orbs.length - 1; i >= 0; i--) {
      const o = this.orbs[i];
      o.life -= dt; o.t += dt;
      if (!o.reflected) {
        // gentle homing toward the player
        const ang = Math.atan2(p.cy - o.y, p.x - o.x);
        const cur = Math.atan2(o.vy, o.vx);
        let diff = ang - cur;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const na = cur + clamp(diff, -o.homing * dt, o.homing * dt);
        const spd = 280;
        o.vx = Math.cos(na) * spd;
        o.vy = Math.sin(na) * spd;
        if (p.state !== 'dead' && dist2(o.x, o.y, p.x, p.cy) < (o.r + 14) * (o.r + 14)) {
          if (p.state === 'parry' && p.parryT > 0) { this.onParry(p, o.owner, o); continue; }
          if (p.iframe > 0) { /* pass through */ }
          else {
            this.enemyHitsPlayer(o.owner || this, o.dmg, {});
            this.fx.burst(o.x, o.y, '#ff6a8a', 12, 320, 2.6, 0.4, 300);
            this.orbs.splice(i, 1);
            continue;
          }
        }
      } else {
        // reflected: seek nearest enemy
        let target = null, best = 1e9;
        for (const e of this.enemies) {
          if (e.dead) continue;
          const d = dist2(o.x, o.y, e.x, e.y - e.h * 0.5);
          if (d < best) { best = d; target = e; }
        }
        if (target) {
          const ang = Math.atan2((target.y - target.h * 0.5) - o.y, target.x - o.x);
          const cur = Math.atan2(o.vy, o.vx);
          let diff = ang - cur;
          while (diff > Math.PI) diff -= TAU;
          while (diff < -Math.PI) diff += TAU;
          const na = cur + clamp(diff, -6 * dt, 6 * dt);
          const spd = 860;
          o.vx = Math.cos(na) * spd;
          o.vy = Math.sin(na) * spd;
        }
        for (const e of this.enemies) {
          if (e.dead) continue;
          const hb = { x: e.x - e.w * 0.6, y: e.y - e.h - 8, w: e.w * 1.2, h: e.h + 8 };
          if (rectsOverlap({ x: o.x - o.r, y: o.y - o.r, w: o.r * 2, h: o.r * 2 }, hb)) {
            const limb = e.hitTest({ x: o.x - 16, y: o.y - 16, w: 32, h: 32 });
            const res = e.takeHit(limb || null, { dmg: o.dmg, dir: sign(o.vx), kb: 260, lift: 170, heavy: true, x: o.x, y: o.y, limbMul: 1.4 });
            if (res.hit) {
              this.stats.hitCount++;
              this.hitstop(0.09, false);
              this.fx.damage(o.x, o.y - 10, o.dmg, '#ffd76a', true);
              this.fx.burst(o.x, o.y, '#ffd76a', 16, 420, 3, 0.45, 500);
            }
            this.orbs.splice(i, 1);
            break;
          }
        }
      }
      if (!this.orbs[i]) continue;
      o.x += o.vx * dt;
      o.y += o.vy * dt;
      if (o.t > o.life || o.y > GROUND_Y + 20 || o.x < ARENA.x1 - 60 || o.x > ARENA.x2 + 60) {
        this.fx.burst(o.x, o.y, o.reflected ? '#ffd76a' : '#ff5b86', 6, 180, 2, 0.25, 200);
        this.orbs.splice(i, 1);
      }
    }
  }

  /* ---------------- severed limbs ---------------- */
  spawnSevered(enemy, limb, dir, o) {
    const col = enemy.def.bodyColor;
    const piece = {
      x: limb.x, y: limb.y,
      vx: dir * rand(150, 320) + rand(-60, 60),
      vy: rand(-420, -180),
      rot: rand(0, TAU), vr: rand(-12, 12),
      life: 8, max: 8,
      floor: GROUND_Y - rand(2, 6),
      bounces: 0, rest: false,
      size: limb.id === 'legs' ? 1.55 : limb.id === 'head' ? 1.2 : 1.5,
      color: col,
      darker: enemy.def.bodyDark,
      accent: enemy.def.accent,
      label: limb.label,
      type: enemy.typeKey,
      id: limb.id,
      // settle upright instead of snapping to an arbitrary quarter turn
      restRot: limb.id === 'head' ? 0 : (Math.random() < 0.5 ? 0 : Math.PI)
    };
    this.severed.push(piece);
  }

  updateSevered(dt) {
    for (const s of this.severed) {
      if (s.rest) { s.life -= dt * 0.6; continue; }
      s.vy += 1500 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.rot += s.vr * dt;
      if (s.y >= s.floor) {
        s.y = s.floor;
        if (Math.abs(s.vy) > 90) {
          s.vy *= -0.34; s.vx *= 0.62; s.vr *= 0.55;
          s.bounces++;
          this.fx.dust(s.x, s.floor, 2, 0);
        } else {
          s.vy = 0; s.vx *= 0.5; s.vr *= 0.5;
          if (Math.abs(s.vx) < 8) {
            s.rest = true;
            s.rot = s.restRot !== undefined ? s.restRot : Math.round(s.rot / (Math.PI / 2)) * (Math.PI / 2);
          }
        }
      }
      if (s.x < ARENA.x1) { s.x = ARENA.x1; s.vx *= -0.5; }
      if (s.x > ARENA.x2) { s.x = ARENA.x2; s.vx *= -0.5; }
    }
    for (let i = this.severed.length - 1; i >= 0; i--) {
      if (this.severed[i].life <= 0) this.severed.splice(i, 1);
    }
  }

  /* ---------------- waves ---------------- */
  updateWaves(dt) {
    if (!this.playing || this.player.state === 'dead') return;
    for (const e of this.enemies) if (!e.dead) {
      // spawn remaining queue regardless
    }
    const alive = this.enemies.filter((e) => !e.dead).length;
    if (this.spawnQueue.length > 0) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0 && alive < 4) {
        const entry = this.spawnQueue.shift();
        this.spawnEnemy(entry.type, entry.side, entry.hpMul || 1);
        this.spawnTimer = 0.55;
      }
    } else if (alive === 0) {
      if (this.waveState !== 'cleared') {
        this.waveState = 'cleared';
        this.waveTimer = (this.stats.wave === 0 ? 0.35 : 1.15);
        if (this.stats.wave > 0) {
          this.waveBannerT = 0.9;
          this.waveBannerText = '清除 · CLEARED';
        }
      } else {
        this.waveTimer -= dt;
        if (this.waveTimer <= 0) this.beginWave(this.stats.wave + 1);
      }
    }
  }

  beginWave(n) {
    this.stats.wave = n;
    this.waveState = 'active';
    this.waveBannerT = 1.5;
    this.waveBannerText = '第 ' + n + ' 波  ·  WAVE ' + n;
    Sfx.wave();
    const list = this.waveList(n);
    this.spawnQueue = list.map((t, i) => ({ type: t, side: i % 2 === 0 ? 1 : -1, hpMul: 1 + Math.min(0.65, Math.max(0, n - 4) * 0.08) }));
    this.spawnTimer = 0.15;
    // heal a sliver between waves for pacing
    const p = this.player;
    if (p.hp > 0) p.hp = Math.min(p.maxHp, p.hp + (n > 1 ? 8 : 0));
  }

  waveList(n) {
    const pattern = [
      ['gnawer', 'gnawer'],
      ['gnawer', 'samurai'],
      ['gnawer', 'puppet', 'gnawer'],
      ['samurai', 'samurai'],
      ['gnawer', 'samurai', 'puppet'],
      ['samurai', 'gnawer', 'gnawer', 'samurai']
    ];
    if (n <= pattern.length) return pattern[n - 1].slice();
    // loop with a scaled mix
    const extra = Math.min(2, Math.floor((n - pattern.length) / 3));
    return ['samurai', 'gnawer', 'puppet'].slice(0, 2 + extra);
  }

  spawnEnemy(type, side, hpMul) {
    const p = this.player;
    let x = side > 0 ? p.x + rand(420, 620) : p.x - rand(420, 620);
    if (x < ARENA.x1 + 60) x = ARENA.x1 + rand(60, 140);
    if (x > ARENA.x2 - 60) x = ARENA.x2 - rand(60, 140);
    const e = new Enemy(this, type, x);
    e.uid = NEXT_ENEMY_ID++;
    if (hpMul && hpMul !== 1) {
      e.maxHp = Math.round(e.maxHp * hpMul);
      e.hp = e.maxHp;
    }
    if (type === 'puppet') e.y = GROUND_Y - 60;
    this.enemies.push(e);
    this.fx.ring(x, GROUND_Y - 1, 4, 50, 'rgba(120,200,255,0.7)', 0.4, 2);
    this.fx.dust(x, GROUND_Y, 8, 0);
    if (Math.random() < 0.8) this.fx.ember(x, GROUND_Y - 30, 4);
    return e;
  }

  onEnemyKilled(e) {
    this.player.focus = Math.min(1, this.player.focus + 0.16);
    this.cam.punch(1.2);
  }

  onPlayerDeath() {
    this.deathT = 0;
    this.cam.shake(7, 0.5);
    this.fx.word(this.player.x, this.player.cy - 60, '败', '#ff6a5a', 34, 1.4);
    this.player.combo = 0;
  }

  /* ---------------- skills ---------------- */
  skillHit(e, dmg, opts) {
    if (e.dead) return { hit: false };
    const o = opts || {};
    const box = { x: e.x - e.w * 0.75, y: e.y - e.h - 12, w: e.w * 1.5, h: e.h + 14 };
    const limb = e.hitTest(box);
    const dir = o.dir === undefined ? (sign(e.x - this.player.x) || 1) : o.dir;
    const res = e.takeHit(limb === undefined ? null : limb, {
      dmg, dir,
      kb: o.kb === undefined ? 220 : o.kb,
      lift: o.lift === undefined ? 0 : o.lift,
      heavy: o.heavy === undefined ? true : o.heavy,
      x: this.player.x, y: e.y - e.h * 0.5,
      limbMul: o.limbMul === undefined ? 1.6 : o.limbMul
    });
    if (res.hit) {
      this.stats.hitCount++;
      this.fx.damage(e.x, e.y - e.h - 10, dmg, o.color || '#ffd0e0', true);
      if (res.broke) this.cam.punch(1.4);
    }
    return res;
  }

  doMoonWheel(p) {
    this.hitstop(0.105, false);
    this.cam.shake(5.5, 0.24);
    this.cam.punch(1.6);
    const cx = p.x, cy = p.cy;
    this.fx.slashLight(cx, cy, 0, Math.PI * 1.55, 120, 'rgba(255,120,200,0.95)', 0.32, 17);
    this.fx.slashLight(cx, cy, Math.PI * 0.8, Math.PI * 1.5, 96, 'rgba(255,190,230,0.9)', 0.28, 9);
    this.fx.ring(cx, cy, 20, 175, 'rgba(255,110,190,0.9)', 0.42, 5);
    this.fx.spark(cx, cy, { count: 30, speed: 720, size: 3.2, life: 0.45, color: '#ffb0d8', spread: Math.PI * 2, grav: 200 });
    this.hitstop(0.06, false);
    for (const e of this.enemies) {
      if (e.dead) continue;
      const d = dist(cx, cy, e.x, e.y - e.h * 0.5);
      if (d < 138) {
        this.skillHit(e, 26, { dir: sign(e.x - cx) || 1, kb: 480, lift: -300, limbMul: 2.0, color: '#ffc0e0' });
        e.stunT = Math.max(e.stunT, 0.28);
      }
    }
    for (let i = this.orbs.length - 1; i >= 0; i--) {
      const o = this.orbs[i];
      if (!o.reflected && dist(o.x, o.y, cx, cy) < 165) this.reflectOrb(o, p);
    }
  }

  markShadow(p) {
    for (const e of this.enemies) {
      if (e.dead) continue;
      if (Math.abs(e.x - p.x) < 78 && Math.abs(e.y - p.y) < 130) e._shadowMarked = 0.55;
    }
  }

  detonateShadow(p) {
    let n = 0;
    for (const e of this.enemies) {
      if (e.dead || !e._shadowMarked) continue;
      e._shadowMarked = 0;
      this.cam.shake(4.5, 0.2);
      this.fx.slashLight(e.x, e.y - e.h * 0.5, rand(-0.7, 0.7), 2.4, 74, 'rgba(255,80,90,0.95)', 0.34, 14);
      this.fx.ring(e.x, e.y - e.h * 0.5, 8, 92, 'rgba(255,80,90,0.9)', 0.34, 4);
      this.skillHit(e, 48, { dir: p.facing, kb: 360, lift: -380, limbMul: 2.8, color: '#ff9a9a' });
      n++;
    }
    if (n) {
      this.hitstop(0.12, false);
      this.cam.punch(1.8);
      Sfx.heavyHit();
    }
  }

  startBladeRain(p) {
    const targets = this.enemies.filter((e) => !e.dead);
    this.bladeRain = [];
    for (let i = 0; i < 6; i++) {
      let tx;
      if (targets.length) {
        const e = targets[i % targets.length];
        tx = e.x + rand(-44, 44);
      } else {
        tx = p.x + rand(-200, 200);
      }
      tx = clamp(tx, ARENA.x1 + 40, ARENA.x2 - 40);
      this.bladeRain.push({ x: tx, y: -80 - i * 34, delay: 0.22 + i * 0.12, vy: 0, done: false });
    }
    Sfx.skill(2);
  }

  updateBladeRain(dt) {
    if (!this.bladeRain.length) return;
    let allDone = true;
    for (const b of this.bladeRain) {
      if (b.done) continue;
      b.delay -= dt;
      if (b.delay > 0) { allDone = false; continue; }
      b.vy += 3800 * dt;
      b.y += b.vy * dt;
      if (Math.random() < dt * 30) this.fx.streak(b.x, b.y, Math.PI / 2, 30, 2, 'rgba(200,230,255,0.75)', 0.1);
      if (b.y >= GROUND_Y - 8) {
        b.done = true;
        this.cam.shake(2.6, 0.12);
        this.fx.ring(b.x, GROUND_Y - 1, 6, 62, 'rgba(190,225,255,0.85)', 0.3, 3);
        this.fx.spark(b.x, GROUND_Y - 12, { count: 12, speed: 340, size: 2.6, life: 0.32, color: '#d8ecff', spread: Math.PI, dir: -Math.PI / 2, grav: 700 });
        Sfx.hit(0.45);
        const bladeBox = { x: b.x - 44, y: GROUND_Y - 150, w: 88, h: 155 };
        for (const e of this.enemies) {
          if (e.dead) continue;
          if (rectsOverlap(bladeBox, e.hurtbox())) {
            this.skillHit(e, 19, { dir: sign(e.x - b.x) || 1, kb: 180, lift: -150, limbMul: 1.5, color: '#cfe8ff' });
          }
        }
      } else allDone = false;
    }
    if (allDone) {
      this.bladeRainTimer = (this.bladeRainTimer || 0) + dt;
      if (this.bladeRainTimer > 0.5) { this.bladeRain.length = 0; this.bladeRainTimer = 0; }
    } else this.bladeRainTimer = 0;
  }

  startUltimate(p) {
    this.ultimate = { t: 0, pulses: [0.2, 0.42, 0.64, 0.86, 1.08], pi: 0, final: false, end: 1.72 };
    this.slowmoT = 1.9;
    this.cam.punch(2.2);
    this.cam.shake(5, 0.3);
    this.fx.ring(p.x, p.cy, 20, 240, 'rgba(255,60,60,0.9)', 0.55, 7);
    this.fx.word2(p.x, p.cy - 74, '绯月·千刃一闪', 'CRIMSON MOON', '#ff6a6a', 24, 1.3);
  }

  updateUltimateTick(dt) {
    const u = this.ultimate;
    if (!u) return;
    u.t += dt;
    while (u.pi < u.pulses.length && u.t >= u.pulses[u.pi]) {
      u.pi++;
      this.ultimatePulse(u.pi);
    }
    if (!u.final && u.t >= 1.34) { u.final = true; this.ultimateFinal(); }
    if (u.t >= u.end) this.ultimate = null;
  }

  ultimatePulse(n) {
    const p = this.player;
    const targets = this.enemies.filter((e) => !e.dead)
      .sort((a, b) => Math.abs(a.x - p.x) - Math.abs(b.x - p.x)).slice(0, 3);
    this.cam.shake(3.4, 0.15);
    for (const e of targets) {
      this.fx.slashLight(e.x, e.y - e.h * 0.5, rand(-1.3, 1.3), 2.2, 84, 'rgba(255,90,90,0.95)', 0.28, 12);
      this.fx.ring(e.x, e.y - e.h * 0.5, 6, 78, 'rgba(255,80,80,0.9)', 0.3, 3);
      this.skillHit(e, 17, { dir: p.facing, kb: 90, lift: -110, limbMul: 4.6, color: '#ffb0b0' });
    }
    if (targets.length) Sfx.hit(0.9);
  }

  ultimateFinal() {
    const p = this.player;
    this.cam.shake(10, 0.45);
    this.cam.punch(2.4);
    this.hitstop(0.17, false);
    Sfx.heavyHit();
    this.fx.slashLight(p.x + p.facing * 70, p.y - 92, p.facing > 0 ? 0 : Math.PI, 2.3, 430, 'rgba(255,70,70,1)', 0.5, 28);
    this.fx.ring(p.x, GROUND_Y - 1, 20, 460, 'rgba(255,90,90,0.8)', 0.5, 8);
    for (const e of this.enemies) {
      if (e.dead) continue;
      if (Math.abs(e.x - p.x) < 580) {
        this.skillHit(e, 56, { dir: p.facing, kb: 950, lift: -440, limbMul: 4.2, color: '#ff8a8a' });
        e.stunT = Math.max(e.stunT, 0.5);
      }
    }
    for (const o of this.orbs) this.reflectOrb(o, p);
  }

  /* ---------------- public state API ---------------- */
  state() {
    return {
      ready: !!this.ready,
      playerAlive: this.player.state !== 'dead' && this.player.hp > 0,
      enemyCount: this.enemies.filter((e) => !e.dead).length,
      hitCount: this.stats.hitCount,
      limbBreakCount: this.stats.limbBreakCount,
      playing: !!this.playing && this.waveState !== 'idle'
    };
  }
}


/* ===== render.js ===== */
/* =========================================================
   render.js — scenery, arena, severed pieces, orbs
   ========================================================= */

function drawSky(ctx, w, h, cam, time) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0a0614');
  g.addColorStop(0.45, '#191026');
  g.addColorStop(0.78, '#2b1526');
  g.addColorStop(1, '#120a12');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // stars
  ctx.save();
  const parX = cam.x * 0.03;
  for (let i = 0; i < 90; i++) {
    const sx = ((i * 137.5 + 43) % 1600) - parX * 0.2 % 1600;
    const sy = ((i * 79.3) % (h * 0.62));
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(time * 1.3 + i));
    ctx.globalAlpha = 0.18 + tw * 0.32;
    ctx.fillStyle = i % 7 === 0 ? '#ffc9c0' : '#dfe8ff';
    ctx.fillRect(((sx % (w + 200)) + w + 200) % (w + 200) - 100, sy, 1.4, 1.4);
  }
  ctx.restore();

  // crimson moon
  const mx = w * 0.74 - (cam.x - 960) * 0.04;
  const my = h * 0.2;
  const mr = Math.min(w, h) * 0.13;
  ctx.save();
  const halo = ctx.createRadialGradient(mx, my, mr * 0.55, mx, my, mr * 2.6);
  halo.addColorStop(0, 'rgba(255,84,66,0.30)');
  halo.addColorStop(0.5, 'rgba(190,40,60,0.10)');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(mx - mr * 3, my - mr * 3, mr * 6, mr * 6);
  const mg = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.1, mx, my, mr);
  mg.addColorStop(0, '#ffd2b8');
  mg.addColorStop(0.4, '#ff7a5e');
  mg.addColorStop(0.75, '#c9303c');
  mg.addColorStop(1, '#6e1420');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
  // moon maria
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = '#5c0c18';
  for (let i = 0; i < 7; i++) {
    const a = i * 1.7, rr = mr * (0.15 + (i % 3) * 0.18);
    ctx.beginPath(); ctx.arc(mx + Math.cos(a) * rr, my + Math.sin(a) * rr, mr * (0.07 + (i % 2) * 0.06), 0, TAU); ctx.fill();
  }
  ctx.restore();

  // distant mountain silhouettes (3 parallax layers)
  const layers = [
    { f: 0.09, col: '#1d1226', base: 0.66, amp: 0.16, seed: 1.2, step: 210 },
    { f: 0.18, col: '#241427', base: 0.74, amp: 0.13, seed: 3.4, step: 150 },
    { f: 0.32, col: '#2a1620', base: 0.83, amp: 0.09, seed: 6.1, step: 105 }
  ];
  for (const L of layers) {
    ctx.fillStyle = L.col;
    ctx.beginPath();
    ctx.moveTo(-40, h);
    const off = cam.x * L.f;
    for (let x = -40; x <= w + 60; x += 14) {
      const wx = x + off;
      const yy = h * L.base - Math.abs(Math.sin(wx * 0.0016 + L.seed)) * h * L.amp
        - Math.abs(Math.sin(wx * 0.0041 + L.seed * 2.7)) * h * L.amp * 0.35;
      ctx.lineTo(x, yy);
    }
    ctx.lineTo(w + 60, h);
    ctx.closePath();
    ctx.fill();
  }
  // mist band
  const mist = ctx.createLinearGradient(0, h * 0.62, 0, h * 0.92);
  mist.addColorStop(0, 'rgba(120,60,80,0)');
  mist.addColorStop(0.55, 'rgba(120,60,80,0.16)');
  mist.addColorStop(1, 'rgba(30,14,24,0)');
  ctx.fillStyle = mist;
  ctx.fillRect(0, h * 0.6, w, h * 0.32);
}

function drawArena(ctx, world) {
  const { x1, x2 } = world.arena;
  const groundY = GROUND_Y;
  // far gate silhouette
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = '#150b14';
  const gateX = 1550;
  ctx.fillRect(gateX - 90, groundY - 250, 16, 250);
  ctx.fillRect(gateX + 74, groundY - 250, 16, 250);
  ctx.fillRect(gateX - 118, groundY - 268, 236, 18);
  ctx.fillRect(gateX - 104, groundY - 236, 208, 10);
  ctx.restore();

  // ground body
  const gg = ctx.createLinearGradient(0, groundY - 4, 0, groundY + 120);
  gg.addColorStop(0, '#3c2a2c');
  gg.addColorStop(0.2, '#2a1c20');
  gg.addColorStop(1, '#120b10');
  ctx.fillStyle = gg;
  ctx.fillRect(x1 - 240, groundY, (x2 - x1) + 480, 180);
  // top edge highlight
  ctx.fillStyle = '#6e4b44';
  ctx.fillRect(x1 - 240, groundY, (x2 - x1) + 480, 2);
  ctx.fillStyle = 'rgba(255,140,110,0.16)';
  ctx.fillRect(x1 - 240, groundY + 2, (x2 - x1) + 480, 1);

  // stone tile joints
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1;
  for (let x = x1 - 240; x < x2 + 240; x += 96) {
    ctx.beginPath(); ctx.moveTo(x, groundY + 4); ctx.lineTo(x - 26, groundY + 120); ctx.stroke();
  }
  for (let yy = groundY + 26; yy < groundY + 120; yy += 30) {
    ctx.beginPath(); ctx.moveTo(x1 - 240, yy); ctx.lineTo(x2 + 240, yy); ctx.stroke();
  }

  // arena limit posts: braziers
  for (const side of [x1 - 22, x2 + 22]) {
    ctx.fillStyle = '#241a1c';
    ctx.fillRect(side - 7, groundY - 92, 14, 92);
    ctx.fillStyle = '#3a2a2a';
    ctx.fillRect(side - 14, groundY - 96, 28, 10);
    const t = world.time;
    glowCircle(ctx, side, groundY - 104, 46, 'rgba(255,110,60,0.5)', 0.55 + Math.sin(t * 7 + side) * 0.12);
    ctx.fillStyle = '#ffb24a';
    ctx.beginPath();
    ctx.moveTo(side - 7, groundY - 96);
    ctx.quadraticCurveTo(side - 3 + Math.sin(t * 9) * 3, groundY - 116, side, groundY - 124 - Math.sin(t * 13) * 4);
    ctx.quadraticCurveTo(side + 4 + Math.cos(t * 8) * 3, groundY - 112, side + 7, groundY - 96);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff0b8';
    ctx.beginPath();
    ctx.ellipse(side, groundY - 103, 3.4, 6 + Math.sin(t * 15) * 1.5, 0, 0, TAU);
    ctx.fill();
    // chains
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.moveTo(side, groundY - 96); ctx.lineTo(side + 16, groundY - 60); ctx.stroke();
  }

  // near foreground grass tufts & pebbles
  ctx.strokeStyle = 'rgba(150,100,90,0.25)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 40; i++) {
    const gx2 = x1 + ((i * 173) % (x2 - x1));
    ctx.beginPath();
    ctx.moveTo(gx2, groundY + 2);
    ctx.quadraticCurveTo(gx2 + 3, groundY - 6, gx2 + 7, groundY - 9);
    ctx.stroke();
  }
  // vignette handled by renderWorld overlay
}

function drawSeveredPiece(ctx, s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot);
  const sc = s.size;
  const fade = clamp(s.life, 0, 1);
  // soft contact shadow when resting
  if (s.rest) {
    ctx.globalAlpha = 0.28 * fade;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0, 2, 16 * sc, 4 * sc, 0, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = fade;
  if (s.id === 'head') {
    ctx.beginPath(); ctx.arc(0, 0, 11 * sc, 0, TAU);
    ctx.fillStyle = s.color; ctx.fill();
    ctx.strokeStyle = s.darker; ctx.lineWidth = 2.2; ctx.stroke();
    // bone-white mask plate
    ctx.beginPath();
    ctx.moveTo(-6 * sc, -3 * sc); ctx.lineTo(7 * sc, -1 * sc);
    ctx.lineTo(6 * sc, 5 * sc); ctx.lineTo(-5 * sc, 4 * sc);
    ctx.closePath();
    ctx.fillStyle = '#efe6cf'; ctx.fill();
    ctx.strokeStyle = s.darker; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#ff3b2f';
    ctx.beginPath(); ctx.arc(-1 * sc, 0, 1.6 * sc, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(3.5 * sc, 0.6 * sc, 1.6 * sc, 0, TAU); ctx.fill();
    // torn neck
    ctx.fillStyle = '#7a1c26';
    ctx.beginPath(); ctx.ellipse(-10 * sc, 1 * sc, 4.4 * sc, 6.5 * sc, 0, 0, TAU); ctx.fill();
  } else if (s.id === 'legs') {
    capsule(ctx, -7 * sc, -5 * sc, -10 * sc, 12 * sc, 6.4 * sc, 4.4 * sc);
    ctx.fillStyle = s.color; ctx.fill(); ctx.strokeStyle = s.darker; ctx.lineWidth = 1.8; ctx.stroke();
    capsule(ctx, 7 * sc, -5 * sc, 10 * sc, 12 * sc, 6.4 * sc, 4.4 * sc);
    ctx.fillStyle = s.color; ctx.fill(); ctx.strokeStyle = s.darker; ctx.lineWidth = 1.8; ctx.stroke();
    // belt/hip band joining the pair
    ctx.fillStyle = s.darker;
    ctx.beginPath(); ctx.ellipse(0, -4 * sc, 12 * sc, 5 * sc, 0, 0, TAU); ctx.fill();
    // torn hip
    ctx.fillStyle = '#7a1c26';
    ctx.beginPath(); ctx.ellipse(0, -8 * sc, 9 * sc, 4 * sc, 0, 0, TAU); ctx.fill();
  } else {
    // arm: shoulder joint -> forearm -> claw/blade remnant
    ctx.lineCap = 'round';
    // torn shoulder stump
    ctx.fillStyle = '#7a1c26';
    ctx.beginPath(); ctx.ellipse(-12 * sc, 0, 4.6 * sc, 7 * sc, 0, 0, TAU); ctx.fill();
    capsule(ctx, -11 * sc, 0, 5 * sc, 0, 5.6 * sc, 4.4 * sc);
    ctx.fillStyle = s.color; ctx.fill(); ctx.strokeStyle = s.darker; ctx.lineWidth = 1.8; ctx.stroke();
    // accent cuff
    ctx.strokeStyle = s.accent || s.darker; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(2 * sc, -4 * sc); ctx.lineTo(2 * sc, 4 * sc); ctx.stroke();
    // claw / gauntlet blade
    ctx.beginPath();
    ctx.moveTo(5 * sc, -4.5 * sc); ctx.lineTo(17 * sc, -6 * sc);
    ctx.lineTo(21 * sc, -0.5 * sc); ctx.lineTo(16 * sc, 3 * sc); ctx.lineTo(6 * sc, 4 * sc);
    ctx.closePath();
    ctx.fillStyle = '#d7d1c2'; ctx.fill();
    ctx.strokeStyle = s.darker; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(8 * sc, -1 * sc); ctx.lineTo(18 * sc, -2.5 * sc); ctx.stroke();
  }
  ctx.restore();
}

function drawOrbs(ctx, world) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const o of world.orbs) {
    const col = o.reflected ? '255,215,106' : '255,91,134';
    glowCircle(ctx, o.x, o.y, o.r * 3.4, 'rgba(' + col + ',0.55)', 0.9);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 0.48, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(' + col + ',0.95)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, world.time * 8, world.time * 8 + 4.2); ctx.stroke();
    // tail
    ctx.strokeStyle = 'rgba(' + col + ',0.5)';
    ctx.lineWidth = o.r * 0.9;
    ctx.beginPath(); ctx.moveTo(o.x, o.y);
    ctx.lineTo(o.x - o.vx * 0.045, o.y - o.vy * 0.045); ctx.stroke();
  }
  ctx.restore();
}

function drawAmbient(ctx, world) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const e of world.ambientEmbers) {
    const y = ((e.y - world.time * 14) % 520 + 520) % 520 + 20;
    const x = e.x + Math.sin(world.time * 0.7 + e.ph) * 22;
    ctx.globalAlpha = 0.12 + 0.2 * (0.5 + 0.5 * Math.sin(world.time * 2 + e.ph));
    ctx.fillStyle = Math.sin(e.ph) > 0 ? '#ff7a58' : '#ffc06a';
    ctx.beginPath(); ctx.arc(x, y, e.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawWorld(ctx, world) {
  const cam = world.cam;
  const w = cam.vw, h = cam.vh;

  drawSky(ctx, w, h, cam, world.time);

  ctx.save();
  cam.apply(ctx);
  drawAmbient(ctx, world);
  drawArena(ctx, world);

  // settled debris lies on the ground behind actors; airborne pieces draw on top
  for (const s of world.severed) if (s.rest) drawSeveredPiece(ctx, s);

  // enemies (sorted back to front by y)
  const list = world.enemies.slice().sort((a, b) => a.y - b.y);
  for (const e of list) e.draw(ctx);

  // player
  world.player.draw(ctx, cam);

  // flying limbs in front of the fight so the moment of severing always reads
  for (const s of world.severed) if (!s.rest) drawSeveredPiece(ctx, s);

  // fx in additive mode
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  world.fx.draw(ctx, true);
  ctx.restore();
  world.fx.draw(ctx, false);

  drawOrbs(ctx, world);
  drawSkillWorldFx(ctx, world);

  // telegraph slash warn already in enemy.draw

  world.fx.drawTexts(ctx);

  // soft arena edge falloff: fades in and back out so there is no hard seam
  const fadeW = 190;
  const fadeL = ctx.createLinearGradient(world.arena.x1 - fadeW, 0, world.arena.x1 + 40, 0);
  fadeL.addColorStop(0, 'rgba(6,3,8,0)');
  fadeL.addColorStop(0.45, 'rgba(6,3,8,0.34)');
  fadeL.addColorStop(1, 'rgba(6,3,8,0)');
  ctx.fillStyle = fadeL;
  ctx.fillRect(world.arena.x1 - fadeW, -400, fadeW + 40, 1400);
  const fadeR = ctx.createLinearGradient(world.arena.x2 + fadeW, 0, world.arena.x2 - 40, 0);
  fadeR.addColorStop(0, 'rgba(6,3,8,0)');
  fadeR.addColorStop(0.45, 'rgba(6,3,8,0.34)');
  fadeR.addColorStop(1, 'rgba(6,3,8,0)');
  ctx.fillStyle = fadeR;
  ctx.fillRect(world.arena.x2 - 40, -400, fadeW + 40, 1400);

  ctx.restore();

  // screen vignette
  const vg = ctx.createRadialGradient(w / 2, h * 0.52, Math.min(w, h) * 0.38, w / 2, h * 0.52, Math.max(w, h) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, w, h);

  // damage flash (subtle red edge)
  if (world.uiDamageFlash > 0) {
    const a = world.uiDamageFlash * 0.5;
    const dg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.7);
    dg.addColorStop(0, 'rgba(255,30,40,0)');
    dg.addColorStop(1, 'rgba(255,30,40,' + a + ')');
    ctx.fillStyle = dg;
    ctx.fillRect(0, 0, w, h);
  }
}


function drawSkillWorldFx(ctx, world) {
  const t = world.time;
  // shadow rend marks
  for (const e of world.enemies) {
    if (e.dead || !e._shadowMarked) continue;
    const k = e._shadowMarked / 0.55;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.35 + 0.4 * k;
    ctx.strokeStyle = '#ff4a6a';
    ctx.lineWidth = 2;
    const cx = e.x, cy = e.y - e.h * 0.5;
    ctx.beginPath(); ctx.arc(cx, cy, 30 + 10 * k, 0, TAU); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const a = t * 5 + i * (TAU / 3);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 14, cy + Math.sin(a) * 14);
      ctx.lineTo(cx + Math.cos(a) * (34 + 8 * k), cy + Math.sin(a) * (34 + 8 * k));
      ctx.stroke();
    }
    ctx.restore();
  }
  // falling falchions
  for (const b of world.bladeRain) {
    if (b.done) continue;
    const visible = b.delay <= 0.35;
    if (!visible) continue;
    ctx.save();
    ctx.translate(b.x, b.y);
    // soft glow trail
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(0, -120, 0, 0);
    g.addColorStop(0, 'rgba(150,200,255,0)');
    g.addColorStop(1, 'rgba(190,230,255,0.55)');
    ctx.fillStyle = g;
    ctx.fillRect(-4, -130, 8, 130);
    ctx.globalCompositeOperation = 'source-over';
    // blade body
    ctx.rotate(0.18);
    poly(ctx, [[-5, -26], [6, -26], [9, 14], [0, 40], [-9, 14]]);
    ctx.fillStyle = '#dceaff'; ctx.fill();
    ctx.strokeStyle = '#5a7fa8'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, 10); ctx.stroke();
    ctx.restore();
  }
}

function drawSkillScreenFx(ctx, world) {
  const u = world.ultimate;
  const w = world.cam.vw, h = world.cam.vh;
  if (u) {
    const k = clamp(u.t / u.end, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // crimson vignette pulse
    const a = 0.16 + 0.14 * Math.sin(k * Math.PI * 6);
    const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.72);
    g.addColorStop(0, 'rgba(255,40,50,0)');
    g.addColorStop(1, 'rgba(255,40,50,' + a.toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    // converging speed lines toward the player
    const px = world.player.x - world.cam.x + w / 2 - world.cam.offX;
    const py = world.player.y - 40 - world.cam.y + h / 2 - world.cam.offY;
    ctx.globalAlpha = 0.10 + 0.12 * Math.sin(k * 40);
    ctx.strokeStyle = '#ff9a9a';
    ctx.lineWidth = 2;
    for (let i = 0; i < 22; i++) {
      const ang = i * 0.2857 + k * 1.4;
      const r0 = 120 + 90 * Math.sin(i * 1.7 + k * 9);
      ctx.beginPath();
      ctx.moveTo(px + Math.cos(ang) * r0, py + Math.sin(ang) * r0 * 0.72);
      ctx.lineTo(px + Math.cos(ang) * (r0 + 150), py + Math.sin(ang) * (r0 + 150) * 0.72);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (world.slowmoT > 0 && !u) {
    ctx.save();
    ctx.fillStyle = 'rgba(40,70,110,' + (0.05 * world.slowmoT).toFixed(3) + ')';
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
}


/* ===== hud.js ===== */
/* =========================================================
   hud.js — in-canvas HUD (HP, wave, combo, controls ribbon)
   ========================================================= */
function drawHUD(ctx, world) {
  const w = world.cam.vw, h = world.cam.vh;
  const p = world.player;
  ctx.save();
  ctx.textBaseline = 'middle';

  // ---- player status plate (top-left) ----
  const px = 24, py = 22, pw = 296, ph = 54;
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = '#0b0810';
  roundRect(ctx, px, py, pw, ph, 8);
  ctx.fill();
  ctx.strokeStyle = 'rgba(200,160,110,0.35)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.globalAlpha = 1;

  gameFont(ctx, 12, 700);
  ctx.fillStyle = '#c9b58e';
  ctx.textAlign = 'left';
  ctx.fillText('绯月行者  REAPER', px + 14, py + 14);

  // hp bar with damage-delay ghost
  if (world._hpGhost === undefined) world._hpGhost = p.hp;
  world._hpGhost += (p.hp - world._hpGhost) * 0.12;
  if (world._hpGhost < p.hp) world._hpGhost = p.hp;
  const bx = px + 14, by = py + 25, bw = pw - 28, bh = 11;
  ctx.fillStyle = '#1d1216';
  roundRect(ctx, bx, by, bw, bh, 4); ctx.fill();
  // ghost
  ctx.fillStyle = 'rgba(255,120,110,0.45)';
  roundRect(ctx, bx, by, bw * clamp(world._hpGhost / p.maxHp, 0, 1), bh, 4); ctx.fill();
  const hpG = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  hpG.addColorStop(0, '#a81e2a');
  hpG.addColorStop(0.55, '#e5483c');
  hpG.addColorStop(1, '#ffb35c');
  ctx.fillStyle = hpG;
  roundRect(ctx, bx, by, bw * clamp(p.hp / p.maxHp, 0, 1), bh, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,180,0.28)';
  roundRect(ctx, bx, by, bw, bh, 4); ctx.stroke();
  // segment ticks
  ctx.strokeStyle = 'rgba(20,8,10,0.55)';
  for (let i = 1; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(bx + (bw / 5) * i, by + 1);
    ctx.lineTo(bx + (bw / 5) * i, by + bh - 1);
    ctx.stroke();
  }
  gameFont(ctx, 11, 700);
  ctx.fillStyle = '#e8d6b8';
  ctx.textAlign = 'right';
  ctx.fillText(Math.ceil(p.hp) + ' / ' + p.maxHp, px + pw - 14, py + 14);

  // ---- wave plate (top-right) ----
  ctx.textAlign = 'right';
  const wave = Math.max(1, world.stats.wave);
  gameFont(ctx, 12, 700);
  ctx.fillStyle = 'rgba(220,200,170,0.7)';
  ctx.fillText('KILL ' + world.stats.killCount + '  ·  SEVER ' + world.stats.limbBreakCount + '  ·  PARRY ' + world.stats.parryCount, w - 120, py + 14);
  gameFont(ctx, 22, 800);
  ctx.fillStyle = '#f2d9a8';
  ctx.fillText('WAVE ' + wave, w - 120, py + 42);

  // ---- combo counter (right side, above ribbon) ----
  if (p.combo > 1) {
    const k = clamp(p.comboTimer / 2.2, 0, 1);
    const pulse = 1 + Math.max(0, (p.comboTimer - 2.05)) * 1.5;
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.65 * k;
    ctx.translate(w - 60, h * 0.34);
    ctx.rotate(-0.05);
    ctx.textAlign = 'right';
    gameFont(ctx, Math.round(52 * pulse), 900);
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(18,8,10,0.8)';
    ctx.strokeText(String(p.combo), 0, 0);
    ctx.fillStyle = '#ffcf8a';
    ctx.fillText(String(p.combo), 0, 0);
    gameFont(ctx, 14, 800);
    ctx.fillStyle = 'rgba(255,215,170,0.85)';
    ctx.fillText('CONNECT', 0, 34);
    ctx.restore();
  }

  // ---- wave banner (centre) ----
  if (world.waveBannerT > 0) {
    const t = world.waveBannerT;
    const a = clamp(Math.min(t * 2, (1.5 - t) * 3), 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    gameFont(ctx, 46, 900);
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(14,6,10,0.85)';
    ctx.strokeText(world.waveBannerText, w / 2, h * 0.26);
    ctx.fillStyle = '#ffe3b0';
    ctx.fillText(world.waveBannerText, w / 2, h * 0.26);
    // underline sweep
    const lw = 260 * clamp((1.5 - t) * 2, 0, 1);
    ctx.strokeStyle = 'rgba(255,120,90,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(w / 2 - lw / 2, h * 0.26 + 34);
    ctx.lineTo(w / 2 + lw / 2, h * 0.26 + 34);
    ctx.stroke();
    ctx.restore();
  }

  // ---- skill bar (bottom-left, above ribbon) ----
  const SKILLS = [
    { key: '1', name: '月轮斩', en: 'MOON WHEEL', cd: 4.5, col: '#ff8ac8' },
    { key: '2', name: '影袭', en: 'SHADOW REND', cd: 6.5, col: '#ff8a7a' },
    { key: '3', name: '刃雨', en: 'BLADE RAIN', cd: 8.5, col: '#9cc9ff' },
    { key: '4', name: '千刃一闪', en: 'CRIMSON MOON', cd: 20, col: '#ff5a5a' }
  ];
  const sx0 = 24, sy0 = h - 98, sw = 128, sh = 44, gap = 6;
  for (let i = 0; i < 4; i++) {
    const cd = p.skillCd[i], max = SKILLS[i].cd;
    const ready = cd <= 0;
    const x = sx0 + i * (sw + gap);
    ctx.globalAlpha = 0.74;
    ctx.fillStyle = '#0b0810';
    roundRect(ctx, x, sy0, sw, sh, 6); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = ready ? SKILLS[i].col : 'rgba(160,140,130,0.35)';
    ctx.lineWidth = ready ? 1.6 : 1;
    roundRect(ctx, x, sy0, sw, sh, 6); ctx.stroke();
    // cooldown wipe (rises from the bottom)
    if (!ready) {
      const k = clamp(cd / max, 0, 1);
      ctx.globalAlpha = 0.34;
      ctx.fillStyle = '#000';
      roundRect(ctx, x, sy0 + sh * (1 - k), sw, sh * k, 6); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.textAlign = 'right';
      gameFont(ctx, 12, 800);
      ctx.fillStyle = '#f0dcc0';
      ctx.fillText(cd.toFixed(1), x + sw - 7, sy0 + 15);
    } else {
      ctx.save();
      ctx.globalAlpha = 0.26 + 0.12 * Math.sin(world.time * 4 + i);
      ctx.fillStyle = SKILLS[i].col;
      roundRect(ctx, x, sy0, sw, sh, 6); ctx.fill();
      ctx.restore();
      ctx.textAlign = 'right';
      gameFont(ctx, 10, 800);
      ctx.fillStyle = 'rgba(255,240,215,0.9)';
      ctx.fillText('READY', x + sw - 7, sy0 + 15);
    }
    // key chip
    ctx.fillStyle = 'rgba(255,235,200,0.16)';
    roundRect(ctx, x + 6, sy0 + 6, 18, 18, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(255,225,180,0.45)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.textAlign = 'center';
    gameFont(ctx, 12, 800);
    ctx.fillStyle = '#ffeecb';
    ctx.fillText(SKILLS[i].key, x + 15, sy0 + 16);
    // names
    ctx.textAlign = 'left';
    gameFont(ctx, 12, 800);
    ctx.fillStyle = ready ? '#f2e3c6' : 'rgba(220,205,185,0.6)';
    ctx.fillText(SKILLS[i].name, x + 29, sy0 + 16);
    gameFont(ctx, 8, 700);
    ctx.fillStyle = ready ? SKILLS[i].col : 'rgba(180,165,150,0.5)';
    ctx.fillText(SKILLS[i].en, x + 29, sy0 + 31);
  }

  // ---- controls ribbon (bottom) ----
  const ry = h - 30;
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#08050c';
  roundRect(ctx, w / 2 - 372, ry - 17, 744, 34, 7);
  ctx.fill();
  ctx.globalAlpha = 0.9;
  const items = [
    ['J', '轻斩 SLASH'],
    ['K', '蓄力重斩 CHARGE'],
    ['L', '瞬步 DASH'],
    ['I', '弹反 PARRY'],
    ['Space', '跳跃 JUMP'],
    ['R', '重开']
  ];
  // skills are shown in the skill bar above; keep the ribbon compact
  let cx = w / 2 - 358;
  for (const it of items) {
    ctx.font = '800 12px "Trebuchet MS","PingFang SC",sans-serif';
    const kw = ctx.measureText(it[0]).width + 12;
    ctx.fillStyle = 'rgba(255,230,190,0.16)';
    roundRect(ctx, cx, ry - 10, kw, 20, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,170,0.4)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#ffe9c4';
    ctx.textAlign = 'center';
    ctx.fillText(it[0], cx + kw / 2, ry + 1);
    cx += kw + 5;
    ctx.fillStyle = 'rgba(230,214,190,0.75)';
    ctx.textAlign = 'left';
    ctx.fillText(it[1], cx, ry + 1);
    cx += ctx.measureText(it[1]).width + 16;
  }

  // ---- death overlay is DOM; draw the "R" cue only ----
  ctx.restore();
}

function drawStartHint(ctx, world) {
  // small hint while idle at very start
  if (world.time < 4.2 && world.playing && world.player.hp > 0) {
    const a = clamp(Math.min(world.time * 0.8, (4.2 - world.time) * 0.8), 0, 0.85);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    gameFont(ctx, 15, 700);
    ctx.fillStyle = '#ffd9a8';
    ctx.fillText('连按 J 追击 · 第四段挑空 · 空中 J 追打 / K 下劈    J combo · 4th launches · air J / K plunge', world.cam.vw / 2, world.cam.vh - 62);
    ctx.restore();
  }
}


/* ===== main.js ===== */
/* =========================================================
   main.js — canvas bootstrap, fixed-step loop, title/death flow
   ========================================================= */
(function boot() {
  const canvasEl = document.getElementById('stage');
  const ctxEl = canvasEl.getContext('2d');
  const muteBtn = document.getElementById('muteBtn');
  const deathPanel = document.getElementById('deathPanel');

  const input = new Input();
  const world = new World();
  world.input = input;

  // expose read-only state hook
  window.combatBenchState = function () {
    try { return world.state(); } catch (e) {
      return { ready: false, playerAlive: false, enemyCount: 0, hitCount: 0, limbBreakCount: 0, playing: false };
    }
  };

  let started = false;
  let last = performance.now();
  let acc = 0;
  const STEP = 1 / 120;
  let deathShown = false;
  let startedAt = 0;

  /* ---- responsive canvas, integer-ish scale, letterbox ---- */
  let viewW = 960, viewH = 540, scale = 1;
  function resize() {
    const app = document.getElementById('app');
    const rect = app.getBoundingClientRect();
    const availW = Math.max(320, rect.width);
    const availH = Math.max(240, rect.height);
    // design view is 960x540 but at 16:9 we widen the world view on ultrawide
    const ratio = availW / availH;
    if (ratio >= 16 / 9) {
      viewH = 540;
      viewW = Math.round(540 * ratio);
      viewW = clamp(viewW, 960, 2400);
    } else {
      viewW = 960;
      viewH = clamp(Math.round(960 / ratio), 540, 1080);
    }
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = Math.min(availW, availH * (viewW / viewH));
    const cssH = cssW * (viewH / viewW);
    canvasEl.style.width = cssW + 'px';
    canvasEl.style.height = cssH + 'px';
    canvasEl.width = Math.round(cssW * dpr);
    canvasEl.height = Math.round(cssH * dpr);
    scale = (cssW * dpr) / viewW;
    world.cam.resize(viewW, viewH);
  }
  window.addEventListener('resize', resize);
  resize();
  world.cam.resize(viewW, viewH);

  /* ---- first interaction: enable audio ---- */
  function ensureAudio() {
    Sfx.init();
    if (muteBtn) muteBtn.textContent = Sfx.isMuted() ? '♪ 音效 关' : '♪ 音效 开';
  }
  window.addEventListener('pointerdown', ensureAudio, { passive: true });
  window.addEventListener('keydown', ensureAudio, { passive: true });
  window.addEventListener('touchstart', ensureAudio, { passive: true });

  if (muteBtn) {
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      ensureAudio();
      const m = Sfx.setMuted(!Sfx.isMuted());
      muteBtn.textContent = m ? '♪ 音效 关' : '♪ 音效 开';
      muteBtn.blur();
    });
    muteBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  }

  /* ---- start / restart ---- */
  function startGame() {
    ensureAudio();
    world.start();
    started = true;
    startedAt = performance.now();
    deathShown = false;
    deathPanel.classList.add('hidden');
    document.getElementById('titlePanel').classList.add('hidden');
    Sfx.select();
  }
  function restartGame() {
    ensureAudio();
    world.restart();
    started = true;
    deathShown = false;
    deathPanel.classList.add('hidden');
    document.getElementById('titlePanel').classList.add('hidden');
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Enter') {
      e.preventDefault();
      if (!started) startGame();
      else if (world.player.state === 'dead' || !world.playing) restartGame();
    } else if (e.code === 'KeyR') {
      if (started) restartGame();
    }
  });
  canvasEl.addEventListener('pointerdown', () => {
    ensureAudio();
    if (!started) startGame();
  });

  // pause when tab hidden
  let paused = false;
  document.addEventListener('visibilitychange', () => {
    paused = document.hidden;
    if (!paused) last = performance.now();
  });

  /* ---- render frame ---- */
  function render() {
    const cw = canvasEl.width, ch = canvasEl.height;
    ctxEl.setTransform(1, 0, 0, 1, 0, 0);
    ctxEl.fillStyle = '#07040a';
    ctxEl.fillRect(0, 0, cw, ch);
    ctxEl.setTransform(scale, 0, 0, scale, 0, 0);
    ctxEl.imageSmoothingEnabled = true;

    drawWorld(ctxEl, world);
    if (started) {
      drawHUD(ctxEl, world);
      drawStartHint(ctxEl, world);
      drawSkillScreenFx(ctxEl, world);
    }

    // death DOM panel
    if (started && world.player.state === 'dead' && world.deathT > 0.8 && !deathShown) {
      deathShown = true;
      deathPanel.classList.remove('hidden');
    }
    if (deathShown && world.player.state !== 'dead') {
      deathShown = false;
      deathPanel.classList.add('hidden');
    }
  }

  /* ---- fixed-step loop ---- */
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (paused) return;
    if (dt > 0.1) dt = 0.1; // tab-back / hitch guard
    if (!started) {
      // idle vignette simulation for the title screen
      world.time += dt;
      world.fx.update(dt, false);
      world.cam.update(dt, world);
      // keep a couple of scenic enemies from the title? no — clean arena
      render();
      return;
    }
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard < 12) {
      // process discrete events that must not be swallowed by hitstop
      handleMetaInput();
      const frozen = world.freeze > 0;
      world.update(STEP);
      // keep buffered attack inputs alive through hit-stop so combos stay responsive
      if (!frozen) input.step();
      acc -= STEP;
      guard++;
    }
    if (guard >= 12) acc = 0;
    render();
  }

  function handleMetaInput() {
    if (world.player.state === 'dead' && world.deathT > 0.5) {
      if (input.consume('restart') || input.consume('confirm')) {
        restartGame();
      }
    }
  }

  // title screen pre-render: show arena with player idle at start position
  world.player.x = 240;
  world.cam.x = 400; world.cam.y = 340;

  requestAnimationFrame(frame);
})();


})();
</script>
</body>
</html>
