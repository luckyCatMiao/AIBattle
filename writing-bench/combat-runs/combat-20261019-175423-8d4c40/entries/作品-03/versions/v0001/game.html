:root {
  --ink: #0a0b0e;
  --ember: #ff8a3c;
  --ember-hot: #ffd9a0;
  --cyan: #7cf3ff;
  --paper: #efe4cf;
  --paper-dim: #a99f8e;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: #06070a;
  color: var(--paper);
  font-family: "UIFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(120% 90% at 50% 10%, #14161d 0%, #08090c 55%, #040507 100%);
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: repeating-linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.018) 0px,
    rgba(255, 255, 255, 0.018) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode: overlay;
  z-index: 3;
  opacity: 0.55;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
}

#game {
  display: block;
  outline: none;
  background: #0b0c10;
  box-shadow: 0 0 0 1px rgba(255, 196, 128, 0.10), 0 30px 90px rgba(0, 0, 0, 0.85);
  touch-action: none;
  cursor: crosshair;
}

#muteBtn {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px 7px 10px;
  border: 1px solid rgba(239, 228, 207, 0.22);
  border-radius: 999px;
  background: rgba(8, 9, 12, 0.66);
  color: var(--paper);
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.08em;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
}

#muteBtn:hover { background: rgba(24, 26, 33, 0.9); border-color: rgba(255, 190, 120, 0.45); }
#muteBtn:active { transform: scale(0.97); }
#muteBtn[aria-pressed="true"] { color: var(--paper-dim); border-color: rgba(239, 228, 207, 0.12); }

#muteIcon {
  display: inline-grid;
  place-items: center;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  font-size: 11px;
  background: rgba(255, 138, 60, 0.16);
  color: var(--ember-hot);
  line-height: 1;
}

#muteBtn[aria-pressed="true"] #muteIcon {
  background: rgba(150, 150, 150, 0.12);
  color: #8b8578;
}

#stageHint {
  position: absolute;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  z-index: 4;
  font-size: 12px;
  letter-spacing: 0.35em;
  color: rgba(239, 228, 207, 0.55);
  pointer-events: none;
  animation: hintPulse 2.6s ease-in-out infinite;
  transition: opacity 400ms ease;
}

#stageHint.hidden { opacity: 0; }

@keyframes hintPulse {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 0.9; }
}

</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="横版动作战斗：余烬之刃"></canvas>
  <button id="muteBtn" type="button" aria-pressed="false" title="音效开关 (M)">
    <span id="muteIcon" aria-hidden="true">♪</span>
    <span id="muteLabel">音效 开</span>
  </button>
  <div id="stageHint" aria-hidden="true">点击画面开始</div>
</div>
<script>
(function(){

/* ---- engine.js ---- */
(function (AV) {
  "use strict";

  // ---------------------------------------------------------------- utilities
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a = 1, b = 0) => b + Math.random() * (a - b);
  const randInt = (a, b) => Math.floor(b + Math.random() * (a - b + 1));
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];

  const approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const easeInCubic = (t) => t * t * t;
  const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOutQuint = (t) => 1 - Math.pow(1 - t, 5);
  const easeOutBack = (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  };
  const angleLerp = (a, b, t) => {
    let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
    return a + d * t;
  };

  AV.util = { TAU, clamp, lerp, rand, randInt, pick, sign, approach, easeOutCubic, easeInCubic, easeInOutCubic, easeOutQuint, easeOutBack, angleLerp };

  // ------------------------------------------------------------------- input
  const GAME_KEYS = new Set([
    "KeyA", "KeyD", "ArrowLeft", "ArrowRight", "Space", "KeyJ", "KeyK", "KeyL", "KeyI",
    "KeyR", "Enter", "KeyM", "KeyP", "Escape", "ShiftLeft", "ShiftRight",
  ]);

  const Input = {
    down: new Set(),
    pressed: new Set(),
    released: new Set(),
    anyKeyPressed: false,
    pointerPressed: false,
    lastInputTime: 0,
    init(canvas) {
      window.addEventListener("keydown", (e) => {
        if (GAME_KEYS.has(e.code)) e.preventDefault();
        if (e.repeat) return;
        this.down.add(e.code);
        this.pressed.add(e.code);
        this.anyKeyPressed = true;
        this.lastInputTime = performance.now();
      }, { passive: false });

      window.addEventListener("keyup", (e) => {
        if (GAME_KEYS.has(e.code)) e.preventDefault();
        this.down.delete(e.code);
        this.released.add(e.code);
      }, { passive: false });

      window.addEventListener("blur", () => this.clear());
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) this.clear();
      });

      canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        this.pointerPressed = true;
        this.anyKeyPressed = true;
        this.lastInputTime = performance.now();
      });
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    },
    clear() {
      this.down.clear();
      this.pressed.clear();
      this.released.clear();
    },
    endFrame() {
      this.pressed.clear();
      this.released.clear();
      this.anyKeyPressed = false;
      this.pointerPressed = false;
    },
    isDown(...codes) {
      for (const c of codes) if (this.down.has(c)) return true;
      return false;
    },
    wasPressed(...codes) {
      for (const c of codes) if (this.pressed.has(c)) return true;
      return false;
    },
  };
  AV.Input = Input;

  // ------------------------------------------------------------------- audio
  class AudioEngine {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.muted = false;
      this.noiseBuf = null;
      this.chargeOsc = null;
      this.chargeGain = null;
      this.chargeFilter = null;
      this.droneStarted = false;
      this.lastCrackle = 0;
      this.enabled = false;
    }

    ensure() {
      if (this.enabled) return true;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return false;
        this.ctx = new Ctx();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.75;
        this.master.connect(this.ctx.destination);

        const len = Math.floor(this.ctx.sampleRate * 1.2);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        this.noiseBuf = buf;
        this.enabled = true;
        if (this.ctx.state === "suspended") this.ctx.resume();
        return true;
      } catch (err) {
        this.enabled = false;
        return false;
      }
    }

    resume() {
      if (!this.ensure()) return;
      if (this.ctx.state === "suspended") this.ctx.resume();
      if (!this.droneStarted) this.startDrone();
    }

    setMuted(m) {
      this.muted = m;
      if (this.master && this.ctx) {
        const t = this.ctx.currentTime;
        this.master.gain.cancelScheduledValues(t);
        this.master.gain.setTargetAtTime(m ? 0 : 0.75, t, 0.03);
      }
      if (m) this.stopChargeHum();
    }

    now() { return this.ctx ? this.ctx.currentTime : 0; }

    noiseSource(playbackRate = 1) {
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      src.playbackRate.value = playbackRate;
      return src;
    }

    envGain(t0, attack, decay, peak) {
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
      return g;
    }

    tone(type, f0, f1, dur, peak, delay = 0, pan = 0) {
      if (!this.enabled || this.muted) return;
      try {
        const t = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        osc.type = type;
        osc.frequency.setValueAtTime(f0, t);
        if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + Math.min(0.012, dur * 0.2));
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        const p = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
        osc.connect(g);
        if (p) { p.pan.value = clamp(pan, -1, 1); g.connect(p); p.connect(this.master); }
        else g.connect(this.master);
        osc.start(t);
        osc.stop(t + dur + 0.05);
      } catch (e) { /* audio must never break gameplay */ }
    }

    noise({ dur = 0.15, peak = 0.25, type = "bandpass", f0 = 1200, f1 = 600, q = 1, delay = 0, rate = 1, pan = 0 } = {}) {
      if (!this.enabled || this.muted) return;
      try {
        const t = this.ctx.currentTime + delay;
        const src = this.noiseSource(rate);
        const flt = this.ctx.createBiquadFilter();
        flt.type = type;
        flt.frequency.setValueAtTime(f0, t);
        if (f1 !== f0) flt.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
        flt.Q.value = q;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(flt);
        flt.connect(g);
        if (this.ctx.createStereoPanner) {
          const p = this.ctx.createStereoPanner();
          p.pan.value = clamp(pan, -1, 1);
          g.connect(p);
          p.connect(this.master);
        } else g.connect(this.master);
        src.start(t, Math.random() * 0.2);
        src.stop(t + dur + 0.03);
      } catch (e) { /* ignore */ }
    }

    swing(power = 1) {
      if (!this.enabled || this.muted) return;
      const p = clamp(power, 0.4, 2);
      this.noise({ dur: 0.1 + 0.05 * p, peak: 0.11 * p, type: "bandpass", f0: 900 + 500 * p, f1: 2600 + 900 * p, q: 0.9 });
      this.noise({ dur: 0.07, peak: 0.06 * p, type: "highpass", f0: 3200, f1: 5200, q: 0.6, delay: 0.015 });
      this.tone("sine", 380 + 120 * p, 220, 0.09, 0.03, 0, 0.1);
    }

    hit(force = 1) {
      if (!this.enabled || this.muted) return;
      const f = clamp(force, 0.5, 3);
      this.tone("sine", 150 * f, 44, 0.16 + 0.06 * f, 0.34, 0, 0.1);
      this.tone("triangle", 220, 90, 0.1, 0.12, 0, -0.1);
      this.noise({ dur: 0.09 + 0.03 * f, peak: 0.16, type: "bandpass", f0: 420, f1: 180, q: 0.7 });
      this.noise({ dur: 0.05, peak: 0.08, type: "highpass", f0: 2600, f1: 3200, q: 0.8, delay: 0.005 });
      const base = 2400 + rand(1400);
      this.tone("triangle", base, base * 0.72, 0.22, 0.035, 0.008, -0.15);
      this.tone("sine", base * 1.5, base * 1.2, 0.14, 0.02, 0.01, 0.2);
    }

    heavy(level = 1) {
      if (!this.enabled || this.muted) return;
      this.tone("sine", 110, 30, 0.32 + 0.08 * level, 0.42, 0, 0);
      this.noise({ dur: 0.22, peak: 0.24, type: "lowpass", f0: 900, f1: 120, q: 1.2 });
      this.noise({ dur: 0.08, peak: 0.13, type: "bandpass", f0: 3400, f1: 1200, q: 1 });
      this.tone("triangle", 1400, 620, 0.28, 0.06, 0.01, -0.25);
      this.tone("triangle", 1970, 900, 0.22, 0.04, 0.015, 0.25);
    }

    parry() {
      if (!this.enabled || this.muted) return;
      const t = this.now();
      this.noise({ dur: 0.05, peak: 0.2, type: "highpass", f0: 3800, f1: 6000, q: 0.7 });
      this.tone("sine", 1568, 1568, 1.1, 0.1, 0, -0.2);
      this.tone("sine", 2093, 2093, 0.95, 0.075, 0.004, 0.2);
      this.tone("sine", 3136, 2900, 0.7, 0.045, 0.01, 0);
      this.tone("triangle", 784, 740, 0.5, 0.05, 0.02);
      this.noise({ dur: 0.32, peak: 0.08, type: "bandpass", f0: 5200, f1: 2200, q: 2.5, delay: 0.03 });
      this.tone("sine", 90, 55, 0.25, 0.18, 0);
    }

    dash() {
      if (!this.enabled || this.muted) return;
      this.noise({ dur: 0.2, peak: 0.16, type: "bandpass", f0: 3200, f1: 300, q: 1.4 });
      this.noise({ dur: 0.08, peak: 0.07, type: "highpass", f0: 5200, f1: 1800, q: 0.8, delay: 0.02 });
      this.tone("sine", 600, 200, 0.12, 0.02);
    }

    jump() {
      if (!this.enabled || this.muted) return;
      this.noise({ dur: 0.12, peak: 0.08, type: "bandpass", f0: 700, f1: 1600, q: 1.1 });
      this.tone("sine", 300, 470, 0.13, 0.035);
    }

    land() {
      if (!this.enabled || this.muted) return;
      this.tone("sine", 95, 40, 0.18, 0.22);
      this.noise({ dur: 0.14, peak: 0.1, type: "lowpass", f0: 1100, f1: 180, q: 0.8 });
    }

    limbBreak() {
      if (!this.enabled || this.muted) return;
      this.tone("sine", 82, 36, 0.36, 0.36);
      for (let i = 0; i < 4; i++) {
        this.tone("square", rand(1400, 700), rand(500, 180), 0.07, 0.028, i * 0.026 + rand(0.02), rand(0.5, -0.5));
      }
      this.noise({ dur: 0.3, peak: 0.24, type: "bandpass", f0: 1700, f1: 260, q: 0.8 });
      this.noise({ dur: 0.12, peak: 0.12, type: "highpass", f0: 4200, f1: 2600, q: 0.8, delay: 0.02 });
    }

    parryReady() {
      if (!this.enabled || this.muted) return;
      this.noise({ dur: 0.14, peak: 0.05, type: "bandpass", f0: 1200, f1: 3200, q: 3 });
    }

    death() {
      if (!this.enabled || this.muted) return;
      this.tone("sine", 220, 55, 1.4, 0.2, 0);
      this.tone("triangle", 330, 110, 1.1, 0.08, 0.05);
      this.noise({ dur: 0.9, peak: 0.12, type: "lowpass", f0: 900, f1: 80, q: 0.7 });
    }

    enemyDie() {
      if (!this.enabled || this.muted) return;
      this.tone("sine", 120, 34, 0.5, 0.25);
      this.noise({ dur: 0.4, peak: 0.18, type: "bandpass", f0: 1400, f1: 200, q: 0.7 });
    }

    wave() {
      if (!this.enabled || this.muted) return;
      this.tone("sine", 196, 196, 1.6, 0.09, 0);
      this.tone("sine", 294, 294, 1.3, 0.05, 0.02);
      this.tone("sine", 392, 392, 1.1, 0.03, 0.04);
      this.noise({ dur: 0.5, peak: 0.05, type: "bandpass", f0: 2400, f1: 900, q: 3, delay: 0.03 });
    }

    startChargeHum() {
      if (!this.enabled || this.muted || this.chargeOsc) return;
      try {
        const t = this.now();
        const osc = this.ctx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(70, t);
        const flt = this.ctx.createBiquadFilter();
        flt.type = "bandpass";
        flt.frequency.value = 400;
        flt.Q.value = 4;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.05, t + 0.18);
        osc.connect(flt); flt.connect(g); g.connect(this.master);
        osc.start(t);
        this.chargeOsc = osc; this.chargeGain = g; this.chargeFilter = flt;
      } catch (e) { /* ignore */ }
    }

    updateChargeHum(progress) {
      if (!this.chargeOsc) return;
      try {
        const t = this.now();
        this.chargeOsc.frequency.setTargetAtTime(70 + progress * 130, t, 0.05);
        this.chargeFilter.frequency.setTargetAtTime(300 + progress * 1500, t, 0.05);
        this.chargeGain.gain.setTargetAtTime(0.03 + progress * 0.05, t, 0.06);
      } catch (e) { /* ignore */ }
    }

    stopChargeHum() {
      if (!this.chargeOsc) return;
      try {
        const t = this.now();
        this.chargeGain.gain.cancelScheduledValues(t);
        this.chargeGain.gain.setTargetAtTime(0.0001, t, 0.03);
        this.chargeOsc.stop(t + 0.15);
      } catch (e) { /* ignore */ }
      this.chargeOsc = null; this.chargeGain = null; this.chargeFilter = null;
    }

    startDrone() {
      this.droneStarted = true;
      try {
        const t = this.now();
        const g = this.ctx.createGain();
        g.gain.value = 0.035;
        const flt = this.ctx.createBiquadFilter();
        flt.type = "lowpass";
        flt.frequency.value = 260;
        const a = this.ctx.createOscillator();
        a.type = "sawtooth"; a.frequency.value = 42;
        const b = this.ctx.createOscillator();
        b.type = "sine"; b.frequency.value = 63.5;
        const c = this.ctx.createOscillator();
        c.type = "sine"; c.frequency.value = 127.3;
        const cg = this.ctx.createGain(); cg.gain.value = 0.25;
        a.connect(flt); b.connect(flt); c.connect(cg); cg.connect(flt);
        flt.connect(g); g.connect(this.master);
        a.start(t); b.start(t); c.start(t);
      } catch (e) { /* ignore */ }
    }

    tick(realDt) {
      if (!this.enabled || this.muted) return;
      this.lastCrackle -= realDt;
      if (this.lastCrackle <= 0) {
        this.lastCrackle = rand(2.8, 1.1);
        try {
          this.noise({ dur: 0.045, peak: 0.02, type: "bandpass", f0: rand(2200, 700), f1: 300, q: 2 });
        } catch (e) { /* ignore */ }
      }
    }
  }
  AV.AudioEngine = AudioEngine;

  // ------------------------------------------------------------------ effects
  // Effects are updated with real dt even while hitstop freezes the world.
  class Effects {
    constructor() {
      this.list = [];
      this.dust = [];
      this.debris = [];
      this.texts = [];
      this.ghosts = [];
      this.flash = 0;
      this.flashColor = "255,255,255";
      this.max = 700;
    }
    clear() {
      this.list.length = 0;
      this.dust.length = 0;
      this.debris.length = 0;
      this.texts.length = 0;
      this.ghosts.length = 0;
      this.flash = 0;
    }
    add(e) {
      if (this.list.length >= this.max) this.list.shift();
      this.list.push(e);
      return e;
    }
    spark(x, y, dirx, diry, opts = {}) {
      const n = opts.count || 8;
      for (let i = 0; i < n; i++) {
        const ang = Math.atan2(diry, dirx) + rand(1.15, -1.15) * (opts.spread == null ? 1 : opts.spread);
        const spd = rand(opts.speed == null ? 520 : opts.speed, 90) * rand(1.3, 0.6);
        this.add({
          k: "spark", x, y,
          vx: Math.cos(ang) * spd + (opts.vx || 0),
          vy: Math.sin(ang) * spd + (opts.vy || 0),
          life: rand(opts.life || 0.4, 0.14),
          max: opts.life || 0.4,
          size: rand(2.4, 0.9) * (opts.scale || 1),
          grav: opts.grav == null ? 1400 : opts.grav,
          color: opts.color || pick(["#ffe7b0", "#ffb45e", "#ffffff", "#9ff6ff"]),
          drag: opts.drag == null ? 2.4 : opts.drag,
        });
      }
    }
    emberBurst(x, y, n = 10, color = "#ffb35c", speed = 260) {
      for (let i = 0; i < n; i++) {
        const a = rand(TAU, 0);
        const s = rand(speed, 40);
        this.add({
          k: "ember", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
          life: rand(1.4, 0.6), max: 1.4, size: rand(3, 1), color, grav: -30, drag: 0.9,
        });
      }
    }
    slash(x, y, angle, radius, opts = {}) {
      this.add({
        k: "slash", x, y, angle, radius,
        arc: opts.arc == null ? 2.1 : opts.arc,
        life: opts.life || 0.22, max: opts.life || 0.22,
        width: opts.width || 10,
        color: opts.color || "#a8f7ff",
        glow: opts.glow == null ? 1 : opts.glow,
        flip: opts.flip || 1,
        follow: opts.follow || null,
        ox: opts.ox || 0, oy: opts.oy || 0,
        rot: opts.rot || 0,
        grow: opts.grow == null ? 60 : opts.grow,
      });
    }
    ring(x, y, opts = {}) {
      this.add({
        k: "ring", x, y, r: opts.r0 || 8, r1: opts.r1 || 90,
        life: opts.life || 0.32, max: opts.life || 0.32,
        width: opts.width || 3, color: opts.color || "#ffd6a0",
        squash: opts.squash == null ? 0.42 : opts.squash,
        rot: opts.rot || 0,
      });
    }
    flashBurst(x, y, opts = {}) {
      this.add({
        k: "flash", x, y, r: opts.r || 60, life: opts.life || 0.14, max: opts.life || 0.14,
        color: opts.color || "#ffffff",
      });
    }
    impact(x, y, dirx, force = 1, color) {
      this.spark(x, y, dirx, -0.35, { count: 8 + (force * 5 | 0), speed: 380 + force * 200, spread: 0.9, life: 0.36, scale: 0.8 + force * 0.25, color });
      this.flashBurst(x, y, { r: 28 + force * 18, color: color || "#fff6df" });
      this.ring(x, y, { r1: 36 + force * 26, width: 2.5 + force, color: "#ffd9a0", life: 0.2, squash: 0.55 });
    }
    dustPuff(x, y, count = 6, dir = 0, power = 1) {
      for (let i = 0; i < count; i++) {
        this.add({
          k: "dust", x: x + rand(20, -20), y: y + rand(4, -4),
          vx: rand(140, -140) * power + dir * 70, vy: rand(-10, -110) * power,
          life: rand(0.7, 0.35), max: 0.7, size: rand(10, 3) * power, color: "#7d7266", grav: -30, drag: 2.2,
        });
      }
    }
    text(x, y, str, opts = {}) {
      this.texts.push({
        x, y, str,
        vx: opts.vx == null ? rand(50, -50) : opts.vx,
        vy: opts.vy == null ? -140 : opts.vy,
        life: opts.life || 0.7, max: opts.life || 0.7,
        size: opts.size || 22, color: opts.color || "#fff2d6",
        weight: opts.weight || 700,
        font: opts.font || "ui",
        glow: opts.glow || 0,
        align: opts.align || "center",
        gravity: opts.gravity == null ? 260 : opts.gravity,
      });
    }
    limb(x, y, part, opts) {
      const ghost = {
        k: "limb", x, y, vx: opts.vx || 0, vy: opts.vy || 0,
        rot: opts.rot || 0, spin: opts.spin || 0,
        life: opts.life || 2.4, max: opts.life || 2.4,
        part, flip: opts.flip || 1, bounce: 0, trail: opts.trail || false,
      };
      this.debris.push(ghost);
      return ghost;
    }
    ghost(x, y, pose, facing, opts = {}) {
      this.ghosts.push({
        x, y, pose, facing,
        life: opts.life || 0.3, max: opts.life || 0.3,
        color: opts.color || "#7cf3ff", alpha: opts.alpha || 0.4,
      });
    }
    screenFlash(alpha, color = "255,255,255") {
      this.flash = Math.max(this.flash, alpha);
      this.flashColor = color;
    }

    update(dt) {
      this.flash = Math.max(0, this.flash - dt * 3.2);
      for (let i = this.list.length - 1; i >= 0; i--) {
        const e = this.list[i];
        e.life -= dt;
        if (e.life <= 0) { this.list.splice(i, 1); continue; }
        if (e.k === "spark" || e.k === "ember" || e.k === "dust") {
          e.vy += e.grav * dt;
          const d = Math.exp(-e.drag * dt);
          e.vx *= d;
          e.vy *= e.k === "dust" ? d : e.vy * 0 + e.vy * d;
          e.x += e.vx * dt;
          e.y += e.vy * dt;
          if (e.k === "spark" && e.y > 0.5) { e.y = 0.5; e.vy *= -0.32; e.vx *= 0.7; }
        }
      }
      for (let i = this.texts.length - 1; i >= 0; i--) {
        const t = this.texts[i];
        t.life -= dt;
        if (t.life <= 0) { this.texts.splice(i, 1); continue; }
        t.vy += t.gravity * dt * (t.life < t.max * 0.5 ? 1 : 0.3);
        t.x += t.vx * dt;
        t.y += t.vy * dt;
      }
      for (let i = this.ghosts.length - 1; i >= 0; i--) {
        const g = this.ghosts[i];
        g.life -= dt;
        if (g.life <= 0) this.ghosts.splice(i, 1);
      }
      for (let i = this.debris.length - 1; i >= 0; i--) {
        const d = this.debris[i];
        d.life -= dt;
        d.vy += 1900 * dt;
        d.x += d.vx * dt;
        d.y += d.vy * dt;
        d.rot += d.spin * dt;

    parryB: P({ lean: 4, head: -6, bSh: 128, bEl: 182, fSh: 262, fEl: 316, swAng: -96, bTh: 104, bShin: 86, fTh: 76, fShin: 92, swX: 4, swY: -4 }),

    // counter execution
    cta: P({ lean: -10, head: -10, bSh: 200, bEl: 250, fSh: 205, fEl: 255, swAng: -150, bTh: 96, bShin: 94, fTh: 82, fShin: 96 }),
    ctb: P({ lean: 34, head: -4, bSh: 160, bEl: 205, fSh: 60, fEl: 26, swAng: 40, bTh: 82, bShin: 96, fTh: 66, fShin: 104, swX: 12 }),
    ctc: P({ lean: 30, head: 0, bSh: 132, bEl: 188, fSh: 48, fEl: 14, swAng: 70, bTh: 84, bShin: 94, fTh: 64, fShin: 106, swX: 10 }),

    dead: P({ lean: 78, head: 30, bSh: 190, bEl: 240, fSh: 160, fEl: 210, swAng: 120, bTh: 118, bShin: 40, fTh: 132, fShin: 46, hipY: -40 }),
  };

  function poseAt(name, t) {
    switch (name) {
      case "idle": {
        const s = (Math.sin(t * 2.2) + 1) * 0.5;
        return G.lerpPose(POSES.idle[0], POSES.idle[1], s);
      }
      case "run": {
        const s = (Math.sin(t * 16) + 1) * 0.5;
        const base = G.lerpPose(POSES.runA, POSES.runB, s);
        base.lean += Math.sin(t * 32) * 1.5;
        return base;
      }
      case "jump": return POSES.jumpRise;
      case "fall": return POSES.fall;
      case "land": return POSES.land;
      case "hurt": return POSES.hurt;
      case "dead": return POSES.dead;
      case "light1": return G.blendPoses([POSES.idle[0], POSES.l1a, POSES.l1b, POSES.l1c], t);
      case "light2": return G.blendPoses([POSES.l1c, POSES.l2a, POSES.l2b, POSES.l2c], t);
      case "light3": return G.blendPoses([POSES.l2c, POSES.l3a, POSES.l3b, POSES.l3c], t);
      case "heavy": {
        if (t < 0.42) return G.lerpPose(POSES.hva, POSES.hvb, clamp(t / 0.42, 0, 1));
        return G.blendPoses([POSES.hvb, POSES.hvc, POSES.hvd], (t - 0.42) / 0.58);
      }
      case "dashAtk": return G.blendPoses([POSES.da, POSES.db, POSES.dc], t);
      case "air1": return G.blendPoses([POSES.a1a, POSES.a1b, POSES.a1c], t);
      case "air2": return G.blendPoses([POSES.a2a, POSES.a2b, POSES.a2c], t);
      case "airDive": return G.blendPoses([POSES.diveA, POSES.diveB], t);
      case "parry": {
        const s = (Math.sin(t * 30) + 1) * 0.5;
        return G.lerpPose(POSES.parryA, POSES.parryB, s * 0.4);
      }
      case "counter": return G.blendPoses([POSES.cta, POSES.ctb, POSES.ctc], t);
      default: return POSES.idle[0];
    }
  }

  class Player {
    constructor(game) {
      this.game = game;
      this.dims = G.DIMS.player;
      this.reset(500, 0);
    }

    reset(x, y) {
      this.x = x;
      this.y = y;
      this.vx = 0;
      this.vy = 0;
      this.facing = 1;
      this.grounded = true;
      this.hp = 100;
      this.maxHp = 100;
      this.alive = true;
      this.state = "idle";
      this.stateT = 0;
      this.animT = 0;
      this.attack = null;
      this.attackName = null;
      this.attackT = 0;
      this.hitSet = new Set();
      this.comboIndex = 0;
      this.comboWindow = 0;
      this.chainQueued = null;
      this.iFrames = 0;
      this.hurtFlash = 0;
      this.parryTimer = 0;
      this.parryActive = false;
      this.parrySuccess = 0;
      this.dashCooldown = 0;
      this.airDashUsed = false;
      this.doubleJumpUsed = false;
      this.coyote = 0;
      this.jumpBuffer = 0;
      this.attackBuffer = 0;
      this.focus = 0;
      this.maxFocus = 100;
      this.charge = 0;
      this.charging = false;
      this.landT = 0;
      this.skel = G.makeSkel(POSES.idle[0], this.dims);
      this.pose = POSES.idle[0];
      this.trailT = 0;
      this.afterimages = 0;
      this.stepT = 0;
      this.deathT = 0;
      this.dashTrailT = 0;
      this.lastHitTime = 0;
      this.guardBREAK = 0;
      this.smokeT = 0;
      this.screenX = x;
      this.screenY = y;
    }

    get swordTip() {
      const w = this.skel.weapon;
      const r = w.ang * D2R;
      const len = 86;
      return {
        x: this.x + this.facing * (w.x + Math.cos(r) * len),
        y: this.y + (w.y + Math.sin(r) * len * 0.98 - Math.sin(r) * 0),
      };
    }

    hitbox() {
      return { x: this.x - 16, y: this.y - 108, w: 32, h: 108 };
    }

    startAttack(name) {
      const a = ATTACKS[name];
      if (!a) return;
      // gentle auto-facing assist: never attack past an adjacent enemy
      let best = null;
      let bd = 150;
      for (const e of this.game.enemies) {
        if (!e.alive || e.spawning) continue;
        const hb = e.hurtbox();
        const d = Math.abs(hb.x - this.x);
        const dy = Math.abs(hb.y - (this.y - 60));
        if (d < bd && dy < 130) { bd = d; best = e; }
      }
      if (best) this.facing = sign(best.x - this.x) || this.facing;
      this.attackName = name;
      this.attack = a;
      this.attackT = 0;
      this.state = "attack";
      this.stateT = 0;
      this.hitSet.clear();
      this.chainQueued = null;
      if (name === "heavy") {
        this.charging = false;
        this.charge = 0;
      }
      if (this.grounded && a.lunge) {
        this.vx = this.facing * a.lunge;
      }
      this.game.audio.swing(a.sfx || 1);
      // swing ghost effect
      const tip = this.swordTip;
      this.game.fx.ghost(this.x, this.y, this.pose || POSES.idle[0], this.facing, { life: 0.24, alpha: 0.18 });
    }

    playAnim(name, speed = 1) {
      this.state = name;
      this.stateT = 0;
    }

    update(dt, game) {
      if (!this.alive) {
        this.deathT += dt;
        this.stateT += dt;
        this.animT += dt;
        this.vx = U.approach(this.vx, 0, 900 * dt);
        this.applyPhysics(dt);
        this.updatePose(dt);
        return;
      }
      this.stateT += dt;
      this.animT += dt;
      this.iFrames = Math.max(0, this.iFrames - dt);
      this.dashCooldown = Math.max(0, this.dashCooldown - dt);
      this.parrySuccess = Math.max(0, this.parrySuccess - dt);
      this.hurtFlash = Math.max(0, this.hurtFlash - dt * 4);
      this.comboWindow = Math.max(0, this.comboWindow - dt);
      this.jumpBuffer = Math.max(0, this.jumpBuffer - dt);
      this.attackBuffer = Math.max(0, this.attackBuffer - dt);
      this.focus = Math.min(this.maxFocus, this.focus + dt * 1.4);

      const input = AV.Input;
      const move = (input.isDown("KeyD", "ArrowRight") ? 1 : 0) - (input.isDown("KeyA", "ArrowLeft") ? 1 : 0);
      if (input.wasPressed("Space")) this.jumpBuffer = 0.13;
      if (input.wasPressed("KeyJ")) this.attackBuffer = 0.16;

      // ---------------- parry (I)
      if (input.wasPressed("KeyI") && this.state !== "attack" && this.state !== "parry" && this.parryCooldownSafe()) {
        this.state = "parry";
        this.stateT = 0;
        this.parryTimer = 0.30;
        this.parryCooldown = 0.5;
        this.vx *= 0.3;
        game.audio.parryReady();
        game.fx.ring(this.x, this.y - 70, { r1: 42, width: 2, color: "#a8f4ff", life: 0.18, squash: 1 });
      }

      // ---------------- dash (L)
      if (input.wasPressed("KeyL") && this.dashCooldown <= 0 && this.state !== "attack" && this.state !== "hurt") {
        const dashingAir = !this.grounded;
        if (!dashingAir || !this.airDashUsed) {
          this.state = "dash";
          this.stateT = 0;
          this.dashTime = 0.20;
          this.iFrames = Math.max(this.iFrames, 0.17);
          this.dashCooldown = 0.34;
          if (dashingAir) { this.airDashUsed = true; this.vy = Math.min(this.vy, 20); }
          const dir = move !== 0 ? move : this.facing;
          this.facing = dir;
          this.vx = dir * 880;
          this.vy = 0;
          this.dashTrailT = 0;
          this.dashAttackWindow = 0.22;
          game.audio.dash();
          game.fx.dustPuff(this.x, this.y, 5, -dir, 0.9);
          game.fx.ghost(this.x, this.y, this.pose, this.facing, { life: 0.3, alpha: 0.35 });
        }
      }
      if (this.state === "dash") {
        this.dashTime -= dt;
        this.dashAttackWindow -= dt;
        this.iFrames = Math.max(this.iFrames, 0.1);
        this.dashTrailT -= dt;
        if (this.dashTrailT <= 0) {
          this.dashTrailT = 0.032;
          game.fx.ghost(this.x, this.y, this.pose, this.facing, { life: 0.26, alpha: 0.32 });
          if (Math.random() < 0.6) game.fx.emberBurst(this.x, this.y - 50, 2, "#7cf3ff", 90);
        }
        this.vx = this.facing * 880 * clamp(this.dashTime / 0.2, 0.35, 1);
        if (this.dashAttackWindow > 0 && (this.attackBuffer > 0 || input.wasPressed("KeyJ"))) {
          this.startAttack("dashAtk");
          this.attackBuffer = 0;
        } else if (this.dashTime <= 0) {
          this.state = this.grounded ? "idle" : "fall";
          this.vx *= 0.4;
        }
      }

      // ---------------- parry state
      if (this.state === "parry") {
        this.parryTimer -= dt;
        this.parryCooldown = Math.max(0, (this.parryCooldown || 0) - dt);
        this.vx = U.approach(this.vx, 0, 1800 * dt);
        if (this.parryTimer <= 0) {
          this.state = this.grounded ? "idle" : "fall";
        }
      } else if (this.parryCooldown) {
        this.parryCooldown = Math.max(0, this.parryCooldown - dt);
      }

      // ---------------- heavy charge (K)
      if (this.state !== "attack" && this.state !== "dash") {
        if (input.isDown("KeyK") && this.grounded) {
          if (!this.charging) {
            this.charging = true;
            this.charge = 0;
            game.audio.startChargeHum();
          }
          this.charge = Math.min(1, this.charge + dt * 1.35);
          this.vx = U.approach(this.vx, 0, 2200 * dt);
          game.audio.updateChargeHum(this.charge);
          if (this.state !== "parry") {
            this.state = "charge";
            this.stateT += dt;
          }
          if (this.charge >= 0.999 && Math.random() < 0.4) {
            const tip = this.swordTip;
            game.fx.spark(tip.x, tip.y, 0, -1, { count: 1, speed: 140, color: "#ffd28a", life: 0.36, grav: -60 });
          }
        } else if (this.charging) {
          this.charging = false;
          game.audio.stopChargeHum();
          if (this.state !== "parry" && this.state !== "dash") {
            this.startAttack("heavy");
            this.attack.chargePower = this.charge;
            this.charge = 0;
          } else {
            this.charge = 0;
          }
        }
      }

      // ---------------- attack
      if (this.state === "attack") {
        this.attackT += dt;
        const a = this.attack;
        const tt = this.attackT / a.dur;

        // gravity / physics for lunging attacks
        if (this.grounded && this.attackT < 0.22) {
          this.vx = U.approach(this.vx, this.facing * (a.lunge || 0), 900 * dt);
        } else if (this.grounded) {
          this.vx = U.approach(this.vx, 0, 2600 * dt);
        }

        // emit slash trail during active window
        if (tt >= a.hit[0] * 0.7 && tt <= a.hit[1] + 0.05) {
          this.trailT -= dt;
          if (this.trailT <= 0) {
            this.trailT = 0.016;
            const tip = this.swordTip;
            const w = this.skel.weapon;
            const ang = Math.atan2(tip.y - (this.y + w.y), tip.x - (this.x + this.facing * w.x));
            game.fx.slash(tip.x, tip.y, ang, 14, {
              arc: 2.4, life: 0.16, width: 11, color: a.counter ? "#ffe1a6" : "#b8f6ff",
              grow: 120, glow: a.heavy ? 1.6 : 1.1,
            });
            game.fx.spark(tip.x, tip.y, Math.cos(ang), Math.sin(ang), { count: 1, speed: 120, life: 0.2, color: "#bff8ff", grav: -20 });
          }
        }

        // hit detection
        if (tt >= a.hit[0] && tt <= a.hit[1]) {
          this.resolveHits(game, a);
        }

        // chain input
        if (a.chain && a.chain.length && this.attackT >= (a.chainAt || 0.1)) {
          if (this.attackBuffer > 0 || input.wasPressed("KeyJ")) {
            const next = this.pickChain(a.chain);
            if (next) {
              this.startAttack(next);
              this.attackBuffer = 0;
              this.comboIndex++;
            }
          }
        }

        if (this.attackT >= a.dur) {
          if (this.state === "attack") {
            this.state = this.grounded ? "idle" : "fall";
            this.attack = null;
            this.attackName = null;
            this.comboWindow = 0.16;
          }
        }
      }

      // ---------------- ground / air movement
      if (this.state !== "attack" && this.state !== "dash" && this.state !== "parry") {
        if (this.grounded) {
          const speed = 430;
          if (this.state === "charge") {
            this.vx = U.approach(this.vx, move * 90, 2200 * dt);
          } else {
            this.vx = U.approach(this.vx, move * speed, 3400 * dt);
            if (move !== 0) this.facing = move;
          }
          if (this.jumpBuffer > 0 && this.state !== "charge") {
            this.jumpBuffer = 0;
            this.vy = -880;
            this.grounded = false;
            this.doubleJumpUsed = false;
            this.coyote = 0.1;
            this.state = "jump";
            this.stateT = 0;
            this.airDashUsed = false;
            game.audio.jump();
            game.fx.dustPuff(this.x, this.y, 5, 0, 0.9);
          }
        } else {
          this.vx = U.approach(this.vx, move * 380, 1500 * dt);
          if (move !== 0 && this.state !== "charge") this.facing = move;
          if (this.jumpBuffer > 0 && !this.doubleJumpUsed) {
            this.jumpBuffer = 0;
            this.doubleJumpUsed = true;
            this.vy = -760;
            this.state = "jump";
            this.stateT = 0;
            this.airDashUsed = false;
            game.audio.jump();
            game.fx.ring(this.x, this.y - 50, { r1: 46, width: 2.5, color: "#a9f3ff", life: 0.3, squash: 0.5 });
            game.fx.spark(this.x, this.y - 40, 0, 1, { count: 6, speed: 220, color: "#a9f3ff", life: 0.3 });
          }
        }
      } else if (this.state === "attack" && !this.grounded) {
        // slight air drift
        const a = this.attack;
        if (a && (this.attackName === "air1" || this.attackName === "air2")) {
          this.vx = U.approach(this.vx, this.facing * 140, 600 * dt);
        }
      }

      // air attack input: J while airborne
      if (!this.grounded && (this.attackBuffer > 0 || input.wasPressed("KeyJ")) && this.state !== "attack" && this.state !== "dash") {
        this.attackBuffer = 0;
        this.startAttack(this.doubleJumpUsed || this.vy < 60 ? "air1" : "air1");
      }

      this.applyPhysics(dt);
      this.updatePose(dt);
    }

    parryCooldownSafe() {
      return !this.parryCooldown || this.parryCooldown <= 0;
    }

    pickChain(chain) {
      if (chain.includes("air1") && !this.grounded) return "air1";
      for (const c of chain) {
        if (c === "airDive" && !this.grounded) return "airDive";
        if (c === "air1" || c === "air2") continue;
        return c;
      }
      return chain[0];
    }

    applyPhysics(dt) {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      const arenaW = this.game.arenaW;
      if (this.x < 60) { this.x = 60; if (this.vx < 0) this.vx = 0; }
      if (this.x > arenaW - 60) { this.x = arenaW - 60; if (this.vx > 0) this.vx = 0; }
      if (this.y >= 0) {
        const wasAirborne = !this.grounded;
        this.y = 0;
        if (wasAirborne) {
          const impact = clamp(this.vy / 900, 0, 1.6);
          this.grounded = true;
          this.vy = 0;
          this.airDashUsed = false;
          this.doubleJumpUsed = false;
          if (this.state === "airDive" || this.state === "fall" || this.state === "jump") {
            if (impact > 0.25) {
              this.game.audio.land();
              this.game.fx.dustPuff(this.x, 0, 4 + impact * 6, 0, 0.8 + impact * 0.5);
              this.game.fx.dustPuff(this.x, 0, 3, -1, 0.6);
              this.game.fx.dustPuff(this.x, 0, 3, 1, 0.6);
              this.game.cam.addShake(impact * 2.4);
            }
            this.state = "land";
            this.landT = 0.12;
          } else if (this.state === "dash" || this.state === "attack" || this.state === "charge") {
            this.game.audio.land();
            this.game.fx.dustPuff(this.x, 0, 4, 0, 0.7);
          }
        }
      } else {
        this.grounded = false;
        this.vy += 2250 * dt;
        if (this.vy > 1600) this.vy = 1600;
        if (this.state === "idle" || this.state === "run" || this.state === "land") {
          this.state = this.vy < 0 ? "jump" : "fall";
          this.stateT = 0;
        }
      }
      if (this.state === "land") {
        this.landT -= dt;
        if (this.landT <= 0) this.state = "idle";
      }
      if (this.grounded && this.state !== "attack" && this.state !== "dash" && this.state !== "parry" && this.state !== "charge" && this.state !== "land" && this.state !== "hurt") {
        if (Math.abs(this.vx) > 30) {
          if (this.state !== "run") { this.state = "run"; this.stateT = 0; }
        } else if (this.state === "run") {
          this.state = "idle";
          this.stateT = 0;
        }
      }
      // run dust
      if (this.state === "run" && this.grounded) {
        this.stepT -= dt;
        if (this.stepT <= 0) {
          this.stepT = 0.12;
          this.game.fx.dustPuff(this.x - this.facing * 14, 0, 1, -this.facing, 0.35);
        }
      }
    }

    resolveHits(game, a) {
      const reach = a.reach;
      const hx = this.x + this.facing * reach * 0.5;
      const hy = this.y - 60;
      const hw = reach;
      const hh = a.hh;
      for (const e of game.enemies) {
        if (!e.alive || e.spawning) continue;
        if (this.hitSet.has(e.id)) continue;
        const hb = e.hurtbox();
        if (Math.abs(hx - hb.x) > (hw + hb.w) * 0.5) continue;
        if (Math.abs(hy - hb.y) > (hh + hb.h) * 0.5) continue;
        // strict facing
        if (Math.sign(hb.x - this.x) !== this.facing && Math.abs(hb.x - this.x) > 20) continue;
        this.hitSet.add(e.id);
        const tip = this.swordTip;
        const contact = {
          x: clamp(tip.x, hb.x - hb.w * 0.5, hb.x + hb.w * 0.5),
          y: clamp(tip.y, hb.y - hb.h * 0.5, hb.y + hb.h * 0.5),
        };
        game.onPlayerHit(e, a, contact, this);
      }
    }

    takeDamage(amount, srcX, opts = {}) {
      const game = this.game;
      if (!this.alive || this.iFrames > 0) return false;
      this.hp -= amount;
      this.hurtFlash = 1;
      this.iFrames = 0.65;
      game.stats.damageTaken += amount;
      const dir = sign(this.x - srcX) || 1;
      this.vx = dir * (opts.kb || 380);
      if (opts.kbY) { this.vy = opts.kbY; this.grounded = false; }
      this.state = "hurt";
      this.stateT = 0;
      this.attack = null;
      this.attackName = null;
      this.charging = false;
      game.audio.stopChargeHum();
      game.fx.impact(this.x, this.y - 64, dir, 1.4, "#ff9a6a");
      game.fx.text(this.x, this.y - 118, "-" + Math.round(amount), { color: "#ff7b6b", size: 26, vy: -60, gravity: 60 });
      game.cam.addShake(7);
      game.cam.punchZoom(0.015);
      game.hitstop = Math.max(game.hitstop, 0.055);
      game.fx.screenFlash(0.12, "255,80,60");
      game.audio.hit(1.2);
      if (this.hp <= 0) {
        this.hp = 0;
        this.alive = false;
        this.state = "dead";
        this.stateT = 0;
        game.onPlayerDeath();
      }
      return true;
    }

    perfectParry(attacker) {
      const game = this.game;
      this.parrySuccess = 0.9;
      this.parryTimer = 0;
      this.parryCooldown = 0.05;
      this.focus = Math.min(this.maxFocus, this.focus + 34);
      this.iFrames = 0.7;
      this.state = "parrySuccess";
      this.stateT = 0;
      game.stats.parries++;
      game.audio.parry();
      game.hitstop = 0.24;
      game.slowmo = 0.42;
      game.slowmoT = 0.55;
      game.cam.addShake(5);
      game.cam.punchZoom(0.03);
      game.fx.screenFlash(0.22, "200,255,255");
      game.fx.ring(this.x, this.y - 66, { r1: 130, width: 6, color: "#eaffff", life: 0.42, squash: 0.9 });
      game.fx.ring(this.x, this.y - 66, { r1: 86, width: 3, color: "#7cf3ff", life: 0.55, squash: 0.9 });
      game.fx.spark(this.x, this.y - 66, 0, -1, { count: 26, speed: 620, spread: 3.2, life: 0.6, color: "#eaffff", grav: 600 });
      game.fx.text(this.x, this.y - 150, "完美弹反", { color: "#d9ffff", size: 30, vy: -120, life: 0.9, glow: 1 });
      if (attacker) {
        attacker.stun(this.focus >= this.maxFocus ? 1.8 : 1.3);
        attacker.parried = true;
