<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>断星 // RIFT REAVER</title>
  <style>/*__STYLE__*/</style>
</head>
<body>
  <main id="shell" aria-label="断星横版动作战斗试玩">
    <canvas id="game" width="1600" height="900" tabindex="0" aria-label="游戏画面"></canvas>
    <div id="grain"></div>
    <section id="startScreen" class="screen show">
      <div class="titleMark">战斗系统试玩</div>
      <h1><span>断</span>星</h1>
      <p class="sub">RIFT // REAVER</p>
      <div class="rule"></div>
      <p class="intro">斩断失控兵偶的武装。压迫、挑空、追击——<br>让每一次命中都成为下一刀的起点。</p>
      <button id="startButton"><b>ENTER</b><span>拔刀</span></button>
      <p class="hint">建议使用键盘 · 音效将在首次操作后启用</p>
    </section>
    <section id="deathScreen" class="screen">
      <div class="titleMark">SIGNAL LOST</div>
      <h2>刃火熄灭</h2>
      <p id="deathStats"></p>
      <button id="restartButton"><b>R</b><span>再战</span></button>
    </section>
    <button id="muteButton" aria-label="静音" title="静音">◖)))</button>
    <div id="focusNotice">窗口失去焦点 · 操作已释放</div>
  </main>
  <script>/*__SCRIPT__*/</script>
</body>
</html>
