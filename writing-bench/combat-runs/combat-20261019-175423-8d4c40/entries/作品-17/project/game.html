<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月下傀儡庭 — 横版动作试玩</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #07060d;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #wrap { position: relative; }
  canvas {
    display: block;
    image-rendering: auto;
    box-shadow: 0 0 80px rgba(80, 60, 160, 0.25);
    cursor: crosshair;
  }
  #muteBtn {
    position: absolute;
    top: 10px; right: 10px;
    width: 40px; height: 40px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(10, 8, 18, 0.6);
    color: #fff;
    font-size: 19px;
    cursor: pointer;
    z-index: 10;
    line-height: 1;
  }
  #muteBtn:hover { background: rgba(40, 32, 70, 0.8); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <button id="muteBtn" title="静音开关">🔊</button>
</div>
<script>
/* ===== 00-util.js ===== */
/* ============================================================
 * 00-util.js — 数学工具 / 全局常量 / 简易随机
 * ============================================================ */
'use strict';

const TAU = Math.PI * 2;

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = (v) => v < 0 ? -1 : 1;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

// 帧率无关的指数平滑
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));

// 缓动
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

// 矩形相交
const rectsHit = (ax, ay, aw, ah, bx, by, bw, bh) =>
  ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

// 点到矩形最近点
const nearestOnRect = (px, py, rx, ry, rw, rh) => ({
  x: clamp(px, rx, rx + rw),
  y: clamp(py, ry, ry + rh),
});

/* ---------- 全局配置 ---------- */
const VIEW_W = 1280;
const VIEW_H = 720;
const GROUND_Y = 600;           // 地面线（逻辑坐标）
const ARENA_W = 2304;           // 战斗场地宽（相机跟随）
const GRAVITY = 2600;

const CFG = {
  player: {
    hp: 120,
    runSpeed: 380,
    accel: 4600,
    airAccel: 2600,
    friction: 5200,
    jumpVel: 920,
    airJumps: 1,
    coyote: 0.09,
    jumpBuf: 0.12,
    dashSpeed: 900,
    dashTime: 0.16,
    dashIFrames: 0.24,
    dashMax: 2,
    dashRegen: 1.05,
    hurtIFrames: 1.0,
  },
  hitstop: {
    light: 0.045,
    medium: 0.07,
    heavy: 0.105,
    charged: 0.15,
    kill: 0.16,
  },
};


/* ===== 01-audio.js ===== */
/* ============================================================
 * 01-audio.js — WebAudio 合成音效（无外部资源）
 * 首次用户手势后启用；提供静音开关。
 * ============================================================ */
'use strict';

class Synth {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = false;
    this.enabled = false;
    this._noiseBuf = null;
    this._lastPlay = {}; // 简单限频，防止同帧叠爆
  }

  // 必须在用户手势中调用
  ensure() {
    if (this.enabled) { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.knee.value = 22;
      comp.ratio.value = 8;
      comp.attack.value = 0.002;
      comp.release.value = 0.16;
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.9;
      this.master.connect(comp);
      comp.connect(this.ctx.destination);

      // 预生成噪声 buffer
      const len = this.ctx.sampleRate * 1.2;
      this._noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this._noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

      this.enabled = true;
    } catch (e) { /* 无音频环境也不阻塞游戏 */ }
  }

  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.01);
  }

  _gate(name, minInterval) {
    const t = performance.now();
    if (this._lastPlay[name] && t - this._lastPlay[name] < minInterval) return false;
    this._lastPlay[name] = t;
    return true;
  }

  _noise(dur, { hp = 0, lp = 20000, gain = 0.5, t0 = 0, attack = 0.004, sweepTo = null, sweepT = null, Q = 0.8 } = {}) {
    const c = this.ctx, t = c.currentTime + t0;
    const src = c.createBufferSource();
    src.buffer = this._noiseBuf;
    src.loop = true;
    src.playbackRate.value = rand(0.9, 1.1);
    let node = src;
    if (lp < 20000) {
      const f = c.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.setValueAtTime(lp, t); f.Q.value = Q;
      if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(30, sweepTo), t + (sweepT || dur));
      node.connect(f); node = f;
    }
    if (hp > 0) {
      const f = c.createBiquadFilter();
      f.type = 'highpass'; f.frequency.setValueAtTime(hp, t);
      if (sweepTo && lp >= 20000) f.frequency.exponentialRampToValueAtTime(Math.max(30, sweepTo), t + (sweepT || dur));
      node.connect(f); node = f;
    }
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    node.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.05);
  }

  _tone(freq, dur, { type = 'sine', gain = 0.4, t0 = 0, slideTo = null, attack = 0.003, curve = 'exp' } = {}) {
    const c = this.ctx, t = c.currentTime + t0;
    const o = c.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq * rand(0.97, 1.03), t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    if (curve === 'exp') g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    else g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  /* ---------- 具体音效 ---------- */
  swing(size = 0) { // 挥砍破空
    if (!this.enabled || !this._gate('swing', 40)) return;
    const big = size >= 2;
    this._noise(big ? 0.22 : 0.13, {
      hp: big ? 500 : 900, gain: big ? 0.5 : 0.3,
      sweepTo: big ? 240 : 420, sweepT: big ? 0.2 : 0.12, Q: 1.4,
    });
  }

  hit(size = 1) { // 命中: 0轻 1中 2重 3蓄力
    if (!this.enabled || !this._gate('hit' + size, 30)) return;
    if (size === 0) {
      this._tone(210, 0.07, { type: 'sine', gain: 0.5, slideTo: 70 });
      this._noise(0.06, { lp: 3800, gain: 0.35 });
    } else if (size === 1) {
      this._tone(170, 0.1, { type: 'sine', gain: 0.62, slideTo: 55 });
      this._noise(0.09, { lp: 3000, gain: 0.42 });
      this._tone(1400, 0.03, { type: 'square', gain: 0.1 });
    } else if (size === 2) {
      this._tone(120, 0.16, { type: 'sine', gain: 0.8, slideTo: 38 });
      this._noise(0.14, { lp: 2200, gain: 0.5 });
      this._tone(900, 0.05, { type: 'square', gain: 0.14, slideTo: 300 });
    } else {
      this._tone(95, 0.24, { type: 'sine', gain: 0.95, slideTo: 30 });
      this._noise(0.2, { lp: 1800, gain: 0.6 });
      this._tone(700, 0.09, { type: 'sawtooth', gain: 0.16, slideTo: 120 });
      this._noise(0.05, { hp: 3000, gain: 0.22 });
    }
  }

  clangArmor() { // 打在霸体上的硬声
    if (!this.enabled || !this._gate('clang', 60)) return;
    this._tone(2400, 0.05, { type: 'square', gain: 0.14, slideTo: 1500 });
    this._noise(0.05, { hp: 2500, gain: 0.2 });
  }

  breakLimb() { // 肢体断裂：木质碎裂
    if (!this.enabled || !this._gate('break', 50)) return;
    this._noise(0.1, { lp: 1600, gain: 0.55 });
    for (let i = 0; i < 4; i++) {
      this._tone(rand(500, 1600), 0.03, { type: 'square', gain: 0.12, t0: i * 0.014 + rand(0, 0.01), slideTo: rand(150, 400) });
    }
    this._tone(90, 0.16, { type: 'sine', gain: 0.5, slideTo: 40 });
  }

  coreShatter() { // 傀儡核心爆碎
    if (!this.enabled || !this._gate('core', 60)) return;
    this._tone(70, 0.35, { type: 'sine', gain: 0.9, slideTo: 26 });
    this._noise(0.3, { lp: 2600, gain: 0.55, sweepTo: 300, sweepT: 0.3 });
    for (let i = 0; i < 6; i++) {
      this._tone(rand(800, 2600), 0.04, { type: 'square', gain: 0.1, t0: 0.02 + i * 0.02, slideTo: rand(200, 600) });
    }
  }

  dash() {
    if (!this.enabled || !this._gate('dash', 90)) return;
    this._noise(0.16, { hp: 1400, gain: 0.26, sweepTo: 5200, sweepT: 0.15, Q: 1.2 });
  }

  jump() {
    if (!this.enabled || !this._gate('jump', 90)) return;
    this._tone(260, 0.09, { type: 'sine', gain: 0.16, slideTo: 460 });
  }

  land(hard = false) {
    if (!this.enabled || !this._gate('land', 120)) return;
    this._tone(hard ? 120 : 90, 0.08, { type: 'sine', gain: hard ? 0.3 : 0.14, slideTo: 45 });
    if (hard) this._noise(0.08, { lp: 900, gain: 0.2 });
  }

  hurt() {
    if (!this.enabled || !this._gate('hurt', 150)) return;
    this._tone(140, 0.18, { type: 'sawtooth', gain: 0.4, slideTo: 50 });
    this._noise(0.12, { lp: 1200, gain: 0.35 });
  }

  enemyWindup() { // 敌人前兆提示音（短促）
    if (!this.enabled || !this._gate('windup', 200)) return;
    this._tone(1150, 0.05, { type: 'square', gain: 0.07, slideTo: 1500 });
  }

  chargeTick(level) { // 蓄力阶段提示
    if (!this.enabled) return;
    this._tone(500 + level * 260, 0.06, { type: 'sine', gain: 0.16, slideTo: 640 + level * 300 });
  }

  slam() { // 空中下劈砸地
    if (!this.enabled || !this._gate('slam', 120)) return;
    this._tone(85, 0.28, { type: 'sine', gain: 0.9, slideTo: 28 });
    this._noise(0.22, { lp: 1400, gain: 0.5 });
  }

  waveStart() {
    if (!this.enabled) return;
    this._tone(160, 0.32, { type: 'sine', gain: 0.55, slideTo: 55 });
    this._tone(320, 0.2, { type: 'sine', gain: 0.25, slideTo: 110, t0: 0.05 });
  }

  uiClick() {
    if (!this.enabled) return;
    this._tone(700, 0.05, { type: 'sine', gain: 0.2, slideTo: 900 });
  }

  gameOver() {
    if (!this.enabled) return;
    this._tone(220, 0.5, { type: 'sawtooth', gain: 0.3, slideTo: 55 });
    this._tone(110, 0.7, { type: 'sine', gain: 0.4, slideTo: 40, t0: 0.1 });
  }

  heal() {
    if (!this.enabled) return;
    this._tone(520, 0.12, { type: 'sine', gain: 0.18, slideTo: 780 });
    this._tone(780, 0.14, { type: 'sine', gain: 0.14, slideTo: 1040, t0: 0.08 });
  }
}

const synth = new Synth();


/* ===== 02-input.js ===== */
/* ============================================================
 * 02-input.js — 键盘输入：缓冲、防页面滚动、失焦清空
 * ============================================================ */
'use strict';

const KEYMAP = {
  left:   ['KeyA', 'ArrowLeft'],
  right:  ['KeyD', 'ArrowRight'],
  up:     ['KeyW', 'ArrowUp'],
  down:   ['KeyS', 'ArrowDown'],
  jump:   ['Space'],
  atk:    ['KeyJ'],
  heavy:  ['KeyK'],
  dash:   ['KeyL'],
  special:['KeyI'],
  restart:['KeyR'],
  start:  ['Enter', 'NumpadEnter'],
};

// 需要拦截默认行为（防滚动）的键
const GAME_CODES = new Set([
  'KeyA', 'KeyD', 'KeyW', 'KeyS',
  'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
  'Space', 'KeyJ', 'KeyK', 'KeyL', 'KeyI', 'KeyR',
  'Enter', 'NumpadEnter',
]);

class Input {
  constructor() {
    this.downCodes = new Set();      // 当前按住
    this.pressBuf = {};              // action -> 剩余缓冲时间
    this.BUF_TIME = 0.16;
    this.anyKeyThisFrame = false;
  }

  attach(target) {
    target.addEventListener('keydown', (e) => {
      if (GAME_CODES.has(e.code)) e.preventDefault();
      if (e.repeat) return;
      this.downCodes.add(e.code);
      for (const act in KEYMAP) {
        if (KEYMAP[act].includes(e.code)) this.pressBuf[act] = this.BUF_TIME;
      }
      this.anyKeyThisFrame = true;
    });
    target.addEventListener('keyup', (e) => {
      this.downCodes.delete(e.code);
    });
    // 失焦/切页时清空，防止按键卡死
    window.addEventListener('blur', () => this.clear());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.clear(); });
  }

  clear() {
    this.downCodes.clear();
    this.pressBuf = {};
  }

  // 每帧结尾调用，衰减缓冲
  update(dt) {
    for (const act in this.pressBuf) {
      this.pressBuf[act] -= dt;
      if (this.pressBuf[act] <= 0) delete this.pressBuf[act];
    }
    this.anyKeyThisFrame = false;
  }

  down(action) {
    return KEYMAP[action].some(c => this.downCodes.has(c));
  }

  pressed(action) { // 是否处于缓冲窗口内
    return this.pressBuf[action] !== undefined;
  }

  consume(action) {
    if (this.pressBuf[action] !== undefined) {
      delete this.pressBuf[action];
      return true;
    }
    return false;
  }

  get axisX() {
    return (this.down('right') ? 1 : 0) - (this.down('left') ? 1 : 0);
  }
}

const input = new Input();


/* ===== 03-fx.js ===== */
/* ============================================================
 * 03-fx.js — 粒子 / 碎肢残骸 / 飘字 / 顿帧 / 震屏 / 慢动作
 * ============================================================ */
'use strict';

class FXSystem {
  constructor() {
    this.particles = [];   // 轻量粒子
    this.debris = [];      // 肢体残骸（物理）
    this.texts = [];       // 飘字
    this.rings = [];       // 冲击环
    this.afterimages = []; // 冲刺残影
    this.shakeAmp = 0;
    this.shakeDur = 0;
    this.shakeT = 0;
    this.shakeDirX = 0;
    this.shakeDirY = 0;
    this.hitstop = 0;      // 剩余顿帧秒
    this.slowmo = 0;       // 剩余慢动作秒
    this.slowmoScale = 1;
    this.flashA = 0;       // 屏幕闪白（极克制使用）
    this.trauma = 0;       // 累积震动量（自动衰减）
  }

  reset() {
    this.particles.length = 0;
    this.debris.length = 0;
    this.texts.length = 0;
    this.rings.length = 0;
    this.afterimages.length = 0;
    this.shakeAmp = 0; this.shakeT = 0; this.shakeDur = 0;
    this.hitstop = 0; this.slowmo = 0; this.flashA = 0; this.trauma = 0;
  }

  /* ---------- 顿帧 / 震屏 / 慢动作 ---------- */
  addHitstop(t) { this.hitstop = Math.max(this.hitstop, t); }

  addSlowmo(scale, dur) {
    this.slowmoScale = scale;
    this.slowmo = Math.max(this.slowmo, dur);
  }

  shake(amp, dur, dx = 0, dy = 0) {
    // 只增不减，避免连续小抖动互相覆盖成大抖
    if (amp >= this.shakeAmp * (1 - this.shakeT / Math.max(0.001, this.shakeDur))) {
      this.shakeAmp = amp;
      this.shakeDur = dur;
      this.shakeT = 0;
      const len = Math.hypot(dx, dy) || 1;
      this.shakeDirX = dx / len;
      this.shakeDirY = dy / len;
    }
  }

  flash(a) { this.flashA = Math.max(this.flashA, a); }

  getShakeOffset(t) {
    if (this.shakeT >= this.shakeDur) return { x: 0, y: 0 };
    const k = 1 - this.shakeT / this.shakeDur;
    const amp = this.shakeAmp * k * k;
    // 高频抖动 + 方向性踢动
    const n1 = Math.sin(t * 91.7) * 0.6 + Math.sin(t * 47.3) * 0.4;
    const n2 = Math.cos(t * 83.1) * 0.6 + Math.cos(t * 39.7) * 0.4;
    return {
      x: n1 * amp + this.shakeDirX * amp * 0.8,
      y: n2 * amp * 0.7 + this.shakeDirY * amp * 0.8,
    };
  }

  /* ---------- 生成器 ---------- */
  spark(x, y, dirX, n, speed, color, spread = 0.9, life = 0.35, size = 3) {
    for (let i = 0; i < n; i++) {
      const a = Math.atan2(0, dirX) + rand(-spread, spread) + (dirX > 0 ? 0 : Math.PI);
      const sp = speed * rand(0.4, 1.15);
      this.particles.push({
        type: 'spark', x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(40, 160),
        life: life * rand(0.6, 1.2), maxLife: life,
        size: size * rand(0.7, 1.4), color,
        grav: 1500, drag: 2.2,
      });
    }
  }

  dust(x, y, n, spreadX = 60, col = '150,140,125') {
    for (let i = 0; i < n; i++) {
      this.particles.push({
        type: 'dust', x: x + rand(-10, 10), y: y + rand(-4, 4),
        vx: rand(-spreadX, spreadX), vy: rand(-90, -18),
        life: rand(0.35, 0.7), maxLife: 0.7,
        size: rand(4, 11), color: col,
        grav: -60, drag: 2.8,
      });
    }
  }

  embers(x, y, n, color = '255,170,60') {
    for (let i = 0; i < n; i++) {
      this.particles.push({
        type: 'ember', x: x + rand(-8, 8), y: y + rand(-8, 8),
        vx: rand(-50, 50), vy: rand(-140, -30),
        life: rand(0.5, 1.1), maxLife: 1.1,
        size: rand(1.5, 3.5), color,
        grav: -40, drag: 1.2,
      });
    }
  }

  splinters(x, y, n, dirX) { // 木屑
    for (let i = 0; i < n; i++) {
      this.particles.push({
        type: 'shard', x, y,
        vx: dirX * rand(60, 320) + rand(-80, 80), vy: rand(-360, -60),
        life: rand(0.4, 0.9), maxLife: 0.9,
        size: rand(2, 6), rot: rand(0, TAU), vr: rand(-14, 14),
        color: pick(['158,111,62', '122,84,46', '190,146,92']),
        grav: 1900, drag: 0.6,
      });
    }
  }

  oilSplash(x, y, n, dirX) { // 傀儡黑油
    for (let i = 0; i < n; i++) {
      this.particles.push({
        type: 'oil', x: x + rand(-6, 6), y: y + rand(-6, 6),
        vx: dirX * rand(40, 260) + rand(-60, 60), vy: rand(-300, -40),
        life: rand(0.35, 0.75), maxLife: 0.75,
        size: rand(2.5, 6), color: '20,16,24',
        grav: 2000, drag: 0.5,
      });
    }
  }

  ring(x, y, r0, r1, life, color, width = 4) {
    this.rings.push({ x, y, r0, r1, life, maxLife: life, color, width });
  }

  slashArc(x, y, dir, reach, color = '160,230,255', flip = false) {
    // 一次性刀光弧（大闪现），存在极短
    this.particles.push({
      type: 'arc', x, y, dir, reach, flip,
      life: 0.12, maxLife: 0.12, color, rot: rand(-0.15, 0.15),
    });
  }

  text(x, y, str, color, size = 18, crit = false) {
    this.texts.push({
      x: x + rand(-8, 8), y, str, color, size, crit,
      vy: crit ? -190 : -140, life: crit ? 0.8 : 0.6, maxLife: crit ? 0.8 : 0.6,
    });
    if (this.texts.length > 40) this.texts.shift();
  }

  addDebris(part) {
    this.debris.push(part);
    if (this.debris.length > 46) this.debris.splice(0, this.debris.length - 46);
  }

  addAfterimage(img) {
    this.afterimages.push(img);
    if (this.afterimages.length > 12) this.afterimages.shift();
  }

  /* ---------- 更新 ---------- */
  // 顿帧期间世界冻结；震屏与闪白照常衰减
  update(realDt) {
    if (this.hitstop > 0) this.hitstop -= realDt;
    if (this.slowmo > 0) this.slowmo -= realDt;
    if (this.flashA > 0) this.flashA = Math.max(0, this.flashA - realDt * 2.6);
    if (this.shakeT < this.shakeDur) this.shakeT += realDt;
  }

  get frozen() { return this.hitstop > 0; }
  get timeScale() { return this.slowmo > 0 ? this.slowmoScale : 1; }

  // 世界时间步（被顿帧跳过，慢动作缩放）
  updateWorld(dt) {
    // 粒子
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      if (p.life <= 0) { this.particles.splice(i, 1); continue; }
      if (p.type !== 'arc') {
        p.vy += (p.grav || 0) * dt;
        const dr = Math.exp(-(p.drag || 0) * dt);
        p.vx *= dr; p.vy *= dr;
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.rot !== undefined) p.rot += p.vr * dt;
        if (p.type === 'shard' || p.type === 'oil') {
          if (p.y > GROUND_Y + 2) { p.y = GROUND_Y + 2; p.vy *= -0.3; p.vx *= 0.6; if (p.vr) p.vr *= 0.6; }
        }
      }
    }
    if (this.particles.length > 420) this.particles.splice(0, this.particles.length - 420);

    // 残骸（肢体）
    for (let i = this.debris.length - 1; i >= 0; i--) {
      const d = this.debris[i];
      d.life -= dt;
      if (d.life <= 0) { this.debris.splice(i, 1); continue; }
      d.vy += 2300 * dt;
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.rot += d.vr * dt;
      const floor = GROUND_Y + d.radius * 0.4;
      if (d.y > floor) {
        d.y = floor;
        if (Math.abs(d.vy) > 140) {
          d.vy *= -0.42; d.vx *= 0.62; d.vr *= 0.55;
          this.dust(d.x, GROUND_Y, 2, 40);
        } else {
          d.vy = 0; d.vx *= Math.exp(-8 * dt); d.vr *= Math.exp(-6 * dt);
        }
      }
      if (d.x < 20) { d.x = 20; d.vx = Math.abs(d.vx) * 0.5; }
      if (d.x > ARENA_W - 20) { d.x = ARENA_W - 20; d.vx = -Math.abs(d.vx) * 0.5; }
    }

    // 冲击环
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.life -= dt;
      if (r.life <= 0) this.rings.splice(i, 1);
    }

    // 飘字
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.life -= dt;
      if (t.life <= 0) { this.texts.splice(i, 1); continue; }
      t.vy += 300 * dt;
      t.y += t.vy * dt;
    }

    // 残影
    for (let i = this.afterimages.length - 1; i >= 0; i--) {
      const a = this.afterimages[i];
      a.life -= dt;
      if (a.life <= 0) this.afterimages.splice(i, 1);
    }
  }

  /* ---------- 绘制 ---------- */
  drawDebris(ctx) {
    for (const d of this.debris) {
      const a = clamp(d.life / 0.5, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot);
      d.draw(ctx);
      ctx.restore();
    }
  }

  drawAfterimages(ctx) {
    for (const a of this.afterimages) {
      const k = clamp(a.life / a.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = k * 0.35;
      a.draw(ctx, k);
      ctx.restore();
    }
  }

  draw(ctx) {
    // 粒子
    for (const p of this.particles) {
      const k = clamp(p.life / p.maxLife, 0, 1);
      if (p.type === 'spark') {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = k;
        ctx.strokeStyle = `rgba(${p.color},1)`;
        ctx.lineWidth = p.size * 0.4;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02);
        ctx.stroke();
        ctx.restore();
      } else if (p.type === 'dust') {
        ctx.save();
        ctx.globalAlpha = k * 0.4;
        ctx.fillStyle = `rgba(${p.color},1)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1.6 - k * 0.6), 0, TAU);
        ctx.fill();
        ctx.restore();
      } else if (p.type === 'ember') {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = k;
        ctx.fillStyle = `rgba(${p.color},1)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * k, 0, TAU);
        ctx.fill();
        ctx.restore();
      } else if (p.type === 'shard') {
        ctx.save();
        ctx.globalAlpha = Math.min(1, k * 1.6);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = `rgb(${p.color})`;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      } else if (p.type === 'oil') {
        ctx.save();
        ctx.globalAlpha = k * 0.85;
        ctx.fillStyle = `rgb(${p.color})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.5 + k * 0.5), 0, TAU);
        ctx.fill();
        ctx.restore();
      } else if (p.type === 'arc') {
        // 大刀光闪
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = k * 0.9;
        ctx.translate(p.x, p.y);
        ctx.scale(p.dir, 1);
        ctx.rotate(p.rot + (p.flip ? 0.5 : -0.1));
        ctx.strokeStyle = `rgba(${p.color},1)`;
        ctx.lineWidth = 7 * k + 2;
        ctx.beginPath();
        ctx.arc(0, 0, p.reach, p.flip ? -1.9 : -0.7, p.flip ? 0.4 : 1.15);
        ctx.stroke();
        ctx.lineWidth = 3 * k;
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.stroke();
        ctx.restore();
      }
    }

    // 冲击环
    for (const r of this.rings) {
      const k = 1 - r.life / r.maxLife;
      const rad = lerp(r.r0, r.r1, easeOutCubic(k));
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - k) * 0.8;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.width * (1 - k) + 1;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, rad, rad * 0.36, 0, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    // 飘字
    for (const t of this.texts) {
      const k = clamp(t.life / t.maxLife, 0, 1);
      const pop = t.crit ? easeOutBack(clamp(1 - k + 0.15, 0, 1) * 3) : 1;
      ctx.save();
      ctx.globalAlpha = Math.min(1, k * 2);
      ctx.font = `bold ${Math.round(t.size * (t.crit ? Math.min(pop, 1.4) : 1))}px "Trebuchet MS", sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(10,8,16,0.85)';
      ctx.strokeText(t.str, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.str, t.x, t.y);
      ctx.restore();
    }
  }
}

/* ===== 04-rig.js ===== */
/* ============================================================
 * 04-rig.js — 程序化人形骨架：姿态求值 + 绘制 + 刀光拖尾
 * 侧视骨架：髋部为原点；角度 0 = 垂直向下，正 = 朝面向方向摆。
 * ============================================================ */
'use strict';

function basePose() {
  return {
    hipY: 0, lean: 0, headTilt: 0, twist: 0,
    armFA1: -0.12, armFA2: -0.35,
    armBA1: 0.14, armBA2: -0.55,
    legFA1: 0.08, legFA2: 0.18,
    legBA1: -0.12, legBA2: 0.3,
    weaponA: 0.9,
  };
}

function lerpPoseInto(out, a, b, t) {
  for (const k in a) out[k] = lerp(a[k], b[k] !== undefined ? b[k] : a[k], t);
  return out;
}

// keys: [{t, p:{...partial pose}}]，要求 t 递增且 keys[0].t = 0
function evalKeyframes(keys, time, out) {
  out = out || basePose();
  let i = 0;
  while (i < keys.length - 1 && keys[i + 1].t <= time) i++;
  const k0 = keys[i];
  const k1 = keys[Math.min(i + 1, keys.length - 1)];
  const span = Math.max(0.0001, k1.t - k0.t);
  const raw = clamp((time - k0.t) / span, 0, 1);
  const e = k0.ease ? k0.ease(raw) : raw;
  // 从默认值出发，先叠 k0 再叠 k1
  const p0 = Object.assign(basePose(), k0.p);
  const p1 = Object.assign(basePose(), k1.p);
  return lerpPoseInto(out, p0, p1, e);
}

/* ---------- 刀光拖尾 ---------- */
class BladeTrail {
  constructor() { this.pts = []; } // {bx,by,tx,ty,life}
  push(bx, by, tx, ty) {
    this.pts.push({ bx, by, tx, ty, life: 1 });
    if (this.pts.length > 14) this.pts.shift();
  }
  clear() { this.pts.length = 0; }
  update(dt) {
    for (let i = this.pts.length - 1; i >= 0; i--) {
      this.pts[i].life -= dt * 7.5;
      if (this.pts[i].life <= 0) this.pts.splice(i, 1);
    }
  }
  draw(ctx, color = '130,225,255', widthMul = 1) {
    const n = this.pts.length;
    if (n < 2) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i < n; i++) {
      const a = this.pts[i - 1], b = this.pts[i];
      const k = b.life;
      if (k <= 0) continue;
      // 刃尖到刃尖、刃根到刃根的四边形
      ctx.beginPath();
      ctx.moveTo(a.tx, a.ty);
      ctx.lineTo(b.tx, b.ty);
      ctx.lineTo(b.bx, b.by);
      ctx.lineTo(a.bx, a.by);
      ctx.closePath();
      const grad = ctx.createLinearGradient(b.bx, b.by, b.tx, b.ty);
      grad.addColorStop(0, `rgba(${color},0)`);
      grad.addColorStop(0.55, `rgba(${color},${0.34 * k})`);
      grad.addColorStop(1, `rgba(255,255,255,${0.5 * k})`);
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------- 人形绘制（玩家浪人） ---------- */
// style: {skin, cloth, clothDark, pants, strap, hair, bladeLen, scale}
function drawRonin(ctx, x, y, facing, pose, style, opts = {}) {
  const s = (style.scale || 1);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing * s * (opts.sx || 1), s * (opts.sy || 1));

  const hip = { x: 0, y: -34 + pose.hipY };
  const chest = {
    x: hip.x + Math.sin(pose.lean) * 26,
    y: hip.y - Math.cos(pose.lean) * 26,
  };

  // 各关节位置（facing 已并入 scale，直接用角度）
  const seg = (ox, oy, ang, len) => ({ x: ox + Math.sin(ang) * len, y: oy + Math.cos(ang) * len });

  const shoulderF = { x: chest.x + 2, y: chest.y + 2 };
  const shoulderB = { x: chest.x - 3, y: chest.y + 3 };
  const elbowF = seg(shoulderF.x, shoulderF.y, pose.armFA1, 15);
  const handF = seg(elbowF.x, elbowF.y, pose.armFA2, 13);
  const elbowB = seg(shoulderB.x, shoulderB.y, pose.armBA1, 15);
  const handB = seg(elbowB.x, elbowB.y, pose.armBA2, 13);

  const kneeF = seg(hip.x, hip.y, pose.legFA1, 16);
  const footF = seg(kneeF.x, kneeF.y, pose.legFA2, 15);
  const kneeB = seg(hip.x, hip.y, pose.legBA1, 16);
  const footB = seg(kneeB.x, kneeB.y, pose.legBA2, 15);

  const headC = {
    x: chest.x + Math.sin(pose.lean + pose.headTilt) * 14,
    y: chest.y - Math.cos(pose.lean + pose.headTilt) * 14,
  };

  const limb = (a, b, w, col) => {
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  };

  // --- 后侧腿臂（暗色） ---
  limb(hip, kneeB, 7, style.pantsDark);
  limb(kneeB, footB, 6, style.pantsDark);
  limb(shoulderB, elbowB, 6, style.clothDark);
  limb(elbowB, handB, 5, style.clothDark);

  // --- 躯干 ---
  ctx.strokeStyle = style.cloth;
  ctx.lineWidth = 13;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(chest.x, chest.y); ctx.stroke();
  // 腰带
  ctx.strokeStyle = style.strap;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(hip.x - 6, hip.y + 2); ctx.lineTo(hip.x + 7, hip.y - 2); ctx.stroke();

  // --- 头 ---
  ctx.fillStyle = style.skin;
  ctx.beginPath(); ctx.arc(headC.x, headC.y, 8, 0, TAU); ctx.fill();
  // 斗笠/发髻
  ctx.fillStyle = style.hair;
  ctx.beginPath(); ctx.arc(headC.x - 1, headC.y - 3, 8.2, Math.PI * 1.02, Math.PI * 2.05); ctx.fill();
  ctx.fillRect(headC.x - 3, headC.y - 13, 6, 5);

  // --- 前侧腿 ---
  limb(hip, kneeF, 7.5, style.pants);
  limb(kneeF, footF, 6, style.pants);

  // --- 前侧臂 + 刀 ---
  limb(shoulderF, elbowF, 6.5, style.cloth);
  limb(elbowF, handF, 5.5, style.cloth);

  // 刀：从手掌沿 weaponA 伸出
  const wa = pose.weaponA;
  const gripEnd = seg(handF.x, handF.y, wa, -9);   // 柄尾
  const bladeBase = seg(handF.x, handF.y, wa, 7);
  const bladeTip = seg(handF.x, handF.y, wa, 7 + style.bladeLen);
  if (!opts.noWeapon) {
    ctx.strokeStyle = '#3a2c20';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(gripEnd.x, gripEnd.y); ctx.lineTo(bladeBase.x, bladeBase.y); ctx.stroke();
    // 刀刃
    const perp = { x: Math.cos(wa), y: -Math.sin(wa) };
    const grad = ctx.createLinearGradient(bladeBase.x, bladeBase.y, bladeTip.x, bladeTip.y);
    grad.addColorStop(0, '#8fa8bd');
    grad.addColorStop(0.6, '#dfeefc');
    grad.addColorStop(1, '#ffffff');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(bladeBase.x + perp.x * 2.4, bladeBase.y + perp.y * 2.4);
    ctx.lineTo(bladeTip.x + perp.x * 0.8, bladeTip.y + perp.y * 0.8);
    ctx.lineTo(bladeTip.x - perp.x * 0.8, bladeTip.y - perp.y * 0.8);
    ctx.lineTo(bladeBase.x - perp.x * 2.4, bladeBase.y - perp.y * 2.4);
    ctx.closePath();
    ctx.fill();
    // 护手
    ctx.fillStyle = '#c9a54a';
    ctx.beginPath(); ctx.arc(bladeBase.x, bladeBase.y, 3, 0, TAU); ctx.fill();
    // 蓄力辉光
    if (opts.glow) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = opts.glow;
      ctx.strokeStyle = 'rgba(140,235,255,0.9)';
      ctx.lineWidth = 3 + opts.glow * 4;
      ctx.beginPath(); ctx.moveTo(bladeBase.x, bladeBase.y); ctx.lineTo(bladeTip.x, bladeTip.y); ctx.stroke();
      ctx.restore();
    }
  }

  // 手
  ctx.fillStyle = style.skin;
  ctx.beginPath(); ctx.arc(handF.x, handF.y, 3.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(handB.x, handB.y, 3, 0, TAU); ctx.fill();

  ctx.restore();

  // 返回刀身世界坐标（供拖尾记录）
  const cs = Math.cos(facing > 0 ? 0 : Math.PI);
  const world = (lx, ly) => ({ x: x + lx * facing * s, y: y + ly * s });
  const bb = world(bladeBase.x, bladeBase.y);
  const bt = world(bladeTip.x, bladeTip.y);
  return { base: bb, tip: bt, hand: world(handF.x, handF.y), chest: world(chest.x, chest.y), head: world(headC.x, headC.y) };
}

/* ---------- 跑步/待机姿态生成 ---------- */
function runPose(phase, out) {
  out = out || basePose();
  const A = 0.75, B = 0.6;
  const s = Math.sin(phase), c = Math.cos(phase);
  out.legFA1 = s * A;
  out.legBA1 = -s * A;
  // 膝盖在摆动后相弯曲
  out.legFA2 = s * A + Math.max(0, -c) * B + 0.12;
  out.legBA2 = -s * A + Math.max(0, c) * B + 0.12;
  out.armFA1 = -s * 0.55 - 0.15;
  out.armBA1 = s * 0.55 + 0.1;
  out.armFA2 = out.armFA1 - 0.35;
  out.armBA2 = out.armBA1 - 0.5;
  out.hipY = Math.abs(Math.cos(phase)) * 2.5;
  out.lean = 0.22;
  out.headTilt = -0.1;
  out.weaponA = 0.75 + Math.sin(phase) * 0.06;
  return out;
}

function idlePose(t, out) {
  out = out || basePose();
  const b = Math.sin(t * 2.1) * 0.5 + 0.5;
  out.hipY = b * 1.4;
  out.lean = 0.03 + b * 0.015;
  out.armFA1 = -0.14 - b * 0.03;
  out.armFA2 = -0.42;
  out.armBA1 = 0.16 + b * 0.03;
  out.armBA2 = -0.6;
  out.legFA1 = 0.09; out.legFA2 = 0.16;
  out.legBA1 = -0.13; out.legBA2 = 0.24;
  out.weaponA = 1.15; // 刀尖下垂向后
  out.headTilt = 0.02;
  return out;
}

function airPose(vy, out) {
  out = out || basePose();
  const up = vy < 0;
  out.legFA1 = up ? -0.5 : 0.25;
  out.legFA2 = up ? -1.1 : 0.9;
  out.legBA1 = up ? 0.35 : -0.3;
  out.legBA2 = up ? 0.7 : 0.5;
  out.armFA1 = up ? -0.5 : -0.3;
  out.armFA2 = up ? -0.9 : -0.6;
  out.armBA1 = up ? 0.55 : 0.4;
  out.armBA2 = up ? 0.1 : -0.2;
  out.lean = up ? -0.06 : 0.14;
  out.weaponA = 1.0;
  return out;
}

    dur: 0.34, startup: 0.05, activeEnd: 0.14, cancel: 0.18,

  },
};
