<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月下傀儡庭 — 横版动作试玩</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #07060d;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #wrap { position: relative; }
  canvas {
    display: block;
    image-rendering: auto;
    box-shadow: 0 0 80px rgba(80, 60, 160, 0.25);
    cursor: crosshair;
  }
  #muteBtn {
    position: absolute;
    top: 10px; right: 10px;
    width: 40px; height: 40px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(10, 8, 18, 0.6);
    color: #fff;
    font-size: 19px;
    cursor: pointer;
    z-index: 10;
    line-height: 1;
  }
  #muteBtn:hover { background: rgba(40, 32, 70, 0.8); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <button id="muteBtn" title="静音开关">🔊</button>
</div>

</body>
