<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>断界：霓虹处刑场</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050811;color:#e9fbff;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;user-select:none}
  body{display:grid;place-items:center}
  #shell{position:relative;width:100vw;height:100vh;min-width:320px;min-height:300px;overflow:hidden;background:#050811}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;cursor:default}
  #mute{position:absolute;z-index:5;right:20px;top:18px;width:42px;height:42px;border:1px solid rgba(130,235,255,.35);border-radius:8px;background:rgba(6,14,28,.72);color:#aeeeff;font-size:19px;cursor:pointer;backdrop-filter:blur(7px);transition:.15s}
  #mute:hover{border-color:#f2fbff;background:rgba(12,30,48,.9);transform:translateY(-1px)}
  #mute:focus-visible{outline:2px solid #75edff;outline-offset:2px}
  #start{position:absolute;z-index:4;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 44%,rgba(18,40,60,.45),rgba(3,5,13,.92) 74%);transition:opacity .35s}
  #start.hidden{opacity:0;pointer-events:none}
  .panel{position:relative;text-align:center;width:min(980px,94vw);padding:30px 26px 25px;border-top:1px solid rgba(125,239,255,.28);border-bottom:1px solid rgba(255,70,126,.25);background:linear-gradient(90deg,transparent,rgba(4,13,26,.78) 14%,rgba(4,13,26,.83) 86%,transparent)}
  .eyebrow{font-size:12px;letter-spacing:.48em;color:#6ceeff;margin-bottom:8px;text-transform:uppercase}
  h1{margin:0;font-size:clamp(52px,8vw,96px);line-height:.94;font-weight:900;letter-spacing:.08em;font-style:italic;text-shadow:4px 0 #ff315f,-4px 0 #32dfff,0 0 28px rgba(90,225,255,.3)}
  .subtitle{margin:15px 0 23px;color:#9eb6c6;letter-spacing:.24em;font-size:13px}
  .startbtn{display:inline-block;padding:12px 35px;border:1px solid #80efff;background:rgba(45,210,239,.1);color:#eaffff;font-size:16px;font-weight:700;letter-spacing:.2em;cursor:pointer;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:.15s}
  .startbtn:hover{background:rgba(64,225,250,.23);filter:drop-shadow(0 0 9px rgba(70,225,255,.42))}
  .keys{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 18px;margin-top:27px;color:#9eb3c0;font-size:12px}
  .keys span{white-space:nowrap}.keys b{color:#e9fbff;border:1px solid rgba(150,223,238,.42);background:#0b1724;border-radius:4px;padding:3px 7px;margin-right:5px;box-shadow:inset 0 -2px rgba(0,0,0,.35)}
  .tip{margin-top:20px;color:#607988;font-size:11px;letter-spacing:.08em}
  #fatal{display:none;position:absolute;z-index:10;inset:0;padding:30px;background:#080a11;color:#ff7897;white-space:pre-wrap;font:14px monospace}
  @media(max-height:560px){.panel{padding:20px}.keys{margin-top:16px}.tip{margin-top:12px}h1{font-size:50px}.subtitle{margin:10px 0 14px}}
</style>
</head>
<body>
<div id="shell">
  <canvas id="game" tabindex="0" aria-label="断界横版动作战斗游戏"></canvas>
  <button id="mute" aria-label="切换静音" title="切换静音">♪</button>
  <div id="start">
    <div class="panel">
      <div class="eyebrow">NEON SEVERANCE // COMBAT TRIAL</div>
      <h1>断 界</h1>
      <div class="subtitle">霓虹处刑场 · 斩断它们的武装</div>
      <button class="startbtn" id="startButton">ENTER&nbsp;&nbsp;投入战斗</button>
      <div class="keys">
        <span><b>A D / ← →</b>移动</span><span><b>SPACE</b>跳跃</span><span><b>J</b>三段斩</span>
        <span><b>K</b>蓄力断肢</span><span><b>L</b>影冲</span><span><b>I</b>瞬反</span><span><b>R</b>重启</span>
      </div>
      <div class="keys">
        <span><b>1</b>裂帛·瞬光</span><span><b>2</b>星坠·断层</span><span><b>3</b>磁狱·缚轮</span><span><b>4</b>终式·千隙葬</span>
      </div>
      <div class="tip">数字键独立释放四项战技 · 消耗 FLUX 且各自冷却 · 终结技与重斩可切断敌人武装</div>
    </div>
  </div>
  <div id="fatal"></div>
</div>
<script>
'use strict';
(() => {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha:false });
const shell = document.getElementById('shell');
const startLayer = document.getElementById('start');
const startButton = document.getElementById('startButton');
const muteButton = document.getElementById('mute');
const fatal = document.getElementById('fatal');
const W=1280,H=720,FLOOR=592, TAU=Math.PI*2;
let cw=1280,ch=720,dpr=1,scale=1,offX=0,offY=0;
let last=performance.now(), accumulator=0, frame=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const approach=(v,t,n)=>v<t?Math.min(t,v+n):Math.max(t,v-n);
const rand=(a,b)=>a+Math.random()*(b-a);
const chance=p=>Math.random()<p;
const easeOut=t=>1-(1-t)*(1-t);
const dist2=(a,b)=>{let x=a.x-b.x,y=a.y-b.y;return x*x+y*y};
const keys=Object.create(null), pressed=Object.create(null), released=Object.create(null);
const gameKeys=new Set(['KeyA','KeyD','ArrowLeft','ArrowRight','Space','KeyJ','KeyK','KeyL','KeyI','Digit1','Digit2','Digit3','Digit4','Numpad1','Numpad2','Numpad3','Numpad4','KeyR','Enter']);
const SKILLS=[
 {name:'裂帛·瞬光',short:'瞬光',cost:14,cd:2.4,color:'#59f4ff'},
 {name:'星坠·断层',short:'断层',cost:18,cd:3.2,color:'#ffc36a'},
 {name:'磁狱·缚轮',short:'缚轮',cost:22,cd:5.2,color:'#b982ff'},
 {name:'终式·千隙葬',short:'千隙葬',cost:38,cd:8.5,color:'#ff4e85'}
];
let started=false, playing=false, gameOver=false, ready=true, muted=false;
let globalTime=0, hitStop=0, hitCount=0, limbBreakCount=0, score=0, wave=0, waveDelay=0, nextEnemyId=1;
let shake=0, shakeX=0, shakeY=0, flash=0, dangerFlash=0, chroma=0, slowMo=0;
let comboCount=0, comboTimer=0, bestCombo=0, style=0, styleLabel='';
let enemies=[], particles=[], trails=[], detached=[], texts=[], shockwaves=[], skillFx=[], fields=[], rain=[], skyline=[];
let player;

function resize(){
  cw=shell.clientWidth; ch=shell.clientHeight; dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(cw*dpr); canvas.height=Math.round(ch*dpr);
  scale=Math.min(cw/W,ch/H); offX=(cw-W*scale)/2; offY=(ch-H*scale)/2;
}
window.addEventListener('resize',resize); resize();

// -------- synthesized audio --------
let ac=null, master=null, noiseBuffer=null;
function initAudio(){
  if(ac) { if(ac.state==='suspended') ac.resume(); return; }
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain(); master.gain.value=muted?0:.26; master.connect(ac.destination);
    noiseBuffer=ac.createBuffer(1,ac.sampleRate*.35,ac.sampleRate);
    const d=noiseBuffer.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  }catch(e){ ac=null; }
}
function tone(freq,dur,type='sine',vol=.12,slide=1,delay=0){
  if(!ac||muted)return; const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+dur);
  g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur=.12,vol=.1,cut=1200,delay=0){
  if(!ac||muted||!noiseBuffer)return;const t=ac.currentTime+delay,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuffer;f.type='bandpass';f.frequency.value=cut;f.Q.value=.7;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);
}
const sfx={
  swing(n=0){noise(.1,.05,1600+n*350);tone(230+n*40,.09,'sawtooth',.035,2.4)},
  hit(power=1){noise(.09+.04*power,.12*power,420);tone(92,.1,'square',.09*power,.45);tone(570,.055,'triangle',.04,1.8)},
  heavy(){noise(.2,.18,300);tone(62,.23,'sawtooth',.15,.35);tone(190,.12,'square',.06,.4,.025)},
  dash(){noise(.16,.075,2100);tone(180,.14,'sawtooth',.06,3)},
  jump(){tone(170,.11,'triangle',.06,1.7)},
  parry(){tone(890,.08,'sine',.14,1.8);tone(1330,.16,'triangle',.1,.7,.035);noise(.08,.08,3200)},
  hurt(){noise(.13,.13,260);tone(115,.18,'sawtooth',.08,.45)},
  break(){noise(.3,.19,520);tone(75,.28,'square',.16,.3);tone(930,.09,'sawtooth',.08,.35)},
  shoot(){tone(660,.12,'sawtooth',.08,.22);noise(.08,.07,2600)},
  charge(p=.5){tone(210+p*180,.055,'sine',.025+p*.02,1.15)},
  death(){tone(150,.45,'sawtooth',.12,.2);noise(.35,.16,240)},
  ability(n){const f=[410,175,285,520][n]||300;tone(f,.18,'sawtooth',.09,n===3?.35:2);tone(f*1.5,.25,'triangle',.07,n===1?.45:1.5,.035);noise(.18,.1,n===1?280:1900);},
  ultimate(){tone(760,.42,'sine',.12,.22);tone(190,.55,'sawtooth',.1,2.8,.05);noise(.35,.14,900,.12)},
  wave(){tone(330,.16,'triangle',.08,1.5);tone(495,.22,'triangle',.07,1.5,.08)}
};
function toggleMute(){muted=!muted;if(master)master.gain.setTargetAtTime(muted?0:.26,ac.currentTime,.02);muteButton.textContent=muted?'×':'♪';muteButton.title=muted?'取消静音':'静音';}
muteButton.addEventListener('click',e=>{e.stopPropagation();initAudio();toggleMute();canvas.focus();});

function initScene(){
  rain.length=0; for(let i=0;i<130;i++) rain.push({x:Math.random()*W,y:Math.random()*H,z:rand(.25,1),l:rand(7,25)});
  skyline.length=0; let x=-30; while(x<W+50){let w=rand(42,115),h=rand(80,300); skyline.push({x,w,h,seed:Math.random()});x+=w+rand(7,24)}
}

function resetGame(){
  player=new Player(); enemies=[];projectiles=[];particles=[];trails=[];detached=[];texts=[];shockwaves=[];skillFx=[];fields=[];
  hitStop=0;hitCount=0;limbBreakCount=0;score=0;wave=0;waveDelay=.15;shake=0;flash=0;dangerFlash=0;comboCount=0;comboTimer=0;bestCombo=0;style=0;styleLabel='';
  gameOver=false;playing=true;globalTime=0;nextEnemyId=1;
  spawnWave();
}
function begin(){initAudio();started=true;startLayer.classList.add('hidden');resetGame();canvas.focus();}
startButton.addEventListener('click',begin);

window.addEventListener('keydown',e=>{
  if(gameKeys.has(e.code))e.preventDefault(); initAudio();
  if(!keys[e.code])pressed[e.code]=true; keys[e.code]=true;
  if(!started&&e.code==='Enter')begin();
  else if(started&&e.code==='KeyR')resetGame();
  else if(gameOver&&e.code==='Enter')resetGame();
});
window.addEventListener('keyup',e=>{if(gameKeys.has(e.code))e.preventDefault();keys[e.code]=false;released[e.code]=true;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in pressed)delete pressed[k];for(const k in released)delete released[k];if(player)player.charging=false;});

function addText(x,y,text,color='#fff',size=20,life=.7,important=false){texts.push({x,y,text,color,size,life,max:life,vy:-35,important});}
function sparks(x,y,color,count=12,power=1){
 for(let i=0;i<count;i++){let a=rand(-Math.PI,Math.PI),s=rand(90,390)*power;particles.push({type:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rand(20,130),life:rand(.12,.42),max:1,color,size:rand(1,3.8),grav:620,drag:.95});}
}
function smoke(x,y,count=5,color='#50677c'){
 for(let i=0;i<count;i++)particles.push({type:'smoke',x:x+rand(-12,12),y:y+rand(-8,8),vx:rand(-35,35),vy:rand(-100,-35),life:rand(.35,.8),max:1,color,size:rand(8,19),grav:-10,drag:.97});
}
function dust(x,y,count=8){
 for(let i=0;i<count;i++)particles.push({type:'dust',x:x+rand(-18,18),y:y-rand(0,4),vx:rand(-130,130),vy:rand(-110,-25),life:rand(.25,.55),max:1,color:chance(.5)?'#526372':'#8aa1aa',size:rand(3,11),grav:340,drag:.93});
}
function bloodOil(x,y,dir,count=8){
 for(let i=0;i<count;i++)particles.push({type:'oil',x,y,vx:dir*rand(50,250)+rand(-70,70),vy:rand(-230,70),life:rand(.35,.8),max:1,color:chance(.4)?'#ff315f':'#17d9e8',size:rand(2,5),grav:600,drag:.98});
}
function ring(x,y,color='#8df6ff',r=12,maxR=100,life=.3,width=4){shockwaves.push({x,y,color,r,maxR,life,max:life,width});}
function slashTrail(x,y,dir,kind,charge=0){trails.push({x,y,dir,kind,charge,life:kind==='heavy'?.3:.17,max:kind==='heavy'?.3:.17});}
function cameraKick(amount,dir=1){shake=Math.max(shake,amount);shakeX+=dir*amount*.9;chroma=Math.max(chroma,amount*.12);}
function freeze(frames){hitStop=Math.max(hitStop,frames/60);}

class Player{
 constructor(){
  this.x=370;this.y=FLOOR;this.vx=0;this.vy=0;this.face=1;this.grounded=true;this.hp=100;this.maxHp=100;
  this.state='idle';this.timer=0;this.actionTime=0;this.comboStep=0;this.comboQueue=false;this.attackHit=new Set();this.attackTrail=false;
  this.coyote=.1;this.jumpBuffer=0;this.dashCd=0;this.dashTimer=0;this.invuln=0;this.hurtTimer=0;this.parryTimer=0;this.parryFlash=0;
  this.charging=false;this.charge=0;this.chargePulse=0;this.energy=100;this.airDash=true;this.afterimages=[];this.landSquash=0;this.hitLean=0;
  this.skillCds=[0,0,0,0];this.skillId=-1;this.skillPhase=0;this.skillStep=0;this.skillLandTime=0;this.skillTargets=[];
 }
 get alive(){return this.hp>0}
 update(dt){
  this.timer+=dt;this.actionTime+=dt;this.invuln=Math.max(0,this.invuln-dt);this.dashCd=Math.max(0,this.dashCd-dt);this.parryFlash=Math.max(0,this.parryFlash-dt);this.landSquash=Math.max(0,this.landSquash-dt*4);this.hitLean=approach(this.hitLean,0,dt*6);
  for(let i=0;i<4;i++)this.skillCds[i]=Math.max(0,this.skillCds[i]-dt);
  this.energy=Math.min(100,this.energy+dt*12);
  if(this.grounded)this.coyote=.1;else this.coyote=Math.max(0,this.coyote-dt);
  if(pressed.Space)this.jumpBuffer=.13;else this.jumpBuffer=Math.max(0,this.jumpBuffer-dt);
  if(this.state==='dead'){this.vy+=1300*dt;this.movePhysics(dt,.94);return;}
  if(this.hurtTimer>0){
   this.hurtTimer-=dt;this.vy+=1350*dt;this.movePhysics(dt,.9);if(this.hurtTimer<=0)this.setState(this.grounded?'idle':'air');return;
  }
  const axis=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  if(this.state==='skill'){this.updateSkill(dt);return;}
  const skillInput=pressed.Digit1||pressed.Numpad1?0:pressed.Digit2||pressed.Numpad2?1:pressed.Digit3||pressed.Numpad3?2:pressed.Digit4||pressed.Numpad4?3:-1;
  if(skillInput>=0&&this.startSkill(skillInput))return;
  if(axis&&this.state!=='dash'&&this.state!=='attack'&&this.state!=='heavy'&&this.state!=='parry')this.face=axis;
  if(pressed.KeyL&&this.dashCd<=0&&this.energy>=18)this.startDash(axis||this.face);
  if(pressed.KeyI&&this.state!=='dash'&&this.state!=='hurt')this.startParry();
  if(this.state==='dash'){this.updateDash(dt);return;}
  if(this.state==='parry'){this.updateParry(dt);this.movePhysics(dt,.78);return;}
  if(this.state==='attack'){this.updateAttack(dt);this.movePhysics(dt,.86);return;}
  if(this.state==='heavy'){this.updateHeavy(dt);this.movePhysics(dt,.82);return;}
  if(pressed.KeyJ){this.startAttack();return;}
  if(pressed.KeyK){this.startHeavy();return;}
  if(this.jumpBuffer>0&&this.coyote>0){this.vy=-610;this.grounded=false;this.coyote=0;this.jumpBuffer=0;sfx.jump();dust(this.x,this.y,5);this.setState('air');}
  const accel=this.grounded?2200:1180, max=this.grounded?300:270;
  if(axis)this.vx=approach(this.vx,axis*max,accel*dt);else this.vx=approach(this.vx,0,(this.grounded?1900:360)*dt);
  this.vy+=1500*dt;this.movePhysics(dt,.99);
  this.state=this.grounded?(Math.abs(this.vx)>30?'run':'idle'):'air';
 }
 setState(s){this.state=s;this.actionTime=0;this.timer=0;}
 startDash(dir){
  this.setState('dash');this.face=dir>=0?1:-1;this.dashTimer=.18;this.dashCd=.42;this.invuln=.25;this.energy-=18;this.vy=0;this.vx=this.face*820;
  this.afterimages.length=0;sfx.dash();ring(this.x,this.y-42,'#5cecff',8,58,.2,2);dust(this.x,this.y,8);
 }
 updateDash(dt){
  this.dashTimer-=dt;this.vx=this.face*lerp(820,500,1-this.dashTimer/.18);this.y+=this.vy*dt;this.x+=this.vx*dt;this.x=clamp(this.x,40,W-40);
  this.afterimages.push({x:this.x,y:this.y,life:.16,pose:'dash'});if(this.afterimages.length>6)this.afterimages.shift();
  if(this.dashTimer<=0){this.setState(this.grounded?'idle':'air');this.vx=this.face*310;}
 }
 startParry(){
  if(this.energy<8)return;this.energy-=8;this.setState('parry');this.parryTimer=.34;this.vx*=.3;sfx.swing(2);ring(this.x+this.face*25,this.y-47,'#75faff',7,50,.2,2);
 }
 updateParry(dt){
  this.parryTimer-=dt;if(this.parryTimer<=0)this.setState(this.grounded?'idle':'air');
 }
 parryActive(){return this.state==='parry'&&this.actionTime>=.045&&this.actionTime<=.19}
 successfulParry(enemy){
  this.parryFlash=.34;this.invuln=.55;this.energy=Math.min(100,this.energy+28);this.parryTimer=.18;style+=24;
  freeze(9);cameraKick(12,-this.face);flash=.22;sfx.parry();ring(this.x+this.face*30,this.y-47,'#f4ffff',12,145,.36,6);sparks(this.x+this.face*35,this.y-52,'#d9ffff',30,1.3);
  addText(this.x,this.y-125,'瞬 反',' #b9ffff'.trim(),27,.8,true);enemy.stagger(.7,this.face*380);score+=350;
  this.setState('attack');this.comboStep=4;this.actionTime=0;this.attackHit=new Set();this.attackTrail=false;this.vx=-this.face*45;
 }
 canUseSkill(id){
  if(this.skillCds[id]>0||this.energy<SKILLS[id].cost)return false;
  if(this.state==='hurt'||this.state==='dead'||this.state==='skill'||this.state==='parry')return false;
  if(this.state==='attack'&&this.actionTime<=this.attackData().end)return false;
  if(this.state==='heavy'&&(this.charging||this.actionTime<=.22))return false;
  if(this.state==='dash'&&this.actionTime<.07)return false;
  return true;
 }
 startSkill(id){
  if(!this.canUseSkill(id)){
   if(this.skillCds[id]>0)addText(this.x,this.y-126,`冷却 ${this.skillCds[id].toFixed(1)}s`,'#718c9c',12,.35);
   else if(this.energy<SKILLS[id].cost)addText(this.x,this.y-126,'FLUX 不足','#ff6683',13,.42);
   return false;
  }
  const skill=SKILLS[id];this.energy-=skill.cost;this.skillCds[id]=skill.cd;this.skillId=id;this.skillPhase=0;this.skillStep=0;this.skillFinisher=false;this.skillTargets=[];this.attackHit=new Set();this.charging=false;this.jumpBuffer=0;this.setState('skill');this.vx=0;this.invuln=Math.max(this.invuln,id===3?1.8:id===1?.9:id===0?.48:.35);
  addText(this.x,this.y-138,skill.name,skill.color,id===3?25:19,id===3?1:.7,true);sfx.ability(id);
  if(id===0){ring(this.x,this.y-52,skill.color,7,68,.22,3);}
  if(id===1){this.grounded=false;this.vy=-680;dust(this.x,this.y,12);ring(this.x,this.y-3,skill.color,8,70,.24,3);}
  if(id===2){ring(this.x,this.y-55,skill.color,12,95,.34,4);}
  if(id===3){
   this.skillTargets=enemies.filter(e=>e.alive&&e.state!=='dead').sort((a,b)=>Math.abs(a.x-this.x)-Math.abs(b.x-this.x)).map(e=>e.id);
   slowMo=Math.max(slowMo,.12);sfx.ultimate();ring(this.x,this.y-55,skill.color,15,180,.48,5);
  }
  return true;
 }
 updateSkill(dt){

function drawSkillFx(){
 for(const f of fields){
  let p=clamp(f.life/f.max,0,1);ctx.save();ctx.translate(f.x,f.y);ctx.globalCompositeOperation='lighter';ctx.strokeStyle=f.color;ctx.shadowBlur=16;ctx.shadowColor=f.color;
  for(let i=0;i<3;i++){ctx.globalAlpha=(.16+i*.1)*Math.min(1,p*4);ctx.lineWidth=2+i;ctx.setLineDash([12+i*5,8]);ctx.beginPath();ctx.ellipse(0,0,85+i*47,25+i*16,globalTime*(i%2?-.9:1.15)+i,0,TAU);ctx.stroke();}
  ctx.setLineDash([]);ctx.globalAlpha=.4+.2*Math.sin(globalTime*14);ctx.beginPath();ctx.moveTo(0,-96);ctx.lineTo(0,96);ctx.stroke();ctx.restore();
 }
 for(const f of skillFx){
  const p=clamp(f.life/f.max,0,1),q=1-p;ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=f.color;ctx.fillStyle=f.color;ctx.shadowBlur=18;ctx.shadowColor=f.color;
  if(f.type==='flashline'){
   ctx.globalAlpha=p*.9;ctx.lineCap='round';ctx.lineWidth=3+14*p;ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.stroke();
   for(let i=0;i<4;i++){ctx.globalAlpha=p*.28;ctx.beginPath();ctx.moveTo(f.x1,f.y1+rand(-28,28));ctx.lineTo(f.x2,f.y2+rand(-28,28));ctx.stroke();}
  }else if(f.type==='drop'){
   ctx.globalAlpha=p*.75;ctx.lineWidth=3+10*p;ctx.beginPath();ctx.moveTo(f.x,f.y1);ctx.lineTo(f.x,f.y2);ctx.stroke();ctx.lineWidth=1;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(f.x+i*12,f.y1+Math.abs(i)*14);ctx.lineTo(f.x+i*4,f.y2);ctx.stroke();}
  }else if(f.type==='groundburst'){
   ctx.globalAlpha=p*.72;ctx.translate(f.x,f.y);ctx.lineWidth=4*p+1;for(let i=0;i<11;i++){let a=-Math.PI+Math.PI*i/10,len=(80+i%3*35)*easeOut(q)+70;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len*.28);ctx.stroke();}ctx.beginPath();ctx.ellipse(0,0,40+q*230,10+q*52,0,Math.PI,TAU);ctx.stroke();
  }else if(f.type==='glyph'){
   ctx.globalAlpha=p*.8;ctx.translate(f.x,f.y);ctx.rotate(q*2);ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<12;i++){let a=i/12*TAU,r=i%2?82:118;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r*.42);}ctx.closePath();ctx.stroke();
  }else if(f.type==='ultslash'){
   ctx.globalAlpha=p*.9;ctx.lineWidth=2+12*p;ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.quadraticCurveTo((f.x1+f.x2)/2,f.flip?f.y2-110:f.y2+70,f.x2,f.y2);ctx.stroke();ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.stroke();
  }else if(f.type==='ultburst'){
   ctx.globalAlpha=p;ctx.translate(f.x,f.y);ctx.rotate(q*1.8);ctx.lineWidth=3+5*p;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,0,20+q*95,i*2.1+.25,i*2.1+1.35);ctx.stroke();}ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(-72,-72);ctx.lineTo(72,72);ctx.moveTo(70,-55);ctx.lineTo(-70,55);ctx.stroke();
  }
  ctx.restore();
 }
}
function drawEffects(){
 for(const s of shockwaves){let p=1-s.life/s.max,r=lerp(s.r,s.maxR,easeOut(p));ctx.save();ctx.globalAlpha=(s.life/s.max)*.72;ctx.strokeStyle=s.color;ctx.lineWidth=s.width*(1-p)+.5;ctx.beginPath();ctx.arc(s.x,s.y,r,0,TAU);ctx.stroke();ctx.restore();}
 for(const p of particles){let a=clamp(p.life/(p.max||1),0,1);ctx.save();ctx.globalAlpha=Math.min(1,a*2);if(p.type==='spark'){ctx.strokeStyle=p.color;ctx.lineWidth=p.size;ctx.shadowBlur=5;ctx.shadowColor=p.color;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.025,p.y-p.vy*.025);ctx.stroke();}else if(p.type==='smoke'||p.type==='dust'){ctx.fillStyle=p.color;ctx.globalAlpha=a*.18;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1.4-a*.4),0,TAU);ctx.fill();}else{ctx.fillStyle=p.color;ctx.shadowBlur=4;ctx.shadowColor=p.color;ctx.beginPath();ctx.ellipse(p.x,p.y,p.size,p.size*.55,Math.atan2(p.vy,p.vx),0,TAU);ctx.fill();}ctx.restore();}
 for(const t of texts){let p=t.life/t.max;ctx.save();ctx.globalAlpha=Math.min(1,p*2);ctx.textAlign='center';ctx.font=`${t.important?'800':'700'} ${t.size}px sans-serif`;ctx.fillStyle=t.color;ctx.shadowBlur=t.important?12:5;ctx.shadowColor=t.color;ctx.fillText(t.text,t.x,t.y);ctx.restore();}
}
function drawSkillBar(){
 const cardW=142,gap=7,total=cardW*4+gap*3,x0=W-total-26,y=H-91;
 for(let i=0;i<4;i++){
  const s=SKILLS[i],x=x0+i*(cardW+gap),cd=player.skillCds[i],readyNow=cd<=0&&player.energy>=s.cost,active=player.state==='skill'&&player.skillId===i;
  ctx.save();ctx.translate(x,y);ctx.fillStyle=active?'rgba(25,35,50,.94)':'rgba(3,9,17,.78)';ctx.fillRect(0,0,cardW,56);
  ctx.strokeStyle=active?'#ffffff':readyNow?s.color:'rgba(93,116,130,.35)';ctx.lineWidth=active?2:1;ctx.strokeRect(.5,.5,cardW-1,55);
  ctx.fillStyle=readyNow?s.color:'#40515e';ctx.fillRect(0,0,4,56);
  ctx.fillStyle=readyNow?'#eaffff':'#6e818c';ctx.font='900 20px monospace';ctx.fillText(String(i+1),13,25);
  ctx.font='700 12px sans-serif';ctx.fillStyle=readyNow?'#eaffff':'#788993';ctx.fillText(s.name,40,20);
  ctx.font='10px monospace';ctx.fillStyle=player.energy>=s.cost?'#64eaf6':'#ff6683';ctx.fillText(`${s.cost} FLUX`,40,39);
  if(cd>0){
   const r=clamp(cd/s.cd,0,1);ctx.fillStyle='rgba(0,3,9,.68)';ctx.fillRect(4,56*(1-r),cardW-4,56*r);ctx.textAlign='right';ctx.fillStyle='#cad7dc';ctx.font='700 13px monospace';ctx.fillText(cd.toFixed(1),cardW-9,48);
  }else if(!readyNow){ctx.textAlign='right';ctx.fillStyle='#ff6683';ctx.font='700 9px sans-serif';ctx.fillText('能量不足',cardW-8,48);}
  if(active){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.35+.25*Math.sin(globalTime*20);ctx.fillStyle=s.color;ctx.fillRect(1,1,cardW-2,54);}
  ctx.restore();
 }
 ctx.save();ctx.textAlign='right';ctx.fillStyle='rgba(135,166,180,.68)';ctx.font='10px sans-serif';ctx.fillText('数字键战技 · 独立冷却',W-27,y-7);ctx.restore();
}
function drawUI(){
 // top left player plate
 ctx.save();ctx.translate(36,35);ctx.fillStyle='rgba(4,10,19,.76)';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(350,0);ctx.lineTo(330,74);ctx.lineTo(0,74);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(110,233,250,.3)';ctx.lineWidth=1;ctx.stroke();
 ctx.fillStyle='#baf7ff';ctx.font='800 13px sans-serif';ctx.fillText('KIRA // EDGE UNIT',18,21);ctx.fillStyle='#506879';ctx.font='10px monospace';ctx.fillText('LIFE',18,41);
 ctx.fillStyle='#172533';ctx.fillRect(58,32,256,12);let hpw=256*(player.hp/player.maxHp);let hg=ctx.createLinearGradient(58,0,314,0);hg.addColorStop(0,'#ff315f');hg.addColorStop(.65,'#ff6581');hg.addColorStop(1,'#e9fbff');ctx.fillStyle=hg;ctx.fillRect(58,32,hpw,12);ctx.fillStyle='#fff';ctx.globalAlpha=.65;ctx.fillRect(58,32,hpw,2);ctx.globalAlpha=1;
 ctx.fillStyle='#506879';ctx.fillText('FLUX',18,62);ctx.fillStyle='#172533';ctx.fillRect(58,53,216,6);ctx.fillStyle='#55eaff';ctx.fillRect(58,53,216*(player.energy/100),6);ctx.fillStyle='#758d99';ctx.font='10px monospace';ctx.fillText('L DASH',283,60);ctx.restore();
 // score / wave
 ctx.textAlign='right';ctx.fillStyle='rgba(190,238,246,.62)';ctx.font='11px monospace';ctx.fillText(`WAVE ${String(wave).padStart(2,'0')}`,W-92,55);ctx.fillStyle='#eaffff';ctx.font='800 22px monospace';ctx.fillText(String(score).padStart(7,'0'),W-92,79);
 // combo
 if(comboCount>1){ctx.save();ctx.translate(W-55,175);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='italic 900 53px sans-serif';ctx.shadowBlur=10;ctx.shadowColor='#48e9ff';ctx.fillText(comboCount,0,0);ctx.font='800 13px sans-serif';ctx.fillStyle='#75ebff';ctx.fillText('CHAIN',0,18);ctx.fillStyle='rgba(80,230,250,.2)';ctx.fillRect(-160,28,160,3);ctx.fillStyle='#75edff';ctx.fillRect(-160,28,160*(comboTimer/2.1),3);ctx.restore();}
 if(styleLabel){ctx.save();ctx.translate(W-54,244);ctx.textAlign='right';ctx.font='italic 900 25px sans-serif';ctx.fillStyle=style>80?'#ffe9a4':'#ff5b82';ctx.shadowBlur=8;ctx.shadowColor=ctx.fillStyle;ctx.fillText(styleLabel,0,0);ctx.restore();}
 // context action reminders
 ctx.save();ctx.translate(34,H-142);ctx.fillStyle='rgba(3,9,16,.62)';ctx.fillRect(0,0,510,47);ctx.font='11px sans-serif';ctx.fillStyle='#708b99';ctx.fillText('MOVE',12,17);ctx.fillText('CHAIN',92,17);ctx.fillText('SEVER',177,17);ctx.fillText('SHIFT',262,17);ctx.fillText('PARRY',347,17);ctx.fillStyle='#dffbff';ctx.font='700 12px monospace';ctx.fillText('A D',12,35);ctx.fillText('J J J',92,35);ctx.fillText('HOLD K',177,35);ctx.fillText('L',262,35);ctx.fillText('I',347,35);ctx.fillStyle='#607887';ctx.fillText('SPACE  JUMP',402,35);ctx.restore();
 drawSkillBar();
 // charge meter near player
 if(player.state==='heavy'&&player.charging){let p=clamp(player.charge/.72,0,1),x=player.x-45,y=player.y-145;ctx.fillStyle='rgba(3,8,15,.8)';ctx.fillRect(x,y,90,8);ctx.fillStyle=p>=1?'#ffe390':'#66efff';ctx.fillRect(x+2,y+2,86*p,4);ctx.textAlign='center';ctx.font='700 10px sans-serif';ctx.fillStyle=p>=1?'#fff0bd':'#aaf6ff';ctx.fillText(p>=1?'BREAK READY':'CHARGING',player.x,y-6);}
 // offscreen direction warning omitted; arena keeps enemies visible
 if(gameOver){ctx.fillStyle='rgba(2,4,10,.68)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ff486c';ctx.shadowBlur=24;ctx.shadowColor='#ff315f';ctx.font='italic 900 64px sans-serif';ctx.fillText('LINK SEVERED',W/2,H/2-28);ctx.shadowBlur=0;ctx.fillStyle='#b7c9d1';ctx.font='14px sans-serif';ctx.fillText(`抵达波次 ${wave}  ·  最高连击 ${bestCombo}  ·  切断武装 ${limbBreakCount}`,W/2,H/2+20);ctx.fillStyle='#eaffff';ctx.font='700 17px sans-serif';ctx.fillText('按 ENTER 或 R 重新连接',W/2,H/2+65);}
 // vignette
 let vg=ctx.createRadialGradient(W/2,H/2,220,W/2,H/2,720);vg.addColorStop(.55,'transparent');vg.addColorStop(1,'rgba(0,0,8,.63)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#050811';ctx.fillRect(0,0,cw,ch);
 ctx.save();ctx.translate(offX,offY);ctx.scale(scale,scale);
 let sx=shake?rand(-shake,shake)+shakeX:0,sy=shake?rand(-shake*.55,shake*.55):0;ctx.translate(sx,sy);
 drawBackground();
 if(started&&player){
  for(const d of detached)drawDetached(d);
  for(const a of player.afterimages)player.draw((a.life/.16)*.26,true,a.x,a.y,a.pose);
  for(const e of enemies)e.draw();
  player.draw();
  for(const p of projectiles)p.draw();
  drawSkillFx();drawTrails();drawEffects();
 }
 ctx.restore();
 ctx.save();ctx.translate(offX,offY);ctx.scale(scale,scale);if(started&&player)drawUI();
 if(flash>0){ctx.globalCompositeOperation='screen';ctx.globalAlpha=flash*.7;ctx.fillStyle='#d9fbff';ctx.fillRect(0,0,W,H);}
 if(dangerFlash>0){let dg=ctx.createRadialGradient(W/2,H/2,250,W/2,H/2,700);dg.addColorStop(.4,'transparent');dg.addColorStop(1,`rgba(255,20,60,${dangerFlash})`);ctx.fillStyle=dg;ctx.fillRect(0,0,W,H);}
 ctx.restore();
 // cinematic bars for slow motion
 if(slowMo>0){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,cw,Math.max(0,offY+12*scale));ctx.fillRect(0,ch-Math.max(0,offY+12*scale),cw,Math.max(0,offY+12*scale));}
}
function loop(now){
 let dt=Math.min(.05,(now-last)/1000);last=now;accumulator+=dt;let consumed=false;
 while(accumulator>=1/60){
  const used=update(1/60);accumulator-=1/60;
  if(used&&!consumed){for(const k in pressed)delete pressed[k];for(const k in released)delete released[k];consumed=true;}
 }
 draw();requestAnimationFrame(loop);
}

initScene();
Object.defineProperty(window,'combatBenchState',{configurable:false,writable:false,value:()=>Object.freeze({ready,playerAlive:!!(player&&player.alive),enemyCount:enemies.filter(e=>e.alive&&e.state!=='dead').length,hitCount,limbBreakCount,playing:!!(started&&playing&&!gameOver)})});
requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop)});
})();
</script>
</body>
