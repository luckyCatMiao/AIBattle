<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3V3 足球 · SOCCER ARENA</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">⚽</span><div><h1>3V3 足球</h1><p>SOCCER ARENA · 每局 1–6 名球员 · 实体足球</p></div></div>
  <div class="modes" id="modes">
    <button data-mode="local" class="on">本地对战</button>
    <button data-mode="watch">观战回放</button>
  </div>
</header>

<main class="stage">
  <div class="stagecol">
    <div class="stagewrap">
      <canvas id="stage" width="1056" height="624"></canvas>
      <div class="banner" id="banner"></div>
    </div>
    <section class="card" id="logCard"></section>
  </div>
  <aside class="side">
    <section class="card" id="setupCard">
      <h3>本地对战</h3>
      <div class="setup"><button id="newMatch">开新局（你 + AI 队友 vs AI，人数随机 1–6）</button></div>
      <small class="hint">WASD 移动 · 鼠标瞄准 · 空格踢球 · 你控制 1 号球员</small>
    </section>
    <section class="card" id="matchCard"></section>
    <section class="card" id="timeCard"></section>
    <section class="card" id="teamCard"></section>
    <section class="card" id="enemyCard"></section>
    <section class="card" id="statsCard"></section>
    <section class="card" id="runCard"></section>
    <section class="card" id="gameCard"></section>
    <section class="card" id="replayCard"></section>
    <section class="card" id="scoreCard"></section>
    <p class="legend" id="legend"></p>
  </aside>
</main>

<footer>AIBATTLE / 3V3 足球 <span id="meta"></span></footer>
<div id="toast" class="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
