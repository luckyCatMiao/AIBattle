<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>俯视角赛车 · RACING ARENA</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">🏎</span><div><h1>俯视角赛车</h1><p>RACING ARENA · 随机赛道 · 漂移蓄能 · 喷火加速</p></div></div>
  <div class="modes" id="modes">
    <button data-mode="local" class="on">本地对战</button>
    <button data-mode="watch">观战回放</button>
  </div>
</header>

<main class="stage">
  <div class="stagecol">
    <div class="stagewrap">
      <canvas id="stage" width="1024" height="704"></canvas>
      <div class="banner" id="banner"></div>
    </div>
    <section class="card" id="logCard"></section>
  </div>
  <aside class="side">
    <section class="card" id="setupCard">
      <h3>本地对战</h3>
      <div class="setup"><button id="newMatch">开新局（你 vs 练习电脑，随机赛道）</button></div>
      <small class="hint">W/S 油门·刹车 · A/D 转向 · 空格 漂移 · Shift 喷火</small>
    </section>
    <section class="card" id="matchCard"></section>
    <section class="card" id="timeCard"></section>
    <section class="card" id="carCard"></section>
    <section class="card" id="rivalCard"></section>
    <section class="card" id="statsCard"></section>
    <section class="card" id="runCard"></section>
    <section class="card" id="gameCard"></section>
    <section class="card" id="replayCard"></section>
    <section class="card" id="scoreCard"></section>
    <p class="legend" id="legend"></p>
  </aside>
</main>

<footer>AIBATTLE / 俯视角赛车 <span id="meta"></span></footer>
<div id="toast" class="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
